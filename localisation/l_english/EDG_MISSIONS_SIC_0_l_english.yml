 EDG_SIC_0_1_1_title:0 "取悦市民"
 EDG_SIC_0_1_1_desc:0 "西西里是一个新生的国家，从安杰洛斯皇帝的统治起，被热那亚僭主统治压抑了百余年经济才开始复兴，一个崭新的市民阶级兴起了，并逐渐成为了西西里国家的重要组成部分。他们拥有着足够宝贵的财富，却没有与之相衬的政治地位。如果我们能保障他们的政治权利，无疑能将他们争取到我们这一方。"

 EDG_SIC_0_1_5_title:0 "折断长剑"
 EDG_SIC_0_1_5_desc:0 "在被奥克西塔尼亚熊熊燃烧的清洁派之火驱逐出故地之后，萨伏伊家族沦为落魄的佣兵贵族，最终流浪到了热那亚共和国。1266年，热那亚的佣兵首领安德烈亚·迪·萨伏伊策动了西西里晚祷战争，推翻了霍亨斯陶芬王朝的统治，自命为僭主，热那亚对西西里的百年统治由此开始。直到1411年伊萨克三世的入侵后，热那亚才被驱逐出叙拉古的故土。\n\n1437年，热那亚共和国和萨伏伊家族的命运都被改写，萨伏伊家族夺取了共和国的大权，将她改造为一个佣兵王国，并妄图趁乱侵占西西里的国土。然而明眼人都能看出，内忧外患的萨伏伊不过是外强中干之辈，就让我们折断佣兵领主的长剑，将利古里亚的海岸纳入治下。"

 EDG_SIC_0_2_1_title:0 "圣旗飘扬"
 EDG_SIC_0_2_1_desc:0 "西西里是一个由信仰东正教的希腊移民建立的国家，但由于长期受到热那亚佣兵僭主的统治，未能组织起一个地方教会治理信众。直到米海尔·安杰洛斯远征推翻了热那亚人，一个听命于「西西里皇帝」而非普世牧首的教会才得以建立。教会如今在安杰洛斯与拉斯卡里斯之间暧昧不清，我们必须终结他们这种摇摆不定的状态。"

 EDG_SIC_0_2_2_title:0 "金狮振翅"
 EDG_SIC_0_2_2_desc:0 "1411年，在东帝国的政治斗争中失利的米海尔·安杰洛斯流亡意大利，成为了威尼斯公爵的女婿。靠着惊人的口才和胆识，米海尔从威尼斯借来了雇佣兵，最终成功夺取了特里纳克里亚的王位，并且作为代价，给予了威尼斯大量贸易特权。随着拉斯卡里斯家族的狄奥多勒废帝自立，废除了大量历史遗留特权，西西里-威尼斯关系日益恶化。丹多洛君主国在十人会和齐亚尔家族的攻讦下摇摇欲坠，西西里也走到了历史的十字路口，双方都期待一个改写当前局势的机会。"

 EDG_SIC_0_2_5_title:0 "奇袭明珠"
 EDG_SIC_0_2_5_desc:0 "卡普阿的圣韦塞利诺家族在那不勒斯王国崩溃后攫取了那波利地区，凭借封土的富庶，成为了罗马教宗的座上红人，还与阿尔勒王国和威尼斯共和国来往甚密。卡普阿的公爵们也逐渐心生傲慢，生性贪婪的他们在领地内横征暴敛，以满足自己穷奢极欲的生活，治下的臣民已经苦不堪言，让我们利用他们的傲慢，占领那波利这颗明珠来惩戒他们。"

 EDG_SIC_0_3_1_title:0 "确保军队"
 EDG_SIC_0_3_1_desc:0 "在伊萨克四世皇帝的改革后，西西里建立了一支由希腊人构成的常备军。皇帝中道崩殂后，军队由狄奥多勒·瓦塔泽斯和利奥·诺萨提共同执掌。军队是立国之本，在即将到来的风暴面前，谁能确保军队的忠诚，便能抢占先机。"

 EDG_SIC_0_3_2_title:0 "静谧之岛"
 EDG_SIC_0_3_2_desc:0 "[125.GetName]码头的醉汉推翻酒瓶，琥珀色液体爬向海的方向。第勒尼安海，把所有的浪，都铺成了哑光的绸缎。修道院的蜡烛无故流泪，石像鬼翅膀开始发烫。而月光正把每条小巷，浇铸成明亮的火药引线。而那主教座堂十二点的钟摆，卡在上帝与魔鬼的齿缝间。"

 EDG_SIC_0_3_3_title:0 "高天密翳"
 EDG_SIC_0_3_3_desc:0 "复仇的气息越来越近了。战线已经排开，军团再次列阵，行进，循序展开，他们紧握刀枪，颂唱着至福乐土的誓言奔向战场：内战已至。\n\n——木已成舟。"

 EDG_SIC_0_3_4_title:0 "射杀旭阳"
 EDG_SIC_0_3_4_desc:0 "倘若我不能从敌人手中拯救西西里......那就让它熊熊燃烧吧！"

 EDG_SIC_0_3_5_title:0 "高贵之死"
 EDG_SIC_0_3_5_desc:0 "先祖的虚名驱使阿普利亚公爵挑起了这场不义之战，令西西里人遭受战争之苦。然而，希腊人不会坐以待毙，我们会正面击溃欧特维尔的军队，令自矜高贵者后悔发动战争。"

 EDG_SIC_0_3_6_title:0 "尘埃落定\n白露未晞"
 EDG_SIC_0_3_6_desc:0 "所有觊觎西西里国土的人像秃鹰一样蜂拥而至，或为虚名，或为野心，或是无意，都妄图争夺特里纳克里亚之冠，然而他们都只是徒劳，西西里之鹰已化作热情的烈火，吞噬了这些不义之人。特里纳克里亚已经摆脱束缚，在阳光下获得应有的地位。我们缅怀逝者，也赞颂领袖。雄鹰啊，载着我们崭新祖国的理想高高翱翔吧。"

 EDG_SIC_0_3_7_title:0 "黑夜过后\n朝阳新生"
 EDG_SIC_0_3_7_desc:0 "\n\n崭新的旗帜在[Root.GetCapitalName]城上飘扬，海浪拍打礁石，将石沙卷入深海。从[121.GetName]到[126.GetName]，从[4736.GetName]到[122.GetName]，雄鹰高高盘旋，钟声久久回荡。\n\n百余年后，当晚祷钟声再次响彻西西里上空，旧日的残阳沉入碧波之下，和平与繁荣终于再度降临在了这片保守风霜的土地。"

 EDG_SIC_0_4_1_title:0 "群山回响"
 EDG_SIC_0_4_1_desc:0 "在晚祷战争后，公教徒便失去了对特里纳克里亚的统治，至今百年有余。无论是热那亚的僭主还是安杰洛斯皇帝，都没能给公教徒们带来光明。希腊移民的排挤和政府的打压，让原本占据西西里主流的他们被迫遁入群山之中。饱受压迫之人终有奋起反抗之日，在内战到来之前，我们必须确保他们反抗的不是我们。"

 EDG_SIC_0_4_2_title:0 "黑鹰低吟"
 EDG_SIC_0_4_2_desc:0 "从德意志的鹰旗到伦巴第的王冠，从西西里染血的长剑到耶路撒冷嫩绿的橄榄枝，霍亨斯陶芬的猎鹰，衔着尘世的权杖，盘旋于罗马人的国土之上，诉说着两位腓特烈的诗篇。虽然鹰旗最终陨落于西西里晚祷的钟声，教宗的诅咒如藤蔓绞碎曼弗雷德的王座，但霍亨斯陶芬的血脉早已隐遁入群山和海岛之中。如今，第三位腓特烈正肩负着家族的荣耀，义无反顾参与到西西里的燎原之火中，而我们必须掌握这火势。"

 EDG_SIC_0_4_5_title:0 "飞渡海峡"
 EDG_SIC_0_4_5_desc:0 "卡拉布里亚与西西里隔海相望，阿夸维亚的公爵们一直励精图治，胸怀称霸特里纳克里亚的野心。然而，我们将终结他的野望，越过墨西拿海峡，统一大希腊。"

 EDG_SIC_0_5_1_title:0 "稳固豪族"
 EDG_SIC_0_5_1_desc:0 "出于政治制衡的考量，伊萨克四世从希腊世界了引入了大量豪族势力委以重任。然而在皇帝突然病故后，西西里陷入了权力真空状态，而拉斯卡里斯家族的狄奥多勒·瓦塔泽斯利用职权之便迅速控制了军队，从而操控了政治。之后，狄奥多勒废黜了幼帝伊萨克五世，建立了共和体制，然而其他豪族并未立刻臣服，而是同样野心勃勃，觊觎护国公的宝座。为了增加我们在迫在眉睫的风暴中的胜算，必须获取豪族的支持。"

 EDG_SIC_0_5_5_title:0 "拜谒宗座"
 EDG_SIC_0_5_5_desc:0 "两西西里僵持不下的战事让罗马的宗座也投来了目光。毫无疑问，梵蒂冈绝不愿意在卧榻之侧看到一个再度统一的、敌对罗马的那不勒斯诺曼王国，但想让他声援我们也不是一件容易的事。在双方磋商下，我们将于拉特兰宫进行一场会谈，探讨战争结束后的治理事务。"

