 EDG_SICDisasterEvents.1.name:0 "晚祷"
 EDG_SICDisasterEvents.1.desc:0 "当然，严格意义上，这次被称为「西西里远征」的事件的主使是一位为君士坦丁波利斯效力的热那亚雇佣兵领袖安德烈亚·迪·萨伏伊。\n\n早在罗马帝国于第四次十字军东征之后土崩瓦解以来，大批试图逃避战乱的希腊人越过奥特朗托海峡登陆西西里岛，其中又以[2982.GetName]和[124.GetName]这样重要的海滨城市为主，建立了大量的希腊人社区。\n\n霍亨施陶芬王朝的重心始终放在德意志，西西里岛对他们而言虽然重要，但终归鞭长莫及，故而长期委派总督统治，因此忽视了这些异端的威胁。\n\n1254年，神圣罗马帝国皇帝兼西西里国王康拉德四世去世，其弟弟「私生子」曼弗雷德篡夺了他侄儿康拉丁的西西里王位，但这也导致西西里失去了来自德意志的任何支持，霍亨施陶芬王朝在西西里的统治开始松动，希腊人社区成为了西西里王国内部的一颗定时炸弹。\n\n1266年，经过热那亚人的牵线搭桥，[124.GetName]和[2982.GetName]两地的希腊人拿起长刀，以西西里教堂的晚祷钟声为号，瞬间西西里的东西两侧海岸沦陷于希腊人之手，[2982.GetName]天主教堂被大火所吞噬，早有准备的热那亚雇佣兵领袖安德烈亚·迪·萨伏伊将军望见烽火，率领着他的军队登上了西西里岛的海滩。而曼弗雷德国王不知所踪，有人说他藏匿在了西西里的群山当中的某个村落，也有人说他乘船离开西西里的过程当中不幸海难身亡。无论如何，「晚祷战争」之后，霍亨施陶芬王朝在西西里岛的统治就此结束。"
 EDG_SICDisasterEvents.1.aa:0 "而西西里的海滨，在阿基米德罹难之后，再一次属于希腊人。"

 EDG_SICDisasterEvents.2.name:0 "孑遗"
 EDG_SICDisasterEvents.2.desc:0 "西西里的海岸被蜂拥而来的希腊人所占满，他们为逃离拉丁人的统治，而向拉丁人的土地而去，于是在第四次十字军东征之后，希腊人胜利的号角在西方的西西里吹响。\n\n战争之后，热那亚共和国的代理人安德烈亚·迪·萨伏伊迫不及待地自封为「西西里希腊人的保护者」，但在西西里以外的土地，将军却被称为西西里的「僭主」，从一开始就没能完全掌控西西里，\n\n在西西里崎岖的山间，笃信着天主教的家族依然坚守着他们的土地，被称为山地人的他们自称自己是「真正的西西里人」，而在他们口中，希腊人被叫做「叙拉古人」——他们和千年前的叙拉古城邦一样，是希腊殖民者，是真正西西里人的敌人。\n\n在[2982.GetName]，热那亚委任的僭主们努力平衡着各个希腊城市代表直接的无端争吵，他们和他们的后继者，一代代西西里僭主守护着这颗跳动的心脏，但这颗遗世而孤立的小岛又怎能够真正在浪潮当中独善其身呢？\n\n这种奇怪的体系保持了一百余年，希腊人和西西里人互相敌对的生活在同一片土地之上，僭主的权威日渐旁落，保护者的势力在西西里岛的发言日渐衰微，希腊城市之间唯一的共识就是抵抗公教徒对西西里的再次渗透。但自曼弗雷德过世以来，德意志的霍亨施陶芬血脉也相继断绝，已无力再辐射到这座阳光之岛。他们绝没有想到，他们最大的威胁来自他们支离破碎的巴尔干故地。"
 EDG_SICDisasterEvents.2.aa:0 "「我惧怕希腊人，即使他们带着礼物。」"

 EDG_SICDisasterEvents.3.name:0 "背叛"
 EDG_SICDisasterEvents.3.desc:0 "1411年，在君士坦丁堡的政变失败后流亡意大利的伊庇鲁斯王朝王子，米海尔·安杰洛斯成为了威尼斯公爵的女婿，他以出色的外交口才和勇敢的胆识在威尼斯声名大噪。\n\n威尼斯是个特殊的国家，在王朝世袭统治盛行的时代她是最耀眼的共和国，于周围格格不入；在自身威望达到顶峰，被称为「尊贵共和国」的年代，却又被她最优秀的总督变成了实质上的君主国，只留共和国的虚名。在内部，盲眼的丹多洛的后代与十人会之间的斗争成为了这个国家最重要的政治生活。\n\n而在外部，热那亚一直是威尼斯的贸易宿敌。从1253到1381年，威热之间发生了四次大战，最终在基奥贾之战热那亚彻底落败于威尼斯，身陷低谷。但是百足之虫死而不僵，在败于圣马可的金狮后，热那亚仍然在地中海占据多个重要的贸易港口，威胁威尼斯的商路。而安德烈亚的遗产——西西里岛正是最为重要的据点。\n\n为了对抗热那亚在地中海交通要道的势力，也为了扩张丹多洛家族的影响力，威尼斯公爵派米海尔率领一直由瑞士和伦巴第雇佣军为核心的船队登陆[2982.GetName]城，而在此之前，为了顺利完成登陆，米海尔将军的副官保罗·诺萨提提前渗透进西西里山区，对他们声称自己是天主教信徒，是来从希腊人手里拯救他们的十字军。西西里的山区家族们信以为真，不仅为米海尔的军队提供了岛上的确切地图和驻防情况，在米海尔上岛后西西里人更是主动为米海尔的军队献上补给。\n\n然而他们某种程度上从一开始就被背叛了——米海尔自然不是来拯救他们的，他此次前来只是为了推翻热那亚人主子，和威尼斯人成为西西里的新主子的。在夺取特里纳克里亚的政权后，米海尔与威尼斯签订了多项条款，事实上将大部分的贸易特权送给了威尼斯人，岛内的市政官也基本委任给威尼斯商人和从东帝国流亡而来的希腊官僚。之前对西西里人承诺的自治权则绝口不提。\n\n尽管米海尔在巩固政权之后数次表示，待到时机成熟，会给予天主教徒与希腊人一样的自主权利，但西西里人早已对米海尔的两面三刀和安杰洛斯王朝的狡诈多端深恶痛绝，天主教氏族再次遁入群山，不听诏令，安杰洛斯在西西里的统治从一开始就为人唾弃。\n\n西西里的王冠似乎受了诅咒，安杰洛斯王朝的统治也未能长久。\n\n皇帝伊萨克三世之后，西西里「皇位」转移到了他的儿子伊萨克四世手中。伊萨克四世是位雄图大略、能力出众的君主，他励精图治，以高超的外交手段和良好的私人关系与威尼斯修改了先帝时期签订的部分贸易协定，支持本土希腊商人同拉丁人竞争，复兴了西西里的丝绸产业，极大程度上恢复了僭主时期混乱的国家经济。除此之外，他还鼓励希腊人参军，重建了西西里的军队体制，在1442年向腐朽不堪的拜占庭帝国发起了远征，迅速进军摩里亚半岛，意图夺取君士坦丁堡皇位。\n\n只是天不假年，皇帝突患疾病，只能连夜班师。直到去世前，他都对希腊故地念念不忘，甚至还联手威尼斯公爵煽动摩里亚专制公狄奥多尔叛乱，反对安德罗尼卡五世的统治。1443年末，壮志未酬的伊萨克四世蒙主恩召，其9岁的独子伊萨克五世继位，国家大权被掌握在狄奥多勒·瓦塔泽斯将军手中，狄奥多勒是尼西亚皇室的苗裔，年轻而富有才干，更重要的是，他是个野心勃勃的军事家，受到国内绝大多数军事贵族的支持。在1444年一月，狄奥多勒送给了伊萨克五世一个绝佳的礼物——他废黜了伊萨克五世，并在军事贵族的支持下成为了「护国公」，总领国家军政大权。狄奥多勒组建了一个护国议会，该议会由军事贵族将领组成，成员由护国公亲自任命，掌管地方的军政事务。"
 EDG_SICDisasterEvents.3.aa:0 "种下荆棘的人，请先准备好迎接赤足的未来。"

 EDG_SICDisasterEvents.4.name:0 "暗流"
 EDG_SICDisasterEvents.4.desc:0 "狄奥多勒·瓦塔泽斯虽然得到了大部分军方人物的支持，但是旧贵族中反对他的人仍是不少。狄奥多勒是位有雄才大略的军事家，但他此时绝对不是一个出色的政治家，忙于思考军事体制变革的他对一些不满足于现状的豪族疏于掌控，这些失势的旧贵悄然围绕在伊萨克五世身边，再次「效忠」安杰洛斯王朝，渴望从军事集团手中夺回权力。狄奥多勒·瓦塔泽斯的先军统治也令一些从希腊世界来的文官不满，他们也开始与伊萨克五世暗通款曲。安杰洛斯王朝毕竟统治了西西里数十年，期间留下的政治遗产足以让护国公尝到失算的苦涩。\n\n与此同时，在曼弗雷德国王不知所踪后，「最正统的霍亨施陶芬国王」至今仍下落不明，带有霍亨施陶芬血脉的分家们早已陷入了西西里岛内陆群峦的权力真空当中激烈争夺，这些家族们一方面为了抗衡海岸的希腊人后裔，一方面是为了强化自己的「真正的西西里」的身份开始以血缘为纽带豢养忠于自身的打手，形成了后世黑手党家族的雏形。其中占据了马耳他岛的一支幼支被认为是霍亨施陶芬家族的最合法继承人，只是这个蕞尔小岛几乎不可能将自己的势力辐射到西西里——但这并不妨碍「真正的西西里人」找到一位「真正的霍亨施陶芬国王」，并在他的带领下反抗希腊人的暴政。\n\n而狄奥多勒在改制之后，为收拢国家财富，废除了大部分与威尼斯的贸易协定，这让丹多洛家族的威信大量受损，本就对狄奥多勒篡权自家血亲而感到不满的威尼斯公爵，也蠢蠢欲动。\n\n除此之外，那不勒斯的诺曼公爵们，也对罗杰的遗产虎视眈眈，渴望戴上特里纳克里亚的王冠；热那亚的萨伏伊家族在篡夺共和国权利之后，也急迫地需要夺取「安德烈亚的遗产」向国内外证明自身的合法性。"
 EDG_SICDisasterEvents.4.aa:0 "特里纳克里亚同突尼斯海峡一般，永远暗潮涌动。"

 EDG_SICDisasterEvents.5.name:0 "游玩指引"
 EDG_SICDisasterEvents.5.desc:0 "西西里拥有2条大路线，即：§O£icon_EDG_catholic£天主教君主国§!路线和£icon_EDG_orthodox_icon£§P东正教§!的§T@GRE希腊共和国§!路线，前者下又有@TTS§O霍亨施陶芬王朝§！和@GK0§P安杰洛斯王朝§!两条小路线。在游戏开始2天后，您可以在事件「命运歧途」中获得一次，也仅有一次抉择路线机会。\n\n§R目前仅制作了共和国路线，请不要误选。§!\n\n单机环境下，共和线的西西里会在可以通过决议触发灾难「诸王烬乱」，对抗拉丁人的入侵。在这场反侵略战争中，我们唯有死战到底。然而，我们并不是孤单一人，东方的希腊同胞，乃至于南方的神秘势力都可能会不吝给予我们帮助。希腊从不缺少仁人义士，在国难时刻自会有人挺身而出。海军是我们最大的短板，然而，希腊人悠久的航海传统会让我们找到出路，届时请通过决议寻找抵抗拉丁封锁之法。\n\n另外，请注意阅读任务，完成尽可能多的任务将减少你可能在灾难期间将经历的负面事件。"
 EDG_SICDisasterEvents.5.aa:0 "祝您游玩愉快！您可以随时通过决议查看该事件。"

 EDG_SICDisasterEvents.6.name:0 "孤星"
 EDG_SICDisasterEvents.6.desc:0 "如果说巴巴罗萨是12世纪最耀眼华丽的红色星辰，腓特烈二世是13世纪夜空中散发妖异金光的明亮星辰，那么腓特烈「虔诚者」就是我们世纪孤独飞行的晨星。\n\n1266年的晚祷战争后，霍亨施陶芬王朝在西西里岛的统治被颠覆，然而最后一位西西里国王曼弗雷德并未逃离特里纳克里亚，而是在忠诚的天主教氏族的帮助下隐遁入了西西里崎岖的群山之中。之后曼弗雷德试图乘船前往威尼斯，回到德意志地区向霍亨施陶芬本家低头换取援助，然而35岁的国王却在途中意外遭遇海难而死。\n\n在天主教徒们沉浸在于晚祷战争的余震和国王罹难的悲恸之际，后宫里却传出喜讯——王后怀上了陛下的遗腹子，霍亨施陶芬在西西里的血脉并未断绝。\n\n这个王子的诞生实属命运的安排。曼弗雷德的遗腹子受到了「真正的西西里人」的拥护，在[2982.GetName]的僭主越发加强对天主教徒的控制后，他们将遗腹子一脉转移到了孤悬海外的马耳他岛上保护，并修建了要塞防御。在安杰洛斯入侵后，越来越多的天主教氏族感到了压迫，他们最后都选择了秘密效忠霍亨施陶芬的血脉。\n\n时间来到15世纪，一个名为腓特烈的婴儿降生于马耳他的霍亨施陶芬堡垒之中，他是已经年近六旬的「正统西西里国王」亨利七世的唯一的继承人，斯陶芬血脉最后的继承人。这真算得上一个生命奇迹了，尤其此时，贵族的平均寿命都不到40岁，花甲之年的亨利七世依旧保持着旺盛的精力，在和年轻美丽的希腊妻子的温存中获得了继承人。\n\n国王的老来得子让西西里人愈发坚信霍亨施陶芬家族仍然天命在身，当时的一位西西里隐修士还不辞辛苦秘密前来马耳他堡垒向国王献诗道贺：\n\n「威严的国王解甲休憩，他有了一个儿子，\n未来执坚披锐的战士。\n赞美幸福的父亲，因得子更幸福：\n他们得到了人民的赐福，\n命中注定父亲用胜利的长矛将幸福分给全体西西里人。\n无论过去还是将来，\n哦！你是个渴望了那么久的男孩，\n你能追回过去辉煌的岁月，\n罗杰和腓特烈，他们都在你的身上。\n平安与你同在，你的诞生让一切实现，\n你的诞生得到了我们最虔诚的祝福。」"
 EDG_SICDisasterEvents.6.aa:0 "「义人多有苦难，但耶和华救他脱离这一切。」"

 EDG_SICDisasterEvents.7.name:0 "马耳他之鹰"
 EDG_SICDisasterEvents.7.desc:0 "腓特烈的父系是蓝色天空下连绵不绝雄伟大山，高高耸立入云的茂密黑森林，山野间遍布绚烂花朵，霍亨施陶芬的荣耀来自施瓦本山地的高伟雄浑，他的母亲却是另一个截然不同的世界——蔚蓝纯净海的爱琴海。\n\n100多年前，时维东帝国两安德罗尼卡内战，昏暗的夜空下，冰冷的大海翻卷着怒涛，来自希腊世界的逃难船只，向西西里的村落和城市进发。巴列奥略朝此起彼伏的王室内战不仅断送了东罗马的国运，也使得无数人民流离失所。腓特烈的母系，正是这样一支从拜占庭逃难来的落魄贵族。\n\n作为日耳曼、拉丁、希腊3个文明的结晶，小腓特烈受到了良好的教育，西西里的牧师教他读书写字，葆有日耳曼传统的廷臣教他武艺与骑士精神，希腊裔的侍从官教他诗文与各地风土人情。腓特烈在年纪轻轻时就掌握了德语、拉丁语、希腊语等多门语言，成为了一名坚忍刚毅的天主教徒，同时是一位学者和诗人，更是一位胸怀韬略的统帅，年少之时就投身北非的十字军战场，率领希腊人和西西里人组成的佣兵团，帮助十字军抵御穆斯林的袭扰，多年的经历为他赢得了「斯泰莱特」的称号，即「柱上者」，意志坚定者。直到1442年父亲海因里希七世受主的感召而去，他才回到马耳他的堡垒继承「王位」。他品德高尚，长相英俊，性格开朗，会与廷臣打猎游玩，也能独自潜心研读宗教经文和律典，又被称为「马耳他的黑鹰」。北非的游历不仅锻炼了他的军事能力，也让他见识了基督教世界所面临的异教徒威胁，更让他与圣殿骑士团的成员和突尼西亚王国的权贵结下了深厚的友谊。\n\n1443年11月，「西西里皇帝」伊萨克五世被拉斯卡里斯的狄奥多勒·瓦塔泽斯废黜，然而一介武夫狄奥多勒却展现了妇人之仁，没有对安杰洛斯王朝的政治势力进行清算，[2982.GetName]的军政府和[125.GetName]的旧贵族最终形成离心之势，貌合而神离，西西里局势波诡云谲。腓特烈看出，西西里的历史已经来到了转折的十字路口，霍亨施陶芬家族最后逆转命运的机会，就在此时。\n\n于是，腓特烈力排众议，决心亲自乘商船前往[125.GetName]秘密拜访西西里「废帝」伊萨克，与他立盟共抗护国公[Root.Monarch.GetName]。"
 EDG_SICDisasterEvents.7.aa:0 "「你若纯洁正直，他必亲来守护你，恢复你正义的居所。」"

 EDG_SICDisasterEvents.8.name:0 "密信"
 EDG_SICDisasterEvents.8.desc:0 "西西里的护国公近日向我们的伊玛目[Root.Monarch.GetName]寄来了一封密信，心中言语近乎恳切。叙拉古人的执政官简单陈述了西西里国家内部的矛盾与外部的危机，并且分析了哈里发国外交局势与西西里的相似性，指出我们两国拥有共同的敌人——天主教世界，而西西里与北非历来藕断丝连、联系紧密，特里纳克里亚和马格里布的命运是悬系于同一根绳系上的。正因此，他向哈里发提出，我们两国应该缔结盟约，西西里会为哈里发国分担基督教世界的压力，为我们提供未来进军意大利的军团驻地和军用港口，而哈里发国只需要在即将到来的风暴中稳住西西里这条孤舟。"
 EDG_SICDisasterEvents.8.aa:0 "有趣。"
 EDG_SICDisasterEvents.8.aa.tt:0 "§G我们将会介入西西里灾难，并在战后趁机勒索他们称臣纳贡。§!"
 EDG_SICDisasterEvents.8.bb:0 "无趣。"
 EDG_SICDisasterEvents.8.bb.tt:0 "§R我们将错过附庸西西里的机会§!，任务§R「巴勒莫之夜」§!将更难完成。"

 EDG_SICDisasterEvents.9.name:0 "与恶魔缔约"
 EDG_SICDisasterEvents.9.desc:0 "西西里复杂的政治局势与迫在眉睫的外部危机令护国公寝食难安，根据密报，阿普利亚公爵正在游说那不勒斯诸公侯，向我们发起远征。仅凭海滨的希腊人，如何能在这乱象中谋得生路？而一名北非的行商在觐见护国公殿下时窥见了他眼中的焦虑，猜到了他的心思，于是立刻自荐，在护国公屏退左右后，商人声称愿为他联系法蒂玛哈里发——这一与西西里拥有共同敌人的统治者。这一离经叛道的想法起初的确让护国公震惊，但他在反复思考其可行性后，还是决定尝试一二——西西里的后面就是地中海，希腊人已经无路可退，必须想尽一切办法才能延续家国。"
 EDG_SICDisasterEvents.9.aa:0 "「神不愿拯救我们，我便与恶魔缔约。」"
 EDG_SICDisasterEvents.9.aa.tt:0 "我们将有机会§G获得@FDM法蒂玛的军事援助§!，但他们也有可能§R挟恩图报§!。"
 EDG_SICDisasterEvents.9.bb:0 "还是算了吧。"
 EDG_SICDisasterEvents.9.bb.tt:0 "我们将§R错过@FDM法蒂玛的军事援助§!。"

 EDG_SICDisasterEvents.10.name:0 "良机"
 EDG_SICDisasterEvents.10.desc:0 "陛下为支援希腊人而发起的远征被如今已大获全胜，伊斯兰信士的兵锋时隔数百年再度横扫南伊塔尼耶，令基督教世界胆寒，[Root.Monarch.GetName]陛下心安理得地在[FDM.Capital.GetName]的宫廷中静静享受战争带来的荣耀与威望。随着战事暂告一段落，我们的顾问向伊玛目指出，希腊人虽然成功击败了诺曼人，并反向夺取了其领地，但是他们此刻正处于战后的虚弱期，且对我们穆斯林的大军几乎没有防备。因此，我们可以值此良机，要挟西西里向哈里发国称臣纳贡。在简单思索后，[Root.Monarch.GetName]点了点头，对臣下说道："
 EDG_SICDisasterEvents.10.aa:0 "「替我向叙拉库塞的山谷问安。」"

 EDG_SICDisasterEvents.11.name:0 "法蒂玛要求内附"
 EDG_SICDisasterEvents.11.desc:0 "[FDM.Capital.GetName]的使节已抵达护国公的宫廷之中，他拿出了此前我们与法蒂玛人签订的密约与法蒂玛哈里发本人的信件，并趾高气昂地声称，我国的胜利都源于柏柏尔人的贡献，甚至勒令我们的[Root.Monarch.GetName]殿下尽快回报恩情，为他们的主子效忠。"
 EDG_SICDisasterEvents.11.aa:0 "我们无力反抗......"
 EDG_SICDisasterEvents.11.bb:0 "法蒂玛哈里发是何人？没听说过。"
 EDG_SICDisasterEvents.11.bb.tt:0 "§R此举将激怒@FDM法蒂玛哈里发。§!"

 EDG_SICDisasterEvents.12.name:0 "希腊的孽种选择毁约！"
 EDG_SICDisasterEvents.12.desc:0 "该死的希腊人不承认我们的贡献，驱逐了哈里发的使节，撕毁了此前与我国的协定，让我们之前的努力付之东流，甚至侮辱了我们的[Root.Monarch.GetName]陛下！"
 EDG_SICDisasterEvents.12.aa:0 "希贼！奸贼！恶贼！逆贼——"

 EDG_SICDisasterEvents.13.name:0 "西西里的归附"
 EDG_SICDisasterEvents.13.desc:0 "在[Root.Monarch.GetName]的至高荣耀面前，西西里的希腊统治者最终低下了他骄傲的头颅，埃米尔们已经将伊玛目的旌旗插上了萨拉古萨和巴拉尔姆的城头，源源不断的税赋与兵丁将从地中海之心再次涌入哈里发国。西西里这一昔日重要重镇的回归，无疑标志着哈里发国势不可挡的复兴。"
 EDG_SICDisasterEvents.13.aa:0 "而这并不是哈里发国征服的终点。"

 EDG_SICDisasterEvents.14.name:0 "求援"
 EDG_SICDisasterEvents.14.desc:0 "战争已经爆发，由阿普利亚公爵带领的那不勒斯军队跨过墨西拿海峡，向特里纳克里亚发起远征。西西里护国公已经心急如焚，向我国发来求援，请求哈里发伸出援手。"
 EDG_SICDisasterEvents.14.aa:0 "我们的兵锋将横扫南伊塔尼耶！"
 EDG_SICDisasterEvents.14.bb:0 "哦不，老兄，这次真的不行......"

 EDG_SICDisasterEvents.15.name:0 "驰援"
 EDG_SICDisasterEvents.15.desc:0 "法蒂玛人虽是异教徒，却也遵守诺言。即使面对诺曼人的来势汹汹，他们还是遵守了此前的盟誓，渡海前来相助我军，并为我们提供了其他宝贵的物质援助。"
 EDG_SICDisasterEvents.15.aa:0 "兄弟......"

 EDG_SICDisasterEvents.16.name:0 "大捷"
 EDG_SICDisasterEvents.16.desc:0 "作为那不勒斯联军主帅与这场不义之战的发起者，阿普利亚公爵[APU.Monarch.GetName]对战争局势的逆转忧心忡忡，终于，他按捺不住心中的焦虑，仅带了数名侍从，来到了前线战场的一旁，亲自观察战事。然而，他们的踪迹很快便被我军发现了，得知消息的前线指挥官带着骑兵队伍迅速突击，擒获了[APU.Monarch.GetName]。联军军心迅速瓦解，阿普利亚士兵望风而逃，指挥官无奈之下只能向我们递上降书。随着欧特维尔家族的陷落，诺曼人漫长的统治即将在两西西里画上了句号。"
 EDG_SICDisasterEvents.16.aa:0 "首恶必诛！"

 EDG_SICDisasterEvents.17.name:0 "败北"
 EDG_SICDisasterEvents.17.desc:0 "尽管信士的大军源源不断地涌向伊塔尼耶战场，但大势已定，希腊人终究无力回天。在一次遭遇战中，西西里护国公的小股部队碰上了阿普利亚公爵的主力军，希腊人虽然奋力反抗，却还是无力回天。最后，一支流矢结束了希腊枭雄并不漫长的一生。在领导者不幸殒命后，由他的个人威信和军事才干勉强拼合起来的联合军政府不多时便作鸟兽散，诺曼军队一路畅通无阻，轻松攻破了叙拉库塞城。最后，罗马教宗册封阿普利亚为西西里国王，欧特维尔家族时隔200年再次荣膺半岛西西里和西西里岛的至高领主之位。由于希腊人败北的速度过快，哈里发的将士虽然试图改变战局，但终究无济于事，最终只能在海军的掩护下撤离，哈里发此前制定的进军伊塔尼耶计划也从此破裂。"
 EDG_SICDisasterEvents.17.aa:0 "唉，丢人......"
 EDG_SICDisasterEvents.17.aa.tt:0 "我们§R错过§!了一个完成任务§R「巴勒莫之夜」§!的§R绝佳时机§!。"

 EDG_SICDisasterEvents.18.name:0 "大捷"
 EDG_SICDisasterEvents.18.desc:0 "出于对战事的负责和前线情况的忧心，我们的[Root.Monarch.GetName]亲自带领精锐部队，莅临前线探查。在战场的一角，公爵大人意外遭遇了西西里护国公和他的侍卫部队，双方展开激战，我军占据了人数优势，势如破竹，最终，一支流矢结束了希腊枭雄并不漫长的一生。在他不幸殒命后，由其个人威信和军事才干勉强拼合起来的联合军政府不多时便作鸟兽散，诺曼大军一路畅通无阻，轻松攻破了叙拉库塞城。罗马教宗听闻公爵[Root.Monarch.GetName]的功业后，也盛赞了他的神功圣武，答应重新为欧特维尔家族加冕西西里国王之衔。我们即将与伟大的罗杰二世比肩！"
 EDG_SICDisasterEvents.18.aa:0 "好极了！"

 EDG_SICDisasterEvents.19.name:0 "《佛罗伦萨条约》"
 EDG_SICDisasterEvents.19.desc:0 "$YEAR$年，西西里代表团与威尼斯代表团于佛罗伦萨会面。在美第奇家族的主持下，双方在百花宫进行了外交谈判。谈判持续一个月，期间希腊人的军队仍在与负隅顽抗的拉丁军激战，而西西里方的捷报不断传来，最后希腊人甚至已经兵临威尼斯人最骄傲的潟湖。战场的失利迫使威尼斯人不断作出妥协、让步，最终，双方在佛罗伦萨市政官的注视下，签订了《佛罗伦萨条约》。根据条约内容，为了补偿西西里在这次不义之战中受到的创伤，威尼斯共和国需要割让达尔马提亚、都拉齐翁这些海外领地，并且将科孚岛、克里特岛、纳克索斯岛、埃维亚岛等拉丁人从希腊人处强取豪夺的土地归还给希腊人的领导者——西西里护国公。除此之外，威尼斯公爵会用自己家族的私库来补偿希腊人的战争损失，而威尼斯人此后的一切贸易活动都需要获得西西里舰队的许可，否则不能越亚得里亚雷池半步。由此，从1204年的第四次十字军之后希腊人罹受的各种苦难，随着叙拉古独立战争的大获全胜和元凶之一的威尼斯人的没落，逐渐步入尾声，希腊的崛起势不可挡。"
 EDG_SICDisasterEvents.19.aa:0 "圣哉！圣哉！圣哉！胜利属于希腊，胜利属于基督！"

 EDG_SICDisasterEvents.20.name:0 "罗马心影录"
 EDG_SICDisasterEvents.20.desc:0 "TODO街溜子君士坦丁·拉斯卡里斯"
 EDG_SICDisasterEvents.20.aa:0 ""

 EDG_SICDisasterEvents.21.name:0 "拉拢"
 EDG_SICDisasterEvents.21.desc:0 "伊萨克四世的确是一位英明神武的「罗马君主」，他敏锐地察觉到了当时东帝国的大势已去，希腊世界的中心正在从君士坦丁波利斯缓慢地向西方的特里纳克里亚移动。于是，他果断地向希腊世界的豪族投出了橄榄枝，一个个在罗马内阁和军区执掌权柄的煊赫姓氏纷纷跨海西渡，在西西里温暖的海岸建立基业。\n\n如今，这批信赖的东方豪族已经成为了西西里政治生态的重要组成部分，能够与延续自诺曼-霍亨施陶芬时代、热那亚僭主时期的旧贵族和伊萨克三世的元从分庭抗礼的强大派系。相较于后者，这些「新贵」和军队无疑才是护国公的基本盘，他们与护国公拥有更多的利益共同点，都迫切需要从旧贵手中夺取权力与资源，壮大自身。于是，[Root.Monarch.GetName]在叙拉库塞的宫廷中精心安排了一场盛大的宴会，挑选了值得拉拢的豪族代表参与。推杯换盏之后，双方在一股愉快的氛围下进行了密谈。交流进行得非常顺利，护国公成功赢得了新贵们的认可与投资，巩固了自己的执政根基。"
 EDG_SICDisasterEvents.21.aa:0 "「一个城邦的公民要拥有同一个心灵和思想。」"

 EDG_SICDisasterEvents.22.name:0 "破灭"
 EDG_SICDisasterEvents.22.desc:0 "一切都结束了。\n\n共和国的理想，萨伏伊的幻梦，一切都结束了。\n\n远方的灯笼塔投下阴影，热那亚的城门终于为西西里的军队敞开门扉，利奥·诺萨提骑着高头大马走在军列的中央，他的身旁是心腹侍从和被押解的前热那亚「公爵」卡洛·迪·萨伏伊。一行人浩浩荡荡向公爵宫走去。\n\n不多时，众人已经抵达。「公爵大人，感觉怎么样？」利奥·诺萨提望着面前的富丽堂皇的府邸，连头都没回，冷漠的声音透过银白的面甲传出，充满着嘲弄。\n\n「......」卡洛连头都不敢抬起来，他畏惧看见道路两旁公民失望的眼神，畏惧看见城垣上的裂痕与疮痍，畏惧看见父亲苦心经营的宫殿。曾经的野望，曾经的计划，曾经的梦想，如今都葬送在了第勒尼安海，音讯全无。\n\n轻蔑地哼了一声，元帅没有去理会他，而是直接翻身下马，按着腰间的护国公赠剑，大步走入殿宇。希腊将军走在干净明亮的大理石地板上，一阵腥风从他耳畔吹过，火光在远方闪耀，厮杀声在背后响起，而他只看到了墙上的马赛克圣像画在对他微笑。"
 EDG_SICDisasterEvents.22.aa:0 "完美之城在对我微笑。"

 EDG_SICDisasterEvents.23.name:0 "追亡逐北"
 EDG_SICDisasterEvents.23.desc:0 "热那亚军队驻扎在阿普利亚公爵军营一旁，在此前几天，双方都在此与西西里军队激烈对阵，直到几天前，阿普利亚公爵被希腊人的流矢射中，不幸殒命，惊慌失措的逃兵回到了大营中，噩耗迅速传遍了全军，诺曼人的队伍大范围溃逃。同时，悲观的情绪影响到了热那亚人。1439年后，菲利贝托·迪·萨伏伊通过军功、威望、行贿和其他方式控制了雇佣兵和热那亚公民组成的军队，1443年，他的儿子卡洛又自称「公爵」，引发了一场声势浩大的共和派叛乱，卡洛丢人现眼的表现几乎葬送了他父亲留下的基业，雇佣兵团的骄兵悍将也对他的屡次欠薪十分不满。阿普利亚公爵远征西西里后，急于证明自己的卡洛第一时间响应，几乎堵上所有筹码，投入所有资源加入这场不义之战。然而，希腊人的坚韧与团结将心高气傲的拉丁人打了一个猝不及防，公教徒的战线一路后撤，最终自己竟成了防守方。如今，在阿普利亚溃败的连锁反应之下，战局的焦灼不下、西西里护国公的重金收买以及卡洛的志大才疏终于使得雇佣兵彻底难以忍受他的统治，当日便发动了哗变，将卡洛·迪·萨伏伊擒下，这位众叛亲离的「公爵」被立即押往希腊军中，跪伏在护国公面前，强迫他递上了早已准备好的降书。\n\n在「一战擒两王」之后，护国公分兵挥师北上，一支由大元帅利奥·诺萨提指挥，渡海远征利古里亚。群龙无首，热那亚的败北已成定局，西西里即将笑纳美丽的利古里亚海岸。"
 EDG_SICDisasterEvents.23.aa:0 "叙拉古不再需要一个利古里亚的僭主了。"
 EDG_SICDisasterEvents.23.aa.tt:0 "解锁§T决议§!：§Y远征热那亚§!"

 EDG_SICDisasterEvents.24.name:0 "旧日之冠"
 EDG_SICDisasterEvents.24.desc:0 "统一的西西里王国最后一位合法君主「善王」威廉二世绝嗣病故后，罗杰三世的私生子莱切伯爵坦克雷德，与罗杰二世的女婿神圣罗马皇帝海因里希六世为了王位大打出手，最终双方两败俱伤，在经历漫长的谈判后和教宗的监督下，签订一份令双方都不满意的《阿马尔菲和约》。和约规定，双方平分西西里王国，欧特维尔家族保留亚平宁半岛的领地，即被称为「半岛西西里」的王位，而霍亨施陶芬家族则占据西西里岛，其也被称为「特里纳克里亚」，其来源于西西里的三足标志。\n\n但双方的王权都没能长久，在半岛，势力大大衰减的欧特维尔家族受到了其他诺曼贵胄的挑战，他们宣称欧特维尔家族嫡流已经断绝，坦克雷德作为私生子无权领有其遗产。坦克雷德本人粉碎了四到五次这样的叛乱，但当他溘然长逝，其子威廉三世即位，霍亨施陶芬再次煽动了半岛西西里的内乱，企图分化半岛西西里为之后的入侵提供条件，这次欧特维尔家族没能赢得最后的胜利，半岛西西里的王位被颠覆，1260年，已经年迈的威廉三世只被允许保留阿普利亚与莱切公爵的头衔，南意大利的诺曼王朝宣布解体。\n\n然而，多行不义必自毙，临近入侵的霍亨施陶芬王朝接受了报应——他们被一个始料未及的对手，拜占庭帝国所突袭，经过热那亚人的牵线搭桥，墨西拿和叙拉库塞两地的希腊人拿起长刀，以西西里教堂的晚祷钟声为号，发动叛乱，推翻了君主的统治。此后二百年，西西里的统治权几经易手，最终落到了拉斯卡里斯家族手中，狄奥多勒·瓦塔泽斯废黜了安杰洛斯君主，打破了岛内微弱的政治平衡。我们的[Root.Monarch.GetName]认为，特里纳克里亚即将被地中海汹涌的海浪吞噬，现在正是夺回王朝遗产的最好时机。阿普利亚公国将完全投入到战争准备，王庭将专注于外交联合，利用自己的「正统」地位，号召那不勒斯诸诺曼王公南下打击西西里的异端，解放山岳中「真正的西西里人」。经过数年的努力，我们的诚意与君王的威严终于打动了卡拉布里亚和卡普阿公爵，时机已至，是时候跨越墨西拿海峡，重返西西里岛了！"
 EDG_SICDisasterEvents.24.aa:0 "先王啊，庇护我吧。"
 EDG_SICDisasterEvents.24.bb:0 "时机未至。"

 EDG_SICDisasterEvents.25.name:0 "离间"
 EDG_SICDisasterEvents.25.desc:0 "利奥·诺萨提是当年伊萨克三世的副官保罗·诺萨提的独子，作为将门贵胄，他是被公认为是元从系的领袖人物，自幼接受了良好的教育，不仅能将正教经文和希腊-罗马典籍倒背如流，还是一位骁勇善战的将领。由于伊萨克三世时期朝政的荒废和父亲的权势，饱览罗马历史的利奥·诺萨提自幼便滋生了不该有的野心，但他用谦卑和早慧伪装了自己。他在早年便被伊萨克四世所提拔，自此与同时晋升的狄奥多勒·瓦塔泽斯一同追随其左右。他被伊萨克的英明神武所折服，深知自己绝无可能超越自己的主君，只能接受在自己的一生中都为这位年轻而英武的帝王效犬马之劳。\n\n然而，天有不测风云，伊萨克四世在摩里亚远征期间不幸染病，过早地结束了自己的统治，只留下了孱弱的幼子嗣位。利奥·诺萨提与狄奥多勒·瓦塔泽斯共同受诏代理国事。由于生性谨慎，利奥·诺萨提没有第一时间接手职权，也因此让善于观察时机的后者，利用拉斯卡里斯家族的人脉借机扩张自己的权力网络，一举完成了对新贵系和军官系力量的掌握，将利奥挤出了权力中心。\n\n在狄奥多勒废黜伊萨克五世后，利奥还是保持着一种谨慎的态度，想要观察狄奥多勒的权势和地位是否稳定，而没有第一时间接受元从系和旧贵系向他提出的各种邀请，也因此与他们之间逐渐产生了隔阂。狄奥多勒观察到了他们的渐行渐远，于是心生一计，设宴邀请了利奥·诺萨提，并将伊萨克四世赠予的佩剑转赠于他。在觥筹交错、酒酣耳热之际，护国公借机递给利奥一份任命文书，当场宣布会为利奥任命西西里国家最高的军衔——大元帅，并且直言自己需要利奥的政治才能，后者将成为护国公的政治助手与继承人，之前赠予的佩剑将就此成为这一职衔的象征。烂醉如泥的利奥一时忘记了所有政治考量，被失而复得的喜悦冲昏了头脑的他当即在任命书上签名落款。直到返回家中后，他才如梦初醒，因自己所为而惊出了一身冷汗。而经此一夜，利奥·诺萨提投入护国公门下的消息不胫而走，本就与他渐生罅隙的元从系就此与他割袍断义。无形之中，利奥·诺萨提的权势遭到了瓦解，而与狄奥多勒签署的一纸委任状则令他别无他法，只能选择了拥立护国公的权威，期冀自己有一日也有幸能登上西西里的权力之座。"
 EDG_SICDisasterEvents.25.aa:0 "你不会为今天的决定而后悔。"

 EDG_SICDisasterEvents.26.name:0 "南征"
 EDG_SICDisasterEvents.26.desc:0 "阿普利亚公爵[APU.Monarch.GetName]向我们发来密信，邀请我们讨伐西西里的希腊异端。此前几年，他一直活跃于意大利的宫廷之中，进行政治游说。如今，我们也是时候给他一个正式答复了。"
 EDG_SICDisasterEvents.26.aa:0 "同去！"
 EDG_SICDisasterEvents.26.bb:0 "领地的发展才是我们重心所在。"

 EDG_SICDisasterEvents.27.name:0 "渗透"
 EDG_SICDisasterEvents.27.desc:0 "「伙计，这次的礼物总还满意吧？」帕诺斯·塞维罗斯将一大袋金币递给递给了老安东尼，笑眯眯地说道。他的身后是好几个穿着便服的西西里士兵，正一起从船上卸下一箱箱财宝。\n\n热那亚人舔了一下嘴唇，迫不及待地从希腊人接过了袋子。「......五十，五十一，五十二......」雇佣兵队长贪婪地一枚一枚数着袋中的钱币，许久之后，他才抬头，望着帕诺斯船上高高垒起的一个大木箱。\n\n「我的朋友，这些都会是你的。」帕诺斯适时凑上前去，搂着安东尼的肩膀说道，那神情分明像是画作里蛊惑人的魔鬼。\n\n安东尼将注意力从宝箱上收了回来，他看着年轻的希腊人，咧嘴一笑：「你们应该知道，卡洛那混小子欠了我们很多钱，但是老菲利贝托给他留下的忠臣还是不少，想要我们为你们卖命的话，这点东西可不足够。」\n\n「放心吧兄弟，我们不需要你们主动发难，只需要你们帮忙推波助澜就好了。只要答应了这一条，这方面我们可不会像萨伏伊人一样亏待你们的！」帕诺斯哈哈大笑，拍了拍老安东尼的肩膀告别，然后便回到了自己的船上，扬帆远去。「伙计，下周还是老地方见！」\n\n等到对方一行人的背影逐渐消失在地平线上，他别过身，嘴角挂着一丝嘲弄，用只有自己能听到的音量，念叨着："
 EDG_SICDisasterEvents.27.aa:0 "「黄金能穿墙入室，摧毁石墙，比闪电更强......」"

 EDG_SICDisasterEvents.28.name:0 "溃于蚁穴"
 EDG_SICDisasterEvents.28.desc:0 "卡普阿公爵[PUA.Monarch.GetName]生性轻上侮下，他坐拥富庶的那波利地区，还是罗马教宗的座上红人，与阿尔勒国王来往也颇为密切，因此养成了飞扬跋扈、狂傲自大的性格，对属官仆从动辄辱骂殴打，在领地内横征暴敛、不得民心。在这次被阿普利亚公爵以重金收买后，他带领举国精锐出兵西西里，后方空虚，而此前被他欺侮的臣下也因此动了报仇的心思，我们的情报人员已经与其中一部分人取得了联系，其中便包括卡普阿城的治安执行官。他告诉我们，他负责领导卡普阿和拿波利城市卫队，而城市行会和八人委员会也早已对公爵[PUA.Monarch.GetName]不满，如果我们能展现足够的诚意，那么卡普阿乃至那波利城都将对希腊人敞开大门。"
 EDG_SICDisasterEvents.28.aa:0 "他的性格已经决定了他的结局。"

 EDG_SICDisasterEvents.29.name:0 "狭路相逢——"
 EDG_SICDisasterEvents.29.desc:0 "卡拉布里亚公爵[CBI.Monarch.GetName]在三位诺曼公侯中拥有最少的领地，却拥有一支最精锐的军队。也因此，虽然阿普利亚公爵是这场不义之战的发起者，但卡拉布里亚公爵才是联军实际上的总指挥，负责制定联军作战计划，亲自坐镇前线指挥战事。\n\n在探查清楚诺曼联军的具体局势后，护国公决定逐个击破，首当其冲便是卡拉布里亚军。护国公亲自制定方略，令小股部队坚守梅西尼，故作疑兵，牵制诺曼人。他游说各豪族，成功劝说他们为共和国捐出了一艘艘宝贵的运输船和机密的海图。在诺曼人忙于强渡墨西拿海峡时，护国公已经找到了几条隐秘的航线，并抓准时机悄然绕过了他们的海军，偷渡到了卡拉布里亚的王庭，截断联军的后路。"
 EDG_SICDisasterEvents.29.aa:0 "——智者胜。"

 EDG_SICDisasterEvents.30.name:0 "诸王烬乱"
 EDG_SICDisasterEvents.30.desc:0 "旧时代的灰烬借风复燃。阿普利亚、卡普阿、卡拉布里亚——半岛西西里的三个诺曼公国，在宣称自己对西西里岛的土地拥有继承权的欧特维尔公爵的带领下，越过墨西拿海峡而来。热那亚和威尼斯在贸易利益的诱使下，短暂搁置了百年国仇，将桨帆船战联袂驶入特里纳克里亚近海，圣乔治十字与圣马可飞狮在风中并肩，宛如秃鹫并排盘旋于海上。而被废黜的安杰洛斯小皇帝正和他的党羽窃窃私语，似乎在帕勒莫酝酿着什么阴谋。\n\n自组建以来一直争执不休的西西里护国议会内，议员们终于停止了争吵，同意在护国公的领导下一致对外，共赴国难。墨西拿郊外的麦田里，希腊步兵正与诺曼骑士撞在一起，矛杆折断，马蹄踏碎尸首，麦穗被血浸成暗红色。卡塔尼亚海岸线上，希腊火点燃了威尼斯人的运粮船，浓烟遮蔽了半个海湾。战争之火几乎席卷了整个意大利亚，南欧的命运即将迎来一次轰轰烈烈的变革。"
 EDG_SICDisasterEvents.30.aa:0 "他们成千成万，像春天茂盛的花木和嫩叶一样，瞬间便被战争的血雨抹去。"

 EDG_SICDisasterEvents.31.name:0 "离弦之箭"
 EDG_SICDisasterEvents.31.desc:0 "如果说叙拉库塞是古典时代的一条激流，汹涌澎湃，那么她今天已濒临干涸，徒留一地河谷；那么帕勒莫就像一条融汇多条支流的大河，在中世纪汇聚，流到今天已即将成为主流。\n\n公元9世纪时，跨海奔袭的萨拉森人陆续攻占西西里诸城，他们将帕勒莫定为行政中心，而对罗马人在西西里的治所——叙拉库塞大加屠戮，由此开启了这2座城市命运的转折。此后，诺曼人、霍亨施陶芬王朝都先后定都于帕勒莫，伊萨克三世虽然定都叙拉库塞，却流连于帕勒莫的行宫，直到狄奥多勒·瓦塔泽斯废黜伊萨克五世，才彻底宣告了特里纳克里亚之心重归叙拉库塞。\n\n自然，帕勒莫的行会和根深蒂固的贵族对护国公的「逆行」颇为不满，首都的更易标志着权力的转移，必然会触及旧集团的利益。而经过马耳他的腓特烈的长期煽动下，几乎在诺曼人南下的同时，本就不满的帕勒莫人终于宣布反抗护国公的统治，重新拥护伊萨克五世为西西里之主，与叙拉库塞势不两立。"
 EDG_SICDisasterEvents.31.aa:0 "不！"

 EDG_SICDisasterEvents.32.name:0 "山崩地陷"
 EDG_SICDisasterEvents.32.desc:0 "在晚祷战争后的近200年里，西西里的统治者从未能完全掌控西西里。在山区，笃信着天主教的家族一直坚守着他的土地，他们被称为山岳人，而自称自己为「真正的西西里人」，与海滨的「叙拉古人」互相仇视。叙拉库塞的主人努力平衡着希腊人和西西里人的对立，他们和他们的后继者，一代代西西里统治者守护着这颗跳动的心脏，但这颗遗世而孤立的小岛是否能够真正在浪潮当中独善其身呢？\n\n答案是否定的。在两西西里这片阳光明媚的土地之上，无论是目不识丁的老农还是统领一方的诸侯，这里的人就信奉一个信条「以牙还牙，以眼还眼」，毒药和匕首永远是两西西里亘古不变的主角，而使用它的芸芸众生只不过是这座舞台的匆匆过客。在等待近200年后，叙拉库塞的权威日渐旁落，希腊人的势力在西西里岛的发言日渐衰微，西西里人的忍耐也到了极限，他们抓起手中的农叉、柴刀以及所有能充当武器的东西，在霍亨施陶芬家族各分家打手的带领下，怒气冲冲地冲出村庄，向最近的希腊人城市奔袭而去。"
 EDG_SICDisasterEvents.32.aa:0 "不！"

 EDG_SICDisasterEvents.33.name:0 "刀刺在背"
 EDG_SICDisasterEvents.33.desc:0 "阴谋与背叛一直是希腊历史的重要一部分，而非简单的政治病态，个人野心与派系倾轧驱动着无数希腊人在阴影中展开了一次次无声的厮杀，轻则决定战争成败，重则撬动历史走向。希腊人缺乏和平交接权力机制的体制与极度推崇「荣誉-竞争」的文化成为了最适合滋生阴谋的土壤。\n\n西西里的政局错综复杂，从诺曼时代就扎根于此的旧贵，跟随伊萨克三世的元从，伊萨克四世时期西渡的新贵，以及执掌军队的军勋，都在暗中争夺特里纳克里亚的权势。而狄奥多勒·瓦塔泽斯的篡权打破了原本脆弱的政治平衡，而他未能及时缔造新的政治体制，使得阴谋在他看不到的角落中疯狂生长。诺曼人的入侵给野心家提供了最好的时机，一天夜里，在护国公巡视军营之时，突然被一支毒箭射中要害，当场昏迷，于次日凌晨宣告死亡，军队群龙无首，希腊豪族为了护国公之位掀起了一场空前的争夺。"
 EDG_SICDisasterEvents.33.aa:0 "不！"

 EDG_SICDisasterEvents.34.name:0 "棕靴军"
 EDG_SICDisasterEvents.34.desc:0 "漫长的战争恰是一场机遇，卡拉布里亚的[CBI.Monarch.GetName]利用其他两位公爵、威尼斯人、热那亚人乃至罗马教宗的支持，培养出了一支身经百战、军纪严明、忠诚果敢的军队，被称为「棕靴军」。他们的前线将领已经习惯了我们的战术，并且据说甚至已经想通了该怎么对付我们。"
 EDG_SICDisasterEvents.34.aa:0 "该死！"

 EDG_SICDisasterEvents.35.name:0 "黄金锁链"
 EDG_SICDisasterEvents.35.desc:0 "拉丁人的舰队是在一个无月的夜里出现的。先是几簇鬼火般的桅灯，随后，整个墨西拿海峡几乎都被桨帆船的黑影填满。那面金边飞狮旗从旗舰的桅顶垂下，在海风中鼓成一面僵硬的帆。封锁令传至叙拉库塞时，码头的渔夫还在修补渔网，港口的税吏还在清点今日的铜币。没有人来得及反应。\n\n第一日，港外出现漂浮的碎木板和断桨——那是试图闯关的商船留下的。第二日，码头上挤满了无处卸货的船主，他们的货物被堵在港口里。第三日，面包的价格翻了五倍，但还是供不应求。\n\n护国议会中，每天都有议员反馈物资紧缺。海面上，威尼斯人的战船昼夜巡逻，将每一艘靠近特里纳克里亚的船只都逼退，乃至击沉。所有人都明白，圣马可飞狮爪间的那道黄金锁链，不但锁住了共和国的大小港口，还锁住了每一户人家灶台上的锅。"
 EDG_SICDisasterEvents.35.aa:0 "该死！"

 EDG_SICDisasterEvents.36.name:0 "驱逐希腊人？"
 EDG_SICDisasterEvents.36.desc:0 "早在公元前8世纪起，希腊人就在当时被称为「大希腊」的今南意大利亚建立了许多殖民城市，如叙拉库塞、塔兰托、克罗托内等。而在拜占庭时期，由于君士坦丁堡的统治，希腊文化逐渐在两西西里复兴。尽管而后萨拉森与诺曼接踵而来，但也没有改变当地枝繁叶茂的希腊社区。晚祷战争后，希腊人更是在西西里岛统治近200年，与本地人逐渐融合，形成了独特的希腊-西西里文化。希腊移民带来了语言、建筑和法制，他们作为医生、星象家、税务官与外交翻译，为宫廷注入拜占庭式的治理智慧，其海事经验更成为掌控地中海商路的关键。然而，在我们夺取一座南方城市后，宫廷中的顾问向我们指出，这帮希腊人曾经背叛了西西里的霍亨施陶芬王室，背信弃义，早已不值得信赖，我们应该拔除治下所有的希腊人定居点，并没收他们的财富，勒令他们滚回爱琴海老家。"
 EDG_SICDisasterEvents.36.aa:0 "拔除这些定居点，希腊佬给我滚出意大利！"
 EDG_SICDisasterEvents.36.bb:0 "准许他们延续吧，毕竟朕也不是什么坏人。"

 EDG_SICDisasterEvents.37.name:0 "怒发冲冠"
 EDG_SICDisasterEvents.37.desc:0 "数十年前，我们的前前任公爵曾经派兵帮助他的女婿米海尔·安杰洛斯夺取了西西里的王位，可敬的米海尔国王在占据西西里后仍然心念旧恩，和共和国保持了良好的关系，帮助我们在地中海的中央铺展贸易网络，封锁我们的老对手热那亚人，巩固我们在希腊世界的商业影响力。\n\n然而，在米海尔死后，他的后继者们都不安分，总是居心叵测地想破坏我们的事业，让共和国伤透了心。他们引来了拜占庭帝国的豪族，让他们与我们竞争，抢占我们的市场。同时，他们还有意无意地鼓励市民排挤我们的商人，直接给我们捣乱。在过去，伊萨克四世用他的小伎俩和私人感情干扰了前任公爵的判断，使得我们在西西里的掌控力大不如前。而如今，随着他和老公爵的相继薨逝，重申对西西里的贸易特权再次成为了议会的最新议程。然而，西西里的希腊人不再恭顺，他们将丹多洛的血脉拉下了王座，而将拉斯卡里斯的后代推了上去，不再打感情牌，而是直接羞辱共和国，将八分之三罗马的骄傲掷于地上，宣布尽数废除我们的贸易特权。对此，我们的[Root.Monarch.GetName]陛下已经怒不可遏，宣称将亲自解放叙拉库塞和帕勒莫，解救他的远房亲戚。"
 EDG_SICDisasterEvents.37.aa:0 "拉斯卡里斯的杂种只配跪倒在我面前为他的背叛忏悔！"

 EDG_SICDisasterEvents.38.name:0 "野心乐章"
 EDG_SICDisasterEvents.38.desc:0 "自从父亲去世后，卡洛·迪·萨伏伊便再也未能安然入眠。\n\n老菲利贝托虽然实际夺取了共和国的最高权力，但他未能撑到彻底完成对热那亚的君主制改造的那一天而过早地离开了人世。年轻气盛的毛头小子卡洛继承了父亲的权力和军队，匆忙地为自己设立了「公爵」的世袭职位，但国内的共和主义者并不买账，雇佣兵团的骄兵悍将也屡屡阳奉阴违，导致他在忙于应付内乱时丧失了科西嘉领地，还使得东方各领地陆续沦陷于希腊人之手。\n\n如今的热那亚毫无疑问陷入了低谷期，卡洛急需一场战争来证明自己，来让反对派闭上嘴，来让父亲的旧部彻底臣服。而西西里的内乱让他看到了机会，他在家传档案中找到了先祖安德烈亚·迪·萨伏伊将军曾发动晚祷战争，获衔「西西里希腊人的保护者」，统治特里纳克里亚的海滨。于是他并援引此事作为自己的宣称，宣布响应阿普利亚公爵的号召，自己也将发动一场对西西里岛的十字军。"
 EDG_SICDisasterEvents.38.aa:0 "我必须要证明自己！"

 EDG_SICDisasterEvents.39.name:0 "圣所之书"
 EDG_SICDisasterEvents.39.desc:0 "TODO 教宗指手画脚"
 EDG_SICDisasterEvents.39.aa:0 "此时此刻，你不会在说笑吧？"
 EDG_SICDisasterEvents.39.bb:0 "我们愿意听从教宗的钧意。"

 EDG_SICDisasterEvents.40.name:0 "熄灭余火"
 EDG_SICDisasterEvents.40.desc:0 "马耳他的腓特烈与帕勒莫的失势贵族们自以为他们的计划天衣无缝、万无一失，殊不知从腓特烈踏上特里纳克里亚的那一刻起，护国公殿下就将这场政治阴谋尽收眼底。预料到安杰洛斯废帝和霍亨施陶芬的没落公子注定不能成事的[Root.Monarch.GetName]在一开始并没有轻举妄动，而是静静观察，等待他们放松警惕，再将其一网打尽。终于，他等到了一个机会。1449年年初的一天，刚刚与安杰洛斯党羽密谋完初步计划的腓特烈·霍亨施陶芬决定去突尼西亚拜访自己在十字军服务期间认识的战友。在他和家族内的亲信扮作商人，乘船离开帕勒莫后，护国公第一时间秘密封锁了伊萨克五世和安杰洛斯党羽所在的区域，根据之前监视时记录下的名单派人逐个将参与密谋的贵族擒获收押，并且彻底软禁了伊萨克五世。确保万无一失后，护国公立刻亲自乘战船追上了霍亨施陶芬家族的船只，将毫无防备的腓特烈一行人截下，随后尽数押至叙拉库塞。与此同时，西西里海军也登陆了马耳他岛，攻入霍亨施陶芬城堡，结束了马耳他岛在晚祷战争之后近200年维持的自治状态。"
 EDG_SICDisasterEvents.40.aa:0 "老东西就该滚回坟墓里，而不是在新时代死灰复燃！"

 EDG_SICDisasterEvents.41.name:0 "蓝天无垠"
 EDG_SICDisasterEvents.41.desc:0 "战争结束后的某一年，[Root.Monarch.GetName]带着一名侍从，一起骑马去了[124.GetName]郊外散心。他只穿了一身常服，披了一件旧斗篷，帽檐压得很低。侍从牵马走在前头，两人沿着当地新修的碎石路，穿过一片片橄榄林。路边的灌溉渠里，水流哗哗响着，是从山上引下来的泉水。\n\n他们来到一个小村庄，村口的麦田已经金黄。几个农人弯着腰在田里割麦，镰刀挥动时发出刷刷的声音。护国公翻身下马，蹲在田埂上抓了一把土。土是黑的，捏在手里沉甸甸的，渗着水汽。几年前，这里还是烧焦的荒地，麦穗没熟就被诺曼人的马蹄踏进泥里。如今，麦粒饱满得撑破了穗壳。一个希腊老农赶着骡车从身边经过，车上堆着新收的麦子，压得车板吱呀响。老汉只当他是一个闲来无事出来游山玩水的老乡绅，就冲他点点头，咧嘴一笑，露出一口缺了牙的牙龈。[Root.Monarch.GetName]笑着对他也点点头。\n\n一扭头，[Root.Monarch.GetName]看见村子里的橄榄树发新枝了，嫩绿的叶子从旧枝干上抽出来。一个村妇正蹲在树下捡落果，她身后是一排新砌的石墙，石灰还没干透，白生生地发亮。耳畔传来孩子的笑声，一个光脚的小男孩从屋子里跑出来，刚好跑到了[Root.Monarch.GetName]身边，天真无邪的眼睛张得大大的，好奇地望向护国公，手里还举着一只纸折的船。[Root.Monarch.GetName]弯腰道了声谢接过纸船看了两眼，又还给他。小男孩跑远了，手中的纸船在风里摇摇晃晃。\n\n此时太阳已升到头顶，于是[Root.Monarch.GetName]在村口的石头上坐下，接过侍从递来的水囊，抿了一口。他抬起头，天空没有一丝云。蓝得像刚洗过，从头顶一直铺到海面，铺到看不见的地方。当年，这片天被烽烟遮着，被箭矢划过，被炮火硝烟熏成灰色。如今，什么都没有了，只有干净的蓝色。[Root.Monarch.GetName]把水囊挂在腰间，站起身，拍了拍裤子上的土。侍从牵过马来，他翻身上马，回头看了一眼村庄。炊烟从几户人家的烟囱里升起来，直直地飘向蓝天。他微微笑着，痴痴地看着自己努力守护的人。"
 EDG_SICDisasterEvents.41.aa:0 "「我们永远，永远拥有明天。」"

 EDG_SICDisasterEvents.42.name:0 "救国热忱"
 EDG_SICDisasterEvents.42.desc:0 "「富足时不见得慈爱，和平时不见得勇敢；只有在困窘中，坚定才被证明；只有在战争中，勇敢才被检验。」如今，西西里国难临头，无数英勇的希腊人挺身而出，自愿加入这场伟大的救国战争。"
 EDG_SICDisasterEvents.42.aa:0 "致敬！"

 EDG_SICDisasterEvents.43.name:0 "爱琴海的浪"
 EDG_SICDisasterEvents.43.desc:0 "克里特岛西端的干尼亚港，海风从西北方向吹来，把飞狮旗吹得猎猎作响。而帕诺斯在日暮登岸。他的商船载着从黑海运来的毛皮，货物清单上盖着威尼斯海关的印章。没有人检查他的船舱。港口税吏接过他递去的银币，就挥手放行。\n\n他穿过市场，拐进一条窄巷，在一家没有招牌的酒馆前停下。木门半掩，门缝里透出昏黄的烛光。推门进去，里面只有一张桌子有人。那人穿着斯特拉迪奥蒂雇佣兵的半身甲，肩上的披风沾满尘土，腰间别着一把短剑。桌上搁着他的皮盔。\n\n帕诺斯摘下帽子，露出那张被海风吹黑吹糙的脸，坐在他身旁，开口致意：「扬纳里斯·德拉科斯-阿尔瓦尼塔基斯，你好。」\n\n「帕诺斯·塞维罗斯，」扬纳里斯放下酒杯，看了他一眼，用北伊庇鲁斯口音的的希腊语作了回复。「我在都拉齐翁见过你。你那时替威尼斯人收小麦。」\n\n「现在也收。只是换了个买家。」帕诺斯从袖中取出一封没有署名的信，推过桌面，「护国公代我向你问好。」\n\n扬纳里斯没有拆信。他用拇指摩挲着封口处的蜡印——那是一只双头鹰，没有文字。「你替拉斯卡里斯家族做事。」\n\n「准确说，是替全体希腊人。」\n\n酒馆老板端来两杯葡萄酒，而后又缩回后厨。帕诺斯举起杯子，抿了一口，眼睛一直看着对方。「威尼斯人封锁了梅西尼海峡。但护国公不愿坐以待毙。」\n\n「可我是威尼斯册封的指挥官。」「你的部队都是阿尔巴尼亚希腊裔或克里特人。」\n\n「我的小伙子们领丹多洛的饷。」「他们的父祖领过君士坦丁堡的饷。」帕诺斯放下酒杯，「你的叔叔因为交不上给纳克索斯公爵的税而死在监狱中，我查过。」\n\n扬纳里斯的脸色变了。他抓起酒杯，一口气灌下半杯。酒液顺着下巴淌进胡茬里。「你要什么？」「你的刀。」帕诺斯说，「不需要你举旗造反，爱琴海每一处都有义军。你的人只需要在起义之夜，出手帮一把。」\n\n「然后呢？」「阿尔瓦尼塔基斯将作为一个荣耀的希腊姓氏登上史册，护国议会将承认你为克里特军区将军。」\n\n扬纳里斯沉默了片刻，旋即伸出手，将那封未拆的信收进胸甲的夹层。「一夜？」「一夜。」\n\n帕诺斯将剩下的酒喝完，数出几枚铜币压在杯底，起身离开。出门的瞬间，海风扑面，将他的衣角吹起。远处海面上，月亮刚从云层后面露出半边，把银光洒在浪尖上。"
 EDG_SICDisasterEvents.43.aa:0 "海风轻推开了窗......"

 EDG_SICDisasterEvents.44.name:0 "先祖余烈"
 EDG_SICDisasterEvents.44.desc:0 "在光复君士坦丁波利斯的前夕，卑劣的巴列奥略篡夺了属于拉斯卡里斯家族的皇位，并且大肆打压后者。然而，尼西亚的血脉从未放弃经营权力网络，一直在韬光养晦，谋划东山再起。\n\n由于帝国的衰败，不少希腊人选择移民到拉丁共和国的治下，虽然要付出不少钱财应付他们的重税，但至少不会有皇室内战和外敌入寇之忧。而拉斯卡里斯家族就借此机会，在威尼斯共和国布下了不少暗桩，他们凭借威尼斯公民的身份，一直为拉斯卡里斯家族秘密服务。\n\n随着护国公[Root.Monarch.GetName]执掌了西西里大权，他获得了家族的更多资源，此前数代人精心经营的情报网络即将在这场战争中起到重大作用。"
 EDG_SICDisasterEvents.44.aa:0 "家族的经营终于得到了回报。"

 EDG_SICDisasterEvents.45.name:0 "海上远征"
 EDG_SICDisasterEvents.45.desc:0 "阿普利亚公爵的失败影响了这一整场战争的走向，不仅导致了诺曼联军的整体溃败，其引起的蝴蝶效应也使得热那亚公爵陷于军队哗变。昔日不可一世的拉丁人已经如同丧家之犬，在西西里军队前望风而降，只有威尼斯共和国选择负隅顽抗。于是，护国公在简单安置战俘和巩固前线战况后，决定亲自远征水城威尼斯，逼迫拉丁人彻底屈服。"
 EDG_SICDisasterEvents.45.aa:0 "仇恨必将用鲜血来偿还！"

 EDG_SICDisasterEvents.46.name:0 "城下之盟？"
 EDG_SICDisasterEvents.46.desc:0 "共和国近期的接连大胜已经让威尼斯公爵吓破了胆，护国公的军队几乎是一口气打到了威尼斯城下。与此同时，威尼斯国内大范围的共和主义者叛乱又倒逼着他向我们低头屈服，表示愿意放弃在希腊的利益，并且斥巨资赔偿西西里在这场战争中的损失，佛罗伦萨的银行家也表示愿为这次和谈的中间人。"
 EDG_SICDisasterEvents.46.aa:0 "同意他，叙拉古也需要时间修整。"
 EDG_SICDisasterEvents.46.bb:0 "拒绝他，我也想吊死威尼斯总督！。"

 EDG_SICDisasterEvents.47.name:0 "心意"
 EDG_SICDisasterEvents.47.desc:0 "拉丁人大军压阵，但我们的[From.GetName]朋友丝毫不惧，毅然决然选择了站在希腊与公义的一方，帮助我们。"
 EDG_SICDisasterEvents.47.aa:0 "「心智善良的伙伴，比兄弟更亲近！」"

 EDG_SICDisasterEvents.48.name:0 "急报"
 EDG_SICDisasterEvents.48.desc:0 "[Root.Monarch.GetTitle]大人，昨日阿普利亚公爵[APU.Monarch.GetName]伙同卡拉布里亚公爵和卡普阿公爵，跨越墨西拿海峡，偷袭我们的盟友西西里共和国，威尼斯和热那亚也纷纷下场。按照此前的盟誓，我们此时应该加入战争，援助他们，请问是否要履行誓言？"
 EDG_SICDisasterEvents.48.aa:0 "不惜一切代价驰援我们的兄弟！"
 EDG_SICDisasterEvents.48.bb:0 "散了吧。"

 EDG_SICDisasterEvents.49.name:0 "意外收获"
 EDG_SICDisasterEvents.49.desc:0 "虽然诺曼人是这场不义之战的首恶，但毋庸置疑的是，威尼斯共和国才是我们头号强敌，护国公每日与将领们商讨的要务都以如何战胜威尼斯为主。一天傍晚，正在叙拉库塞海岸巡逻的西西里海军突然发现了一艘落单的威尼斯战船。在确认并无埋伏之后，西西里海军迅速上前击沉了这艘战船，俘获了船上人员。在审问之后，我们惊讶地发现，这艘战船上的军官几乎都是威尼斯共和国的大家族子弟，他们只知在船上饮酒作乐，无人在意航线，最终竟偏航到了叙拉库塞海岸，为我们所擒。面对这样的意外之喜，毫无疑问，我们会成功撬开他们的嘴，从中获得更多的有利消息。"
 EDG_SICDisasterEvents.49.aa:0 "好极了！"

 EDG_SICDisasterEvents.50.name:0 "费阿刻斯之手"
 EDG_SICDisasterEvents.50.desc:0 "科孚岛，古称「斯刻里亚岛」，今称「克基拉岛」，宛如一条美人鱼横卧在爱奥尼亚海上，宁静精致。荷马史诗里，漂泊的奥德修斯被风暴冲到斯克里亚岛，安居岛上的费阿刻斯人盛情款待他，送他衣物、美酒和船只，让他在沉睡中驶回故乡。\n\n岛上的居民基本都是希腊人，即使威尼斯统治此地近半个世纪，也未能改变希腊族群的主导地位。在驻军中，也有不少希腊士兵，有的是本地应征，有的是从周边逃来的难民。他们就驻扎在东岸的岬角上，三面悬崖，一面临陆。拉丁人修缮、扩建了始建于6世纪的堡垒，在要害处加了棱堡，炮台从崖壁间伸出，指向海面，锁住了亚得里亚海的门户，易守难攻。\n\n也因此，护国公在深思熟虑后，并未选择强攻此地，而是决定动用一些巧妙的手段。\n\n在一天夜里，驻守城门的希腊军官下令撤下了吊桥的锁链，用火把向海面发出信号，岛民随后涌上城墙，夺下了炮台。战斗没有持续多久。几名不愿投降的拉丁军官被堵在甬道里，佩剑都没来得及拔出鞘。港口的海军试图起锚逃走，但殊不知他们的船底的舵板早就被希腊水手凿穿了。威尼斯驻军指挥官被堵在房内，还没穿上靴子就做了俘虏。天还未亮时，西西里的舰队从海峡对岸驶来，没有遇到任何抵抗，鱼贯入港。共和国旗帜已在堡垒的旗杆上飘扬，在海风中猎猎作响。由此，威尼斯封锁亚得里亚海的黄金锁链已经被西西里熔断，希腊人远征北境之路畅通无阻。\n\n千年前，漂泊的英雄被费阿刻斯人送还故乡；千年前，费阿刻斯人又向西西里的奥德修斯伸出援手，帮他们打开了敌国之门，也推开了回归希腊世界之窗。"
 EDG_SICDisasterEvents.50.aa:0 "「如今，我亲爱的故土确实已经清晰可见。」"

 EDG_SICDisasterEvents.51.name:0 "公民提供战船"
 EDG_SICDisasterEvents.51.desc:0 "护国公领导下的西西里陆军英勇善战，击败了所有入侵者，但是海军的孱弱却让敌人有了可乘之机，骚扰特里纳克里亚的海岸。有识的公民已经发现了共和国的这一缺点，并无私地向政府捐献了宝贵的战船。"
 EDG_SICDisasterEvents.51.aa:0 "好极了！"

 EDG_SICDisasterEvents.52.name:0 "后院失火"
 EDG_SICDisasterEvents.52.desc:0 "公爵大人，大事不妙！我们的王庭前日已被希腊人攻破，那该死的城市卫队司令官收了希腊人的五十万杜卡特，还放他们进了那波利城，如今后方已经全面溃败，都被希腊人所占据，国家危矣！"
 EDG_SICDisasterEvents.52.aa:0 "大事不好！"

 EDG_SICDisasterEvents.53.name:0 "媾和？"
 EDG_SICDisasterEvents.53.desc:0 "我们错估了西西里的实力和我们国内的局势，如今，共和主义者、齐亚尔家族和希腊人的合力围攻即将倾覆丹多洛家族的王座，从先祖恩里克·丹多洛传下来的冠冕已经朝不保夕。对此，一部分顾问向我们的[Root.Monarch.GetName]陛下提出，攘外必先安内，我们必须暂时放弃在海外的利益，专注对付该死的家贼，确保我们的统治。"
 EDG_SICDisasterEvents.53.aa:0 "说的没错，赶紧去向希腊人认错服软吧！"
 EDG_SICDisasterEvents.53.bb:0 "列位弟兄，战斗至最后一刻，自刎归天！"

 EDG_SICDisasterEvents.54.name:0 "势如破竹"
 EDG_SICDisasterEvents.54.desc:0 "随着我们顺利攻破了卡普阿公国的王庭，此前与我们暗中取得联系的卡普阿城治安执行官也找到了前线指挥官，向他投诚。如今，卡普阿后方防线大开，我们势如破竹，一路攻克各座城市。"
 EDG_SICDisasterEvents.54.aa:0 "好极了！"
 
 EDG_SICDisasterEvents.55.name:0 "危如累卵"
 EDG_SICDisasterEvents.55.desc:0 "晚祷战争后，霍亨施陶芬王朝在西西里岛的统治被颠覆，然而最后一位西西里国王曼弗雷德并未逃离特里纳克里亚，而是在忠诚的公教徒的帮助下隐遁入了西西里崎岖群山之中的某个村落。之后国王试图乘船前往威尼斯，回到德意志地区向本家低头换取援助，然而35岁的国王却在途中意外遭遇海难而死。在遗民们沉浸在于晚祷战争的余震和国王罹难的悲恸之际，后宫里却传出喜讯——王后怀上了陛下的遗腹子，霍亨施陶芬的嫡系血脉并未断绝。\n\n此时，带有霍亨施陶芬血脉的分家们早已陷入了西西里岛内陆群峦的权力真空当中激烈争夺，而受拥护的曼弗雷德遗腹子被「真正的西西里人」转移到了马耳他岛上保护，并在此修筑了坚固的堡垒。由于政局的混乱，叙拉库塞的热那亚僭主并未注意到一座蕞尔小岛的变化，使得霍亨施陶芬的末裔得以延续。\n\n时间来到15世纪，年过六旬的马耳他「正统西西里国王」海因里希七世与东罗马巴列奥略家族的贵女结合，诞下了独子腓特烈。腓特烈受到了良好的教育，是一名坚忍刚毅的公教徒，还是一位学者和诗人，更是一位胸怀韬略的统帅，年少之时就投身北非的十字军战场，帮助十字军抵御穆斯林的袭扰，与圣殿骑士团的成员和突尼西亚王国的权贵结下了深厚的友谊。1442年，他回到马耳他继承「王位」。次年，西西里皇帝伊萨克四世溘然长逝，其幼子伊萨克五世便被狄奥多勒·瓦塔泽斯废黜。然而当时的护国公展现了妇人之仁，没有对安杰洛斯的势力进行清算，[2982.GetName]的军政府和[125.GetName]的旧贵族最终形成离心之势，貌合而神离，西西里局势波诡云谲。腓特烈看出，西西里的历史已经来到了转折的十字路口，霍亨施陶芬家族最后逆转命运的机会，就在此时。于是，腓特烈乘商船秘密前往[125.GetName]，决定凭借自己的才能在特里纳克里亚搅动风云。"
 EDG_SICDisasterEvents.55.aa:0 "迫在眉睫。"
 EDG_SICDisasterEvents.55.aa.tt:0 "§R我们必须及时完成任务阻止腓特烈·霍亨施陶芬的阴谋。§!"

 EDG_SICDisasterEvents.56.name:0 "山雨欲来"
 EDG_SICDisasterEvents.56.desc:0 "1266年的晚祷战争彻底改写了特里纳克里亚的命运，打断了两西西里统一的大势，在拉丁和希腊两个民族之间再次割开了一条鸿沟。南方的西西里岛在此后近200年内，无数统治者如走马灯般登场，旋即谢幕，而北方的半岛西西里一直在舔舐着伤口，等待一个入侵机会。随着西西里政局的持续动荡，半岛西西里的诺曼人和热那亚的佣兵领主终于看到了一个夺取政权的绝佳机会，于是在商人和贵族的联合之下，阿普利亚公爵已经组建了一个针对西西里的军事联盟，一场大战已经近在眼前。"
 EDG_SICDisasterEvents.56.aa:0 "战争一触即发。"
 EDG_SICDisasterEvents.56.aa.tt:0 "§R战争即将爆发，请做好万全准备！§!"

 EDG_SICDisasterEvents.57.name:0 "残烬新生"
 EDG_SICDisasterEvents.57.desc:0 "承蒙上帝恩典，入侵特里纳克里亚的敌军已经被我们尽数消灭，并在北方的诸多城市都悬起护国公制定的蓝白鹰旗，进行胜利游行，永远终结了两西西里这两百多年的分裂局面，并将希腊民族复兴和正教信仰复兴的浪潮推动到了新的高峰。而阿普利亚、热那亚等国的旗帜都被拖行在地。这些曾趁人之危的入侵者如今已经在战争中失去了所有，而西西里受到的苦难已经已百倍奉还。\n\n而今天，在神圣庄严的弦乐中，护国公一手按住腰间的佩剑帕林耶内西奥斯，一手执一张羊皮纸，在大元帅和牧首的陪同下，昂首大步迈入护国议会大厅，行至主位，向所有议员们宣告了最后一个敌人——威尼斯已经停止负隅顽抗，共和国已经彻底结束了这场拉丁灾厄。在旧时代的余烬中，新时代的西西里沐浴着基督的荣光与希腊的辉光，已经向欧洲宣告，她的时代即将开始。"
 EDG_SICDisasterEvents.57.aa:0 "「自由！让我们向你欢呼！」"
 EDG_SICDisasterEvents.57.aa.tt:0 "灾难§R诸王烬乱§!将会结束。"

 EDG_SICDisasterEvents.58.name:0 "北国征伐"
 EDG_SICDisasterEvents.58.desc:0 "在后方全境陷落与军队全部溃散后，卡普阿公爵已经失去了与我们对抗的资本，只能选择投降。那波利，古称「涅阿波利斯」的阳光与快乐之城，终归我手，这将是我们进军北意大利亚的前哨站。"
 EDG_SICDisasterEvents.58.aa:0 "陶醉于胜利！"

 EDG_SICDisasterEvents.59.name:0 "南方攻略"
 EDG_SICDisasterEvents.59.desc:0 "在后方全境陷落与军队尽数被歼灭后，卡拉布里亚公爵已经失去了与我们对抗的资本，只能选择投降。卡拉布里亚，古称「意大利亚」南方重镇，终归我手，这将是我们对亚平宁半岛征服的起点。"
 EDG_SICDisasterEvents.59.aa:0 "陶醉于胜利！"

 EDG_SICDisasterEvents.60.name:0 "「圣许漏洞」"
 EDG_SICDisasterEvents.60.desc:0 "TODO拉特兰条约"
 EDG_SICDisasterEvents.60.aa:0 ""

 EDG_SICDisasterEvents.61.name:0 "纷争"
 EDG_SICDisasterEvents.61.desc:0 "西西里是罗马帝国的第一块殖民地，也是地中海最闪耀的明珠，是地中海跳动的心脏，是罗马帝国唯一还在运转的的领地——尽管这块土地既不像向君士坦丁堡臣服，也不听命于罗马。\n\n当我们把时间拨回到1189年，统一的两西西里最后一位国王威廉二世意外去世，西西里王位的两大竞争者——罗杰三世的私生子莱切的坦克雷德，和神圣罗马帝国皇帝亨利六世自此展开了对西西里王位数年的争斗。在两败俱伤后，双方被迫签订一份令双方都不满意的《阿马尔菲和约》，欧特维尔家族保留那不勒斯领地，亨利六世的霍亨施陶芬家族占据西西里岛，其也被称为「特里纳克里亚」，其来源于西西里的三足标志。。\n\n然而双方的王权都没能长久。坦克雷德辞世后，那不勒斯王国最终被颠覆，卡普阿和卡拉布里亚的野心家让罗杰的冠冕破碎，欧特维尔退守阿普利亚公国。而霍亨施陶芬还未来得及趁乱攫取诺曼的明珠，特里纳克里亚就被一个始料未及的敌人——东帝国所突袭。"
 EDG_SICDisasterEvents.61.aa:0 "「晚钟惊破帝国梦，遍地蔷薇尽作腥红。」"

 EDG_SICDisasterEvents.62.name:0 "贵族支持"
 EDG_SICDisasterEvents.62.desc:0 "TODO狄奥多勒·瓦塔泽斯已经设法获取了贵族的支持。"
 EDG_SICDisasterEvents.62.aa:0 "好！"

 EDG_SICDisasterEvents.63.name:0 "法蒂玛人毁约"
 EDG_SICDisasterEvents.63.desc:0 "诺曼人来势汹汹，而法蒂玛人却在西西里遭遇此劫难时畏葸不前，对我国的求援使节含糊其辞、虚与委蛇。毫无疑问，他们已经撕毁了之前的盟誓，不再值得我们信任。"
 EDG_SICDisasterEvents.63.aa:0 "我就不应该相信该死的异教徒！"

 EDG_SICDisasterEvents.99.name:0 "命运歧途"
 EDG_SICDisasterEvents.99.desc:0 "特里纳克里亚旧日的纷争都已被地中海吞噬，唯有叙拉库塞的灯塔还在默默照耀。在海滨，护国公狄奥多勒·瓦塔泽斯正勉力维持着希腊人的国家；在内陆的群山中，自称「真正的西西里人」的天主教氏族仍世代与海滨叙拉古人为敌；在巴勒莫，安杰洛斯的残党正窃窃私语；在马耳他，霍亨施陶芬王脉的孑遗正倔强喘息；在域外，诺曼的公侯伺机而动，热那亚僭主野望翻涌，威尼斯公爵日渐不满。\n\n西西里曾拥有一部足以自傲的古代史——她曾是希腊世界的剑盾，是皮洛士的梦想，是西庇阿的战利品。她曾是诺曼人的冠冕，霍亨施陶芬的御座，热那亚共和国的明珠。\n\n她也拥有一部血腥与背叛的近世史——那是欧特维尔的刀剑，是罗马的敕令，有晚祷的钟声，有无数个被出卖的黎明。\n\n同时，她正拥有一部尚未落笔的未来史——那是一部注定在地中海风暴中彻底改写的未来史。风暴已在海上生成，云层已压向埃特纳山。船只能否从风暴中驶出，取决于舵手。\n\n那么西西里的前路将是什么？\n\n她或可坚守方向，坚定军事领导，恢复「叙拉古」这个古老的名字，以重建希腊化世界为己任——让柏拉图的三次航行，在第四次抵达彼岸。\n\n她或可使残焰复燃，让安杰洛斯的最后一缕余火，焚灭历史加诸家族身上的耻辱——追求一个无与伦比的梦想。\n\n她或可使王政复古，让霍亨施陶芬的黑鹰再振翼翅——从西西里的山巅起飞，掠过亚平宁，笼罩日耳曼，攫取那无上的桂冠。\n\n前路未卜，西西里的未来，将由你来决定。"
 EDG_SICDisasterEvents.99.aa:0 "君主的意志至高无上！"
 EDG_SICDisasterEvents.99.aa.tt:0 "§O我们将有机会拥立霍亨施陶芬或安杰洛斯王朝。§!"
 EDG_SIC_WIP_tt:0 "§R正在制作中，请勿选择。如若选择，后果自负！§!"
 EDG_SICDisasterEvents.99.bb:0 "共和的荣耀不容忽视！"
 EDG_SICDisasterEvents.99.bb.tt:0 "§T我们将坚持护国公的领导，恢复希腊的荣光。§!"

 EDG_SICDisasterEvents.100.name:0 "尘归旧风"
 EDG_SICDisasterEvents.100.desc:0 "「今天不来，明天就一定到！」\n\n希腊的雄鹰本应展翅高飞，却屡次囿于困顿之中。毫无疑问，此乃那些将希腊人置于枷锁之下罪人的过错。从[321.GetName]到[2982.GetName]，从拜占蒂翁到[163.GetName]，从[320.GetName]到[146.GetName]，希腊民族从未得到过真正的自由。但是现在，随着大护国公[Root.Monarch.GetName]宣告了叙拉古共和国的建立，从特里纳克里亚的海滨与山间传出一声如雷声轰鸣般的呼喊，它回荡在[125.GetName]黑暗的小巷中，直到格雷西亚也加入到这欣欣向荣的大合唱中：希腊仍存于世间！\n\n叙拉古独立战争的胜利者们怀揣着的梦想将永不磨灭。十字军国家和罗马继业者的衰退正激发着新希腊民族的觉醒，而它的余波更在整个欧陆激荡。官僚们开始讨论新的体制，教士们在感叹神的伟业，贵族们对[151.GetName]或梵蒂冈的命令嗤之以鼻，曾以为埋没在时间长河中的旧旗帜，也再度飘扬。"
 EDG_SICDisasterEvents.100.aa:0 "「起来吧，希腊，你的子孙正呼唤着你！」"
 EDG_form_Syracusae_tooltip:0 "成立§Y叙拉古§!。"
 EDG_SICDisasterEvents.100.bb:0 "好方略，不过我想稍作修改。"

