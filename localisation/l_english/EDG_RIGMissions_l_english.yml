 rig_universal_declaration_title:0 "§R世界宣言§!"
 rig_universal_declaration_desc:0 "她曾在冰湖的裂口中折断，曾在自焚的烈火中蜷缩成灰，曾在内战的泥潭中窒息。有人曾以为她死了，再也不可能复活。但如今，这座曾经蜷缩在道加瓦河畔的小城，已经将自己的名字刻遍了从大西洋到太平洋的岩壁。万国的集会，将在她的广场上重建；万民的箴言，将在她的学堂里被抄写。束缚她的人，已被她挣脱；折磨她的人，已在她面前低头；放逐她的人，已跪回她的门前请求收容；而试图毁灭她的人，已经在她雷霆般的震怒中荡然无存。当一座城承载起整个世界的地基，她就不再仅仅是一座城，而是整个世界的道标。愿那从灰烬中升起的，也能够使所有仍深陷灰烬中的弟兄抬眼望见晨曦。"
 rig_universal_declaration.tt:0 "我们将能够无视条件将属国转换为§Y主教区§!属国，且不再拥有转换花费\n\n所有§Y主教区§!属国将不再占有外交关系\n\n解锁决议§Y天堂攻势§!\n\n§Y伟大战役§!在进行§Y宣战§!之后将不再进入§Y冷却§!"
