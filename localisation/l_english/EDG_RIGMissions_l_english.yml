 rig_one_country_title:0 "一主一国\n一球一教"
 rig_one_country_desc:0 "这一日终于到来了。我们踏过了每一个王国的废墟，渡过了每一条将大陆切开的大河，翻过了每一座将民族隔开的高山。当最后一支敌军降下他们的旗帜，当最后一座陌生的城池向里加交出钥匙，当我们站在海图边缘的峭壁上回望来路时，眼中所见的，不再是分裂的疆土，而是一整个被十字架缝合起来的地球。\n这一日，曾在异教祭坛前跪拜的君王，在里加大主教的座前献上了冠冕；曾以古兰经与摩西五经各自祈祷的百姓，在同一座教堂中领圣体；曾因肤色、语言与习俗而彼此仇视的部族，在同一个市场上交换货物，他们的孩子在同一个学堂里学习相同的知识。\n这一日，钟声响起来了。每一座教堂、每一座修道院、每一座钟楼的铜钟都在同一时刻被扯动了绳索，那声音撞破了每一片天空，震动每一座山谷，如同一阵从创世之初便已蓄势待发的雷声，终于在这一日涌出了云层。北方的钟声低沉如大地的心跳，南方的钟声清亮如冰川的碎裂，东方的钟声悠长如丝路的驼铃，西方的钟声浑厚如大洋的浪涌。它们在天幕之上汇合，在穹顶之下交织，然后像一阵风暴卷过了所有曾经被战争撕裂的平原、被仇恨烧焦的城池、被遗忘掩埋的村庄。\n这一日，里加的的演出抵达了终章。舞台上不再有刀剑相击的声响，不再有攻城槌撞击城门的回音。最后一幕的场景，是一个被重新缝合的世界，万物各归其位，万民各安其所，刀剑化为犁铧，天堑化为通途，所有语言都在同一首赞美诗中找到了属于自己的音节。这谢幕的钟声也将作为那没有穷尽的、新天新地中第一场礼拜的序曲。\n§O世上的国成了我主和主基督的国；他要作王，直到永永远远。§!"
