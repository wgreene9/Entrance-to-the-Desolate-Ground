l_english:
 rig_benefit_of_sword_title:0 "宝剑之利"
 rig_benefit_of_sword_desc:0 "宝剑骑士团在过去一直保护着我们，以刀剑与鲜血为里加的城墙筑起屏障。我们当从他们的成败中汲取智慧，将这些宝贵的经验化为己用。"
 rig_eve_of_war_title:0 "战争前夜"
 rig_eve_of_war_desc:0 "里加的现状并不明朗，虽然东欧现在并无强权，但显然这一状况并不会持续多久。因此我们必须武装起来，联合所有能够联合的势力来保卫我们自己。"
 rig_stabilze_country_title:0 "稳定城市内部"
 rig_stabilze_country_desc:0 "里加城市内部目前来看并不稳定，在进行一切对外行动之前我们必须先稳定我们自身。"
 rig_baltic_union_title:0 "波罗的联合"
 rig_baltic_union_desc:0 "经过一段时间的行政整合，现在我们与骑士团已经适应了彼此的军事与行政体系，是时候将波罗的海的主动权重新夺回手中了。"
 rig_furor_treatment_danzig_title:0 "处理普鲁士联盟"
 rig_furor_treatment_danzig_desc:0 "由于条顿骑士团对但泽的管理不善，其境内数个城市已经滋生了不满，也许我们应该先处理一下这个棘手的问题。"
 rig_furor_teutonicus_title:0 "条顿之怒"
 rig_furor_teutonicus_desc:0 "条顿骑士团以好战著称，数百年间南征北战，积累了海量的作战经验。我们的部队若能在训练中融入这些经验，军事素养必将显著提升。"
 rig_pru_confederation_curtailed:0 "如果§Y条顿骑士团§!为我们的附庸国，我们将解锁一项处理§Y普鲁士联盟§!的决议"
 teu_allready_pru_confederation_curtailed:0 "我们已经处理了普鲁士联盟的问题"
 rig_under_the_sword_title:0 "刀剑之下"
 rig_under_the_sword_desc:0 "立陶宛大公国在连年的内斗下已显疲态，其国内兵力空虚、贵族离心，这正是我们报仇雪恨的绝佳时机。即刻出击，将立陶宛的势力逐出奥克施泰提亚与萨莫吉希亚！"
 rig_riga_conference_title:0 "里加会议"
 rig_riga_conference_desc:0 "不同于传统国家将每一寸土地纳入自己掌中的行政制度，里加将另辟蹊径，建立一个极其庞大的附庸体系，因此我们需要进行一次会议以商讨我们未来的方针，为玛利亚之地的万邦之梦奠定根基。"
 rig_city_of_faith_title:0 "信仰之城"
 rig_city_of_faith_desc:0 "主说：「我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子。」信仰使得我们得以存在，在北方十字军的旌旗被冰湖吞没之后，是信仰仍将里加从灰烬中托起，仍然前行，仍然将福音连同刀剑一同送往四方。使命从未终结，因为呼召我们的主从未改变。愿每一个踏进里加城门的人，都能看见这里的石头不仅刻着商人的账目，更刻着圣徒的祈祷。以信仰为根基的城，必不被摇动。"
 rig_unruly_city_title:0 "不羁之城"
 rig_unruly_city_desc:0 "在欧罗巴的版图上，主教区并不罕见。但像里加大主教区这般将经商的热忱与宣教的使命编织在一起的，绝无仅有。里加相信，商船驶过的航线，就是福音传播最快的道路。因此，修道院的修士学习算账，教堂的钟声与码头的号子此起彼伏。大主教亲自接见往来的商人，在关税的谈判桌上人们也谈论施洗约翰的悔改之道。在里加，信仰不躲在修道院的高墙内，而是走进市场、码头、作坊和集市。在里加，每一枚银币的叮当声，都能听见唱诗篇的回响。"
 rig_road_to_riga_title:0 "条条大路通里加"
 rig_road_to_riga_desc:0 "汉萨同盟的时代已如落日沉入北海，但里加不会让那张交织了百年的贸易之网碎裂在浪花中。相反，我们要将每一根断裂的线头重新接起，编织成一张更大、更密、更结实的网。这次网的中央，不再是吕贝克，而是里加。通往列邦的道路，也将从里加的码头向四面八方铺开：向西，直到英格兰的羊毛工坊；向北，直到挪威的鳕鱼码头；向南，直到德意志的矿场与葡萄酒庄；向东，直到罗斯的毛皮与牲畜产地。我们要让万国的商人都说：往里加去，那里有货与灵的双重丰盛。"
 rig_heart_of_baltic_title:0 "波罗的之心"
 rig_heart_of_baltic_desc:0 "数十年的光阴，如同波罗的海的潮水，涨了又退，退了又涨。多少商船沉没在风暴中，多少刀剑折断在城墙下，多少王冠从头顶滑落。但里加，这座曾经的道加瓦河畔的小小要塞，如同一块被主亲手雕琢的磐石，在浪涛的拍打中愈发坚硬、高大。从吕贝克的集市到诺夫哥罗德的码头，从斯德哥尔摩的库房到但泽的粮仓——每一处港口的灯塔，都为里加的商船点亮；每一座市场的天平，都向里加的银币低头。商品从这里泵向四面八方，又带着财富与荣耀流回此地。里加，已经成为了无可置疑的整片海域的心脏！"
 rig_heart_of_baltic.tt:0 "解锁§Y特许贸易条例§!外交行动\n该行动允许我们将与我们处于同一贸易联盟的国家转换为§G里加特许贸易区§!"
 rig_sealand_agreement_title:0 "西兰协定"
 rig_sealand_agreement_desc:0 "吕贝克，汉萨同盟的女王，波罗的海的锁钥，那座曾以砖砌哥特式山墙俯瞰整个北海贸易的城市，终于迎来了她的哀歌。数年的贸易争端、诸侯的摇摆、雇佣兵的火并，最终汇成了一场无法回避的风暴。里加主教区联合丹麦诸自由市的舰队，在波罗的海南部集结，如同乌云从东边压向吕贝克的塔楼。汉萨同盟引以为傲的联合舰队在炮火与接舷战中四散奔逃。吕贝克港口的商船被拖走，仓库被查封，市政厅的长桌上落满了从裂开的天花板掉下的灰泥。这份协定签下的不仅是停战书，更是汉萨同盟的死亡宣告。吕贝克自此退出了争夺北海——波罗的海贸易主导权的牌桌，她的城墙还在，但她的时代已经逝去。我们将重塑这一地区的贸易，将其牢牢掌控在自己手中。"
 rig_neva_agreement_title:0 "涅瓦协定"
 rig_neva_agreement_desc:0 "战鼓渐息，剑收入鞘。诺夫哥罗德，这座矗立在沃尔霍夫河畔的古老城邑，向我们低下了它的头颅。从今往后，伏尔加河的毛皮、罗斯腹地的谷物与牲畜，将不再经过异教徒的集市，而是直接运进里加的码头。那些曾经阻挡我们商队的罗斯贵族，现在要么在修道院里忏悔，要么在新立的条约上按下了手印。我们终于确保了诺夫哥罗德这一上游节点的贸易安全。"
 rig_scandinavian_strategy_title:0 "斯堪的纳维亚战略"
 rig_scandinavian_strategy_desc:0 "瑞典正试图填补斯堪的纳维亚的强权真空。他们的战舰如乌鸦般密布在波的尼亚湾，他们的步兵如蚂蚁般填满了芬兰的堡垒。曾几何时，卡尔马联盟的绳索还能勒住他们的脖颈，如今那绳索已断，瑞典人正用自己的牙齿撕咬着波罗的海的每一条商路。较量已无可避免，我们要么折断他们伸向海上的手，要么永远在他们的阴影下航行。"
 rig_gotland_bridgehead_title:0 "哥得兰桥头堡"
 rig_gotland_bridgehead_desc:0 "哥得兰的海盗世代以私掠为生，他们熟悉波罗的海的每一道暗流、每一处避风港，如同农夫熟悉自己的田垄。不过，瑞典一直都威胁着他们的安全。如若我们允许他们继续掠夺并向他们提供里加的保护，那么作为回报，哥得兰的港口将对我们的舰队敞开，熟悉敌情的老水手将加入我们的军营，这将为我们与瑞典的交锋投下一枚重重的砝码。"
 rig_divede_norway_title:0 "离间挪威"
 rig_divede_norway_desc:0 "瑞典与挪威的联合统治并不是铁板一块，共同的王冠下是日益增长的猜忌与怨言。我们可以在适当的时候对他们进行离间，将他们的裂痕凿成鸿沟，以此来减缓我们与瑞典的战争压力。"
 rig_divede_norway.tt:0 "如果我们完成任务§Y离弦之箭§!之时，我们在瑞典有一定的§G间谍网规模§!并且和挪威§G关系良好§!，亦或是挪威表现出不忠之时，我们将有意外收获。"
 rig_waiting_in_wings_title:0 "伺机待发"
 rig_waiting_in_wings_desc:0 "使者已经归来，带来了斯科讷执政官的答复：他们接受了我们的条件。我们只需要等待他们打响第一枪。"
 rig_waiting_in_wings.tt:0 "我们要做的只有等待..."
 rig_skona_agreement_title:0 "斯科讷协定"
 rig_skona_agreement_desc:0 "丹麦王国，曾在北海掀起巨浪的古老国度，如今已如被风吹散的沙丘。它的领土碎成了个个市镇，从日德兰到西兰岛，每座城墙后都有一位自封的执政官，而唯一能够称得上作为丹麦王国遗产的斯科讷伯国却被瑞典所控制，我们应当与他们进行接洽，试探一下他们是否拥有独立的想法——而我们将帮他实现。\n\n§R请注意在完成这一任务时你不应当与瑞典存在停战协定，否则会导致后续任务无法正常加载§!"
 rig_administrative_integration_title:0 "行政整合"
 rig_administrative_integration_desc:0 "新征服的土地，单靠刀剑无法长久管治。让我们向当地人民施以仁慈，轻徭薄赋、尊重旧俗，这才是长期统治的根基。"
 rig_plus_loin_title:0 "更进一步"
 rig_plus_loin_desc:0 "我们在波兰与鲁塞尼亚的推进，如约书亚的军队在迦南地中前行，城墙在主的怒火下倒塌，城池和田地归了我们。如今，是时候将目光放远一点，彻底统一这两个地区了。让里加的权柄从波罗的海一直延伸到黑海之滨！"
 rig_shield_of_south_title:0 "南方之盾"
 rig_shield_of_south_desc:0 "波兰的王冠碎片，如今被我们一片片收在了里加的宝库中。克拉科夫、华沙、桑多梅日、波兹南，那些曾经属于皮亚斯特与雅盖隆的土地，如今都由我们的总督与骑士看守。让我们成立一个新的波兰王国，它的王冠镶嵌在里加大主教的十字架上，它的法律出自里加大主教的训令，它也将成为玛利亚之地伸向喀尔巴阡山脉的铁臂。\n\n让旧瓶装新酒，让旧土立新约。"
 rig_much_will_have_more_title:0 "§R得寸进尺§!"
 rig_much_will_have_more_desc:0 "波兰与鲁塞尼亚的秩序已经稳固。但主的应许之地并不该以喀尔巴阡山为界——越过层峦叠嶂，罗马尼亚的平原正向我们缓缓铺开。那里是多瑙河下游的咽喉，谁握住了它，谁就握住了通往巴尔干腹地的钥匙。然而统合这一地区绝非易事。我们是否做好了和这一地区盘踞的强权交手的准备？"
 rig_hansa_league_title:0 "汉萨同盟"
 rig_hansa_league_desc:0 "从12世纪起，北德意志商人为了同英国、佛兰德进行贸易，曾组织过“科隆汉萨”和“汉堡汉萨”。约在12世纪中叶～13世纪中叶，德意志莱茵河流域的贸易愈发活跃，对外贸易重心逐渐扩大到波罗的海地区。13世纪80年代，莱茵地区各商人开始组织互相合作以维护共同的利益，并与吕贝克及其他控制波罗的海贸易的北德城市结成同盟，以防御劫匪和海盗，确保贸易安全，这便是汉萨同盟的前身。汉萨同盟成立之后，其宗旨很快从镇压海盗、打击掠夺和取消不合理的通行税等保护商业的行为转至在海外扩展商业势力，垄断商业利益，压制来自同盟外的德意志城市以及来自英国、俄罗斯和佛兰德本土的商业竞争。"
 rig_hansa_league.tt:0 "§Y我们将开始与汉萨同盟争夺波罗的海地区的贸易掌控权§!"
 rig_sharpen_the_sword_title:0 "磨砺刀剑"
 rig_sharpen_the_sword_desc:0 "我们需要面对的是骁勇善战的东北罗斯人，北方十字军曾数次败给这群异教徒。这次我们必须要做好万全准备以应对我们的敌人。"
 rig_rus_departments_title:0 "罗斯诸部"
 rig_rus_departments_desc:0 "东北罗斯在不久之前陷入了内战，互相攻伐的王公们在刀剑与背叛中耗尽了自己的城邑与臣民。不过这一情况不会持续多久，野心家正在摩拳擦掌，莫斯科、特维尔、或是某个从血泊中站起的留里克后裔将最终成为一个崛起的统一的强权。我们应当为此做好准备。"
 rig_enemy_of_enemy_title:0 "敌人的敌人"
 rig_enemy_of_enemy_desc:0 "1368～1370年，汉萨同盟的联合舰队击败丹麦，迫使丹麦签订《施特拉尔松德和约》。该和约的签订不仅让汉萨获得了北欧政治同盟的性质，更使其对波罗的海、北海的贸易以及斯堪的纳维亚的政治走向握住了缰绳。随后丹麦的分裂使得汉萨同盟进一步巩固了自己位于波罗的的贸易霸权，倘若我们需要寻求盟友，那么位于丹麦的数个自由市将是我们的首要选择。尽管我们曾经作为汉萨同盟的一员与丹麦敌对过，但利益能将昔日仇敌的手重新握在一起，也能促使这些城邦重新考虑一下与我们的合作。"
 rig_enemy_of_enemy_tt:0 "所有位于§Y丹麦§!与§Y北日德兰§!区域的一地国家需要满足以下几个条件：\n均对§Y里加§!的好感度至少为§Y150§!\n§Y里加§!在其中至少有§Y25§!的间谍规模\n与我们在同一贸易联盟中\n是我们的属国"
 rig_enemy_of_enemy_effect:0 "我们将与所有位于§Y丹麦§!与§Y北日德兰§!区域的一地国家进行接洽\n这将激化里加-汉萨贸易争端"
 rig_permeate_hansa_league_title:0 "渗透汉萨同盟"
 rig_permeate_hansa_league_desc:0 "由于同盟内部组织松弛，既无宪法，也无成文的制度和执行机构，并且各个成员国之间仍然保持着较为独立的外交政策，因此我们可以很轻松地在汉萨同盟当中扩大我们的信息源并取得我们需要的信息，借此来获取对汉萨同盟在战略布局上的优势。"
 rig_permeate_hansa_league_tt:0 "由§Y吕贝克§!领导的贸易联盟中的所有成员对§Y里加§!的好感度至少为§Y75§!或§Y里加§!在其中至少有§Y35§!的间谍规模"
 rig_whip_the_horse_title:0 "策马扬鞭"
 rig_whip_the_horse_desc:0 "普斯科夫，这座城曾让北方十字军的旌旗折断，让宝剑骑士团的铁蹄陷落，但如今一切早已不同。缰绳拉紧，马刺轻磕，骑士们如洪流般直扑它的城门，要把从前丢失的荣耀用利剑从异教徒手中夺回。"
 rig_whip_the_horse.tt.1:0 "我们将恢复被突然袭击带来的负面影响"
 rig_ready_for_battle_title:0 "严阵以待"
 rig_ready_for_battle_desc:0 "在收集到足够的情报后，我们应当确定我们在罗斯地区作战的战略战术了。"
 rig_ready_for_battle_tt_1:0 "为时尚早"
 rig_ready_for_battle_tt_2:0 "我们还在准备当中！"
 rig_disaster_of_lubeck_title:0 "吕贝克之灾"
 rig_disaster_of_lubeck_desc:0 "北德意志的震动惊动了神圣罗马帝国的皇帝，他不能容忍一个波罗的海的新贵如此践踏帝国的商业秩序。在要求里加让步被拒绝后，帝国的鹰旗升起，皇帝亲自发布讨伐令，号召所有忠于帝国的北德意志诸侯加入汉萨同盟的阵营。那些在贸易战中已经选边站的诸侯们，有的拔剑响应皇帝，有的继续追随里加的旗帜。神圣罗马帝国的内战，从商行蔓延到了真正的战场。"
 incident_north_german_trade_war_begin_tt:0 "我们正在等待北德意志诸侯国的回应"
 rigaExpandIncident_option_tt:0 "我们需要等待皇帝对北德意志局势做出决定"
 rig_advantages_and_disadvantages_title:0 "优胜劣汰"
 rig_advantages_and_disadvantages_desc:0 "贸易如同一场永不落幕的竞技：强者满载而归，弱者沉入浪底。优胜劣汰，这是主在创世之初就刻进万物心中的法则。我们已经联合了日德兰和丹麦地区的自由市，汉萨同盟绝不会坐视不理。是时候用金币和商品代替长剑和盾牌，同威胁到我们商业利益的人开战了！"
 rig_advantages_and_disadvantages_tt:0 "所有签署条约的§Y丹麦自由市§!都将加入我们的贸易联盟\n这将进一步激化里加-汉萨贸易争端，这将影响到整个北德意志诸侯国的贸易生产，而他们将在之后一段时间对此作出反应\n§R如果处理不当，我们与汉萨同盟之间的贸易争端将升级为战争！§!"
 rig_in_the_name_of_god_title:0 "以主之名"
 rig_in_the_name_of_god_desc:0 "普斯科夫的城门在里加的马蹄下敞开，东方罗斯人的阵线如蜡被火熔化。北方十字军自此重新启动，里加大主教的号角将从道加瓦河吹向伏尔加河、乌拉尔山，乃至更远的寒林与冻土。让玛利亚之地的战旗，插遍每一座仍被异端黑暗遮蔽的山丘！"
 rig_crown_of_poland_title:0 "波兰王冠"
 rig_crown_of_poland_desc:0 "波兰王冠已经破碎，进军这一地区不会遇到过多阻力。不过唯一需要注意的是有些国家可能将头转向西方，寻求神圣罗马帝国的羽翼遮蔽。一旦帝国的鹰旗出现在奥得河对岸，这场征伐便会难度陡增。因此，我们当快马加鞭，在皇帝的敕令下达之前，将寻求庇护者的城池一一收入掌中。"
 rig_advance_slowly_fight_quickly_title:0 "大草原方针"
 rig_advance_slowly_fight_quickly_desc:0 "基辅罗斯人的骑兵在与东方游牧民族的交锋中迅捷如同草原上的风，来去无常而不似西欧骑士那般全凭重甲冲锋。我们的骑士团在这片大草原上仍是生手，我们需要尽快熟悉这片战场来找到利用我们优势的方法。"
 rig_poish_ruthenia_strategy_title:0 "波兰-鲁塞尼亚战略"
 rig_poish_ruthenia_strategy_desc:0 "波兰与鲁塞尼亚的田野一望无际，麦浪低垂，黑土肥美，足以供养从日耳曼到罗斯的万民。如今，这片丰饶之地正处在破碎与混乱之中——波兰的王冠四分五裂，鲁塞尼亚的田野无人收割。若能坐上克拉科夫的王座、握住基辅的权杖，我们就能掌控整个东欧的粮食产出。到那日，列邦的粮价将由我们定夺，诸王的谷仓将由我们填满。"
 rig_city_of_ross_title:0 "罗斯之城"
 rig_city_of_ross_desc:0 "「众城之母」——这是古罗斯人对基辅的称呼，那里埋葬着弗拉基米尔大公的骸骨，矗立着金顶的索菲亚大教堂。谁控制了基辅，谁就接过了留里克王朝坠落的权杖。如今，里加的剑已指向南方。当我们踏过第聂伯河的渡口，将玛利亚之旗插上基辅城头时，整个鲁塞尼亚的诸侯与平民都将知晓，他们新的主人已经来到。"
 rig_on_the_verge_of_war_title:0 "离弦之箭"
 rig_on_the_verge_of_war_desc:0 "斯科讷的火把照亮了厄勒海峡的夜空，号角从南方吹来，直抵里加的城墙。现在，是时候让我们和瑞典一较高下了。"
 not_has_rig_already_pre_for_uprising_tt:0 "时机还未成熟"
 has_rig_already_pre_for_uprising_tt:0 "时机已到"
 rig_safty_north_title:0 "安定北境"
 rig_safty_north_desc:0 "瑞典的旌旗沉入波罗的海，斯科讷的海峡向我们敞开。曾经向瑞典人缴纳过路税的船长现在将银币投进了里加的宝库，曾经畏惧北方雄狮舰队的商人如今在里加的旗帜下安心扬帆。我们终于成为了波罗的海沿岸无可置疑、无可争辩的最有力的贸易力量。"
 rig_greate_north_war_title:0 "§R大北方战争§!"
 rig_greate_north_war_desc:0 "斯堪的纳维亚就在我们眼前展开，高山、峡湾、森林、岛屿，如同一卷未被诵读的羊皮书卷。瑞典的雄狮在斯科讷的刀刃下流血，挪威雪鹰的翅膀已被疲倦压沉。时日已到，机会的大门敞开。起来，向北进军，直到玛利亚之地的旌旗在北极的永夜中猎猎作响！"
 rig_expand_libran_title:0 "发展利夫兰"
 rig_expand_libran_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_vilnius_title:0 "发展维尔纽斯"
 rig_expand_vilnius_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_marianburg_title:0 "发展玛丽安堡"
 rig_expand_marianburg_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_koenigsberg_title:0 "发展柯尼斯堡"
 rig_expand_koenigsberg_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"


 rig_riga_fulcrum_title:0 "里加支点"
 rig_riga_fulcrum_desc:0 "里加坐落在道加瓦河与波罗的海的交汇处，上游可通罗斯腹地，下游可抵北海诸港。数十年的苦心经营，已让里加从一座主教座堂旁的集市成长为波罗的海东岸乃至整个欧罗巴最大、最坚固、最繁华的城市。也只有里加，能在金币与刀剑之外提供信仰与使命。我们将以首都为一个支点，正如心脏为全身供血。"
 rig_terra_mariana_title:0 "§G圣母之地§!"
 rig_terra_mariana_desc:0 "普世城计划的准备终于迎来了尾声，我们即将正式开启这项伟大的计划！"
 rig_danzig_fulcrum_title:0 "但泽支点"
 rig_danzig_fulcrum_desc:0 "维斯瓦河从波兰腹地蜿蜒而来，承载着谷物、木材与铜铁，但泽正是这条水道的闸门，它的海湾宽而深，足以停泊里加最庞大的克拉克帆船。它的码头已泊过千帆，它的吊车已举过万石。条顿骑士团曾在此铸造堡垒，也在此与波兰国王签署条约。我们将以但泽为一个支点，进一步掌控波兰的粮食和布匹贸易。"
 rig_advance_both_by_land_and_warter_title:0 "水路并进"
 rig_advance_both_by_land_and_warter_desc:0 "港口很容易被狭窄的航道、简陋的泊位和陈旧的吊车卡住喉咙。我们将一方面扩建港口，挖深主航道，增建石砌码头，架设更多的装卸吊车。另一方面整治陆路，修整道路，增设摆渡和纤道。水路与陆路，如同鸟之两翼、车之双轮，缺一不可。"
 rig_advance_both_by_land_and_warter.tt:0 "§Y这将为接下来的计划打下基础§!"
 rig_vilnius_fulcrum_title:0 "维尔纽斯支点"
 rig_vilnius_fulcrum_desc:0 "维尔纽斯坐落在两河交汇处的高地上，周围是密林与沼泽，易守难攻。从维尔纽斯出发，商路向四面八方辐射。它是陆路贸易的十字路口，是毛皮、蜂蜡、琥珀与铁器交换的中心。我们将以维尔纽斯为一个支点，进一步掌控横跨东西方的商道。"
 rig_direct_planning_title:0 "直接计划"
 rig_direct_planning_desc:0 "如果无法投机取巧，那么直接扩建城市规模将是唯一有效的方式。金币会像河水一样流出国库，工人的号子会日夜不停。我们将会用力气换取规模，用时间累积高度。但那些嘲笑它笨拙的人，终将在宏伟的新城墙下仰酸了脖子。"
 rig_direct_planning.tt:0 "§Y这将为接下来的计划打下基础§!"

 rig_what_must_be_done_title:0 "必行之事"
 rig_what_must_be_done_desc:0 "里加的直属部队如同一把锈迹斑斑的旧剑，剑鞘上还刻着昔日的荣耀，剑刃却已卷口。各主教区兵源混乱，将领们躺在骑士团的功劳簿上睡大觉，各个军区早已暗流涌动。相比于行政改革，军事改革已迫在眉睫，这是我们所必须要做的事情。"
 rig_religion_reformation_title:0 "里加宗教改革"
 rig_religion_reformation_desc:0 "里加的信仰，自宝剑骑士团在冰湖上竖起十字架的那一天起，便如同迷雾中的灯塔，从未熄灭，也从未动摇。变革与进步是可以接受的，但这并不意味着里加将会偏离它曾经的道路。如同一条河流，可能会改道，但最终仍流向大海；如同一棵大树，可能要剪枝，但根系仍扎进土壤。"
 rig_religion_reformation.tt:0 "消去我们与附庸所拥有的所有§Y异端异教§!省份的§Y宗教热情§!修正"
 rig_ordinance_of_piety_title:0 "虔信条例"
 rig_ordinance_of_piety_desc:0 "在对外宣教之前，我们必须先在国家内部进行宗教统一。为此，我们将派出巡回修士，深入最偏远的村庄，为那些几十年未曾领受圣礼的信徒补行告解与圣餐，同时清除传教士队伍里的蛀虫，让他们真正成为主散播福音的使者。"
 rig_propaganda_act_title:0 "宣讲条例"
 rig_propaganda_act_desc:0 "从德意志蔓延而来的宗教改革浪潮如暗流般侵蚀着里加坚固的堤岸，单凭日常的讲道已不足以抵挡。谣言、小册子、匿名布告像野火一样在街头巷尾燃烧，鼓动着人们质疑圣礼、贬低神职、甚至妄图割断里加与罗马的联系。我们应当采取更加强有力的措施应对，比如派出资深的神父在闹市同激进派公开讨论教义，解释里加为何要在公教会的体系下进行革新。在万不得已的情况下，我们甚至有可能采取更加极端的方式来捍卫我们的正信......"
 rig_propaganda_act.tt:0 "§R这将激化新教徒与天主教徒之间的矛盾§!"
 rig_sword_of_god_title:0 "天主之剑"
 rig_sword_of_god_desc:0 "公教的铁骑与十字架一同推进。里加的骑士团、皇帝的胸甲骑兵、波兰的翼骑兵，以及一切仍忠于罗马的势力，在同一面旗帜下合流。那些妄图分裂公教会的人，如今要么伏在公教法庭的台阶上悔改，要么在荒野中流浪，失去一切庇护。"
 rig_sword_of_god_1.tt:0 "我们与我们附庸所有的§Y新教§!、§Y胡斯派§!、§Y改革宗§!省份都将皈依§Y天主教§!\n所有§Y新教§!、§Y胡斯派§!、§Y改革宗§!改革中心将被移除"
 rig_sword_of_god_2.tt:0 "我们将向§Y神圣罗马帝国皇帝§!以及所有未与我们结盟的§Y选帝侯§!宣战，以§Y解散神圣罗马帝国§!，摧毁这个不再神圣的帝国"
 rig_statute_of_religious_unity_title:0 "宗教统一条例"
 rig_statute_of_religious_unity_desc:0 "刀剑可以赢得战争，但唯有信仰的统一才能确保长久的和平。新教同盟已经溃散，但是里加与属国的疆土上却仍残留着异端的余烬。我们应当走进每一条街巷、每一个村落，去拯救那些误入歧途的羔羊。"
 rig_statute_of_religious_unity_trigger.tt:0 "所有我们与我们属国拥有的省份的宗教都必须为天主教"
 rig_statute_of_religious_unity.tt:0 "我们所有的§Y主教区§!与§O骑士团§!属国都会获得相同的修正"
 rig_administrative_restructuring_title:0 "行政重组"
 rig_administrative_restructuring_desc:0 "行政重组是大规模改革所必须经历的事情，这一点对于我们来说也不例外。"
 rig_thngs_to_do_title:0 "须行之事"
 rig_thngs_to_do_desc:0 "里加的行政体系正在逐步走向僵化。属国的独立倾向、地方官僚的懈怠、中央与边远地区的消息梗阻，已经如同老树的根般盘根错节，粗暴地拔起只会带起整片泥土。我们应当循序渐进，一步一步地迈向前方。"
 rig_diocesan_renovation_ordinace_title:0 "主教区革新条例"
 rig_diocesan_renovation_ordinace_desc:0 "扫除腐败与彻查官僚如同清水洗净了里加行政体系的污秽。我们应当趁机对官僚体制进行改革，削去叠床架屋的结构，优化我们和我们属国的行政体系。"
 rig_second_allegiance_act_title:0 "再效忠条例"
 rig_second_allegiance_act_desc:0 "在又一次改组了骑士团的结构后，我们将进一步明确骑士们应当承担的义务和享有的权利，并要求每一位骑士按着我们订下的新约在圣坛前重新宣读效忠誓言。"
 rig_second_association_act_title:0 "二次联合条例"
 rig_second_association_act_desc:0 "行政改革如同大潮，冲刷着里加每一寸被苛捐杂税与腐败蛀虫侵蚀的土地。人民看到了我们变革的决心，但是改革若只自上而下终究是少部分人的游戏。我们必须建立一条自下而上的管道，让所有人的意见都能被听到，只有这样，我们才能真正永远团结在玛丽亚之地的旗帜下。"
 rig_concerning_civil_government_title:0 "政府论"
 rig_concerning_civil_government_desc:0 "我们已经彻底完成了行政改革，愿我们的秩序如天上的万象，轨道清晰，永放光明。"
 rig_impermeable_plane_title:0 "滴水不漏"
 rig_impermeable_plane_desc:0 "军中的蛀虫已啃空里加的铁壁。劝勉和警告都被他们当成了耳旁风，唯有一场无声的行动，才能在敌人察觉之前，将腐蚀的根系连根拔起。"
 rig_one_night_of_riga_title:0 "里加一夜"
 rig_one_night_of_riga_desc:0 "各路人马如同无声的渡鸦，在夜幕中按着沙盘上演练过无数遍的路线同时扑向目标。每一个环节都严丝合缝。没有打斗，没有呼喊，只有门扉被轻轻推开的声音，和酒盏跌到地面上的脆响。" 
 rig_one_night_of_riga_tt_false:0 "时机未到"
 rig_one_night_of_riga_tt_right:0 "时机已到"
 rig_summarize_past_experience_title:0 "总结经验"
 rig_summarize_past_experience_desc:0 "里加的军事改革历经了血与火的试炼。是时候停下脚步回顾我们的经历了，让我们将这一段伟大的探索刻在石板上，作为后人的道标。"
 rig_learning_thought_title:0 "学习思想"
 rig_learning_thought_desc:0 "我们聘请了一位富有经验的陆军改革家前来讲授先进的作战思想，这将极大地有利于我们军事科技的发展和军事改革的进行。"
 rig_learning_thought.tt:0 "我们所有§Y主教区§!与§O骑士团§!属国军事科技提升§Y1§!级"
 rig_promotion_of_new_talent_title:0 "提拔新秀"
 rig_promotion_of_new_talent_desc:0 "腐败将领已经从我们的军队里被除去，如同农夫从田间拔掉稗草。如今田地已松，正等候着新的种子播下。在经过一系列严格的筛选后，数位新秀脱颖而出，成为我们新军的骨干将领。"
 rig_uniform_oreder_title:0 "统一号令"
 rig_uniform_oreder_desc:0 "里加的新军与属国部队虽在同一面旗帜下行军，却操着不同的口令、打着不同的旗语、走着不同的步伐。这在太平日子里尚可容忍，在刀兵相接的战场上却是致命的。是时候统一我们和所有附庸国的号令了。"
 rig_uniform_oreder.tt:0 "我们所有§Y主教区§!与§O骑士团§!属国获得如下修正：\n陆军移动速度§G+10%§!\n陆军损耗§G-10%§!\n补充速度§G+25%§!"
 rig_riga_steel_guardian_title:0 "里加铁卫"
 rig_riga_steel_guardian_desc:0 "我们重建的军队严重缺乏作战经验。骑士团的每一位精锐士兵都历经千锤百炼，他们宝贵的训练经历如同一把重锤，我们的教官将会用它反复捶打我们的军队，去除粗铁中的杂质，只留下精钢锻造的脊骨。"
 rig_border_brave_army_title:0 "边区悍勇"
 rig_border_brave_army_desc:0 "不同于骑士团规范化的训练，我们的主教军区长期面对的是真实的敌人，他们的作战风格更加剽悍也更加灵活。我们的陆军组织者将协调我们规模日益增长的军队，让士兵们从我们属国那里汲取我们急需的实战经验。"
 rig_border_brave_army.tt:0 "我们的§Y主教军区§!属国获得§G5§!训练度"
 rig_thngs_which_lackluster_title:0 "乏善可陈"
 rig_thngs_which_lackluster_desc:0 "里加的行政体系，在外人看来或许运转如常，波澜不惊；但在真正清楚现状的人的眼中，却已是乏善可陈。这种平静比一场暴乱更危险，因为暴乱会逼人奋起，而平庸却会让人在升温的温水中渐渐失去知觉。一场关于里加行政体系的深层改革，已经被提上了日程。"
 rig_a_day_in_riga_title:0 "里加一日"
 rig_a_day_in_riga_desc:0 "晨祷的钟声还未敲完，大教堂的议事厅已经座无虚席。官僚从内城区各个衙门赶来，准备聆听我们行政顾问对行政效率问题的最新解决方案。"
 rig_sweep_away_corruption_title:0 "扫除腐败"
 rig_sweep_away_corruption_desc:0 "那些在文书传递中索取杜卡特的官吏，在属国边界上私设关卡的士卒，用虚假账目骗取拨款的管事，他们的手比抢劫的匪徒更脏，因为他们披着公义的袍子。反腐必将是一场持久战，但至少我们能让贪官污吏知道，大主教的眼睛正在盯着每一批金币的流向。"
 rig_scour_the_bureaucracy_title:0 "彻查官僚"
 rig_scour_the_bureaucracy_desc:0 "在追查腐败的过程中，我们发现了一个可怕的事实：整个官僚系统已经形成了一张护着彼此的网。你包庇我的假账，我掩护你的缺漏；你虚报属国人口，我帮你篡改存粮数字。那些不贪不占的官员，反而被视为异类、被排挤出核心事务。是时候对所有神职行政人员与属国联络官进行一轮全面的背景审查与能力考核了。"
 rig_kinght_seconde_reorganization_title:0 "二次改组"
 rig_kinght_seconde_reorganization_desc:0 "在扫除了官僚系统中的腐败，拔起了盘根错节的利益网之后，我们推行改革的阻力大大减轻。在第一次里加会议时我们便改组了骑士团的架构；而随着时代的发展，为了保证他们依然是我们最锋利的剑，进行对骑士团的二次改组就变成了我们的首要任务。"
 rig_clarify_responsibilities_title:0 "明晰职责"
 rig_clarify_responsibilities_desc:0 "职责不是捆绑人的锁链，而是使人自由行走的护栏。在行政顾问的帮助下，我们将明确骑士团的权利和义务，让他们知道自己为谁而战，为何而战。"
 rig_be_sharply_demarcated_from_title:0 "划清界限"
 rig_be_sharply_demarcated_from_desc:0 "在明确了骑士团的职责之后，我们应当回顾我们自身的官僚体系。为了避免各部门之间权限和责任的模糊，我们必须让官吏知道该自己站在哪一块地上，不可逾越，也不必退缩。"
 rig_each_performs_its_owned_functions_title:0 "各司其职"
 rig_each_performs_its_owned_functions_desc:0 "若不使每一个格子里的人专心做自己分内的事，再清晰的界线也只能存在于纸面上。我们将会要求每一名官员——从大教堂的首席书记官到外城区最基层的税吏——都明确自己的岗位职责，并在任职期间以此职责为唯一重心，让每一扇门后的笔都只书写属于自己部门的文书。"
 rig_military_reorganization_title:0 "军队重组"
 rig_military_reorganization_desc:0 "腐败的枝条已被砍去，树干上留下了深深的刀痕。但仅凭清除朽木，并不能让大树重新挺立。我们需要立刻对我们的军队展开从最底层到最顶层的彻底重建。"
 rig_military_reorganization_trigger.tt:0 "我们必须解散全部的陆军来重组我们的军队系统！"
 rig_military_reorganization.tt:0 "§Y我们将立刻采取措施来防止属国在我们重组军队之时滋生反叛§!"
 rig_military_theory_innovation_title:0 "军事理论革新"
 rig_military_theory_innovation_desc:0 "在学习了现代和古代的军事思想和战略战术后，里加的军官们进行了充分的思索、交流和辩论，最终结合里加的国情形成了一套全新的军事理论。"
 rig_military_organization_reform_title:0 "军事组织改革"
 rig_military_organization_reform_desc:0 "在进行了长久的前期准备，经历了无数坎坷之后，我们终于可以彻底地重新构建我们和属国的军队架构了。"
 rig_military_joint_exercise_title:0 "联合军事操练"
 rig_military_joint_exercise_desc:0 "纸上谈兵自古以来就是行不通的，我们需要一次全方位的操练来确保我们的改革不是一厢情愿，同时也向外界证明里加的部队是铁与火中炼出的精兵，是主赐给玛利亚之地的不败的护卫者。"
 rig_treatise_on_campaigns_title:0 "战略论"
 rig_treatise_on_campaigns_desc:0 "我们已经彻底完成了军事改革，现在是时候敲定更符合国情的战略方向了。"
 rig_be_able_but_modest_title:0 "和光同尘"
 rig_be_able_but_modest_desc:0 "§O「世人哪，耶和华已指示你何为善。他向你所要的是什么呢？只要你行公义，好怜悯，存谦卑的心，与你的神同行。」§!\n自第二次里加会议以来，我们已经历许多。行政改革重组了官僚体系，使法令如活水流通；军事改革淬炼了里加军队，使铁卫如磐石坚立；宗教改革洁净了教会衣袍，使信仰如晨星明亮。我们做到了列国以为不可能的事，如同大卫击败歌利亚。曾被腐败压迫的百姓，如今看见大主教与他们一同在市场上排队买面包；曾因信仰分裂的属国，如今看见里加的神父与他们的使者一同跪在圣坛前领圣体。最伟大的改革，不是建起高塔，而是拆掉高墙。\n和光同尘，光不刺眼，尘不卑微，这便是主所欣纳的国度。"

 rig_at_the_crack_of_dawn_title:"破晓时分"
 rig_at_the_crack_of_dawn_desc:0 "黑暗笼罩着玛利亚之地的每一个角落。外邦人的傀儡坐在里加的宝座上，属国的诸侯各怀鬼胎，而真正的里加儿女等不下去了。破晓时分，黑暗与光明交接，雾气与晨光交织。效忠里加大主教区的起义军同时在各个属国的首都举起了叛旗。没有人知道这场起义将把里加带向何方，但每一个人都知道，他们宁可在追逐黎明的道路中倒下，也不愿在无边的永夜中沉眠。"
 rig_at_the_crack_of_dawn.tt:0 "§R周围的一切都在崩塌，我们必须开始着手挽救我们的国家§!"
 rig_economic_recovery_act_title:0 "经济复苏条例"
 rig_economic_recovery_act_desc:0 "§O原来那地上的穷人永不断绝。所以我吩咐你说，总要向你地上困苦穷乏的弟兄松开手。§!"
 rig_economic_recovery_act.tt:0 "§O我们将一定程度上缓解破产所带来的影响§!\n\n我们将获得获得§Y20§!笔§!0§!利息的贷款"
 rig_urban_renewal_ordinance_title:0 "城市重建条例"
 rig_urban_renewal_ordinance_desc:0 "§O他们必修造已久的荒场，建立先前凄凉之处，重修历代荒凉之城。§!"
 rig_military_support_act_title:0 "军事支援条例"
 rig_military_support_act_desc:0 "§O你当刚强壮胆！不要惧怕，也不要惊惶；因为你无论往哪里去，耶和华你的神必与你同在。§!"
 rig_resource_reserve_act_title:0 "资源准备条例"
 rig_resource_reserve_act_desc:0 "§O我要将他们栽于本地，他们不再从我所赐给他们的地上拔出来。这是耶和华——你的神说的。§!"
 rig_stabilization_act_title:0 "稳固条例"
 rig_stabilization_act_desc:0 "§O我要使他们有合一的心，也要将新灵放在他们里面，又从他们肉体中除掉石心，赐给他们肉心。§!"
 rig_stabilization_act.tt:0 "§R且行必行之事§!"
 rig_resistance_act_title:0 "反抗条例"
 rig_resistance_act_desc:0 "§O但那等候耶和华的必从新得力。他们必如鹰展翅上腾，他们奔跑却不困倦，行走却不疲乏。§!"
 rig_resistance_act.tt:0 "§R浴火重生或是化为灰烬，皆在此一役§!"
 rig_at_dawn_time_title:0 "黎明时刻"
 rig_at_dawn_time_desc:0 "硝烟尚未散尽，但黎明的光已经刺穿了最深的黑夜。在暴乱中失去家园的人开始在废墟上拾捡可用的木料；在洗劫中被掳走的圣器被从敌军的仓库里一件件翻出；在动荡中离散的家庭沿着新清理出的道路重新聚拢。愿主使里加从这一日开始行走在光中，直到审判日的号角吹响。"
 rig_at_dawn_time.tt:0 "§G结束灾难§Y破晓之战§!§!"

 rig_expand_stockholm_title:0 "发展斯德哥尔摩"
 rig_expand_stockholm_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_londe_title:0 "发展隆德"
 rig_expand_londe_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_moscow_title:0 "发展莫斯科"
 rig_expand_moscow_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_smolensk_title:0 "发展斯摩棱斯克"
 rig_expand_smolensk_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_volhynia_title:0 "发展沃里尼亚"
 rig_expand_volhynia_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_podolia_title:0 "发展波多里亚"
 rig_expand_podolia_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_warsaw_title:0 "发展华沙"
 rig_expand_warsaw_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_expand_posen_title:0 "发展波兹南"
 rig_expand_posen_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_the_curtain_is_rising_title:0 "大幕渐起"
 rig_the_curtain_is_rising_desc:0 "当那覆盖万城之城的帷幔被第一缕晨光掀起一角时，里加的钟楼齐鸣，列国的眼睛从四面八方望来。从道加瓦河的波光中升起的，是一个新天新地的预表。"
 rig_the_curtain_is_rising.tt:0 "§G第二幕§!"
 rig_back_on_track_title:0 "重回正轨"
 rig_back_on_track_desc:0 "里加在数百年的潮起潮落中逐渐偏离了当初的使命，那颗当年在冰湖上高举十字架的初心，正在逐渐被账簿的灰尘和权杖的裂纹所覆盖。如今，我们必须纠正这一切，重新拾起曾经的使命，保护朝圣者，建造医院与教堂，在每一个新征服的土地上先插十字架、后立界碑。愿主赦免我们偏离的日子，引导我们重新踏上那条古老的善道。"
 rig_before_the_soldiers_title:0 "兵马未动..."
 rig_before_the_soldiers_desc:0 "十字军远征的一件要事，是让每一座矿山的铜与铁化为战士们的刀刃、矛尖、甲片与马蹄铁。我们将建起武器工场，打造最精锐的装备，因为战场上绝对不会有第二次机会。"
 rig_before_the_soldiers_trigger.tt:0 "我们及我们附庸所有产物为§Y铜矿§!与§Y铁矿§!的省份都需建有§Y武器工厂§!"
 rig_grain_and_grass_go_title:0 "...粮草先行"
 rig_grain_and_grass_go_desc:0 "另一件要事是让我们拥有的每一片麦田与牧场产出战士们口中的粮食与马匹的草料。我们将建起粮仓与磨坊，储备最充足的给养，因为饥饿的军队绝无可能夺取胜利。"
 rig_grain_and_grass_go_trigger.tt:0 "我们及我们附庸在§Y波罗的地区§!所有产物为§Y谷物§!与§Y牲畜§!的省份都需建有§Y士兵之家§!或§Y农场§!"
 rig_one_size_fits_all_title:0 "万全之策"
 rig_one_size_fits_all_desc:0 "十字军的大炮可以轰开城墙，却摸不清迷雾中的敌情。我们将在每一座目标城池中投放间谍，织起一张密不透风的网，让十字军的每一步都踩在敌人的盲区，而敌人的每一刀都砍在我们早已架好的盾上。"
 rig_in_the_name_of_the_word_title:0 "以剑之名"
 rig_in_the_name_of_the_word_desc:0 ""
 rig_repeat_the_banners_title:"重整旌旗"
 rig_repeat_the_banners_desc:0 ""
 rig_dust_off_title:0 "拭去尘埃"
 rig_dust_off_desc:0 "那些矗立在地中海东岸与安纳托利亚高原上的古老城邑——君士坦丁堡、安条克、耶路撒冷、亚历山大、大马士革——它们曾是基督教在东方的灯塔，却已在异教的沙土与裂教的迷雾中蒙尘百年。圣索菲亚的穹顶上积满了鸦羽，圣墓教堂的门槛被异教徒的靴底磨出凹槽，安条克的圣彼得洞穴教堂中，蜘蛛在祭坛上织网。让我们将这些城市的尘埃拂去，让它们在唯一的正信下重放光芒。"
 rig_tver_fulcrum_title:0 "特维尔支点"
 rig_tver_fulcrum_desc:0 "伏尔加河从瓦尔代丘陵的湖泊与沼泽中启程，向着里海奔流万里，贯穿整个俄罗斯的腹地。特维尔扼守在这条大河的上游，是连接诺夫哥罗德与莫斯科、波罗的海与伏尔加河流域的十字路口。我们将以特维尔为一个支点，进一步掌控伏尔加河流域的粮食、毛皮与木材贸易，并向更远的东方敞开里加的大门。"
 rig_be_ready_for_battle_title:0 "枕戈待旦"
 rig_be_ready_for_battle_desc:0 "里加的营帐内，骑士枕着鞍鞯，士兵握着枪杆，连随军的驮马都在睡梦中打着响鼻。十字军的将士们在等待那一声号角，那一支从大教堂塔楼上吹响的、带有大主教铜印的号角，它的声音将横越整个欧罗巴，惊醒沉睡的列国。在那支号角吹响的时候，他们就不再是农民、工匠、商人或修士，而是里加的战士，万军之耶和华的战士。"
 rig_Kiev_fulcrum_title:0 "基辅支点"
 rig_Kiev_fulcrum_desc:0 "基辅，罗斯众城之母，坐落在第聂伯河畔的高岸上，金顶的索菲亚大教堂俯视着往来的商船。圣弗拉基米尔在此为万民施洗，智者雅罗斯拉夫在此编纂了第一部罗斯法典。它的城墙抵御过佩切涅格人的马蹄，它的商栈接待过汉萨同盟的使者，我们也将以基辅为一个支点，打开通往巴尔干和安纳托利亚的南向门户。"
 rig_krakow_fulcrum_title:0 "克拉科夫支点"
 rig_krakow_fulcrum_desc:0 "维斯瓦河从喀尔巴阡山的北麓奔涌而出，穿过小波兰的丘陵与平原，将匈牙利的铜、鲁塞尼亚的蜡与波兰的谷物一并裹挟北上。克拉科夫正坐落在这条大河的上游，它是波兰王国的冠冕与心脏，皮亚斯特王朝的君王在此加冕，雅盖隆王朝的君主在此安息。我们将以克拉科夫为一个支点，将我们的影响力楔进德意志的心脏。"
 rig_lift_the_curtain_title:0 "揭开帷幕"
 rig_lift_the_curtain_desc:0 "里加的手按住了幕绳。帷幕揭开的那一刻，那被遮盖的必显露出来，那被捆绑的必得释放。从今以后，历史将分为两段：帷幕落下之前的黑暗，与帷幕揭开之后的光明。"
 rig_new_world_mission_act_title:0 "新世界宣教条例"
 rig_new_world_mission_act_desc:0 "那越过西海、在陌生大陆上扎根的里加利亚，已在异教之地结出了初熟的果子。一批批原住民受洗，一座座简陋的教堂在密林深处升起。现在，在我们已经可以跨越大洋投射影响力之后，让我们正式确立里加主教区与里加利亚之间的神圣关系。"
 rig_expansion_of_the_baltic_shipbuilding_title:0 "发展波罗的海造船业"
 rig_expansion_of_the_baltic_shipbuilding_desc:0 "随着贸易的扩张，里加需要一支能够同时控制波罗的海、北海乃至整个大西洋的舰队。走私者、海盗、敌国的私掠船，将在每一处峡湾与港湾中遭遇里加的战舰。"
 rig_expansion_of_the_baltic_shipbuilding.tt:0 "所有在§Y波罗的海§!贸易区及§Y南卡累利阿§!区域符合要求的省份都将获得上述修正"
 rig_formation_of_the_riga_combined_fleet_title:0 "组建里加联合舰队"
 rig_formation_of_the_riga_combined_fleet_desc:0 "在完善了波罗的海沿岸的基础设施之后，是时候将建造一支强大的舰队提上我们的日程了。"
 rig_formation_of_black_sea_fleet_title:0 "拓展黑海港口"
 rig_formation_of_black_sea_fleet_desc:0 "黑海，这片被拜占庭人称为“本都”的内海，如今已在里加的掌控之下。我们将让黑海的波涛和波罗的海的浪花一样，臣服在里加舰队的龙骨之下。"
 rig_formation_of_black_sea_fleet.tt:0 "所有在§Y东欧大草原§!区域符合要求的省份都将获得上述修正"
 rig_across_the_bosphorus_title:0 "穿过博斯普鲁斯海峡"
 rig_across_the_bosphorus_desc:0 "世界渴望之城已入我手，安纳托利亚高原和色雷斯丘陵都被里加的十字旗所覆盖。让我们的舰队穿过博斯普鲁斯海峡，到地中海去劈波斩浪。"
 rig_far_east_area_title:0 "远东战略"
 rig_far_east_area_desc:0 "东路十字军没有耶路撒冷那样的圣城作为终点，它的终点是每一个未被福音触及的部落，每一个仍向偶像烧香的王公，每一个将基督使者的头颅悬于帐前的可汗。我们不会用刀剑强迫洗礼，但我们必须用刀剑打开传道的大门。"
 rig_far_east_area.tt:0 "稍作准备之后，我们将对所有首都位于§Y乌拉尔§!、§Y东欧大草原§!、§Y高加索§!、§Y中亚§!、§Y西西伯利亚§!地区的国家宣战\n\n除此之外，我们还将对拥有§Y秋明§!、§Y撒尔马罕§!、§Y阿拉斯特罕§!、§Y喀山§!、§Y埃里温§!的国家宣战\n\n被我们§Y保障独立§!、与我们达成§Y军事结盟§!、与我们在§Y同一贸易联盟§!、§Y非独立国家§!将不会被宣战"
 rig_give_subject_prestige_and_war_exhaustion:0 "给予我们所有附庸§Y10§!威望，溢出的部分将会转换为§Y君主点数§!\n我们所有附庸减少§Y2§!厌战度"
 rig_be_the_first_title:0 "首当其冲"
 rig_be_the_first_desc:0 "喀山，伏尔加河畔的鞑靼王座，蒙古金帐汗国的遗腹子，东方的铁门。它的骑兵曾在莫斯科的郊外烧杀，它的税吏曾向特维尔的商队抽税。它是第一个必须拔掉的钉子，它将第一个倒下，第一个归附，第一个成为里加在东方的跳板。从它的废墟上，我们将眺望更远的秋明，更远的撒马尔罕，乃至更远的日出之地。"
 rig_over_the_urals_title:0 "翻过乌拉尔"
 rig_over_the_urals_desc:0 "东路十字军的先遣队用乌拉尔山中的落叶松扎成爬犁，将火炮拆开驮在驯鹿背上，在积雪中攀过了最高的山口。翻过乌拉尔便是秋明，西西伯利亚的第一座城池。它没有石墙，只有木栅与土垒；没有宫殿，只有汗王的毡帐与毛皮仓库。但它的意义远超它的外表：因为它是我们在亚洲的第一个前哨，西伯利亚的门从此被推开了一条缝。"
 rig_penetrate_deeply_into_title:0 "深入腹地"
 rig_penetrate_deeply_into_desc:0 "西西伯利亚，这片从乌拉尔山向东延伸至叶尼塞河的冻原与针叶林，冬季的白昼短如叹息，夏季的蚊蚋密如烟云。如今，里加的东路十字军已嚼过最硬的冻肉，涉过最刺骨的沼泽，在鄂毕河畔听到了熊的咆哮。"
 rig_second_piece_of_domijo_title:0 "第二块多米诺"
 rig_second_piece_of_domijo_desc:0 "喀山倒下时，它的震动沿伏尔加河传到了下游。阿斯特拉罕，里海的门户，伏尔加河的嘴唇。这里是金帐汗国最后的港口，是波斯商队北上毛皮之路的终点，是里海鱼子酱与咸水鱼的集市。谁控制了阿斯特拉罕，谁就能用一把锁锁住里海与黑海之间的所有水道。第二块多米诺已经倒下，唤醒了那些仍在东方沉睡的基督子民，告诉他们：里加来了，十字架来了，刀剑与福音并行的日子到了。"
 rig_across_the_caucasus_title:0 "越过高加索"
 rig_across_the_caucasus_desc:0 "埃里温，亚美尼亚人的古城，使徒巴多罗买曾在此传道。这座城曾被波斯人、阿拉伯人、蒙古人轮番践踏，却从未忘记基督的名。当里加的十字旗出现在山脊上，城中的亚美尼亚教长率众出迎。愿亚伯拉罕、以撒、雅各的神赐福给我们，正如他赐福给挪亚，让他的船在城外的亚拉腊山搁浅，让他的后裔遍满全地。"
 rig_the_crossroad_title:0 "十字路口"
 rig_the_crossroad_desc:0 "撒马尔罕，粟特人的古城，帖木儿帝国的王冠，丝绸之路上最璀璨的珍珠。它的圆顶清真寺与经学院，曾让阿拉伯人说：天堂在撒马尔罕的天空下；它的天文台与造纸坊，曾让波斯人惊叹：世界一半的智慧在此城中。里加的东路十字军没有在这里遭遇顽抗。帖木儿的子孙们正忙于内斗，城中的商人们更关心税率的轻与重而非墙上悬挂的是新月还是十字。撒马尔罕，十字路口。里加不会在此驻留重兵，不会在此推行拉丁语法令。里加要做的，是让这座城成为东方商路的枢纽、情报的中转站、以及向更遥远东方传教的后援基地。"
 rig_great_victory_in_the_east_title:0 "东方惊雷"
 rig_great_victory_in_the_east_desc:0 "雷声从乌拉尔的山脊滚过西西伯利亚的针叶林，从中亚的沙漠卷向撒马尔罕的蓝色穹顶。从伏尔加河到鄂毕河，从里海到巴尔喀什湖，所有游牧人的马蹄都被铁卫的钉鞋踩进了泥土，所有萨满的皮鼓都被拉丁语赞美诗的管风琴取代。"
 rig_southern_strategy_title:0 "南方战略"
 rig_southern_strategy_desc:0 "南路十字军的剑锋，将指向那五座曾照亮上古世界的城邑：君士坦丁堡、安条克、耶路撒冷、亚历山大和巴格达。凡首都坐落于此地的异教之国，凡曾以刀剑或偶像玷污圣地者，都将听见里加的宣战号角。"
 rig_southern_strategy.tt:0 "稍作准备之后，我们将对所有首都位于§Y巴尔干§!、§Y安纳托利亚§!、§Y马什里克§!、§Y埃及§!地区的国家宣战。\n\n除此之外，我们还将对拥有§Y君士坦丁堡§!、§Y安条克§!、§Y耶路撒冷§!、§Y亚历山大§!、§Y巴格达§!的国家宣战。\n\n被我们§Y保障独立§!、与我们结成§Y军事同盟§!、与我们在§Y同一贸易联盟§!或者是§Y非独立§!的国家将不会被宣战"
 rig_balkan_tour_title:0 "巴尔干之行"
 rig_balkan_tour_desc:0 "从多瑙河的弯道到爱琴海的波涛，从萨瓦河畔的贝尔格莱德到马尔马拉海边的君士坦丁堡，巴尔干的全境已在里加十字军的马蹄与号角声中被丈量完毕。每一座曾供奉偶像的山丘都插上了十字架，每一处曾兵戈相向的隘口都响起了公教的祷词。以圣父、圣子、圣灵之名，这里不再是众多民族彼此厮杀的旷野，而是公义与和平的牧场。"
 rig_the_road_to_asia_minor_title:0 "小亚细亚之路"
 rig_the_road_to_asia_minor_desc:0 "这块被称为小亚细亚的土地，曾见证使徒保罗的三次宣教之旅，曾看着尼西亚大公会议确立《信经》，曾埋葬无数殉道者的骸骨。如今，它重新被公教的旗帜覆盖，如同牧人将散落的羊群重新收入栏中。"
 rig_mesopotamia_plain_title:0 "美索不达米亚平原"
 rig_mesopotamia_plain_desc:0 "底格里斯河与幼发拉底河之间，便是那被称为“美索不达米亚”的古老平原。从尼尼微的废墟到巴比伦的土丘，从巴格达的智慧宫到摩苏尔的石桥，这块两河之间的土地，见证了亚述的铁骑、波斯的大军、阿拉伯的弯刀、蒙古的火药。如今，里加的十字架在此地立定，愿幼发拉底河的流水继续浇灌里加在此地栽种的橄榄枝，直到它根深叶茂，不再惧怕战争的风暴。"
 rig_liberation_of_jerusalem_title:0 "光复耶路撒冷"
 rig_liberation_of_jerusalem_desc:0 "北方十字军的火把从未熄灭，它只是埋在里加的灰烬里，埋在道加瓦河的泥沙下，埋在每一代骑士的骨灰中。如今它喷射而出，烧穿了安纳托利亚，烧穿了叙利亚，烧穿了整个伊斯兰世界的胸膛，而在今日破开了圣地耶路撒冷的城门！从克莱芒教宗的第一次呼召，到昨天清晨里加铁卫终于在橄榄山上插下十字旗，整个基督教世界等了太久太久。圣墓教堂的钥匙从穆斯林手中被夺回，铁链被砸断，铜门被撞开，从里加大教堂带来的橄榄油，注满了每一盏银灯！城中的所有大钟发了疯地鸣响，各各他山的山巅上大主教伏地膜拜，看着新一天的晨光刺破了千年的阴影。钟声越过地中海，传到君士坦丁堡，传到维也纳，传到巴黎，传到伦敦，传到罗马教宗的宝座前，整个公教世界都在因这座城的解放而颤抖！「耶路撒冷啊，我若忘记你，情愿我的右手忘记技巧！」现在，里加的双手终于高高举起，捧着圣城的钥匙，献给昔在、今在、以后永在的全能者！"
 rig_the_city_the_world_desires_title:0 "世界渴望之城"
 rig_the_city_the_world_desires_desc:0 "君士坦丁堡，新罗马，世界渴望之城，万城之城的女王！狄奥多西城墙的城门曾用金银包裹，金角湾的码头曾泊满商船，圣索菲亚大教堂的穹顶曾使每一个仰望者相信天国确实降临于人间。然而一百余年的拉丁占领，四十年的内外交困，以及那从东方升起的奥斯曼异教徒，已使这座世界之城跪倒在尘埃中。但是如今，里加的十字架与钥匙代替了巴列奥略的双头鹰和异教徒的新月，插上了圣罗曼努斯门的塔楼。钟声齐鸣，号角震天，愿一切有气息的都赞美耶和华，因为祂将这座城从异教和异端的手中交给了里加，交给了玛利亚之地的儿女！"
 rig_march_on_antioch_title:0 "进军安条克"
 rig_march_on_antioch_desc:0 "安条克，奥龙特斯河畔的明珠，塞琉古的帝都，罗马的东方首府，基督教向外邦人宣教的第一个堡垒！圣彼得曾在此牧养群羊，圣保罗从此踏上三次宣教的旅程。然而六百年来，宣礼塔的尖刺插入了安条克的胸膛，圣彼得的座椅被异教的祭司当作脚凳，十字架从城墙上被拔去。而今夜，在圣彼得洞穴教堂的祭坛前，大主教将亲手点燃第一支复活节蜡烛，全城的士兵和市民将跪在使徒的画像前，唱起那首从查士丁尼时代就未曾在此唱过的赞美诗：「这是主所定的日子，我们在其中要高兴欢喜！」"
 rig_return_to_the_holy_land_title:0 "重回圣地"
 rig_return_to_the_holy_land_desc:0 "锡安不再遥不可及，耶路撒冷不再被异教之轭所压伤。南路十字军从里加出发，穿过巴尔干的血色黄昏，踏过安纳托利亚的焦土，涉过美索不达米亚的河流，终于将十字架重新竖立在圣墓之上。门已开，路已通，里加将永远记念这从北方旷野到南方锡安的朝圣之旅。"
 rig_steady_front_title:0 "稳固阵线"
 rig_steady_front_desc:0 "我们完全控制了安纳托利亚、马什里克和高加索，将它们编织成了一张紧密结合的网。安纳托利亚的粮食运往叙利亚，叙利亚的棉花织成高加索骑兵的披风，高加索的战马补充安纳托利亚的卫队。里加不再需要从波罗的海千里迢迢运来军需，因为这三个地区已足以自养、自卫、自成一体。"
 rig_rebuild_antiochus_title:"发展安条克"
 rig_rebuild_antiochus_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_rebuild_alexander_title:"发展亚历山大"
 rig_rebuild_alexander_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
 rig_the_gift_of_the_nile_title:0 "尼罗河的馈赠"
 rig_the_gift_of_the_nile_desc:0 "尼罗河，埃及的动脉，沙漠中的乳汁，从维多利亚湖的群山中涌出，穿越苏丹的荒原，在开罗以北分成七道汊流，如一只绿色的手掌伸向地中海。没有它，埃及只是一片焦土；有了它，埃及才能养活从亚历山大到阿斯旺的千万人口。尼罗河的泛滥如同主的恩典，每年按时而至，使埃及的谷仓永远丰盈，也将使里加的钱袋永远沉重。"
 rig_the_legacy_of_the_french_crusaders_title:0 "法兰西十字军的遗产"
 rig_the_legacy_of_the_french_crusaders_desc:0 "1270年，法兰西国王路易九世为报1250年兵败之仇，率领大军登陆突尼斯。然而，登陆之后不久，瘟疫如同看不见的镰刀，成片地割倒了营帐中的士兵，路易九世本人也在此死去。如今里加的旗帜覆盖了这片土地，我们将在这片土地上用坚固的堡垒、公正的税法和拉丁文的福音，为那两个失败的法兰西十字军写下一个迟到的答案。"
 rig_to_solomon_land_title:0 "所罗门之地"
 rig_to_solomon_land_desc:0 "传说中的示巴女王后裔所治理的国度——埃塞俄比亚——已在里加的十字架下低头。这片群山环抱的高原，是约柜最后的流亡地，是施洗约翰所行之道的最南端，是从使徒腓利为太监施洗以来便未曾断绝的古老基督教净土。现在所罗门之地与玛利亚之地在地图上相连，约柜安息之处将安放里加的十字架，示巴后裔的歌喉也将为里加所传的福音增添新的调式。"
 rig_in_the_sand_title:0 "于黄沙之中"
 rig_in_the_sand_desc:0 "阿拉伯半岛，被红海、波斯湾与印度洋三面合围的沙海，只有烈日、砾石、以及游牧人在绿洲之间刻下的足迹。它不值得耕种却值得征服，因为麦加的克尔白、麦地那的先知寺，以及从阿曼到亚丁的乳香之路，都在它的腹地。我们将把十字架插遍每一片绿洲，在这片诞生了对我们威胁最大的异教徒的土地上宣告唯一正信的到来。"
 rig_patrol_the_mountains_title:0 "巡群山之间"
 rig_patrol_the_mountains_desc:0 "波斯，被扎格罗斯山脉、厄尔布尔士山脉与兴都库什山脉环抱的高原，自古便是帝王的棋盘。伊斯兰的宣礼声已在此回响八百年。群山之间的马蹄声惊醒了沉睡的商路。里加的巡逻队如同一根根穿针引线的梭子，将波斯的碎片缝进玛利亚之地的长袍。愿居鲁士的灵魂在帕萨尔加德的墓中安息，因为他的土地迎来了一位比亚历山大更有耐心的主人。里加不会焚烧波斯波利斯，它只是坐在台阶上，向渴盼救赎的民众宣读圣经的条文。"
 rig_below_the_junction_title:0 "交汇点之上"
 rig_below_the_junction_desc:0 "呼罗珊，波斯语意为「太阳升起之地」。它的东边是印度与中国，西边是波斯与阿拉伯，北边是花剌子模的沙漠与咸海，南边是锡斯坦的盐沼与马克兰的荒滩。我们将以呼罗珊为桥头堡，一窥印度和中国这两个文明古国的风采。"
 rig_western_frontier_title:0 "边陲重地"
 rig_western_frontier_desc:0 "我们沿着北非的海岸线一路向西，收服了那些曾在汪达尔人、拜占庭人、阿拉伯人与柏柏尔部落间反复易主的城邦。的黎波里的城墙在铁卫的大炮下开裂，突尼斯的苏丹在谈判桌上交出了钥匙，阿尔及尔的海盗船在里加舰队面前焚烧殆尽，而丹吉尔，这座眺望直布罗陀海峡的古老港口，也已将城门向里加的总督敞开。"
 rig_the_fire_of_africa_title:0 "阿非利加之火"
 rig_the_fire_of_africa_desc:0 "我们的军队如同一道自东向西横扫北非的火焰，燃尽了异教的荆棘，也点亮了里加最西端的天际线，将旧日法兰西儿童十字军被贩卖的羞辱与圣路易染疫而亡的叹息一并焚尽。在非斯、马拉喀什与特莱姆森，乃至海外的加那利群岛，里加的主教座堂拔地而起，主的福泽八百年以来第一次洒遍整个日落之地。"
 rig_the_fire_of_africa.tt:0 "所有位于§Y马格里布§!地区商品为§Y奴隶§!的省份商品都会被替换，其概率如下：\n\n20% 牲畜\n20% 谷物\n20% 盐\n20% 羊毛\n10% 香料\n10% 糖\n"
 rig_uniting_the_horn_of_africa_title:0 "抵进非洲之角"
 rig_uniting_the_horn_of_africa_desc:0 "当里加的铁卫最终驻扎于瓜达富伊角的最东端，这片自远古以来便以乳香、没药与奴隶闻名于世的地区终于被里加的十字旗覆盖。从今往后，非洲之角将不再以奴隶商队的鞭响闻名于世，而将以牧人的短笛、磨坊中的谷物、咖啡作坊的香气与铸币厂的炉火，为里加的国库注入汩汩清泉。"
 rig_uniting_the_horn_of_africa.tt:0 "所有位于§Y非洲之角§!地区商品为§Y奴隶§!的省份商品都会被替换，其概率如下：\n\n40% 牲畜\n40% 谷物\n10% 咖啡\n10% 黄金\n"
 rig_deep_in_the_forest_title:0 "密林深处"
 rig_deep_in_the_forest_desc:0 "在赤道雨林深处的刚果河流域，一个以刚果河为血脉的古老王国正于密林与沃土之间繁衍。那里有象牙如山，有铜矿如丘，有数不清的部族在热带雨林的缝隙中筑城立寨。我们不会任由这片土地在蒙昧中停滞，那里的每一座村庄都将成为我们向阿非利加腹地挺进的跳板。"
 rig_western_passage_title:0 "西方通道"
 rig_western_passage_desc:0 "西欧虽然名义上是公教会的世界，但是异端的暗流依然汹涌。那里有清洁派和祷告派尚未绝迹的余烬，有在不列颠和德意志滋生的新的裂痕；那里有日益脱离罗马教廷权威的世俗君王，有以金币与刀剑篡夺主教冠冕的诸侯。我们应当帮助他们，重新拿起手中滑落的旗帜。"
 rig_euphrates_and_tigris_rivers_title:0 "幼发拉底河与底格里斯河"
 rig_euphrates_and_tigris_rivers_desc:0 "巴比伦的棕榈林见证了多少代帝王的铁骑，而如今，它们将继续在幼发拉底河畔的微风中见证里加的犁铧插入新翻的泥土。我们将让这片土地，这片文明发源之地重新兴盛，让两河的波涛将丰收的诺言撒入每一座村庄。"
 rig_euphrates_and_tigris_rivers.tt:0 "所有位于§Y马什里克§!地区且符合条件的省份都将获得如上修正\n"
 rig_along_the_gulf_of_aden_title:0 "沿着亚丁湾..."
 rig_along_the_gulf_of_aden_desc:0 "亚丁湾两岸建起了里加的造船厂。里加的船匠们在此地设计了一种轻快而坚韧的船体，融合了独桅帆船的灵活与克拉克船的吨位，以应对印度洋的季风。亚丁湾将不再是海盗与走私者的乐园，而是里加贸易体系中不可或缺的一部分。"
 rig_along_the_gulf_of_aden.tt:0 "所有符合条件的省份都将获得如上修正\n"
 rig_islamic_wine_title:0 "伊斯兰之酒"
 rig_islamic_wine_desc:0 "在阿拉伯半岛的烈日与沙漠之中，有一种黑色的饮品，被那些不饮葡萄酒的信徒称为‘伊斯兰之酒’——咖啡。它从埃塞俄比亚的高原传入也门，在摩卡港的烘烤作坊中散发香气，被苏菲派的修士们用作夜祷时不眠的燃料。我们将改进它的生产方式，选育更好的品种，让里加的人民都能品鉴这种风味独特的饮料。"
 rig_islamic_wine.tt:0 "所有位于§Y阿拉伯§Y与§Y非洲之角§!地区且符合条件的省份都将获得如上修正\n"
 rig_gold_miner_title:0 "黄金矿工"
 rig_gold_miner_desc:0 "埃塞俄比亚群山之间的黄金矿脉，如今在铁镐与炸药下露出了面容。我们将在此地辟开新的矿坑，以熔炉、磨盘与筛网将金沙剥离，它们的一部分将流动于埃及、马什里克与欧洲的集市，另一部分将寄往各个教堂，让修士们用示巴女王的馈赠装点我们的穹顶。"
 rig_to_hormuz_title:0 "...到霍尔木兹"
 rig_to_hormuz_desc:0 "从亚丁湾到霍尔木兹，里加在印度洋沿岸的船厂如一道铁链，将红海与波斯湾、非洲之角与阿拉伯半岛连成一体。我们将从这里出发，把锚链送到锡兰和苏门答腊的海岸，让整个印度洋的货物都送上里加的柜台。"
 rig_to_hormuz.tt:0 "所有符合条件的省份都将获得如上修正\n"
 rig_mediterranean_granary_title:0 "地中海粮仓"
 rig_mediterranean_granary_desc:0 "每一寸被尼罗河浸润过的农田都在里加的水利工程师与农艺师手中得到重新丈量与规划。旧的灌溉渠被疏浚，新的水车被架设，因为内战而荒废多年的河堤重新竖起了堤坝与闸门。埃及的谷物将像罗马时期一样，重新填满人民的餐桌。"
 rig_mediterranean_granary.tt:0 "所有位于§Y埃及§!地区且符合条件的省份都将获得如上修正\n"
 rig_gain_a_firm_foothold_title:0 "站稳脚跟"
 rig_gain_a_firm_foothold_desc:0 "在控制了整个呼罗珊地区后，我们将在苏莱曼山脉的隘口修建要塞，为下一步向印度传播福音做好准备。"
 rig_four_way_access_title:0 "白棉如雪"
 rig_four_way_access_desc:0 "棉花，轻薄如云，洁白如雪。我们将引进新的灌溉沟渠与轮种制度，修建仓储与纺织工坊，为我们的人民提供舒适而优质的衣装。"
 rig_four_way_access.tt:0 "所有在§Y呼罗珊§!地区且符合条件的省份都将获得§Y2§!基础税收与§Y2§!基础人力\n"
 rig_eastern_entrance_title:0 "东部入口"
 rig_eastern_entrance_desc:0 "从呼罗珊的棉花田向东望去，我们的斥候已经攀上了兴都库什山脊的瞭望点，带回了关于印度河河谷的消息。让我们去打开一扇从未被公教世界触碰过的门，那门背后不仅是香料与大象，更是无数尚未听闻福音的万民。"
 rig_look_far_into_the_distance_title:0 "目光远眺"
 rig_look_far_into_the_distance_desc:0 "在清扫了如此多的异端和异教徒之后，我们是时候从堆积如山的战报与地图前抬起头来，将目光从身旁的喧嚣移向海天相接之处了。那里，是我们大洋彼岸的兄弟：里加利亚。"
 rig_look_far_into_the_distance.tt:0 "我们将解锁决议来缓解§Y里加利亚§!的行政压力"
 rig_cease_all_activities_title:0 "偃旗息鼓"
 rig_cease_all_activities_desc:0 "刀剑的鸣响暂时归于沉寂。那些为里加征战一生的骑士，终于能够将铠甲悬挂于家中的墙壁上，作为墙上的纪念而非行军的负担。士兵们拆下帐篷的桩子，将营火熄灭，把鞍具擦拭干净后交还给军需官。至少在这一刻，在里加的领土上，每一个曾经流离失所的农民都回到了自己的田垄，每一个曾经在阵亡者名单上留下姓名的家庭都已领到了抚恤金与祭奠的香烛。"
 rig_cease_all_activities.tt:0 "上述修正持续期间，我们无法发动§Y伟大战役§!与一般的战争决议"
 rig_build_largely_title:0 "大兴土木"
 rig_build_largely_desc:0 "那曾在战场上挥动铁锤的手，如今转向了石料与木料。道路在拓宽，城墙在加固，粮仓在翻新，桥梁在跨越那些曾将军队阻隔数日的河流。从今往后，里加治下的每一寸土地，都将以石头、砂浆与木材书写它所承载的和平。愿这些被建造起来的屋宇与工坊在风暴中站立，在日光下见证我们的耕耘。"
 rig_build_largely.tt:0 "我们的非§G里加特许贸易区§!属国也会获得上述修正"
 rig_jerusalem_fulcrum_title:0 "耶路撒冷支点"
 rig_jerusalem_fulcrum_desc:0 "耶路撒冷高踞于犹地亚的山丘上，从大卫到所罗门，从以赛亚到施洗约翰，这座城的每一块石头都记录在神圣的史诗中。圣墓教堂的地基下埋着各各他的岩缝，圣殿山的平台上留着亚伯拉罕献祭的传说，橄榄山的斜坡上仍能望见主升天时踏出的云迹。我们将以耶路撒冷为一个支点，因为它不仅是进入非洲的关隘，更是我们步入天国的大门。"
 rig_kilk_roads_title:0 "丝绸之路"
 rig_kilk_roads_desc:0 "从长安到罗马，那条横跨万里的古老商道，曾以丝绸为名，将东方最柔软的光芒递向西方。如今，里加已将这条道路的中段牢牢握在掌心。我们将扩大波斯地区原有的丝绸产业，在整个欧亚大陆上织出我们的锦绣江山。"
 rig_kilk_roads.tt:0 "所有位于§Y波斯§!地区且符合条件的省份都将获得如上修正\n"
 rig_constantinople_fulcrum_title:0 "君士坦丁堡支点"
 rig_constantinople_fulcrum_desc:0 "世界渴望之城北枕金角湾，南临马尔马拉海，东隔博斯普鲁斯海峡与安纳托利亚相望，曾在一个仟年内是全欧洲规模最大且最为繁华的城市。圣索菲亚的巨大穹顶巍然屹立如同天堂降临人间，大皇宫的镶嵌画墙壁上查士丁尼与他的将军们以金色马赛克拼出战功的图景，赛马场上的方尖碑与蛇柱铭记着帝国对旧世界的征服。我们将以君士坦丁堡为一个支点，向罗马帝国往日的疆土继续进发。"
 rig_tabriz_fulcrum_title:0 "大不里士支点"
 rig_tabriz_fulcrum_desc:0 "大不里士坐落在萨汉德山北麓的谷地之中，雷扎耶湖盆地东北侧的山脚下。它扼守着从安纳托利亚高原通往伊朗腹地的咽喉，自古以来便是东西方交通的汇合点。这里是伊尔汗国的首都，蒙古大汗的宫廷曾在此号令从地中海到印度河的万里疆土。我们将以大不里士为一个支点，为向南亚和东亚传播福音做好准备。"
 rig_siberian_trade_route_title:0 "西伯利亚商路"
 rig_siberian_trade_route_desc:0 "黑貂、银狐、北极狐、海狸这些生活在寒冷中的动物，因其皮毛的柔软与温暖广受追捧。里加的猎手跨过鄂毕河与叶尼塞河向东进发，在每一处密林寻猎，在沿途的工坊鞣制皮草，并将这些货物沿驿站一路运回秋明与喀山的商栈。"
 rig_siberian_trade_route.tt:0 "所有位于§Y西西伯利亚§!地区且符合条件的省份都将获得如上修正\n"
 rig_connection_origin_title:0 "连接起点"
 rig_connection_origin_desc:0 "斯堪的纳维亚的森林与峡湾是欧洲最古老的皮草产地之一，那里曾供应着罗马贵族的冬袍与拜占庭皇帝的披肩。从遥远的西伯利亚，到斯堪的纳维亚的峡湾口岸，整条皮草商路将如同一张织好的网，将里加的触角伸向每一处能长出松树与驯鹿的冻土。"
 rig_connection_origin.tt:0 "所有位于§Y斯堪的纳维亚§!与§Y俄罗斯§!地区且符合条件的省份都将获得如上修正\n"
 rig_everything_is_ready_title:0 "万事俱全"
 rig_everything_is_ready_desc:0 "经过了又一段时间的发展，我们已经物阜民丰。现在是时候完成我们最后也是最宏大的计划了——我们将翻新整个里加城，让它真正变成一座普世之城！"
 rig_broad_view_about_taking_title:0 "博观约取"
 rig_broad_view_about_taking_desc:0 ""
 rig_accumulate_steadily_title:0 "厚积薄发"
 rig_accumulate_steadily_desc:0 ""
 rig_make_the_world_a_city_and_the_city_a_world_title:0 "融世界于一城筑一城为世界"
 rig_make_the_world_a_city_and_the_city_a_world_desc:0 "里加，巍然屹立在道加瓦河河畔，巍然屹立在玛丽亚之地上。从它码头的吊车区出去，最近的是汉萨式砖砌仓库与吕贝克式山墙，供北欧的木材与毛皮商卸载货箱；稍远一些的，是仿照大不里士巴扎建造的有顶棚市场，波斯人、亚美尼亚人与犹太商人在此交换地毯、宝石与香料；再向外延伸，一条粮食加工巷两侧立着高大的石砌谷仓与风车，将伏尔加河流域的小麦与埃及的麦种一同磨成面粉。每条作坊街的中央都设有一口公共水井，其井栏的样式出自全世界的建筑师之手。\n走过狄奥多西式的城墙，穿过一道以圣墓教堂的石门为模板的拱门，进入内城居民区。靠近拱门的街区以安纳托利亚高原的石砌建筑为主题，再往深处走则是一条横贯内城的运河，两旁的联排住宅按低地的窄立面风格建造，但每一户的窗台上都摆放着非洲的陶器或印度的摆件。街角矗立着三座不同礼法的教堂：一座拉丁哥特式的尖顶教堂，一座拜占庭风格的穹顶小堂，一座亚美尼亚式的凿岩礼拜堂。三个钟楼同时敲响时，三组音阶在空中相遇，如一首从三个方向聚拢的赞美诗。\n一条笔直的大道从城门延伸至主教座堂，两侧列着从埃及运来的方尖碑、从帕特农遗址移来的石柱、以及从摩苏尔运来的亚述浮雕残片。从耶路撒冷运来的石灰岩，被雕成教堂的柱头与拱门；从君士坦丁堡仿制的镶嵌画，被拼贴在教堂的穹顶上；从大不里士取来的绿松石彩陶，装饰着教堂的主立面；从撒马尔罕生产的天青色釉砖贴满了大主教座堂的外墙，它们在阳光下如同波斯的天空。\n当这座城落成时，任何踏进其城门的人——无论是来自西欧的朝圣者，还是来自远东的商人——都会在那错综复杂的街巷中，找到一处令他想起故乡屋檐的拐角，同时也找到另一处令他惊异的、从未见过的形制。当万国的语言在里加的市场中同时响起时，那声音便如同诸天的赞颂，将万国熔铸于此，使里加成为世界的回廊。"
 rig_expand_macedonia_title:0 "发展马其顿"
 rig_expand_macedonia_desc:0 "城市的发展从来不是一瞬之间完成的，它必须经由时间的塑造，逐渐迈向繁荣昌盛。"
