l_english:


#灾难
 EDG_FDM_path_of_rebirth_disaster: "§T重生之路§!"
 EDG_FDM_path_of_rebirth_disaster_tt: "--------------\n「与艰难相伴的，确是容易。」——《古兰经》94:5\n\n自当年苏莱曼王子成功逃出开罗并在卡比利亚建基以来，法蒂玛王朝便踏上了一条充满艰险的重生之路。\n\n马格里布从来就不是和平的庇护所，而是一片势力交错的四战之地。我们的西面与南面被根深蒂固的逊尼派政权包围，他们始终视高举伊斯玛仪派大旗的我们为异端；而在东面与北面的沿海地带，野心勃勃的基督徒正试图巩固他们十字军远征的战果，将突尼西亚转化为长久的圣战王国。\n\n在这群狼环伺的乱局中，脆弱的新生政权没有任何退路。为了延续先知的血脉，我们必须凭借军事手腕与外交智慧在夹缝中寻求生存与扩张。征服桀骜的柏柏尔部落、瓦解十字军的统治、将北非的零散势力整合成一个统一的帝国。\n\n但这仅仅是开始。我们在马格里布所进行的一切惨烈战争和统治重建，皆是为了一项更为宏大的历史使命积蓄力量：有朝一日沿着地中海东进，跨越无尽的沙漠，将法蒂玛的旗帜重新插上开罗的城头。\n\n§Y灾难期间，过度扩张事件组将会出现正面选项§!"
 EDG_FDM_if_we_are_still_under_the_disaster_tt: "如果我们仍处于灾难§T重生之路§!，那么："
 EDG_FDM_path_of_rebirth_disaster_can_end_tt_1: "「§G成功§!」任务§Y碧衣归来§!已完成\n————（以此方式结束§T重生之路§!时，将会§G永久保留§!任务树中给予的§T重生之路限定奖励§!）\n"
 EDG_FDM_path_of_rebirth_disaster_can_end_tt_2: "「§R失败§!」§T重生之路剩余时间§!已归零\n————（以此方式结束§T重生之路§!时，将会立即进入惩罚性灾难§R绝望之剑§!。）"
 EDG_FDM_path_of_rebirth_disaster_will_end_tt_1: "我们已经夺回了@FDM§Y法蒂玛§!王朝的所有故土，灾难§T重生之路§!将会以「§G成功§!」告终。"
 EDG_FDM_path_of_rebirth_disaster_will_end_tt_2: "灾难§T重生之路§!将会以「§R失败§!」告终。"
