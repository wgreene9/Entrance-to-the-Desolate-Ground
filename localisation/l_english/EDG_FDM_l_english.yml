 EDG_FDM_sword_of_despair_disaster: "§R绝望之剑§!"
 EDG_FDM_sword_of_despair_disaster_tt: "--------------\n「难道我没有为你而开拓你的胸襟吗？我卸下了你的重负，那原是压着你的脊背的。」——《古兰经》94:1-3\n\n法蒂玛的先辈曾以无畏的勇气在绝境中开辟生机，但如今，随着重生之路的失败，整个国家似乎再次被逼入了比任何时期都更为黑暗的深渊。\n\n长期的战争与内部的动荡已经抽干了国库的最后一滴黄金，柏柏尔部落开始抗拒征召，曾经让整个西地中海基督徒乃至十字军国家闻风丧胆的舰队和精锐骑兵如今士气低落。国债高筑、叛乱四起，地方上的总督们开始拥兵自重，连清真寺中的乌理玛也在布道时对哈里发的统治合法性隐讳地提出质疑。\n\n如同当年被迫挥起屠刀洗劫异教徒庄园的流亡者，绝望的情绪正在整个统治阶层和军队中蔓延。当我们手中的剑不再是为了真主的荣光与先知血脉的骄傲而挥舞，而是仅仅为了在这地狱般的乱世中苟延残喘时，它便成了一把沉重且会反噬自身的绝望之剑。\n\n§R该灾难为惩罚性灾难，请避免触发该灾难！§!"
 EDG_FDM_sword_of_despair_disaster_can_end_tt: "拥有并控制我们所有的核心省份"


 EDG_FDM_scale_of_imam_disaster: "§T伊玛目的天平§!"
 EDG_FDM_scale_of_imam_disaster_tt: "--------------\n「他曾将天升起了，并设置了公平。你不要在天平上不公。你们应当秉公地谨守衡度，不要克扣秤量。」——《古兰经》55:7-9\n\n作为先知女儿法蒂玛与阿里的直系后裔，哈里发不仅是世俗的统治者，更是伊斯玛仪派信徒心中至高无上的伊玛目化身。\n\n当年苏莱曼王子在卡比利亚打开城门，接纳了所有愿意归顺的受苦穆斯林，这种宽容曾是我们国家力量的源泉。然而，随着庞大帝国的建立与教派的繁杂化，正统的什叶派禁卫军、逊尼派的柏柏尔部落、被征服地的异教徒以及那些通过奴隶贸易涌入的边缘群体，在宗教与律法上的矛盾日益尖锐。\n\n宫廷内部，极端的宗教学者要求哈里发以「伊玛目」之名发起大清洗，建立纯粹的什叶派国度；而实务官僚则警告此举将瞬间撕裂整个国家的经济与军事基础。\n\n伊玛目的天平正在剧烈摇摆，一旦平衡被彻底打破，宗教狂热的烈焰将烧毁先祖们耗费两百年心血在北非建立起的秩序与繁荣。\n\n§Y灾难期间，禁用§M法蒂玛宗教容忍度§!相关机制§!\n\n§R曾经的敌人会卷土重来！请做好准备§!"
 EDG_FDM_scale_of_imam_disaster_can_start_tt: "§T伊玛目的天平§!已彻底§R失衡§!"
 EDG_FDM_scale_of_imam_disaster_can_end_tt: "重新平衡了各派系的利益"
