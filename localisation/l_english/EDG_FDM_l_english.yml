 EDG_FDMEvents.71.title: "尼罗河爆发洪水！"
 EDG_FDMEvents.71.desc: "灾难降临了。\n\n尼罗河——这条滋养了埃及数千年的母亲河——突然变得狂暴而不可控。史无前例的洪水冲毁了堤坝，淹没了村庄，吞噬了大片的麦田。洪水退去之后，留下的不是往年的肥沃淤泥，而是一片片满目疮痍的废墟。\n\n农民们跪在泥泞中痛哭，他们的庄稼、房屋、牲畜，一切都在一夜之间化为乌有。开罗城中的粮价飞涨，饥荒的阴影开始笼罩整个尼罗河谷。\n\n在埃及本土居民的眼中，这是真主对这些外来统治者的神罚。古老的伊西斯女神传说在民间重新流传——人们说，尼罗河的泛滥是伊西斯哭泣所流下的泪水，而这一次，她的泪水已经变成了毁灭性的洪灾。"
 EDG_FDMEvents.71.a: "难道连真主都要抛弃我们？"
 EDG_FDMEvents.71.a_tt: "§Y埃及§!地区所有省份将§R清空基础生产§!，一段时间后，我们会进入灾难§T伊西斯的眼泪§!，清空的基础生产会在灾难§T伊西斯的眼泪§!结束后返还。"
 EDG_FDMEvents.72.title: "伊西斯的眼泪"
 EDG_FDMEvents.72.desc: "「我以穷困和患难考验他们，以便他们谦逊。当我的命令降临的时候，他们不义，但他们不觉悟。」——《古兰经》7:94-95\n\n伊西斯是古埃及宗教信仰中的一位女神，对她的崇拜传遍了整个希腊-罗马世界。她被敬奉为理想的母亲和妻子、自然和魔法的守护神。人们相信，每年尼罗河洪水的泛滥，就是伊西斯哭泣欧西里斯所流下的悲伤泪水。因此，人们每年都要举行再现欧西里斯死亡和重生的仪式。\n\n但是，曾滋养了我们先祖、见证了法蒂玛最初辉煌的尼罗河，如今却违背了千百年来的自然规律。\n\n史无前例的大旱使得每年本该如期而至的泛滥化为泡影，干裂的河床像是一道道丑陋的伤疤撕裂了埃及的大地；而当罕见的暴雨降临时，它又化作狂暴的洪灾，冲毁了堤坝、村庄与大片的麦田。\n\n自然的伟力无情地摧毁了这片曾经充当东地中海粮仓的丰饶之地，农田荒芜，粮食绝收，可怕的饥饿与绝望在尼罗河谷蔓延。在埃及本土居民的眼中，这是真主对我们这些外来统治者的神罚。这条古老河流的「背叛」，不仅让帝国的农业和财政濒临崩溃，更将我们那本就岌岌可危的统治合法性推向了深渊。\n\n如果我们不能尽快调集资金修复水利、安抚灾民并度过这场自然浩劫，先祖夺回故土的宏愿将被掩埋在这片饥芜的泥沼之下。"
 EDG_FDMEvents.72.a: "悲伤，逆流成河。"
 EDG_FDMEvents.72.a_tt: "进入灾难§T伊西斯的眼泪§!。\n\n解锁§Y决议§!：§T伊西斯的眼泪§!：紧急救济\n解锁§Y决议§!：§T伊西斯的眼泪§!：开仓放粮\n解锁§Y决议§!：§T伊西斯的眼泪§!：抑制粮价\n解锁§Y决议§!：§T伊西斯的眼泪§!：囤积居奇\n解锁§Y决议§!：§T伊西斯的眼泪§!：加重税负\n解锁§Y决议§!：§T伊西斯的眼泪§!：征丁入亩\n解锁§Y决议§!：§T伊西斯的眼泪§!：发行国债"
 EDG_FDMEvents_72_modifier: "§R伊西斯的眼泪§!"
 EDG_FDMEvents.72.a_tt_2: "直到灾难§T伊西斯的眼泪§!结束"
 EDG_FDMEvents.73.title: "浩劫之后"
 EDG_FDMEvents.73.desc: "尼罗河的灾难终于过去了。\n\n经过数月的艰苦努力，被洪水摧毁的堤坝得到了修复，被淹没的农田重新露出了地面，被冲毁的村庄开始了重建。那些在饥荒中幸存下来的农民们，带着疲惫但坚定的眼神，重新拿起了锄头与镰刀。\n\n令人惊喜的是，洪水虽然带来了毁灭，但也留下了丰厚的礼物——那层覆盖在田野上的肥沃淤泥，将使未来数年的庄稼产量远超以往。尼罗河用它特有的方式，向这片土地上的人们证明：毁灭与重生，从来都是一枚硬币的两面。\n\n帝国的农业与财政正在缓慢但坚定地恢复。那些曾经在灾难中绝望的百姓，如今重新看到了希望的曙光。伊西斯的眼泪已经流干，而她的祝福，才刚刚开始。"
 EDG_FDMEvents.73.a: "真主保佑。"
 EDG_FDMEvents.73.a_tt: "灾难§T伊西斯的眼泪§!将会结束，灾难之前清空的基础生产将会§G全数返还§!，§G升级§!埃及地区所有省份的§Y税收§!建筑和§Y生产§!建筑，并额外赠送§Y1§!点基础生产。"
 EDG_FDMEvents_73_modifier: "§T伊西斯的眼泪§!"
 EDG_FDMEvents.74.title: "红海的困境"
 EDG_FDMEvents.74.desc: "「因为他们供奉古莱什人冬夏的旅行。故教他们崇拜这天房的主，他曾解除他们的饥荒，并使他们远离恐惧。」——《古兰经》106:1-4\n\n凭借着控制埃及与红海的绝佳地理优势，法蒂玛王朝如同扼住了欧亚大陆贸易的咽喉。来自印度的香料和东方的丝绸，无一例外都需要经过我们在苏伊士与亚历山大设立的海关。庞大的过境抽解与垄断利润充实了帝国的金库，让我们得以供养不可战胜的大军，并将开罗打造成世界的中心。\n\n然而，当那些葡萄牙与西班牙的探险家驾着帆船绕过好望角，历史的轨迹发生了致命的偏转。欧洲异教徒开辟的直达印度的新航路，对我们的经济体系造成了釜底抽薪般的打击。满载香料的商船不再驶入红海，而是直接驶向了里斯本的港口；亚历山大集市的喧嚣迅速退去，取而代之的是死寂的高大库房。海关收入的暴跌使得原本极度依赖贸易红利的帝国机器齿轮骤停。\n\n更为严峻的是，财政的枯竭让我们无法继续维持庞大的红海巡逻舰队，更无力安抚依靠贸易为生的沿岸阿拉伯部落。破产的商团心生怨恨，海盗与地方分裂势力趁机在红海与汉志沿岸死灰复燃。在这个大航海的时代，帝国正面临前所未有的经济窒息——如果我们不能将大炮架在印度洋的波涛之上打破异教徒的垄断，或是及时探寻出属于帝国自己的新财源，这曾经辉煌的经济大厦必将轰然倒塌。"
 EDG_FDMEvents.74.a: "万人空巷的亚历山大港如今要成为历史了吗？"
 EDG_FDMEvents.74.a_tt: "进入灾难§T红海的困境§!。"
 EDG_FDMEvents.75.title: "奇迹之城"
 EDG_FDMEvents.75.desc: "奇迹发生了。\n\n当葡萄牙与西班牙的帆船绕过好望角，当红海的贸易航线日渐萧条，当帝国的经济命脉被大航海时代的浪潮无情地切断时——开罗，这座建立在尼罗河畔的千年古都，以一种出人意料的方式完成了自我救赎。\n\n通过开凿苏伊士运河、发展本地手工业、拓展非洲内陆贸易网络，以及利用帝国庞大的国内市场优势，开罗重新崛起为一个连接地中海、红海与印度洋的超级贸易枢纽。亚历山大港的船坞再次繁忙起来，开罗集市上的香料堆成了山，来自世界各地的商人在这座奇迹之城中寻找着财富与机遇。\n\n红海的困境已被彻底克服。法蒂玛的经济不再依赖于单一的过境贸易，而是建立在多元化、可持续的商业基础之上。开罗，真正成为了世界的中心。"
 EDG_FDMEvents.75.a: "开罗，世界的中心。"
 EDG_FDMEvents.75.a_tt: "灾难§T红海的困境§!将会结束。"
 EDG_FDMEvents_75_modifier: "§T繁荣的亚历山大港§!"
 EDG_FDMEvents.76.title: "众矢之的"
 EDG_FDMEvents.76.desc: "法蒂玛哈里发国的归来，如同一颗巨石投入了平静的湖面，激起了整个已知世界的波澜。\n\n从君士坦丁堡到巴黎，从德里到里斯本，每一位国王、苏丹与皇帝都在密切关注着这个从马格里布荒漠中崛起的什叶派帝国。他们看到了法蒂玛的军队横扫北非与中东的雷霆之势，看到了伊斯玛仪派信仰在阿拉伯世界的迅速蔓延，看到了一个统一的伊斯兰帝国对现有世界秩序构成的根本性威胁。\n\n恐惧催生了联盟。那些曾经彼此敌对的列强——天主教的欧洲、逊尼派的奥斯曼、东正教的俄罗斯——在面对共同的威胁时，罕见地找到了合作的契机。一场针对法蒂玛的遏制行动正在悄然展开。\n\n我们曾经是猎物，如今成为了猎人。但猎人也会成为猎物——当整个世界都将你视为威胁时，你便成为了众矢之的。"
 EDG_FDMEvents.76.a: "没有什么能阻挡法蒂玛复兴的脚步！"
 EDG_FDMEvents.76.a_tt: "@FDM§Y法蒂玛§!哈里发国的归来引起了众多国家的恐惧，所有非§Y什叶派§!的列强将会激活修正「§Y列强的角逐§!」，以遏止@FDM§Y法蒂玛§!哈里发再度统一伊斯兰世界的企图。"
 EDG_FDMEvents.76.b: "还是算了吧"
 EDG_FDMEvents.76.b_tt: "什么都不会发生。"
 EDG_FDMEvents.77.title: "安达卢斯的新生"
 EDG_FDMEvents.77.desc: "伊比利亚的阳光下，一场静默的文化革命正在完成它的最后一块拼图。\n\n从科尔多瓦的红宫到塞维利亚的吉拉尔达塔，从格拉纳达的阿尔罕布拉到里斯本的港口——曾以基督徒、摩尔人和犹太人三重身份交织而闻名的伊比利亚大地，如今在法蒂玛的统治下找到了一种全新的统一。\n\n安达卢斯，这个名字承载着数百年伊斯兰文明在欧洲最西端的辉煌记忆。如今，它不再仅仅是历史的回响，而是一个崭新文化身份的诞生。当地的阿拉伯人、柏柏尔人、皈依的基督徒与混血后裔，在法蒂玛宫廷的文化政策引导下，逐渐融合为一个以「安达卢斯」为名的独特文化群体。\n\n他们保留了伊比利亚人对航海的天赋与对商业的敏锐，同时吸收了伊斯玛仪派的哲学思辨与什叶派的艺术审美。法蒂玛的旗帜飘扬在这片土地上，不再被视为外来征服者的标志，而是成为了安达卢斯人引以为傲的身份象征。"
 EDG_FDMEvents.77.a: "安达卢斯，法蒂玛在西方的明珠"
 EDG_FDMEvents.77.a_tt: "所有§Y伊比利亚§!文化组的省份将转变为§T安达卢斯§!文化，该文化属于§T黎凡特§!文化组。"
 EDG_FDMEvents.78.title: "伊塔尼耶的融合"
 EDG_FDMEvents.78.desc: "亚平宁半岛与拉丁世界的古老土地，正在经历一场前所未有的文化重塑。\n\n罗马的废墟、佛罗伦萨的穹顶、威尼斯的运河、那不勒斯的港湾——这些曾经属于拉丁基督教文明的标志性景观，如今在法蒂玛的统治下被赋予了全新的文化内涵。伊斯玛仪派的宣礼塔矗立在古罗马广场的废墟旁，什叶派的书院取代了修道院成为知识的中心。\n\n伊塔尼耶，这个由法蒂玛宫廷的学者们创造的新名字，正在成为这片土地上所有居民的共同身份。拉丁裔的商人、皈依的基督徒后裔、来自北非的柏柏尔移民，以及东方来的穆斯林学者——所有人在法蒂玛的文化熔炉中逐渐融为一体。\n\n他们继承了拉丁人对法律与秩序的执着，同时融入了伊斯兰世界对科学与艺术的热情。伊塔尼耶文化，正是东西方文明在法蒂玛旗帜下交汇的最完美结晶。"
 EDG_FDMEvents.78.a: "拉丁世界的荣光将在伊斯玛仪的旗帜下重生"
 EDG_FDMEvents.78.a_tt: "所有§Y拉丁§!文化组的省份将转变为§T伊塔尼耶§!文化，该文化属于§T黎凡特§!文化组。"
 EDG_FDMEvents.79.title: "哈巴沙的归化"
 EDG_FDMEvents.79.desc: "非洲之角的古老土地终于被纳入了法蒂玛的文化版图。\n\n从阿克苏姆的方尖碑到埃塞俄比亚高原的修道院，从亚丁湾的港口到索马里的香料海岸——这片曾以所罗门后裔与示巴女王传说而自豪的土地，如今在法蒂玛的统治下翻开崭新的一页。\n\n哈巴沙，这个名字源自阿拉伯语对埃塞俄比亚的古老称呼。在法蒂玛宫廷的文化规划中，它代表着非洲之角所有民族融合后的新身份。科普特基督徒的后裔、穆斯林商人、古老的阿克苏姆遗民，以及来自阿拉伯半岛的移民，在这片高原上逐渐融合为一个统一的文化体。\n\n他们保留了非洲之角人民对高原与海洋的深厚感情，同时接纳了什叶派的信仰框架与伊斯玛仪派的理性传统。哈巴沙文化，是法蒂玛帝国在非洲大陆种下的一颗璀璨明珠。"
 EDG_FDMEvents.79.a: "非洲之角，法蒂玛在南方的骄傲"
 EDG_FDMEvents.79.a_tt: "所有§Y非洲之角§!地区的省份将转变为§T哈巴沙§!文化，该文化属于§T黎凡特§!文化组。"
 EDG_FDMEvents.80.title: "比拉德法里斯的重塑"
 EDG_FDMEvents.80.desc: "波斯——这片曾孕育了阿契美尼德与萨珊辉煌的古老土地——正在法蒂玛的统治下经历一场深刻的文化变革。\n\n从伊斯法罕的四十柱宫到设拉子的诗园，从波斯波利斯的废墟到霍尔木兹海峡的港口，波斯文明的千年积淀正在与法蒂玛的什叶派伊斯玛仪传统发生激烈的碰撞与融合。\n\n比拉德法里斯，这个融合了波斯语「法尔斯之地」与阿拉伯语地理概念的新名字，正在成为这片土地上所有居民的共同标识。波斯的什叶派学者、逊尼派的遗老、琐罗亚斯德教的后裔，以及来自阿拉伯半岛的移民，在法蒂玛的文化政策下逐渐融合为一个全新的文化群体。\n\n他们继承了波斯人对诗歌、花园与精致生活的热爱，同时将伊斯玛仪派的哲学思辨融入了波斯悠久的智识传统之中。比拉德法里斯文化，是法蒂玛帝国在东方世界树立的文化丰碑。"
 EDG_FDMEvents.80.a: "波斯的智慧将在法蒂玛的旗帜下绽放新的光芒"
 EDG_FDMEvents.80.a_tt: "所有§Y伊朗§!文化组的省份将转变为§T比拉德法里斯§!文化，该文化属于§T黎凡特§!文化组。"
 EDG_FDMEvents.81.title: "夜访苏克"
 EDG_FDMEvents.81.desc: "某个无法入眠的夜晚，[Root.Monarch.GetName]换上一身普通商人的装束，独自溜出了宫殿。\n\n开罗的苏克在月光下呈现出与白日截然不同的面貌。白天喧嚣的集市此刻只剩下零星的灯火与低声交谈的守夜人。哈里发在一个茶摊旁坐下，要了一壶薄荷茶，默默地听着身旁两个商人的闲聊。\n\n「哈里发确实是明君，」一个商人说道，「自从法蒂玛归来，开罗的贸易比萨哈达时代好了不知多少倍。」另一个商人却不以为然地冷哼一声：「明君？也许吧。但他身边的那些税吏呢？上个月我的货被扣了三次，每次都要额外塞钱才放行。哈里发坐在宫殿里，哪里知道我们小商人的苦？」\n\n[Root.Monarch.GetName]没有插话，只是默默地喝完了茶。离开时，他在茶摊上留下了一枚金币——足够那个抱怨的商人交半年的税。"
 EDG_FDMEvents.81.a: "记住那些赞美，它们是帝国稳定的基石"
 EDG_FDMEvents.81.tt: "该事件属于§T伊伦之治§!事件组。"
 EDG_FDMEvents.98.tt: "该事件属于§T重生之路§!事件组。"
 EDG_FDMEvents.81.b: "记住那些抱怨，它们是帝国腐败的警钟"
 EDG_FDMEvents.82.title: "弯刀与笔"
 EDG_FDMEvents.82.desc: "深夜的书房中，[Root.Monarch.GetName]独自面对着一份需要签署的法令。\n\n烛光摇曳，映照着堆积如山的文书。他拿起笔，却发现自己的手在微微颤抖——这双手能稳稳地驾驭战马、挥舞弯刀，能在十三岁时砍倒第一个敌人，却在面对这些密密麻麻的文字时笨拙得如同孩童。\n\n他想起了老维齐尔当年教他抄写税册的日子。那时候他抱怨连连，认为这是对王子的侮辱。直到他在税册中发现了被篡改的数字，才明白了维齐尔的良苦用心。\n\n「父亲给了我握刀的手，」[Root.Monarch.GetName]苦笑着自言自语，「维齐尔给了我读数的眼。但谁来给我写字的耐心？」\n\n他盯着那份法令看了很久，最终还是拿起了笔。"
 EDG_FDMEvents.82.a: "治理帝国不能只靠刀剑"
 EDG_FDMEvents.82.b: "战场才是哈里发的归宿"
 EDG_FDMEvents.83.title: "棋逢对手"
 EDG_FDMEvents.83.desc: "一位自称来自波斯的神秘旅人抵达了开罗，请求与哈里发对弈。他自称原本是塔巴里斯坦的沙阿之子，原本在帖木儿苏丹麾下效力，听闻家国危难之际，只身回到阿莫勒，结果却发现祖国同自己的沙阿父亲一起埋进了坟墓里，几近辗转，他来到了开罗，来到了哈里发的宫廷里。\n\n[Root.Monarch.GetName]在宫殿花园中接见了他。这个波斯人衣着朴素，面容被风吹日晒得黝黑粗糙，但举手投足间却透着一种难以言喻的从容。他下棋的风格极其诡异——不按任何已知的开局，每一步都像是在故意暴露弱点，却在最后关头将所有散落的棋子串联成致命的杀局。\n\n[Root.Monarch.GetName]输了。\n\n他盯着棋盘沉默良久，然后抬起头问道：「你是谁？」\n\n波斯人微微一笑，站起身来，却什么也没说，然后便转身离去，再也没有出现过，波斯人就像一缕青烟，消失在了开罗的茫茫人海之中。"
 EDG_FDMEvents.83.a: "我必须知道他是谁"
 EDG_FDMEvents.83.a_tt: "哈里发派人追寻此人的下落，最后却只发现了一封留给哈里发的信，信中什么都没有写，只留下一个不知所云的署名：归来者。"
 EDG_FDMEvents.83.b: "天外有天，人外有人"
 EDG_FDMEvents.84.title: "渔夫的智慧"
 EDG_FDMEvents.84.desc: "一次微服出行中，[Root.Monarch.GetName]在尼罗河畔遇到了一位老渔夫。\n\n老渔夫不认识他，只当他是某个贵族子弟，便与他闲聊起来。两人坐在河堤上，看着夕阳将尼罗河染成一片金红。\n\n「年轻人，你看这河水，」老渔夫指着缓缓流淌的河面说道，「它从不与石头硬碰硬，而是绕着走。但你给它一千年，它能把山磨成沙。」\n\n[Root.Monarch.GetName]若有所思。他想起了自己即位以来的种种铁腕手段——镇压叛乱、清洗异端、以刀剑维持秩序。这些手段确实有效，但也留下了无数的仇恨与裂痕。\n\n临走时，渔夫叫住了他：「年轻人，你的眼神太凶了。多看看河水，少看看刀刃。」\n\n[Root.Monarch.GetName]没有回头，但他的脚步明显慢了下来。"
 EDG_FDMEvents.84.a: "水滴石穿，柔能克刚"
 EDG_FDMEvents.84.b: "刀剑与流水，缺一不可"
 EDG_FDMEvents_84_modifier: "渔夫的智慧"
 EDG_FDMEvents.85.title: "母亲的面容"
 EDG_FDMEvents.85.desc: "在整理先父遗物时，[Root.Monarch.GetName]发现了一枚小小的银质挂坠。\n\n挂坠藏在一只陈旧的木匣底部，被层层丝绸包裹着。打开后，里面是一幅微型肖像画——一位年轻女子的面容，眉眼间与[Root.Monarch.GetName]有七分相似。她的嘴角带着一丝温柔的微笑，仿佛正在凝视着画外的某个人。\n\n挂坠背面刻着一行小字：「愿真主保佑你，我的孩子。」\n\n侍从低声告诉他，这是他母亲生前前留下的唯一遗物。当年，她挺着大肚子，在马格里布的荒漠中生下了他。她没能看到他长大，没能看到他即位，没能看到法蒂玛的旗帜重新飘扬在开罗的城头。\n\n[Root.Monarch.GetName]将挂坠贴在额头上。额头上的银色弯月印记与挂坠上的字迹恰好重合，仿佛母亲的手正隔着时空轻轻抚摸着他的脸庞。"
 EDG_FDMEvents.85.a: "让母亲的祝福伴我左右"
 EDG_FDMEvents.85.b: "让母亲的祝福庇佑整个帝国"
 EDG_FDMEvents_85_modifier: "母亲的祝福"
 EDG_FDMEvents.86.title: "沙暴中的幻象"
 EDG_FDMEvents.86.desc: "一次远征途中，[Root.Monarch.GetName]的军队在撒哈拉边缘遭遇了一场罕见的沙暴。\n\n天地一片昏黄，狂风裹挟着沙砾如刀割般扑面而来。队伍被打散，战马嘶鸣，士兵们在风沙中艰难地辨认着方向。[Root.Monarch.GetName]被一阵狂风掀下马来，等他挣扎着站起身时，发现自己已经孤身一人。\n\n在漫天的黄沙中，他看到了一个幻象。\n\n他的父亲站在沙丘之上，白袍猎猎，手中握着那柄传了数代的弯刀。父亲没有说话，只是将弯刀递向他。[Root.Monarch.GetName]伸出手去接，却抓了个空——父亲的身影如同海市蜃楼般消散在风沙之中。\n\n风暴散去后，他发现自己跪在沙地上，手中紧握着的，只有那柄沾满沙尘的弯刀。和他父亲当年坠入尼罗河时握着的，是同一柄。\n\n身边的侍从们赶来时，看到哈里发独自跪在沙漠中，额头上的银色弯月印记在阳光下闪闪发光。他没有说话，只是缓缓站起身，翻身上马，继续前行。"
 EDG_FDMEvents.86.a: "父亲在天之灵注视着我"
 EDG_FDMEvents.86.b: "父亲的血脉在我体内流淌"
 EDG_FDMEvents_86_modifier: "沙暴中的顿悟"
 EDG_FDMEvents.87.title: "叛将之子"
 EDG_FDMEvents.87.desc: "一场战役后，士兵俘获了一名少年——他是叛军首领的儿子。\n\n按照惯例，这个孩子应该被处决或终身监禁。当[Root.Monarch.GetName]走进关押俘虏的营帐时，那个少年正蜷缩在角落里，浑身是伤，却倔强地不肯低头。\n\n「你恨我吗？」[Root.Monarch.GetName]问道。\n\n少年抬起头，眼中燃烧着与年龄极不相称的怒火：「你杀了我父亲。」\n\n[Root.Monarch.GetName]沉默了。\n\n他在那双眼睛中看到了某种熟悉的东西——那是十三岁的自己，在阿特拉斯山的战场上第一次杀人时的眼神。倔强、愤怒、不肯低头。如果命运稍有不同，跪在这里的可能就是他。\n\n「你多大了？」[Root.Monarch.GetName]问。\n\n「十三。」\n\n又是十三岁。"
 EDG_FDMEvents.87.a: "将其收为义子，这孩子让我想起了当年的自己"
 EDG_FDMEvents.87.b: "帝国的法律不容私情"
 EDG_FDMEvents.88.title: "艾资哈尔的深夜"
 EDG_FDMEvents.88.desc: "某个失眠的夜晚，[Root.Monarch.GetName]独自走进了艾资哈尔清真寺。\n\n月光透过穹顶洒在祈祷厅的地面上，形成一片银色的光斑。空旷的大殿中寂静无声，只有远处偶尔传来守夜人的脚步声。\n\n[Root.Monarch.GetName]在大殿中央坐下，开始低声诵读古兰经。这是他多年来第一次不是为了仪式而祈祷——没有朝臣在旁注视，没有史官在旁记录，只有他与真主之间最私密的对话。\n\n一位年迈的守夜人走过来，没有认出他，只是在他身旁坐下，一起默默祈祷。两人在月光中并肩而坐，一个是最高的统治者，一个是最卑微的仆人，却在这一刻平等地跪伏在真主面前。\n\n黎明时分，守夜人起身离去。临走前，他拍了拍[Root.Monarch.GetName]的肩膀，留下一句话：「年轻人，真主不需要你的膝盖弯曲，他需要你的心弯曲。」\n\n[Root.Monarch.GetName]目送老人离去，然后独自在晨光中坐了很久。"
 EDG_FDMEvents.88.a: "真主面前，我永远是谦卑的仆人"
 EDG_FDMEvents.88.b: "但我不需要改变自己"
 EDG_FDMEvents.89.title: "伊伦的一生"
 EDG_FDMEvents.89.desc: "[Root.Monarch.GetName]最后一次骑上战马时，已经不再年轻了。\n\n额头上的银色弯月印记早已被岁月磨得模糊，那柄从先祖苏莱曼手中传下来的弯刀也换过了三次刀鞘。但他依然坚持亲自率军出征——正如他即位第一天所做的那样。\n\n那是一场并不重要的边境冲突。叛军的残部据守在一座荒凉的山谷中，以他的兵力本可以围而不攻，等对方粮尽自溃。但他选择了强攻。「我不想像父亲那样死在追击的路上，」他对身边的将领说道，「但我也不会在城墙上等着别人替我去死。」\n\n战斗结束得很顺利。但在打扫战场时，一支隐藏在暗处的冷箭射中了他的肩膀。箭头有毒。\n\n当侍从们将他抬回开罗时，他已经知道自己时日无多。他拒绝了御医的治疗——「毒已入骨，」他平静地说，「与其在床上苟延残喘，不如让我体面地离开。」\n\n弥留之际，他让人将那柄弯刀取来，放在枕边。他望着窗外开罗的天际线，嘴角浮现出一丝微笑。\n\n「父亲，」他低声说道，「我做到了。」\n\n然后他闭上了眼睛。\n\n额头上那枚银色弯月印记，在烛光中最后一次闪烁，然后永远地黯淡了下去。"
 EDG_FDMEvents.89.a: "至此，这位传奇般的哈里发的故事画上句号"
 EDG_FDMEvents.90.title: "智慧宫的灯火"
 EDG_FDMEvents.90.desc: "一位来自巴格达的学者带着一船手稿抵达了亚历山大港。\n\n他自称是阿拔斯王朝智慧宫最后一位馆长的后人。当年蒙古铁骑踏破巴格达之时，他的先祖冒着生命危险从烈焰中抢救出了数千卷珍贵的手稿——包括希腊哲学家的阿拉伯语译本、波斯天文学家的星图、印度数学家的论文，以及大量伊斯玛仪派早期学者的秘密著作。\n\n「这些手稿在逊尼派的世界里已经无处容身，」老学者跪在哈里发面前说道，「但在法蒂玛的旗帜下，它们或许能找到新的归宿。」\n\n宫廷中的乌理玛们对此意见不一。一些人认为这些手稿中混杂着逊尼派学者的异端思想，应该被焚毁；另一些人则认为，知识不分教派，智慧宫的灯火应该照亮整个世界。\n\n哈里发翻阅着那些泛黄的羊皮卷，指尖掠过欧几里得的几何图形、托勒密的星象表、伊本·西纳的医学论著。他抬起头，望着窗外开罗的天际线，缓缓说道：「真主赐予人类最宝贵的礼物，不是黄金，不是刀剑，而是知识。」"
 EDG_FDMEvents.90.a: "知识不分教派"
 EDG_FDMEvents.90.b: "正信不容玷污"
 EDG_FDMEvents_90_modifier: "智慧宫的灯火"
 EDG_FDMEvents.91.title: "移山之人"
 EDG_FDMEvents.91.desc: "宫廷中的老学者们又开始讲述那个古老的传说了。\n\n当年先祖穆仪兹奠基开罗时，穆盖塔姆山挡住了城市的风水。哈里发命令工程师贾法尔·伊本·穆罕默德移走这座山。贾法尔没有真的移山——那显然不可能——而是在山上点燃了无数火把，在夜间造成山体消失的视觉错觉，让哈里发相信山已经被移走了。\n\n「移山之人，」[Root.Monarch.GetName]喃喃自语，「不是真的移走了山，而是让人们相信山已经不在了。」\n\n如今，帝国正面临着一个看似不可能完成的任务。敌人的要塞固若金汤，正面强攻必将付出惨重的代价。将领们在沙盘前争论不休，有人主张围困，有人主张强攻，有人主张绕道而行。\n\n[Root.Monarch.GetName]望着沙盘上那座代表要塞的小山丘，嘴角浮现出一丝微笑：「先祖穆仪兹说过，真正的胜利不是移走山，而是让山自己让开。」"
 EDG_FDMEvents.91.a: "效仿先祖的移山之道"
 EDG_FDMEvents.91.b: "刀剑才是哈里发的语言"
 EDG_FDMEvents_91_modifier: "移山之人的智慧"
 EDG_FDMEvents.92.title: "疯王的幽灵"
 EDG_FDMEvents.92.desc: "在整理开罗古宫的档案时，[Root.Monarch.GetName]发现了一份尘封已久的密函。\n\n密函的封蜡上印着法蒂玛王朝的月牙纹章，但年代久远，已经龟裂发黄。打开后，里面是一封以哈基姆哈里发名义书写的信——那位在历史上以「疯王」著称、最终在穆盖塔姆山上神秘失踪的统治者。\n\n信中写道：「如果你读到这封信，说明我已经不在了。不要寻找我。我所做的一切——那些禁令、那些疯狂、那些让整个帝国为之震颤的决定——都是为了一个目的：让人们记住，真主的意志不是通过哈里发的口来传达的，而是通过每个人的心来感受的。真相不在山巅，而在每个人的心中。」\n\n[Root.Monarch.GetName]读完信，沉默良久。哈基姆究竟是一个疯子，还是一个被误解的圣人？他的那些疯狂举动——禁止下棋、禁止女性出门、摧毁耶路撒冷的圣墓教堂——究竟是暴政，还是某种更深层的启示？\n\n宫廷中的学者们对此争论不休，但[Root.Monarch.GetName]只是将信折好，重新放回了木匣中。"
 EDG_FDMEvents.92.a: "他是被误解的圣人"
 EDG_FDMEvents.92.b: "不要重蹈他的覆辙"
 EDG_FDMEvents_92_modifier: "疯王的遗产"
 EDG_FDMEvents.93.title: "尼罗河的刻度"
 EDG_FDMEvents.93.desc: "尼罗河的泛滥季即将到来，罗达岛上的水位计却出现了异常。\n\n这座由法蒂玛先祖建造的精密装置，千百年来一直是帝国农业的命脉。通过八角形测量井中的刻度，学者们可以精确预测洪水的高度，从而决定当年的税收额度。刻度上升三尺，意味着丰收；刻度下降三尺，意味着歉收。\n\n但今年的读数既不是高位，也不是低位，而是一个从未见过的中间值。\n\n宫廷中的学者们争论不休。天文学家认为这是星辰运行的异常，水利工程师认为这是上游河道改道的征兆，而乌理玛们则认为这是真主对帝国的考验。\n\n「这个读数意味着什么？」[Root.Monarch.GetName]问道。\n\n首席学者沉默了很久，最终说道：「至高的哈里发，坦白说——我们不知道。」"
 EDG_FDMEvents.93.a: "相信这是吉兆，降低税率以示庆祝"
 EDG_FDMEvents.93.b: "相信这是凶兆，提高税率以备荒年"
 EDG_FDMEvents.94.title: "达伊的密信"
 EDG_FDMEvents.94.desc: "一封来自远方的密信，经过层层转手，终于抵达了开罗。\n\n信是用伊斯玛仪派的密码书写的，只有宫廷中最资深的达伊才能解读。信中报告说，在某个逊尼派大国的心脏地带，我们的传教士已经发展了一个庞大的秘密信徒网络。这些人隐藏在逊尼派的面具之下，在清真寺中假装祈祷，在集市上假装经商，却在暗中传播什叶派的真谛。\n\n但这个网络即将暴露。当地的密探已经开始追查异端思想的来源，几位核心信徒已经被逮捕。达伊请求开罗立即提供资金和外交支持，否则整个网络将在数月内被摧毁。\n\n「如果我们支持他们，」维齐尔忧心忡忡地说道，「可能会引发与那个大国的外交危机。但如果我们置之不理，数十年的心血将付诸东流。」"
 EDG_FDMEvents.94.a: "全力支持达伊，信仰的火种不能熄灭"
 EDG_FDMEvents.94.b: "切断联系，保全帝国的外交利益"
 EDG_FDMEvents_94_modifier: "达伊的网络"
 EDG_FDMEvents.95.title: "先知的诞辰"
 EDG_FDMEvents.95.desc: "宫廷中的乌理玛们向哈里发呈上了一份请愿书。\n\n他们提议恢复先知穆罕默德诞辰的盛大庆祝活动——这是法蒂玛王朝的传统，但在过去的动荡年代中逐渐式微。按照传统，在这一天，开罗的街道上应该举行盛大的游行，哈里发亲自出席清真寺的祈祷仪式，穷人们应该收到食物和金钱的施舍。\n\n「毛利德（先知诞辰）是团结穆斯林世界的绝佳机会，」首席乌理玛恭敬地说道，「无论是什叶派还是逊尼派，所有穆斯林都尊敬先知。通过盛大的庆祝活动，我们可以向整个伊斯兰世界展示法蒂玛的虔诚与慷慨。」\n\n但也有学者提出异议：「这种庆祝活动带有民间狂欢的色彩，甚至混杂着前伊斯兰时代的异教传统。作为伊斯玛仪派的伊玛目，我们应该恪守正统，而非迎合大众的低级趣味。」"
 EDG_FDMEvents.95.a: "先知的诞辰属于所有人"
 EDG_FDMEvents.95.a_tt: "哈里发下令盛大庆祝先知诞辰，§Y正统性§!和§Y威望§!提升，但国库收入减少。"
 EDG_FDMEvents.95.b: "信仰不需要狂欢"
 EDG_FDMEvents.95.b_tt: "哈里发坚持低调庆祝，§Y虔诚§!提升，但§Y正统性§!下降。"
 EDG_FDMEvents.96.title: "金币的重量"
 EDG_FDMEvents.96.desc: "帝国的造币厂总管被紧急召入宫廷。\n\n他跪在哈里发面前，浑身颤抖，因为他带来了一个可怕的消息：近年来，帝国铸造的金第纳尔中出现了严重的质量问题。一些不法之徒在铸造过程中掺入了铜和银，使得金币的纯度大幅下降。\n\n这个问题的影响远超帝国的边境。法蒂玛的金第纳尔是整个地中海世界的硬通货——从威尼斯的商人到马里的国王，从拜占庭的皇帝到印度的苏丹，所有人都信赖这枚印着哈里发名号的金币。一旦金币的声誉受损，整个国际贸易体系都将陷入混乱。\n\n「我们有两个选择，」维齐尔说道，「一是严惩造假者，重新铸造纯金第纳尔，但这需要大量的黄金储备。二是改革铸币制度，引入新的防伪技术，但这需要更长的时间和更大的投资。」"
 EDG_FDMEvents.96.a: "严惩造假者，恢复金币纯度"
 EDG_FDMEvents.96.b: "改革铸币制度，引入防伪技术"
 EDG_FDMEvents_96_modifier_1: "纯金第纳尔"
 EDG_FDMEvents_96_modifier_2: "新铸币制度"
 EDG_FDMEvents.97.title: "穆盖塔姆山的晚祷"
 EDG_FDMEvents.97.desc: "某个黄昏，[Root.Monarch.GetName]独自登上了穆盖塔姆山。\n\n这座见证了无数兴衰的石灰岩山脉，俯瞰着整个开罗城。夕阳将尼罗河染成一片金红，宣礼塔上的宣礼员开始吟唱晚祷词，那悠扬的声音在山谷间回荡，仿佛整个世界都在这一刻安静了下来。\n\n[Root.Monarch.GetName]站在山顶，望着脚下这座由先祖穆仪兹亲手奠基的城市。开罗——「胜利之城」——从一片荒漠中崛起，经历了法蒂玛王朝的辉煌与衰落，经历了阿尤布的篡权与法蒂玛的归来，如今终于再次成为了伊斯玛仪派世界的心脏。\n\n但未来呢？\n\n这座城市还能辉煌多久？这个王朝还能延续几代？先知的血脉还能在这片土地上流淌多长时间？\n\n没有人能回答这些问题。哈里发只是静静地站在那里，听着晚祷的声音，看着夕阳缓缓沉入尼罗河的尽头。"
 EDG_FDMEvents.97.a: "顺其自然"
 EDG_FDMEvents.97.b: "居安思危"
 EDG_FDMEvents_97_modifier: "穆盖塔姆山的启示"
 EDG_FDMEvents.98.title: "突尼斯的城门"
 EDG_FDMEvents.98.desc: "突尼斯的城门终于在我们的攻势下轰然倒塌。\n\n当法蒂玛的旗帜第一次飘扬在这座城市的上空时，[Root.Monarch.GetName]骑马穿过城门，身后是凯旋的军队，身前是跪伏在道路两旁的居民。这座城市——曾经是十字军在北非的桥头堡，是圣殿骑士团的白袍旗帜高悬之地——如今终于回到了阿里后裔的手中。\n\n先祖苏莱曼当年逃离开罗时，曾绕过突尼斯，不敢停留。那时的法蒂玛还太弱小，无力与盘踞在这里的十字军抗衡。但如今，两个多世纪的积蓄终于化作了雷霆一击。\n\n突尼斯的陷落不仅仅是一座城市的易手——它标志着法蒂玛在马格里布的统治彻底稳固。从这里出发，通往开罗的道路已经敞开。"
 EDG_FDMEvents.98.a: "突尼斯，法蒂玛在马格里布的第一座丰碑"
 EDG_FDMEvents.99.title: "马拉喀什的绿旗"
 EDG_FDMEvents.99.desc: "马拉喀什城头的绿旗终于被我们亲手斩落。\n\n这座从阿特拉斯山脉脚下崛起的城市，曾是穆瓦希德王朝的心脏。当年那个以「一神论者」自居、以极端的教法正统主义著称的帝国，曾残酷地迫害过什叶派、犹太人乃至一切他们认为「不够纯粹」的穆斯林。如今，他们的都城在我们的铁蹄下陷落。\n\n我们的军队踏过了伊本·图马尔特陵墓前的广场，接管了这个曾经与先祖并立于北非的庞大遗产。马拉喀什的集市、书院与宫殿，都将被纳入法蒂玛的版图。\n\n马格里布的统一正在一步步变为现实。从卡比利亚到马拉喀什，从撒哈拉的边缘到大西洋的海岸——法蒂玛的旗帜正在覆盖这片古老的土地。"
 EDG_FDMEvents.99.a: "穆瓦希德的时代结束了"
 EDG_FDMEvents_99_modifier: "马拉喀什大捷"
 EDG_FDMEvents.100.title: "非斯的铜门"
 EDG_FDMEvents.100.desc: "非斯古老的铜门向我们的大军敞开。\n\n这座蜿蜒于阿特拉斯山脉与大西洋之间的狭长走廊上的城市，是马立克学派的堡垒，是卡拉维因清真寺的所在地，是整个西马格里布逊尼派学术的心脏。城中的法吉赫们曾公开宣称我们是「篡夺先知之名的异端」，山区的柏柏尔部落领袖曾在祷告中诅咒我们的哈里发。\n\n如今，这些声音都沉默了。\n\n[Root.Monarch.GetName]骑马进入非斯时，特意绕道经过了卡拉维因清真寺。这座建于859年的古老清真寺，比法蒂玛王朝的历史还要悠久。他没有下令将其改建，只是在门前驻足了片刻，低声说道：「知识不分教派。总有一天，这里的学者们会明白，伊斯玛仪派的真谛并不比他们的逊尼派教义更邪恶。」\n\n非斯的征服，标志着法蒂玛对整个摩洛哥的统治正式确立。"
 EDG_FDMEvents.100.a: "卡拉维因的灯火将继续照亮这片土地"
 EDG_FDMEvents.101.title: "科尔多瓦的黄昏"
 EDG_FDMEvents.101.desc: "科尔多瓦的红宫终于在我们的铁蹄下陷落。\n\n这座曾让整个伊比利亚为之颤栗的宫殿，曾是倭马亚僭主们炫耀武力与财富的舞台——当我们的先祖在开罗竖起什叶派的大旗时，他们却在安达卢斯以「真正的哈里发」自居，用逊尼派的教义否定法蒂玛血脉的神圣性。数百年来，两个哈里发国隔着地中海遥遥对峙，彼此的仇恨早已融入了每一道诏书、每一场布道、每一次主麻日的祷词。\n\n如今，历史终于给出了它的裁决。\n\n[Root.Monarch.GetName]走进科尔多瓦大清真寺时，阳光正透过数百根红白相间的拱门洒在祈祷厅的地面上。这座由阿卜杜勒·拉赫曼一世奠基、历经数百年扩建的宏伟建筑，曾是整个伊斯兰世界最辉煌的清真寺。如今，它的宣礼塔将再次为伊斯玛仪派诵出祷词。\n\n什叶派与逊尼派延续数百年的哈里发之争，在今天，以法蒂玛的最终胜利画上了句号。先祖穆仪兹与奥贝德拉在天之灵可以瞑目了。"
 EDG_FDMEvents.101.a: "让卡拉欧拉之塔见证法蒂玛的永恒荣光"
 EDG_FDMEvents_101_modifier: "科尔多瓦的黄昏"
 EDG_FDMEvents.102.title: "亚历山大的灯塔"
 EDG_FDMEvents.102.desc: "亚历山大港——这座由亚历山大大帝亲手奠基、曾以法罗斯岛上的灯塔照亮整个地中海的传奇之城——如今重新飘扬着法蒂玛的旗帜。\n\n当[Root.Monarch.GetName]的舰队驶入亚历山大港时，码头上挤满了前来迎接的居民。他们中有阿拉伯商人、科普特基督徒、犹太银行家，甚至还有少数来自威尼斯和热那亚的拉丁裔贸易代表。这座城市的居民比任何人都清楚，谁控制了亚历山大，谁就控制了地中海的贸易命脉。\n\n亚历山大的灯塔虽然早已在地震中倒塌，但法蒂玛的到来为这座城市带来了新的光芒。海关的税收将充实帝国的金库，船坞中的战舰将拱卫帝国的海岸，而那些堆满香料与丝绸的仓库，将成为法蒂玛经济复兴的基石。\n\n通往开罗的最后一步，已经迈出。"
 EDG_FDMEvents.102.a: "亚历山大，地中海的明珠"
 EDG_FDMEvents.103.title: "古都斯的圣石"
 EDG_FDMEvents.103.desc: "耶路撒冷——古都斯，「圣城」——终于回到了法蒂玛的手中。\n\n当[Root.Monarch.GetName]骑马穿过雅法门，踏上这座古老城市布满岁月痕迹的石板路时，整个城市仿佛屏住了呼吸。圆顶清真寺的金色穹顶在阳光下熠熠生辉，阿克萨清真寺的宣礼塔直指苍穹，而远处的橄榄山上，基督徒的教堂钟声与穆斯林的宣礼声交织在一起。\n\n这座城市见证了太多的历史。先知穆罕默德在这里夜行登霄，大卫王在这里建立王国，耶稣在这里被钉上十字架。它曾被罗马人摧毁，被十字军占领，被萨拉丁收复，如今又落入了法蒂玛的手中。\n\n[Root.Monarch.GetName]走进圆顶清真寺，站在那块传说中先知登霄时踏过的圣石前，缓缓跪下。他没有祈祷，只是静静地凝视着那块石头，仿佛在与千年的历史对话。\n\n「古都斯，」他低声说道，「你终于等到了真正的守护者。」"
 EDG_FDMEvents.103.a: "真主的圣城将永远受到法蒂玛的庇护"
 EDG_FDMEvents.104.title: "先知的清真寺"
 EDG_FDMEvents.104.desc: "麦地那——先知之城，先知穆罕默德最终安息之地——如今飘扬着法蒂玛的旗帜。\n\n当[Root.Monarch.GetName]走进先知清真寺时，他的脚步变得异常轻柔，仿佛怕惊扰了长眠于此的先知之灵。绿色的穹顶之下，是先知穆罕默德、艾布·伯克尔和欧麦尔的陵墓。三位伟人静静地躺在那里，见证着伊斯兰世界千年的兴衰更替。\n\n作为先知女儿法蒂玛与阿里的直系后裔，[Root.Monarch.GetName]跪在陵墓前，低声诵读了一段古兰经。周围的信徒们屏息凝神，有人悄悄擦去了眼角的泪水。\n\n麦地那的征服不仅仅是一次军事行动——它是一次精神上的回归。自先知迁徙以来，这座城市一直是伊斯兰世界最神圣的地方之一。如今，它终于回到了先知血脉的手中。\n\n从先知清真寺的窗口望出去，可以看到整个麦地那城。夕阳将沙漠染成一片金红，宣礼塔上的宣礼员开始吟唱晚祷词。[Root.Monarch.GetName]闭上眼睛，聆听着那悠扬的声音，心中涌起一种前所未有的平静。"
 EDG_FDMEvents.104.a: "先知的血脉将永远守护这片圣地"
 EDG_FDMEvents_104_modifier: "先知的祝福"
 EDG_FDMEvents.105.title: "天房的钥匙"
 EDG_FDMEvents.105.desc: "麦加——禁寺之所在，克尔白天房的所在地，全世界穆斯林礼拜时朝向的圣地——如今落入了法蒂玛的手中。\n\n当[Root.Monarch.GetName]走进禁寺，第一次亲眼看到那座被黑色丝绸帷幔覆盖的立方形建筑时，他停下了脚步，久久无法言语。克尔白——这座由先知易卜拉欣和他的儿子伊斯玛仪亲手建造的圣殿，是伊斯兰世界最神圣的地方。每一个穆斯林一生中至少要来此朝觐一次，而在五次每日的祈祷中，他们都会朝向这座建筑。\n\n[Root.Monarch.GetName]缓步走向克尔白，伸出手触摸那冰冷的石墙。帷幔上的金色经文在阳光下闪闪发光，周围的朝觐者们纷纷跪下，低声诵读着赞美词。\n\n作为法蒂玛与阿里的后裔，作为伊斯玛仪派的伊玛目，[Root.Monarch.GetName]有资格亲手打开克尔白的大门。他接过那把古老的钥匙，缓缓推开了那扇厚重的木门。\n\n门内是一片空旷的殿堂，只有几根柱子支撑着天花板。阳光从门口洒入，照亮了地面上的大理石。[Root.Monarch.GetName]走进去，跪在地上，额头贴着冰冷的石板。\n\n这是法蒂玛王朝数百年来最辉煌的时刻。从马格里布的荒漠到麦加的圣殿，从卡比利亚的海岸到克尔白的门槛——先知的血脉终于回到了先知的圣城。\n\n天房的钥匙，终于落入了它真正的主人手中。"
 EDG_FDMEvents.105.a: "万物非主，唯有真主；穆罕默德是真主的使者"
 EDG_FDMEvents_105_modifier: "天房的守护者"
 EDG_FDMEvents.106.tt: "该事件属于§T伊玛目的天平§!事件组。"
 EDG_FDMEvents.106.title: "盛世的阴影"
 EDG_FDMEvents.106.desc: "法蒂玛迎来了它最辉煌的时代。\n\n从大西洋到波斯湾，从安纳托利亚的高原到非洲之角的海岸，法蒂玛的旗帜覆盖了整个伊斯兰世界的半壁江山。开罗的集市上堆满了来自印度的香料和中国的丝绸，艾资哈尔清真寺里汇聚了来自各地的学者，帝国的金库充盈，军队战无不胜。\n\n然而，在这片繁荣的表象之下，一道深深的裂痕正在悄然蔓延。\n\n帝国的疆域扩张得越大，什叶派统治阶层与逊尼派多数民众之间的矛盾就越尖锐。在开罗，什叶派的乌理玛占据着宫廷的核心位置，而逊尼派的学者们只能在边缘徘徊；在巴格达，逊尼派的百姓被迫在主麻日的祷词中念诵他们并不认同的伊玛目之名；在波斯，那些曾经追随萨法维的什叶派信徒发现，他们不过是换了一个主人而已。\n\n表面上，帝国的宗教宽容政策依然在运转——基督徒和犹太人依然可以在缴纳人头税后自由礼拜。但在穆斯林内部，什叶派与逊尼派之间的鸿沟正在变成一道无法逾越的深渊。\n\n宫廷中的有识之士已经察觉到了危险的信号。一位年迈的维齐尔在私下里忧心忡忡地说道：「帝国的疆域越大，裂缝就越深。当这些裂缝最终撕裂时，法蒂玛将面临一场比任何外敌入侵都更为可怕的灾难。」"
 EDG_FDMEvents.106.a: "繁荣之下，暗流涌动"
 EDG_FDMEvents.106.a_tt: "禁用§M法蒂玛宗教容忍度§!机制。"
 EDG_FDMEvents.107.title: "乌理玛的请愿"
 EDG_FDMEvents.107.desc: "一封由数百位逊尼派学者联名签署的请愿书，被送到了哈里发的案头。\n\n请愿书的措辞恭敬但坚定。这些来自帝国各地的逊尼派乌理玛们，以先知圣训的名义，请求哈里发关注帝国内部日益严重的宗教不平等现象。他们指出，在许多省份，逊尼派的清真寺被禁止举行某些传统仪式；在宫廷中，逊尼派学者几乎没有晋升的通道；在军队中，逊尼派士兵的待遇远不如什叶派同袍。\n\n「我们并非质疑哈里发的权威，」请愿书中写道，「我们只是请求，作为先知后裔的哈里发，能够以先知的慈悲对待所有穆斯林——无论他们是什叶派还是逊尼派。先知曾说：『穆斯林皆为兄弟。』难道这句话在法蒂玛的旗帜下已经失去了意义吗？」\n\n宫廷中的什叶派激进分子怒不可遏：「这些逊尼派的伪信者竟敢质疑伊玛目的统治！应该将他们全部逮捕，以儆效尤！」而务实的官僚们则警告说，逮捕这些德高望重的学者只会激化矛盾，让局势更加不可收拾。\n\n[Root.Monarch.GetName]面前摆着两条路：倾听这些声音，还是将它们彻底压制？"
 EDG_FDMEvents.107.a: "先知的慈悲不应有教派之分"
 EDG_FDMEvents.107.b: "伊玛目的权威不容质疑"
 EDG_FDMEvents.108.title: "集市上的血案"
 EDG_FDMEvents.108.desc: "开罗的苏克爆发了血腥的冲突。\n\n事情的起因看似微不足道：一位什叶派商人在称量货物时与一位逊尼派顾客发生了争执。争执很快升级为肢体冲突，然后演变成了一场席卷整个集市的骚乱。什叶派和逊尼派的居民从各自的社区中涌出，手持棍棒和刀剑，在狭窄的巷道中厮杀。\n\n当军队赶到时，已经有数十人倒在了血泊中。死者中有老人、妇女，甚至还有几个孩子。更令人心寒的是，一些士兵在执行平乱任务时，明显偏袒了与自己同教派的一方。\n\n消息传开后，帝国各地的城市都出现了类似的骚乱。在巴格达，逊尼派的暴民焚烧了什叶派的清真寺；在大马士革，什叶派的民兵屠杀了逊尼派的社区；在伊斯法罕，两派的冲突甚至波及到了当地的犹太人和基督徒。\n\n帝国的表面繁荣正在以惊人的速度瓦解。那些曾经在法蒂玛旗帜下和平共处的不同教派，如今却像仇敌一样互相残杀。\n\n[Root.Monarch.GetName]接到报告时，沉默了很久。最终，他问了一个让所有大臣都噤若寒蝉的问题：「这一切，究竟是谁的错？」"
 EDG_FDMEvents.108.a: "必须找出幕后黑手"
 EDG_FDMEvents.108.b: "帝国的秩序不容破坏"
 EDG_FDMEvents.109.title: "哈里发的抉择"
 EDG_FDMEvents.109.desc: "宫廷中的气氛已经紧张到了极点。\n\n逊尼派和什叶派的代表们坐在大殿的两侧，彼此怒目而视，仿佛随时都可能拔刀相向。哈里发坐在高台之上，俯视着这些曾经在他面前俯首帖耳的臣子们，心中涌起一种前所未有的无力感。\n\n逊尼派的代表首先发言：「至高的哈里发，我们要求平等的权利。我们要求在宫廷中有发言权，在军队中有晋升的机会，在清真寺中有自由礼拜的权利。我们是帝国的多数，我们不应被当作二等公民！」\n\n什叶派的代表立刻反驳：「这些逊尼派的野心家想要颠覆伊玛目的统治！他们口中的『平等』不过是夺取权力的借口。如果哈里发向他们让步，法蒂玛的什叶派传统将荡然无存！」\n\n两派的争吵越来越激烈，几乎要动起手来。[Root.Monarch.GetName]试图调解，但他的话语在双方的怒火中显得如此苍白无力。\n\n一位老维齐尔悄悄走到哈里发身边，低声说道：「至高的哈里发，天平已经倾斜得太厉害了。无论您选择哪一边，另一边都不会接受。内战，恐怕已经不可避免了。」\n\n[Root.Monarch.GetName]闭上眼睛，深深地叹了一口气。他知道，老维齐尔说的是实话。"
 EDG_FDMEvents.109.a: "尝试最后一次调解，哪怕希望渺茫"
 EDG_FDMEvents.109.b: "有些裂痕无法弥合"
 EDG_FDMEvents.110.title: "天平的倾斜"
 EDG_FDMEvents.110.desc: "最后的希望破灭了。\n\n[Root.Monarch.GetName]试图在两派之间达成妥协，但他的努力只换来了更多的猜疑和怨恨。逊尼派认为他偏袒什叶派，什叶派认为他向逊尼派让步。哈里发的权威在这场宗教危机中摇摇欲坠，帝国的统一正在以肉眼可见的速度瓦解。\n\n当最后一位逊尼派代表愤然离席，当最后一位什叶派长老怒气冲冲地摔门而去，[Root.Monarch.GetName]独自坐在空荡荡的大殿中，面对着一个残酷的现实：法蒂玛王朝赖以立身的宗教平衡，已经彻底崩塌了。\n\n伊玛目的天平，曾经是法蒂玛治理术的核心——通过在什叶派正统与逊尼派多数之间维持微妙的平衡，帝国得以在宗教多元的基础上运转。但如今，这个天平已经倾斜到了无法挽回的地步。\n\n一边是坚持什叶派正统的狂热信徒，他们要求哈里发以伊玛目的名义清洗一切异端；另一边是渴望平等权利的逊尼派多数，他们不愿再忍受被边缘化的命运。夹在中间的哈里发，无论选择哪一边，都意味着对另一边的背叛。\n\n内战的阴影已经笼罩了整个帝国。从开罗的宫殿到巴格达的集市，从波斯的高原到安纳托利亚的山谷，所有人都在等待着——等待着那不可避免的爆发。\n\n[Root.Monarch.GetName]望着窗外开罗的天际线，低声说道：「先祖穆仪兹，您当年建立这个帝国时，是否也曾预见到这一刻？」\n\n没有人回答他。只有风声在空旷的大殿中回荡，仿佛在为即将到来的灾难哀悼。"
 EDG_FDMEvents.110.a: "灾难近在咫尺"
 EDG_FDMEvents.110.a_tt: "§T伊玛目的天平§!将会彻底§R失衡§!。"
 EDG_FDMEvents.111.tt: "该事件属于§T伊西斯的眼泪§!事件组。"
 EDG_FDMEvents.111.title: "哈桑的田地"
 EDG_FDMEvents.111.desc: "在上埃及的一个小村庄里，一个名叫哈桑·伊本·优素福的农夫正蹲在自家的田埂上，望着眼前这片曾经金黄的麦田。\n\n田地已经干裂了。那些曾经在微风中摇曳的麦穗如今枯黄倒伏，像是被一只无形的手从大地上连根拔起。哈桑用粗糙的手指捏起一把干土，土块在他手中碎成粉末，被风吹散。\n\n这片田地是哈桑的祖父传下来的。祖父的父亲、父亲的父亲，世代耕种着这片靠近尼罗河的土地。每年泛滥季，尼罗河的洪水会带来肥沃的淤泥，滋养这片大地，让麦子长得比人还高。哈桑从小就听父亲说：「尼罗河是我们的母亲，她永远不会抛弃我们。」\n\n但今年，母亲抛弃了她的孩子。\n\n尼罗河没有泛滥。河床裸露着，像一道丑陋的伤疤横亘在大地上。上游的暴雨没有如期而至，取而代之的是无情的烈日和干燥的热风。哈桑的邻居们已经开始宰杀牲畜，因为没有草料喂养它们。\n\n哈桑的妻子娜菲赛从屋里走出来，怀里抱着他们最小的孩子——一个刚满周岁的女婴。娜菲赛的眼神中充满了恐惧，但她没有说话，只是静静地站在丈夫身边，望着那片死去的田地。\n\n「我们该怎么办？」她终于开口，声音像是从很远的地方传来。\n\n哈桑没有回答。他不知道答案。"
 EDG_FDMEvents.111.a: "愿真主怜悯我们"
 EDG_FDMEvents.112.title: "开罗的路上"
 EDG_FDMEvents.112.desc: "哈桑最终做出了决定：去开罗。\n\n他听路过的商人说，哈里发在开罗开仓放粮，赈济灾民。开罗是帝国的心脏，是世界的中心，那里一定有吃的。只要能走到开罗，他们一家就能活下来。\n\n哈桑卖掉了家里最后一只羊，换来了几天的干粮。他把大部分留给了妻子和孩子，自己只啃几口硬邦邦的面饼。他们加入了通往开罗的人流——成千上万的农民、手艺人、流浪者，像一条缓慢的河流，沿着尼罗河谷向北移动。\n\n路上的景象令人心碎。每隔几里就能看到倒在路边的尸体——有些是饿死的，有些是病死的，还有些是被抢劫后杀死的。哈桑紧紧握着妻子的手，把女儿背在背上，不敢有丝毫松懈。\n\n第三天，他们的水喝完了。哈桑的嘴唇干裂出血，喉咙像是被火烧过一样。小女儿开始发烧，额头烫得像一块刚出炉的面包。娜菲赛用自己的头巾浸了路边泥坑里的脏水，敷在女儿的额头上。\n\n「哈桑，」娜菲赛低声说道，「如果……如果女儿撑不住了……」\n\n「她会撑住的，」哈桑打断了她，声音沙哑但坚定，「开罗就在前面。只要到了开罗，一切都会好起来的。」"
 EDG_FDMEvents.112.a: "继续前行"
 EDG_FDMEvents.113.title: "城墙之下"
 EDG_FDMEvents.113.desc: "哈桑一家终于到达了开罗。\n\n但他们没能进入城门。城墙外聚集着数以万计的灾民，密密麻麻地挤在尘土飞扬的空地上，像是一群被遗弃的牲畜。哈里发确实开仓放粮了，但粮食的数量远远不够——每天只能分到一碗稀粥，而且要排上好几个时辰的队。\n\n哈桑排在队伍里，看着前面的人一个接一个地领走他们的份额。轮到他时，锅里只剩下一点残渣。分粥的士兵摇摇头：「明天再来吧。」\n\n娜菲赛抱着女儿坐在一棵枯树下。小女儿已经不再哭了——不是因为她好了，而是因为她连哭的力气都没有了。她的呼吸越来越微弱，像是一盏即将熄灭的油灯。\n\n哈桑跪在女儿身边，用手指蘸了一点水，涂在她干裂的嘴唇上。女婴的眼睛微微睁开，看了父亲一眼，然后又闭上了。\n\n「真主啊，」哈桑低声祈祷，「如果你要惩罚我们，请惩罚我一个人。不要带走我的女儿。她才一岁，她还什么都不知道。」\n\n没有人回答他。"
 EDG_FDMEvents.113.a: "等待黎明"
 EDG_FDMEvents.114.title: "最后的祈祷"
 EDG_FDMEvents.114.desc: "小女儿在黎明前死去了。\n\n娜菲赛最先发现的。她醒来时，怀里的身体已经冰冷僵硬。她没有尖叫，没有哭泣，只是用头巾把女儿裹好，轻轻地放在地上，然后走到哈桑身边。\n\n「哈桑，」她的声音平静得可怕，「我们的女儿走了。」\n\n哈桑跪在女儿的尸体前，沉默了很久。他想哭，但眼泪已经流干了。他想愤怒，但不知道该向谁发泄。是向真主？向哈里发？向尼罗河？还是向这个残忍的世界？\n\n他最终只是伸出手，轻轻地抚摸着女儿冰冷的脸颊。「愿你在天堂里有吃不完的面包和喝不完的清水，」他低声说道，「愿你在那里，不用再受苦了。」\n\n娜菲赛坐在他身边，握着他的手。两个人就这样静静地坐着，望着东方的天空慢慢变亮。\n\n当太阳升起时，哈桑站起身来。他没有埋葬女儿——土地太硬了，他没有力气挖坑。他只是把她放在了一棵枯树下，用几块石头盖住了她的脸。\n\n「走吧，」他对娜菲赛说，「我们还有很长的路要走。」"
 EDG_FDMEvents.114.a: "愿真主保佑她的灵魂"
 EDG_FDMEvents.115.title: "一个无名的父亲"
 EDG_FDMEvents.115.desc: "帝国的灾难终于结束了。\n\n尼罗河恢复了正常的泛滥，干裂的河床重新被肥沃的淤泥覆盖，田野里再次长出了嫩绿的麦苗。哈里发的政令传遍了整个埃及，水利设施得到了修复，饥荒的阴影正在消散。开罗的集市上重新响起了商贩的叫卖声，孩子们在街头追逐嬉戏，仿佛什么都没有发生过。\n\n但有些东西，永远地消失了。\n\n在开罗城墙外的一片荒地上，有一棵枯树。树下有一堆石头，石头下面是一个小小的身体。没有人知道她的名字，没有人记得她的存在。她只活了一岁，甚至还没有学会叫「父亲」。\n\n哈桑没有回到他的田地。他和娜菲赛留在了开罗，成了城里无数乞丐中的一个。他不再祈祷，不再说话，只是每天清晨坐在城墙根下，望着来来往往的人群，眼神空洞得像一口枯井。\n\n娜菲赛有时会拉着他去清真寺，但他只是跪在那里，一言不发。娜菲赛问他为什么不再祈祷，他沉默了很久，最终说了一句话：\n\n「我的女儿死的时候，我在祈祷。真主没有回答我。现在，我不知道该对他说什么了。」"
 EDG_FDMEvents.115.a: "他的悲伤，和尼罗河一样古老，和埃及的大地一样沉重。"
 EDG_FDMEvents.116.tt: "该事件属于§T红海的困境§!事件组。"
 EDG_FDMEvents.116.title: "亚历山大港的黄昏"
 EDG_FDMEvents.116.desc: "夕阳西沉，亚历山大港的天际线被染成一片血红。\n\n曾经繁忙的码头如今冷冷清清，只有几艘破旧的渔船在波涛中摇曳。那些曾经堆满印度香料和中国丝绸的仓库，如今只剩下空荡荡的货架和厚厚的灰尘。老船长哈桑站在码头上，望着眼前这片死寂的港口，眼中满是茫然。\n\n「三十年前，」他喃喃自语，「这里每天都有上百艘商船进出。来自威尼斯、热那亚、巴塞罗那的商人们在这里争抢着最好的香料。我的父亲就是靠运送香料发的家。」\n\n他身旁的年轻水手问道：「现在呢？」\n\n哈桑苦笑着指向远方的海平面：「现在？现在他们都绕过好望角，直接去印度了。谁还需要我们？」\n\n亚历山大港的衰落不仅仅是贸易路线的改变，更是整个帝国经济命脉的断裂。那些世代依靠过境贸易为生的商人、船夫、搬运工、仓库管理员，如今都失去了生计。他们的怨恨正在积聚，如同地底的岩浆，随时可能喷发。"
 EDG_FDMEvents.116.a: "承认现实，这是新时代的开始"
 EDG_FDMEvents.116.b: "强行挽留商人，提供补贴"
 EDG_FDMEvents.117.title: "破产的香料商人"
 EDG_FDMEvents.117.desc: "开罗最大的香料商人阿卜杜勒·伊本·马哈茂德跪在哈里发的宫殿前，泣不成声。\n\n他的家族三代经营香料贸易，曾经是整个埃及最富有的商贾之一。从印度运来的胡椒、肉桂、丁香，都要经过他的仓库，再转卖到地中海各地。他的商队曾经绵延数里，骆驼的铃铛声从苏伊士一直响到亚历山大。\n\n但现在，一切都完了。\n\n葡萄牙人的商船绕过好望角，直接从印度运回香料，价格比红海路线便宜了一半。阿卜杜勒的货物堆积在仓库里，无人问津。他欠下了巨额债务，银行家们天天上门催债，他的妻子和孩子被迫搬出了豪华的宅邸，住进了开罗老城的一间破屋。\n\n「至高的哈里发，」阿卜杜勒哽咽着说道，「我请求您的怜悯。我们这些商人是帝国的支柱，如果我们都破产了，帝国的经济也就完了。请赐予我们一些救济，让我们能够度过这个难关。」\n\n宫廷中的大臣们对此意见不一。有人主张救济这些商人，以维护帝国的商业基础；有人则认为应该让他们自生自灭，把资源用在更紧迫的地方。"
 EDG_FDMEvents.117.a: "拨款救济，这些商人是帝国的根基"
 EDG_FDMEvents_117_modifier_1: "哈里发的恩典"
 EDG_FDMEvents.117.b: "置之不理，让他们自生自灭"
 EDG_FDMEvents_117_modifier_2: "商人的怨恨"
 EDG_FDMEvents.117.c: "没收他们的财产，充实国库"
 EDG_FDMEvents_117_modifier_3: "商人逃离法蒂玛"
 EDG_FDMEvents.118.title: "海盗的兴起"
 EDG_FDMEvents.118.desc: "红海的航道上，海盗的旗帜再次飘扬。\n\n随着帝国海军的衰落，那些曾经被压制的海盗势力死灰复燃。阿拉伯半岛沿岸的贝都因部落、也门的流亡贵族、甚至一些被遣散的帝国海军水手，都加入了这个危险的行当。他们驾驶着轻快的三角帆船，在红海的狭窄航道上伏击商船，劫掠货物，绑架船员索取赎金。\n\n一支来自亚丁的海盗舰队甚至胆敢攻击了帝国的官方运输船，将船上价值连城的丝绸和香料洗劫一空。更令人震惊的是，这支海盗的首领竟然是一位曾经效忠于帝国的海军将领，因为军饷拖欠而叛变。\n\n「这些海盗正在扼杀我们仅存的贸易生命线，」海军大臣忧心忡忡地报告，「如果我们不尽快采取行动，红海将彻底沦为海盗的乐园。」\n\n但帝国的国库已经空虚，建造新的战舰需要大量的资金和时间。我们是否能够承担得起这场代价高昂的海上清剿？"
 EDG_FDMEvents.118.a: "组建护航舰队，保护商船"
 EDG_FDMEvents_118_modifier_1: "红海护航"
 EDG_FDMEvents.118.b: "招安海盗首领，化敌为友"
 EDG_FDMEvents.118.c: "放任不管，集中资源应对其他危机"
 EDG_FDMEvents_118_modifier_2: "海盗猖獗"
 EDG_FDMEvents.119.title: "波斯湾的希望"
 EDG_FDMEvents.119.desc: "一位来自波斯湾沿岸的商人带来了令人振奋的消息。\n\n在霍尔木兹海峡的对岸，我们的商人发现了一条新的贸易路线。通过波斯湾，我们可以绕过葡萄牙人控制的好望角，直接与印度西北部的古吉拉特商人建立联系。虽然这条路线比红海更长，但它避开了葡萄牙人的拦截。\n\n「至高的哈里发，」商人激动地说道，「我在霍尔木兹亲眼看到了那些印度商船。他们带来了香料、棉布和宝石，而且价格比葡萄牙人便宜。如果我们能够投资建设波斯湾的港口设施，开辟一条从巴士拉到霍尔木兹的稳定航线，我们就有可能重新夺回一部分贸易份额。」\n\n这个消息让宫廷中的大臣们议论纷纷。有人认为这是帝国复兴的契机，有人则担心投资波斯湾会分散本已紧张的资源。\n\n「波斯湾？」财政大臣皱眉道，「那里远离帝国的核心，而且需要大量的基础设施投资。我们真的有能力同时维护红海和波斯湾两条贸易路线吗？」"
 EDG_FDMEvents.119.a: "投资波斯湾，抓住这个机会"
 EDG_FDMEvents_119_modifier: "波斯湾贸易路线"
 EDG_FDMEvents.119.b: "放弃这个机会，集中资源"
 EDG_FDMEvents.120.title: "开罗学者的建议"
 EDG_FDMEvents.120.desc: "艾资哈尔清真寺的学者们向哈里发提交了一份详细的改革方案。\n\n这份方案长达数十页，涵盖了经济、社会、文化等多个方面。学者们认为，帝国过度依赖过境贸易的经济模式已经不可持续，必须进行根本性的改革。他们建议发展本土手工业，特别是纺织、陶瓷和金属加工等行业，以减少对进口商品的依赖。\n\n「我们不能永远依靠别人的货物来充实我们的国库，」首席学者说道，「我们必须创造自己的财富。开罗的工匠们有着精湛的技艺，但他们缺乏资金和市场。如果哈里发能够提供支持，我们就有可能建立起自己的制造业。」\n\n这份方案还建议拓展非洲内陆的贸易网络，通过尼罗河上游与苏丹和埃塞俄比亚建立联系，获取黄金、象牙和奴隶。\n\n「这是一条漫长而艰难的道路，」学者们承认，「但这是帝国复兴的唯一希望。」"
 EDG_FDMEvents.120.a: "资助这项研究，开启改革之路"
 EDG_FDMEvents.120.b: "忽视这个建议，维持现状"
 EDG_FDMEvents.121.title: "开罗手工业复兴"
 EDG_FDMEvents.121.desc: "改革的成果开始显现。\n\n在哈里发的资助下，开罗的工匠们开始尝试新的生产技术。从印度学来的纺织技术与本地的传统工艺相结合，生产出了一种独特的棉布，质量上乘，价格合理。这种棉布很快在北非和地中海东部打开了市场。\n\n陶瓷工匠们也不甘落后。他们借鉴了中国瓷器的制作方法，结合伊斯兰艺术的几何图案，创造出了一种风格独特的陶瓷制品。这些产品不仅在国内畅销，还出口到了欧洲，成为了贵族们争相收藏的珍品。\n\n金属加工行业同样取得了突破。开罗的铁匠们发明了一种新的炼钢技术，生产出的刀剑质量堪比大马士革钢。这些武器不仅满足了帝国军队的需求，还成为了重要的出口商品。\n\n「真主保佑，」首席学者感慨道，「我们终于找到了新的出路。虽然我们无法恢复昔日的贸易垄断，但至少我们不再是别人的附庸了。」"
 EDG_FDMEvents.121.a: "继续支持手工业发展"
 EDG_FDMEvents_121_modifier: "开罗制造业"
 EDG_FDMEvents.121.b: "削减资助，见好就收"
 EDG_FDMEvents.122.title: "神圣罗马皇帝的末路"
 EDG_FDMEvents.122.desc: "神圣罗马帝国的皇帝跪在了哈里发的座前。\n\n他的紫色皇袍已经被剥去，取而代之的是一件粗麻布的囚衣。那顶镶满珠宝的皇冠被丢弃在大殿的角落里，像一件被丢弃的垃圾。他的双手被铁链锁着，每一次移动都会发出刺耳的金属声。\n\n这就是那个曾经自诩为「基督教世界的守护者」、「罗马帝国的合法继承人」的皇帝吗？这就是那个曾经率领十字军东征、妄图将伊斯兰世界从地图上抹去的皇帝吗？\n\n[Root.Monarch.GetName]俯视着这位跪伏在地的老人，嘴角浮现出一丝冷笑。「抬起头来，」他命令道。\n\n皇帝缓缓抬起头，那张曾经不可一世的面容如今满是污垢与疲惫。他的嘴唇颤抖着，似乎想说什么，但最终只是发出了一声低沉的呜咽。\n\n「你曾经妄想征服开罗，」[Root.Monarch.GetName]的声音冰冷如铁，「你曾经妄想将法蒂玛的旗帜踩在脚下。如今，你跪在这里，而你的帝国已经化为灰烬。维也纳的城墙上飘扬着我们的绿旗，你的诸侯们争先恐后地向我宣誓效忠，你的教皇已经成了我的阶下囚。」\n\n皇帝的身体开始颤抖，泪水顺着他的脸颊流下。\n\n「真主是至大的，」[Root.Monarch.GetName]站起身来，居高临下地俯视着这位曾经的皇帝，「而你，不过是历史的尘埃。」"
 EDG_FDMEvents.122.a: "把他带下去，让全世界看看亵渎者的下场"
 EDG_FDMEvents.123.title: "法兰西国王的审判"
 EDG_FDMEvents.123.desc: "法兰西国王被押解至开罗时，他的鸢尾花旗帜已经被撕成了碎片。\n\n士兵们强迫他跪在大殿的石板上，但他的脊背依然挺直，下巴依然扬起，那双傲慢的蓝色眼睛中燃烧着不屈的火焰。他的嘴唇紧抿，仿佛在忍受着某种巨大的痛苦——不是肉体的痛苦，而是尊严被践踏的痛苦。\n\n「法兰西国王不向异教徒下跪，」他的声音沙哑但倔强，「这是我的先祖传下来的规矩。」\n\n[Root.Monarch.GetName]没有发怒，只是冷笑着走下宝座，走到这位国王面前。「你的先祖？」他居高临下地俯视着这位俘虏，「你的先祖曾经率领十字军来到这片土地，妄想用火与剑征服我们的信仰。他们的尸骨早已化为尘土，而我们依然站在这里。」\n\n国王的眼神黯淡了一瞬，但很快又恢复了冷漠。「你想怎么处置我？」\n\n「处置？」[Root.Monarch.GetName]伸出手，捏住国王的下巴，强迫他抬起头来，「我不处置你。我让你活着，让你亲眼看着你的王国在法蒂玛的旗帜下臣服。让你看着你的贵族们向我跪拜，让你看着你的教堂被改造成清真寺，让你看着你的子民在我们的统治下学会敬畏真主。」\n\n国王的脸色变得苍白，但他没有求饶。他只是闭上了眼睛，仿佛在等待着最后的审判。\n\n「把他带下去，」[Root.Monarch.GetName]松开手，转身走向宝座，「让他在囚笼里好好想想，法兰西的鸢尾花在法蒂玛的月牙面前是多么渺小。」"
 EDG_FDMEvents.123.a: "傲慢是最大的罪，而他已经为此付出了代价"
 EDG_FDMEvents.124.title: "不列颠国王的屈膝"
 EDG_FDMEvents.124.desc: "不列颠国王跪在了开罗的码头上。\n\n他的王冠被摘下，放在了[Root.Monarch.GetName]的脚下。那顶镶满宝石的金冠曾经象征着「日不落帝国」的荣耀，如今却成了法蒂玛胜利的战利品。码头上挤满了围观的人群，所有人都在看着这位曾经统治着半个世界的君主如何向东方的哈里发屈服。\n\n国王的王后和年幼的王子站在他身后，脸上写满了恐惧与屈辱。王子紧紧抓着母亲的裙角，不敢抬头看那些包围着他们的法蒂玛士兵。\n\n「我，英格兰国王，」国王的声音沙哑而颤抖，「在此向法蒂玛哈里发投降。我愿以我的自由换取我的子民的平安。」\n\n[Root.Monarch.GetName]没有立即回答。他弯腰捡起那顶王冠，在手中掂了掂，然后将它丢给了身旁的侍从。「把这个放进宝库，」他说道，「让所有人都看看，曾经不可一世的不列颠国王是如何向法蒂玛低头的。」\n\n国王的脸色变得苍白，但他没有说话。他知道，从这一刻起，他的名字将永远与耻辱联系在一起。\n\n「你的舰队已经沉入海底，」[Root.Monarch.GetName]的声音冰冷如铁，「你的殖民地已经升起我们的旗帜，你的子民将在我们的统治下学会什么是真正的秩序。从今天起，不列颠不再是海洋的主人，而是法蒂玛的附庸。」"
 EDG_FDMEvents.124.a: "从今以后，海洋只有一个主人"
 EDG_FDMEvents.125.title: "巴列奥略的黄昏"
 EDG_FDMEvents.125.desc: "最后一位巴列奥略王朝的后人被带入开罗的大殿时，他的双手被铁链锁着，脖子上套着一条皮质的项圈——那是法蒂玛士兵给战俘戴上的标记。\n\n他是一个年轻人，面容清秀，但眼神中已经没有了任何光彩。他的紫袍被剥去，取而代之的是一件破旧的囚衣。他的皇冠、他的权杖、他的宝剑，都成了法蒂玛的战利品。\n\n但他手中紧握着一样东西——一幅小小的圣像，上面画着圣母玛利亚抱着婴儿耶稣的图案。圣像的边框已经磨损，颜料也有些剥落，但年轻人握着它的手指却异常坚定，仿佛那是他最后的依靠。\n\n「放下它，」[Root.Monarch.GetName]命令道。\n\n年轻人抬起头，眼神中闪过一丝恐惧，但很快被某种倔强所取代。「不，」他的声音颤抖但坚定，「这是我先祖留下的遗物，我不能放弃它。」\n\n[Root.Monarch.GetName]冷笑着走下宝座，从年轻人手中夺过圣像，高高举起，然后狠狠地摔在了地上。圣像的玻璃碎裂，碎片四溅，年轻人发出一声悲鸣，跪倒在地，试图捡起那些碎片。\n\n「你的帝国已经不存在了，」[Root.Monarch.GetName]居高临下地俯视着这个跪在地上哭泣的年轻人。"
 EDG_FDMEvents.125.a: "「让他在囚笼里好好想想，两千年帝国的覆灭是什么滋味。」"
 EDG_FDMEvents.126.title: "达赖喇嘛的沉默"
 EDG_FDMEvents.126.desc: "在所有被俘的君主中，达赖喇嘛是最安静的一个。\n\n他没有穿华丽的袍服，没有戴镶满宝石的帽子，只是一身简单的红色僧袍，赤着双脚，盘腿坐在大殿的地板上——不是跪，而是坐，仿佛他不是在等待审判，而是在寺院中冥想。\n\n他的面容平静得如同一潭死水，没有恐惧，没有愤怒，没有悲伤，只有某种超越世俗的宁静。当[Root.Monarch.GetName]走进大殿时，他甚至没有睁开眼睛。\n\n「站起来，」哈里发命令道。\n\n达赖喇嘛没有动。\n\n「我叫你站起来！」哈里发的声音提高了几分。\n\n达赖喇嘛缓缓睁开眼睛，那双深邃的眼眸中映照着[Root.Monarch.GetName]的身影。「我为什么要站起来？」他的声音轻柔但坚定，「在我的信仰中，静坐比站立更接近真理。」\n\n[Root.Monarch.GetName]冷笑着走到他面前，居高临下地俯视着这位来自雪域高原的僧人。「你的信仰？」他的声音中充满了轻蔑，「你的信仰没能保护你的国家，没能保护你的子民，甚至没能保护你自己。你跪在这里，而你的寺庙已经被我们的士兵占领，你的信徒已经被我们的军队驱散，你的雪山已经在法蒂玛的旗帜下臣服。」\n\n达赖喇嘛没有说话，被带走时，他的嘴唇微微动了动，似乎在念诵着什么——或许是祈祷，或许是咒语，又或许只是一声叹息。"
 EDG_FDMEvents.126.a: "刀剑面前，信仰不过是懦弱的借口"
 EDG_FDMEvents.127.title: "天子的陨落"
 EDG_FDMEvents.127.desc: "当中国皇帝被押解至开罗时，他带来了一样让所有人都震惊的东西——一封用龙纹黄纸书写的诏书。\n\n诏书上写着：「奉天承运，皇帝诏曰：朕以万乘之尊，屈身于异域之君，实乃天命使然。然朕虽为俘，不失天子之威。法蒂玛哈里发若以礼相待，朕愿与之约为兄弟之邦，共享太平。若以辱加之，朕宁死不屈。」\n\n[Root.Monarch.GetName]读完诏书，冷笑一声，将诏书撕成了碎片。\n\n「天子？」他居高临下地俯视着这位来自东方的皇帝，「你的天在哪里？你的子在哪里？你的帝国已经被我们的军队踏平，你的宫殿已经被我们的火焰焚烧，你的妃嫔和皇子已经成为我们的俘虏。你还敢在我面前提什么天子之威？」\n\n皇帝的脸色变得苍白，但他没有低头。「朕是天命所归，」他的声音颤抖但倔强，「朕可以被囚禁，但不能被羞辱。朕的血脉将永远传承下去，而你的帝国终将化为尘土。」\n\n[Root.Monarch.GetName]冷笑着走到皇帝面前，伸出手，从他手中夺过那枚玉玺——那是中国皇帝最后的尊严。他将玉玺高高举起，然后狠狠地摔在了地上。玉玺碎裂，碎片四溅，皇帝发出一声悲鸣，跪倒在地。\n\n「你的天命已经结束了，」[Root.Monarch.GetName]转身走向宝座，「从今天起，东方不再是世界的中心，开罗才是。而你，不过是又一个被法蒂玛踩在脚下的失败者。」\n\n皇帝跪在地上，紧紧握着那些破碎的玉玺碎片，泪水滴落在冰冷的石板上。他的帝国，他的尊严，他的天命，都在这一刻化为了乌有。"
 EDG_FDMEvents.127.a: "不过是又一个跪伏的尘埃"
 EDG_FDMEvents.128.title: "教宗的十字架"
 EDG_FDMEvents.128.desc: "罗马教宗被押解至开罗的消息，比任何一场战役的胜利都更让整个伊斯兰世界为之震动。\n\n当那位身着白色长袍、头戴三重冠的老人被带入大殿时，他的步伐已经不再平稳，面容已经不再安详。他的三重冠被摘下，他的白袍沾满了尘土，他的双手被铁链锁着，每走一步都会发出刺耳的金属声。\n\n教宗在哈里发面前站定，缓缓低下头，从脖子上取下那枚金质十字架——那是历代教宗传承了千年的圣物——将它握在手中，举到胸前。\n\n「我，罗马主教，」他的声音苍老而疲惫，「在此承认，法蒂玛的哈里发是这个时代最强大的统治者。」\n\n[Root.Monarch.GetName]没有回答，只是冷笑着走下宝座，从教宗手中夺过十字架，高高举起，然后狠狠地摔在了地上。十字架的金属碎裂，碎片四溅，教宗发出一声悲鸣，跪倒在地。\n\n「你的上帝没能保护你，」[Root.Monarch.GetName]居高临下地俯视着这位跪在地上哭泣的老人，「你的十字架没能拯救你，你的信仰没能阻止法蒂玛的军队踏平你的罗马。从今天起，基督教的世界已经结束了，伊斯兰的世界才刚刚开始。」"
 EDG_FDMEvents.128.a: "十字架已经碎裂，月牙将永远照耀这个世界"