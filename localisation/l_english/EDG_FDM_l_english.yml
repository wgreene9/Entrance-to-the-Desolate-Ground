 EDG_FDM_egyptian_in_name_only_disaster: "§T名不副实§!"
 EDG_FDM_egyptian_in_name_only_disaster_tt: "--------------\n「信士们皆为教胞，故你们应当调解你们教胞之间的纷争。你们应当敬畏真主，以便你们蒙主的怜恤。」——《古兰经》49:10\n\n当法蒂玛的旗帜再次飘扬在尼罗河畔，当苏莱曼王子年少时痴痴遥望的开罗城终于回到阿里后裔的手中时，这场复仇与回归似乎达到了历史的顶峰。\n\n但现实却远比史诗残酷。如今统治着埃及的，是一群习惯了马格里布海风与柏柏尔人生活方式的「外乡人」。百年的分离让两地的文化产生了深深的隔阂，埃及本土的阿拉伯人与前朝遗老们在心底里鄙夷这些带着北非口音、行事粗野的新贵族，认为他们不过是窃取了法蒂玛威名、借着十字军与战乱趁火打劫的马格里布强盗。\n\n尽管我们以哈里发自居，但文化上的不认同与离心力让整个统治体系形同虚设。税收受阻，法令难行，那些原本应该臣服于先知血脉的尼罗河子民正酝酿着将我们再次赶回西边沙漠的阴谋。"
 EDG_FDM_egyptian_in_name_only_disaster_can_end_tt: "恢复了对埃及的绝对统治"
 EDG_FDM_egyptian_in_name_only_disaster_ended_tt: "灾难§T名不副实§!已结束"
