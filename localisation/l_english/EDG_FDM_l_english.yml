 EDG_FDM_tear_of_iset_disaster: "§T伊西斯的眼泪§!"
 EDG_FDM_tear_of_iset_disaster_tt: "--------------\n「我以穷困和患难考验他们，以便他们谦逊。当我的命令降临的时候，他们不义，但他们不觉悟。」——《古兰经》7:94-95\n\n伊西斯是古埃及宗教信仰中的一位女神，对她的崇拜传遍了整个希腊-罗马世界。她被敬奉为理想的母亲和妻子、自然和魔法的守护神。人们相信，每年尼罗河洪水的泛滥，就是伊西斯哭泣欧西里斯所流下的悲伤泪水。因此，人们每年都要举行再现欧西里斯死亡和重生的仪式。\n\n但是，曾滋养了我们先祖、见证了法蒂玛最初辉煌的尼罗河，如今却违背了千百年来的自然规律。\n\n史无前例的大旱使得每年本该如期而至的泛滥化为泡影，干裂的河床像是一道道丑陋的伤疤撕裂了埃及的大地；而当罕见的暴雨降临时，它又化作狂暴的洪灾，冲毁了堤坝、村庄与大片的麦田。\n\n自然的伟力无情地摧毁了这片曾经充当东地中海粮仓的丰饶之地，农田荒芜，粮食绝收，可怕的饥饿与绝望在尼罗河谷蔓延。在埃及本土居民的眼中，这是真主对我们这些外来统治者的神罚。这条古老河流的「背叛」，不仅让帝国的农业和财政濒临崩溃，更将我们那本就岌岌可危的统治合法性推向了深渊。\n\n如果我们不能尽快调集资金修复水利、安抚灾民并度过这场自然浩劫，先祖夺回故土的宏愿将被掩埋在这片饥芜的泥沼之下。"
 EDG_FDM_tear_of_iset_disaster_can_start_tt: "§Y尼罗河§!爆发了§R严重的自然灾害§!"
 EDG_FDM_tear_of_iset_disaster_can_end_tt: "战胜了尼罗河的天灾并恢复了生产"
 EDG_FDM_tear_of_iset_disaster_ended_tt: "灾难§T伊西斯的眼泪§!已结束"


 EDG_FDM_plight_of_the_red_sea_disaster: "§T红海的困境§!"
 EDG_FDM_plight_of_the_red_sea_disaster_tt: "--------------\n「因为他们供奉古莱什人冬夏的旅行。故教他们崇拜这天房的主，他曾解除他们的饥荒，并使他们远离恐惧。」——《古兰经》106:1-4\n\n凭借着控制埃及与红海的绝佳地理优势，法蒂玛王朝如同扼住了欧亚大陆贸易的咽喉。来自印度的香料和东方的丝绸，无一例外都需要经过我们在苏伊士与亚历山大设立的海关。庞大的过境抽解与垄断利润充实了帝国的金库，让我们得以供养不可战胜的大军，并将开罗打造成世界的中心。\n\n然而，当那些葡萄牙与西班牙的探险家驾着帆船绕过好望角，历史的轨迹发生了致命的偏转。欧洲异教徒开辟的直达印度的新航路，对我们的经济体系造成了釜底抽薪般的打击。满载香料的商船不再驶入红海，而是直接驶向了里斯本的港口；亚历山大集市的喧嚣迅速退去，取而代之的是死寂的高大库房。海关收入的暴跌使得原本极度依赖贸易红利的帝国机器齿轮骤停。\n\n更为严峻的是，财政的枯竭让我们无法继续维持庞大的红海巡逻舰队，更无力安抚依靠贸易为生的沿岸阿拉伯部落。破产的商团心生怨恨，海盗与地方分裂势力趁机在红海与汉志沿岸死灰复燃。在这个大航海的时代，帝国正面临前所未有的经济窒息——如果我们不能将大炮架在印度洋的波涛之上打破异教徒的垄断，或是及时探寻出属于帝国自己的新财源，这曾经辉煌的经济大厦必将轰然倒塌。"
 EDG_FDM_plight_of_the_red_sea_disaster_can_end_tt: "以下条件全部满足：\n——我们的§Y贸易本埠§!位于一个§Y终端节点§!\n——我们在§Y贸易本埠§!拥有最高的§Y贸易竞争力§!\n——我们的§Y贸易本埠§!拥有全世界最高的§Y贸易价值§!\n（请注意：如果我们已经通过任务§Y亚历山大军港§!解锁§T军事管制§!机制，该灾难将更容易结束）"



#政府改革
 EDG_FDM_Fatima_caliph_reform: "法蒂玛哈里发国"
 EDG_FDM_Fatima_caliph_reform_desc: "909年，奥贝德拉伊斯兰教什叶派首领在突尼斯以法蒂玛和阿里的后裔自居，自称哈里发。由于法蒂玛王朝的哈里发合法性来自于阿里，因而法蒂玛哈里发国同什叶派紧紧捆绑于一处。\n\n法蒂玛王朝的统治基石建立在伊玛目作为先知后裔的神圣性之上。哈里发不仅是世俗的君主，更是什叶派伊斯玛仪教派的最高宗教领袖与精神指引者。在这种体制下，皇权与神权高度统一，国家的法律即是圣法，国家的疆域即是真理的堡垒。哈里发的每一道谕旨都被视为来自神圣源头的启示，这种绝对的信仰感召力赋予了国家极高的向心力。然而，这一制度也要求统治者必须时刻保持其神圣形象，任何在世俗事务上的失败都可能被解读为恩典的丧失。在此体制下，国家以宗教为纲，致力于在动荡的伊斯兰世界中竖起一面纯净的什叶派旗帜。"
 sanction_holy_war_claims_tt: "获得所有相邻§Y区域§!的§Y永久性宣称§!，其中每个已经是我们宣称的省份都会给予§Y1§!点§Y陆军传统§!。"
 EDG_FDM_provincial_supervision_reform: "行省监察制"
 EDG_FDM_provincial_supervision_reform_desc: "法蒂玛王朝长期警惕以地换忠的伊克塔分封逻辑，转而依托迪万体系加强对行省的财政与军政监督。中央通过任命可轮调的行省官员、建立常态化审计与税册核对制度，削弱地方军事贵族对土地与税源的私人控制。行省军费以国库拨付为主，军政权责被拆分并纳入书面化流程，从而在维持边地动员能力的同时，避免地方割据与家族化统治。这一改革的核心目标，是以官僚监督和财政穿透力取代封建分封，确保哈里发政权对地方的持续掌控。"
 EDG_FDM_wazir_centered_bureaucracy_reform: "维齐尔专政"
 EDG_FDM_wazir_centered_bureaucracy_reform_desc: "当哈里发专注于精神沉思或难以亲政时，大维齐尔（Wazir）成为了帝国实际的操盘手。法蒂玛王朝建立了一套高度专业化的官僚体系，大维齐尔作为「双重统治者」，统筹民政与军事，通过严密的奏章制度与层级汇报，将复杂的帝国事务梳理得井井有条。这种制度大幅提升了行政效率，减少了朝堂决策的迟滞，也让一批出身寒微但才华横溢的文官阶层崛起。大维齐尔的权力达到了顶峰，他们甚至可以废立哈里发或进行重大政策转向。这是一个属于精英官僚的时代，法治的雏形在文官的笔下逐渐取代了贵族的剑锋。"
 EDG_FDM_multicultural_guard_reform: "职业军体系"
 EDG_FDM_multicultural_guard_reform_desc: "为了摆脱对特定贵族阶级的依赖，法蒂玛王朝建立了一支由不同族裔组成的禁卫军：突厥骑兵提供机动性，北非柏柏尔步兵提供忠诚，而苏丹步兵则以悍不畏死著称。这种「以夷制夷」的多元结构在本质上是一种高级的政治平衡术。各军团之间存在微妙的竞争关系，这种制衡使得任何单一势力都无法在首都发动政变。虽然这支军队的维护成本极高，且在族裔冲突中时常引发暴乱，但它保证了哈里发作为最高裁判者的地位。这是一支效忠于雇佣薪饷与哈里发权威的战争机器，是帝国在群狼环伺的乱世中立足的最后底牌。"
 EDG_FDM_diwan_centralization_reform: "迪万中央集权"
 EDG_FDM_diwan_centralization_reform_desc: "迪万（Diwan）不仅是中央财务部门，更是帝国中枢神经系统。通过全面整顿税收、人口普查与货币管理，法蒂玛政府实现了对国民财富的精准掌控。改革后的迪万取消了中间层的截留，通过严密的审计与惩腐机制，确保每一分税收都流向国库。这一过程伴随着权力的收缩，地方领主失去了对税收的最终决定权，帝国财政进入了量化管理的时代。随着黄金与丝绸在开罗汇聚，通过高明的财务运作，哈里发不仅供养了强大的军队，还资助了庞大的科学与文化项目，使法蒂玛统治下的埃及成为地中海世界的经济重心。"
 EDG_FDM_dawah_intellectualism_reform: "伊斯兰学术传统"
 EDG_FDM_dawah_intellectualism_reform_desc: "法蒂玛的统治不仅靠军队，更靠传播理念的达瓦（Dawah）系统。这一改革将宗教传教、科学研究与高等教育合而为一。国家设立了名为「智慧宫」的机构，广纳天文学家、数学家与法学家，将伊斯玛仪教派的思辨哲学融入国家教育中。这种开明的学术氛围不仅促进了生产技术的进步，更增强了帝国对知识分子的吸引力。达瓦组织深入基层，将异教徒聚居区吸纳进帝国的文明秩序中。通过这种方式，法蒂玛王朝构建了一种软实力霸权，使得其文化影响力远超其军事边界，实现了「以智御国」的统治理想。"
 EDG_FDM_majlis_al_shura_reform: "舒拉会议"
 EDG_FDM_majlis_al_shura_reform_desc: "当帝国的治理日益复杂，单靠宫廷密令已无法维系统治秩序。舒拉会议（Majlis al-Shura）由宗教学者、地方显贵与资深官僚共同组成，承担政策审议与利益协调之责。它为哈里发提供了一个制度化的咨询平台，使重大决策不再完全依赖个人意志，而是在多方辩论后形成较稳健的共识。通过将精英纳入政治协商，朝廷得以缓和地方离心倾向，并增强改革的可执行性。尽管这种机制可能降低决策速度，却显著提升了统治合法性与社会稳定。"
 EDG_FDM_mediterranean_hub_reform: "地中海枢纽"
 EDG_FDM_mediterranean_hub_reform_desc: "法蒂玛王朝将自身定位为连接马格里布、黎凡特与红海贸易圈的海上中介。通过整顿港口税制、扩建船坞仓储并强化海关监管，国家把开罗与沿海商埠编织成一张高效的商业网络。商人、金银与香料在此汇聚，贸易航线的延展反过来推动了外交与海军建设。这一改革不仅提升了国家的关税收益与市场影响力，也使帝国能够在地中海力量博弈中掌握更大话语权，逐步把经济优势转化为战略优势。"
 EDG_FDM_ismaili_rationalism_reform: "伊斯玛仪理性论"
 EDG_FDM_ismaili_rationalism_reform_desc: "在教义解释与国家治理的交汇处，伊斯玛仪理性论强调秩序、法度与理性推演的统一。法蒂玛宫廷借助这一路线，强化中央对教法、司法与行政的解释权，将复杂多变的政治现实纳入可被论证与执行的制度框架之中。它压制了地方宗教权威的离散声音，也为国家动员提供了更明确的意识形态基础。随着制度纪律不断深化，帝国在面对内乱与外敌时展现出更强的整体韧性，以更高的政治集中度换取长期稳定。"
 EDG_FDM_constitutional_caliphate_reform: "宪政哈里发"
 EDG_FDM_constitutional_caliphate_reform_desc: "当帝国迈入新的政治阶段，哈里发权威开始与成文制度并行。宪政哈里发体制并非削弱宗教核心，而是通过明确官署权限、政策程序与监督责任，避免权力在危机中陷入无序竞争。文官系统得以在更清晰的规则下运转，重大国策也能够获得跨派系的持续支持。与此同时，国家通过制度化协调机制整合不同利益集团，使政务执行更具连续性。这种改革让传统神圣权威与近代国家治理逻辑实现了有限但关键的融合。"
 EDG_FDM_dualist_judicial_executive_reform: "司法行政二元制"
 EDG_FDM_dualist_judicial_executive_reform_desc: "为避免权力过度集中导致的治理失衡，法蒂玛王朝将司法裁断与行政执行明确区分：前者由专业法官体系维持法理权威，后者由官僚机构保障政策落实。二元结构使国家在扩张与整合并行的阶段，既能维持法治稳定，又能保持行政效率。地方争端不再轻易升级为政治危机，朝廷也可通过制度渠道化解官僚与贵族的利益冲突。此举强化了国家对动荡局势的承压能力，让帝国机器在高负荷运转下仍具可控性与韧性。"

