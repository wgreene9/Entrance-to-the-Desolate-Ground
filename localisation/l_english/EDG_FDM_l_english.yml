#理念
 EDG_caliph_ideas: "哈里发理念"
 EDG_caliph_ideas_1: "伊玛目的神圣统治"
 EDG_sunni_Caliph_decree_cost_effect_tt_discounted: "我们将花费§M10§!点§Y逊尼派哈里发权威§!\n伊玛目的神圣统治: §G-50.0%§!"
 EDG_shiite_Caliph_decree_cost_effect_tt_discounted: "我们将花费§M10§!点§Y什叶派哈里发权威§!\n伊玛目的神圣统治: §G-50.0%§!"
 EDG_caliph_ideas_2: "教化信徒"
 EDG_caliph_ideas_3: "伊斯兰贸易体系"
 EDG_caliph_ideas_4: "学术中心"
 EDG_caliph_ideas_5: "天课"
 EDG_caliph_ideas_6: "虔信皈依"
 EDG_caliph_ideas_7: "阶层平衡"
 EDG_caliph_ideas_bonus: "哈里发理念完成"
 EDG_caliph_ideas_1_desc: "哈里发不仅是世俗的君主，更是先知血脉的延续与信众精神的灯塔。凭借这份神圣的血统与权威，哈里发的谕令能够在辽阔的疆域中维持秩序与安定。百姓敬畏的并非刀剑，而是那位端坐于宫殿深处、代行先知意志的至高伊玛目。在这种神圣光环的笼罩下，叛乱与纷争自然消弭于无形。\n\n哈里发诏令花费: §G-50.0%§!"
 EDG_caliph_ideas_2_desc: "信仰的传播不仅依靠剑锋，更依赖于耐心的教化与引导。我们在各地设立宣教站与诵经堂，派遣饱学之士深入村镇，用温和的方式向迷途者阐释伊斯玛仪派的真谛。每一座新建的清真寺都是文明的灯塔，每一位新皈依的信徒都是真主恩典的见证。信仰之树需要灌溉，而非劈砍。"
 EDG_caliph_ideas_3_desc: "从印度洋的香料到马里的黄金，从波斯的丝绸到欧洲的白银，穆斯林商人的驼队与帆船编织成一张横跨旧大陆的贸易网络。哈里发国作为这张网络的守护者与受益者，通过统一的度量衡、可靠的驿站体系与受保护的商路，让财富在帝国的血脉中平稳流淌。商业的繁荣便是国运的昌盛。"
 EDG_caliph_ideas_4_desc: "当欧洲尚在蒙昧中摸索时，我们的书院里已经汇聚了来自各地的天文学家、数学家与医学家。哈里发慷慨资助学术研究，将智慧宫的传统延续并发扬光大。新思想与新技术在正信的框架内自由传播，帝国因此始终站在文明进步的前沿。知识是真主赐予人类最宝贵的礼物，而我们有幸成为它的守护者。"
 EDG_caliph_ideas_5_desc: "穆斯林认为天课是真主真主对那些丰衣足食的穆民的主命（义务），指令他们把其每年盈余财富的一部分用作帮助贫民和有需要的人。真主说：「你们应当谨守拜功，完纳天课，并以善债借给真主。你们为自己做什么善事，都将在真主那里得到更好更大的报酬。你们应当向真主求饶，真主是至赦的，是至慈的。」（《古兰经》73：20）真主说：「正义是信真主、信末日、信天神、信天经、信先知，并将所爱的财产施济亲戚、孤儿、贫民、旅客、乞丐和赎取奴隶，并谨守拜功、完纳天课、履行约言、忍受贫困、患难和战争。这等人，确是忠贞的；这等人，确是敬畏的。」（《古兰经》2:177）"
 EDG_caliph_ideas_6_desc: "在帝国的边疆与新征服的土地上，传教士们以耐心和善意劝导异教徒认识真理。他们不以暴力胁迫，而是通过辩论、著述与身教来展示信仰的力量。每一个灵魂的皈依都被视为一次珍贵的胜利，因为真正的信仰发自内心，而非迫于刀剑。这种温和而坚定的传教方式，使帝国的信仰根基日益深厚。"
 EDG_caliph_ideas_7_desc: "一个庞大帝国的稳定，取决于能否平衡各方利益。哈里发作为最高仲裁者，审慎地调节宗教领袖、军事贵族、商人与平民之间的关系。既不让任何一方独大，也不让任何一方被彻底压制。舒拉会议为各阶层提供了表达诉求的渠道，而哈里发的公正裁决则是维系这一微妙平衡的关键。和谐共处方能长久。"
 EDG_FDM_enhanced_ideas: "§T浴火重生的法蒂玛理念§!"
 EDG_FDM_enhanced_ideas_start: "§T法蒂玛传统§!"
 EDG_FDM_enhanced_ideas_bonus: "§T法蒂玛野心§!"
 EDG_FDM_enhanced_ideas_1: "§T重返开罗§!"
 EDG_FDM_enhanced_ideas_2: "§T改组马穆鲁克§!"
 EDG_FDM_enhanced_ideas_3: "§T教法学院体系§!"
 EDG_FDM_enhanced_ideas_4: "§T阿里的后裔§!"
 EDG_FDM_enhanced_ideas_5: "§T哈里发治下的和平§!"
 EDG_FDM_enhanced_ideas_6: "§T法蒂玛职业军体系§!"
 EDG_FDM_enhanced_ideas_7: "§T永无止境的吉哈德§!"
 EDG_FDM_enhanced_ideas_1_desc: "自幼被软禁在开罗小院的岁月，在先祖苏莱曼心中刻下了不可磨灭的烙印，更磨砺出冷酷而坚韧的精神。埃及本就是我们所应统治的土地，那些谋害法蒂玛王族成员的阿尤布篡权者必将付出代价。重返尼罗河畔、夺回那片富饶的龙兴之地，是我们每一个法蒂玛子孙不可推卸的神圣宿命。"
 EDG_FDM_enhanced_ideas_2_desc: "先祖在建立第二王朝时，将埃及的统治方式带回了马格里布。为了在桀骜不驯的柏柏尔部落和涌入卡比利亚的各路难民中建立绝对的权威，我们引进了东方的军事传统，招募并培养忠诚的马穆鲁克奴隶卫队。这些精锐的奴隶战士将成为维护王朝统治的中坚力量。"
 EDG_FDM_enhanced_ideas_3_desc: "我们不仅用刀剑征服了北非，更用智慧和信仰教化这片土地。通过建立完善的教法学院体系，柏柏尔人不仅放下了屠刀学会了读书写字与农耕，更为国家培养了大量精通伊斯玛仪派教义的官僚。统一的信仰和高效的行政网络，是王朝长治久安的基石。"
 EDG_FDM_enhanced_ideas_4_desc: "苏莱曼先祖是先知女儿法蒂玛与阿里结合的高贵血脉，是至高无上的赛义德。当年我们向世人敞开城门时只有一个要求——坚信只有先知的后代才拥有天然的统治权。这种神圣的血统是我们政权合法性的源泉，更如同一面无形的旗帜，让全天下的穆斯林甘愿为我们效死。"
 EDG_FDM_enhanced_ideas_5_desc: "经过几十年的开垦与治理，我们为这片曾经秩序崩溃的土地带来了久违的繁荣。在湿润的海岸线上，大片的小麦田随风摇曳，北非奇迹般地恢复了罗马帝国时期‘粮仓’的盛景。在哈里发的慈悲统治下，贸易繁荣，国库充盈，马格里布迎来了真正的和平与复兴。"
 EDG_FDM_enhanced_ideas_6_desc: "我们的军队来源复杂，既有追随先祖的狂热信徒，也有因突尼西亚十字军战乱流离失所的难民。为了发挥这支庞大军队的最大战斗力，我们重组了古老的法蒂玛九军体系。通过将不同族裔和背景的士兵整编为各司其职、互补长短的军团，我们打造了一支战无不胜的复合型大军。"
 EDG_FDM_enhanced_ideas_7_desc: "面对盘踞在突尼西亚的十字军王国，以及海上络绎不绝的异教徒商船，我们的圣战永不止息。熟谙航海的柏柏尔人驾驭着舰队巡航于巴巴里海岸，洗劫西方的教堂与庄园。战利品和白人奴隶被运往马里帝国的金矿换取无尽的黄金，这滚滚财源将支撑我们向异教徒发动永无止境的吉哈德！"


#政策
 EDG_caliph_policy_1: "行政改革"
 EDG_caliph_policy_1_desc: "哈里发将古老的迪万体系与现代行政理念相结合，通过细化行省管辖范围、明确官员权责与优化公文流转，使帝国的治理能力迈上新的台阶。中央政令得以更顺畅地传达到每一个边远省份，地方事务也能更及时地反馈至宫廷。"
 EDG_caliph_policy_2: "信仰动员"
 EDG_caliph_policy_2_desc: "当帝国面临外敌威胁时，哈里发以宗教领袖的身份号召信众保家卫国。清真寺的宣礼声传遍城乡，虔诚的信徒们响应号召拿起武器。信仰的力量将散落的个体凝聚为捍卫家园的钢铁洪流。"
 EDG_caliph_policy_3: "宽容敕令"
 EDG_caliph_policy_3_desc: "哈里发颁布敕令，保障帝国内部不同信仰群体的基本权利。基督徒与犹太人在缴纳人头税后可自由礼拜，异端教派在不公开挑战正统的前提下亦受法律保护。这种务实的宽容政策减少了内部摩擦，使帝国能够将更多精力用于治理与发展。"
 EDG_caliph_policy_4: "公共营造"
 EDG_caliph_policy_4_desc: "哈里发拨出专款用于修缮道路、桥梁与灌溉渠，并以优惠条件鼓励地方兴建集市与旅店。帝国的基础设施在统一规划下不断完善，商旅往来更加便捷，百姓生活也因公共工程的改善而日渐安定。"
 EDG_caliph_policy_5: "宫廷耳目"
 EDG_caliph_policy_5_desc: "哈里发建立了遍布帝国的情报网络，密探潜伏于集市、清真寺与外国宫廷之中。他们既监视国内的不稳定因素，也刺探邻国的军事动向。在信息的博弈中，掌握先机者方能立于不败之地。"
 EDG_caliph_policy_6: "外交斡旋"
 EDG_caliph_policy_6_desc: "哈里发凭借其在伊斯兰世界的崇高威望，派遣使节穿梭于各国宫廷之间。通过调解争端、缔结盟约与施加外交压力，帝国在不动干戈的情况下拓展了影响力，战争的门槛也因此降低。"
 EDG_caliph_policy_7: "商路保护"
 EDG_caliph_policy_7_desc: "哈里发下令在帝国境内的主要商路上设置驿站与卫所，保护商队免受匪盗侵扰。统一的度量衡与税制降低了交易成本，诚信的商业环境吸引了更多远方的商人前来贸易，帝国的商品经济因此更加繁荣。"
 EDG_caliph_policy_8: "合法扩张"
 EDG_caliph_policy_8_desc: "哈里发利用其宗教权威，为帝国的领土扩张提供教法上的合法性依据。无论是光复故土还是讨伐叛逆，每一场战争都被赋予了正当的理由，减少了国际社会的非议与干预。"
 EDG_caliph_policy_9: "骑兵采邑"
 EDG_caliph_policy_9_desc: "哈里发将部分土地以采邑形式分封给骑兵贵族，换取他们随时应召出战的承诺。这些世袭的骑手构成了帝国军队的精锐突击力量，他们的战马与弯刀是哈里发权威的有力保障。"
 EDG_caliph_policy_10: "征兵清册"
 EDG_caliph_policy_10_desc: "哈里发下令在正信省份编制详细的征兵清册，登记每一户的适龄男丁。一旦战事爆发，帝国可以迅速而有序地动员大量兵员，确保军队在数量上始终占据优势。"
 EDG_caliph_policy_11: "精兵简政"
 EDG_caliph_policy_11_desc: "哈里发在维持军队规模的同时，着力提升部队的训练水平与装备质量。精锐的禁卫军接受严格的操练，配备了优良的铠甲与火器。数量与质量的兼顾，使帝国的军队在战场上既能承受伤亡，又能打出致命的一击。"
 EDG_caliph_policy_12: "雇佣契约"
 EDG_caliph_policy_12_desc: "哈里发与经验丰富的雇佣兵队长签订契约，以优厚的薪饷换取他们麾下部队的绝对服从。这些职业战士在哈里发的旗帜下作战，纪律严明、作战凶悍，为帝国提供了灵活而高效的军事力量。"
 EDG_caliph_policy_13: "奥斯曼哈里发"
 EDG_caliph_policy_13_desc: "哈里发对宫廷中的奢靡之风与怠政之弊进行了严厉的整肃。冗官被裁撤，懈怠者受到惩戒，勤勉者得到擢升。帝国的行政效率在铁腕治理下显著提升，曾经蔓延的腐化习气被有效遏制。"

