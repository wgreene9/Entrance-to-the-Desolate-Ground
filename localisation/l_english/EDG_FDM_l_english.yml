#事件
 EDG_FDMEvents.0.title: "于黄沙之中"
 EDG_FDMEvents.0.desc: "苏莱曼·伊本·达乌德，法蒂玛与阿里的后裔，至高的赛义德，法蒂玛家族最后的血脉。1185年，他的母亲被秘密带出开罗，他得以在自由中降生；然而秘密不胫而走，他旋即被阿尤布王朝软禁于开罗一座戒备森严的小院，如同其父一般，沦为库尔德人抬升正统性的笼中之鸟。囚禁的岁月磨砺了他的心志，他常伏在二楼眺望开罗，深信这本就是他先祖应当统治的土地。\n\n公元1205年八月的拜拉特之夜，一伙土匪趁居民赴清真寺祈祷之机袭城劫掠，全城火光与刀影交织。苏莱曼在数名忠仆掩护下混入乱民之中逃出生天，率一支马队一路西行，绕过被十字军占据的突尼斯，直抵先祖兴业之地——马格里布。闻讯大怒的阿尤布苏丹卡米勒·穆罕默德秘密处决了法蒂玛王族全部成员，官方文书中则宣称他们死于天花。\n\n彼时穆瓦希德王朝深陷丹吉尔之乱，东疆失控，卡比利亚与特莱姆森各自为政。苏莱曼树起旌旗，久受压制的伊斯玛仪派迎来了他们的伊玛目化身。他抵达马格里布时仅随八骑，兵临卡比利亚城下时身后已聚数万追随者——凭借的与其说是血脉，不如说是个人魅力。\n\n卡比利亚陷落后，马格里布诸城望风而降。盘踞突尼斯的十字军因埃及惨败而放弃东征，转而将突尼西亚经营为圣战者的王国，用刀剑将大批穆斯林逐向卡比利亚。苏莱曼开城纳之，只要求一条：唯先知的后代拥有天然的统治权。\n\n他所开创的政权即后世所称的后法蒂玛王朝。其后两个世纪，子孙传承有序，将埃及的治理方式带回这片土地，在湿润的海岸开辟麦田，不过五十年便使北非重返罗马时代的粮仓之位。卡比利亚则成为与马里帝国进行奴隶—黄金贸易的集散地；柏柏尔人虽习读书与耕作，在厚利面前仍不惮再操劫掠，西方商船远避其海岸，西欧教堂庄园遭洗劫、金发基督徒被缚上骆驼送往马里金矿的记载屡见不鲜。坊间传言塔里克山以西另有一条通往黄金之国的航路，1444年春，法蒂玛苏丹已下令组建舰队探寻这条通向无尽财富的道路——他们或许会走得更远。此外还有一条更为现实的道路：趁埃及陷入混乱，像祖先那样夺回那片富饶之地。"
 EDG_FDMEvents.0.a: "真主会指引我们走向何方"
 EDG_FDMEvents.0.a_tt: "「你们中在真主看来最尊贵者，是你们中最敬畏者。」\n——《古兰经》49:13\n\n游玩提醒：\n\n1.@FDM§Y法蒂玛§!需要您对游戏有一定的基础理解，不建议游戏时长低于§Y1000§!小时的玩家游玩该国家，也不建议游戏时长低于§Y2000§!小时的玩家开启§Y极难§!模式，更不建议开启§Y神话征服者§!难度。\n\n2.@FDM§Y法蒂玛§!的大部分任务树都要求省份由§Y自己§!持有，不建议在游玩过程中通过§Y释放§!或§Y条约§!来拥有附庸。\n\n3.@FDM§Y法蒂玛§!与§Y什叶派§!宗教和§Y伊斯玛仪派§!教派绑定，§R请不要试图以任何方式转至其他宗教§!，这可能会严重破坏你的游戏。\n\n4.在击败@CDC§Y突尼西亚§!和@KTP§Y圣殿骑士团§!之后，灾难§T重生之路§!将会开启，届时你将获得§T大量战争加成§!以帮助你夺回@FDM§Y法蒂玛§!王朝故土，但同时也会获得大量§R侵略扩张§!，请善用任务树给予的机制控制好包围网。\n\n5.一旦§T重生之路§!以「§R失败§!」告终，你将会进入惩罚性灾难§R绝望之剑§!，请尽全力避免此事发生。除§R绝望之剑§!外，所有灾难均为§T剧情性灾难§!，你不需要阻止这些灾难发生。\n\n6.如果回应@SIC§Y西西里§!的§T请求§!，我们也许能得到意料之外的§G帮助§!...\n\n7.灾难§T名不副实§!需要拥有所有§Y马格里布§!文化组的省份，包括位于大西洋的未殖民省份。这些省份可以通过任务「§Y抵达博哈多尔角§!」获得。\n\n8.灾难§T伊西斯的眼泪§!会给予埃及地区的大量§R负面修正§!，你可以提前修建§Y清真寺§!和§Y工坊§!来加快灾难结束速度，但也会导致不能享受到一些§G正面修正§!。\n\n9.灾难§T红海的困境§!要求你垄断一个终端节点，这在你完成任务「§Y亚历山大军港§!」并解锁§T军事管制§!机制后变得非常轻松。另外，建议尽早修建§Y苏伊士运河§!。\n\n10.§R重要§!：请不要开启自动化mod！该mod已明确与法蒂玛产生冲突，开启后造成的bug不在维护范围内！"
 EDG_FDMEvents.1.title: "基督徒的命运"
 EDG_FDMEvents.1.desc: "突尼斯的城门终于在我们的攻势下轰然倒塌。突尼西亚十字军的旗帜被践踏在泥泞中，圣殿骑士团残存的白袍骑士或死或俘，那些自诩为「圣战者」的法兰克贵族再也无法在这片先祖的土地上颐指气使。\n\n然而，当我们的铁骑踏入突尼斯、杰尔巴和的黎波里塔尼亚的街巷时，迎接我们的并非夹道欢呼的穆斯林同胞，而是一座座高耸的教堂尖塔、操着普罗旺斯口音的拉丁裔市民，以及数以万计在十字军统治下改宗或迁入的基督徒定居者。经过两个世纪的经营，这里早已不是当年伊弗里基叶那片纯粹的什叶派乐土——圣礼拜堂的钟声回荡在迦太基的废墟之上，法兰克商人的行会把持着港口的贸易。\n\n朝堂之上，激进的伊斯玛仪派乌理玛高声疾呼：「这些异教徒的血脉是十字军留在先祖土地上的脓疮，唯有火与剑才能将其涤荡！」而务实的迪万官员则忧心忡忡地指出，若强行改宗，港口贸易将瞬间瘫痪，沿海地区将陷入旷日持久的叛乱。"
 EDG_FDMEvents.1.a: "以圣战者之血洗净先祖的土地！"
 EDG_FDMEvents.1.b: "真主的仆人宽宥迷途的羔羊。"
 EDG_FDMEvents.2.title: "摩洛哥问题"
 EDG_FDMEvents.2.desc: "马林王朝的最后一位苏丹已在丹吉尔的血战中殒命，非斯古老的铜门向我们的大军敞开。那条蜿蜒于阿特拉斯山脉与大西洋之间的狭长走廊，那片孕育了摩洛哥骑手与柏柏尔学者的古老土地，如今正式归于法蒂玛的旌旗之下。\n\n然而，非斯从来就不是什叶派的土壤。这里是马立克学派的堡垒，是卡拉维因清真寺的所在地，是整个西马格里布逊尼派学术的心脏。城中的法吉赫们公开宣称我们是「篡夺先知之名的异端」，山区的柏柏尔部落领袖则在祷告中诅咒我们的哈里发。这片土地上的每一位伊玛目、每一位部落长老、每一位市场商人，都以世代传承的逊尼派信仰为荣。\n\n要将这片倔强的土地真正纳入帝国，仅凭征服的刀锋是远远不够的。我们必须决定——究竟是以伊玛目的权威一劳永逸地终结这场教派之争，还是以哈里发的宽容换取这片新省的稳定与税收。"
 EDG_FDMEvents.2.a: "清洗非斯的异端，让卡拉维因升起什叶派的旗帜！"
 EDG_FDMEvents.2.b: "摩洛哥的传统值得被尊重。"
 EDG_FDMEvents.3.title: "穆瓦希德的遗产"
 EDG_FDMEvents.3.desc: "马拉喀什城头的绿旗终于被我们亲手斩落。昔日那个从阿特拉斯山脉崛起、一度横扫整个西地中海、将安达卢斯基督徒打得节节败退的穆瓦希德王朝，终究在内讧与衰落中迎来了它的末日。我们的军队踏过了伊本·图马尔特陵墓前的广场，接管了这个曾经与先祖并立于北非的庞大遗产。\n\n然而，这份遗产是一柄双刃剑。穆瓦希德曾以「一神论者」自居，以极端的教法正统主义著称，他们曾残酷地迫害过什叶派、犹太人乃至一切他们认为「不够纯粹」的穆斯林。如今我们站在他们的废墟之上，那些曾被其供奉的逊尼派法官、那些被灌输了数代反什叶思想的部落战士、那些在马拉喀什书院中成长起来的教法学者，全都在阴郁地注视着我们的一举一动。\n\n宫廷中有人主张以牙还牙，用穆瓦希德当年对待我们先祖的方式回敬他们的继承者；也有人认为，正是穆瓦希德的偏执毁灭了他们自己，我们不应重蹈覆辙。"
 EDG_FDMEvents.3.a: "以伊本·图马尔特的火焰回敬他的信徒！"
 EDG_FDMEvents.3.b: "让我们以宽容证明什叶派的正道。"
 EDG_FDMEvents.4.title: "处理柏柏尔人"
 EDG_FDMEvents.4.desc: "从阿特拉斯的雪峰到撒哈拉的沙海，从里夫的峭壁到卡比利亚的橄榄林，柏柏尔人——这片土地上最古老的主人——构成了帝国人口的绝对主体。他们骑着骆驼与阿拉伯战马，讲着塔马齐格特语，在星空下遵循着比伊斯兰更古老的部落律法。\n\n先祖苏莱曼当年在卡比利亚登陆时，正是这些柏柏尔部落举起了法蒂玛的大旗。然而两个世纪过去了，他们的忠诚始终游移不定。高山中的桑哈贾部落依然秘密奉行着他们的萨满传统；马斯穆达人虽皈依伊斯兰，却固守逊尼派马立克学派；泽纳塔游牧民则在草原上随风而动，今日效忠哈里发，明日便可能追随任何一位许以厚利的埃米尔。\n\n宫廷中的什叶派狂热者愤怒地指出：「这些山民名为穆斯林，实为异教徒！必须让他们在天平上做出选择——要么成为真正的伊斯玛仪派信徒，要么就作为叛教者被处置！」而老成持重的维齐尔则提醒我们，柏柏尔人是帝国军队的脊梁，若逼反他们，连马格里布本土都将化为焦土。"
 EDG_FDMEvents.4.a: "在天平面前，柏柏尔人必须做出抉择！"
 EDG_FDMEvents.4.b: "柏柏尔人是法蒂玛的忠诚之盾。"
 EDG_FDMEvents.5.title: "征服费赞"
 EDG_FDMEvents.5.desc: "的黎波里以南，横亘着一片令欧洲制图师为之战栗的死亡之海——撒哈拉。而在这片无垠金沙的腹地深处，却镶嵌着一串翠绿的明珠：费赞。穆尔祖克、加特、加达梅斯——这些绿洲城市如同沙海中的灯塔，自古以来便是跨撒哈拉贸易的命脉节点，西非马里帝国的黄金、盐块、象牙与奴隶，皆经此地转运至地中海。\n\n如今，我们的骆驼骑兵与柏柏尔向导历经数月的艰苦跋涉，终于将法蒂玛的月牙旗插上了穆尔祖克的城楼。然而征服只是开始——费赞的居民由图阿雷格部落、图布族与阿拉伯商人混杂而成，他们中的许多人信奉着与正统迥异的、混合了非洲传统的苏菲派神秘主义，甚至有部落依然在偏远的绿洲中供奉着前伊斯兰时代的古神。\n\n这片绿洲的战略价值无与伦比——它是我们打通与马里帝国黄金贸易的最后一环。但若以铁腕强推什叶派正统，那些熟悉沙漠每一粒砂砾的向导与商队便会在一夜之间消失；若放任其宗教混乱，则帝国的神圣权威将在沙海中被风化殆尽。"
 EDG_FDMEvents.5.a: "让伊斯玛仪派的光辉照亮撒哈拉的每一片绿洲！"
 EDG_FDMEvents.5.b: "沙漠的商路比清真寺的尖塔更重要。"
 EDG_FDMEvents.6.title: "火上浇油"
 EDG_FDMEvents.6.desc: "几艘悬挂着陌生旗帜的桨帆船在夜色掩护下停靠于我们的港口。\n\n当海关官员登船检查时，他们出示了来自法蒂玛哈里发[From.Monarch.GetName]亲自签署的通行文书，并自称为「真主仆人的使节」。\n\n这群从马格里布远道而来的客人并未携带太多寻常货物，他们的船舱里满载着白银、丝绸、来自撒哈拉以南的黄金，以及——更为致命的——一份份用阿拉伯文与拉丁文双语誊抄的密信。这些密信被分别送往伊比利亚各个宫廷的角落：递到阿斯图里亚斯，递到巴达霍斯，递到马德里，递到里斯本。\n\n那位坐在卡比利亚宫殿中的什叶派哈里发似乎深谙一个古老的道理——比利牛斯山以南的基督徒与逊尼派越是彼此撕咬，马格里布的海岸就越是安全。他向所有怀抱不满之人许诺白银与火药，向所有觊觎邻国土地的领主提供雇佣兵的名册。法蒂玛的密使如同投入干柴堆的火星，在伊比利亚这座本就矛盾重重的火药桶上，添了一把足以引燃整个半岛的烈焰。"
 EDG_FDMEvents.6.a: "法蒂玛人的诡计昭然若揭"
 EDG_FDMEvents.7.title: "落井下石"
 EDG_FDMEvents.7.desc: "灾难性的消息一封接一封地送进了萨哈达的宫殿。\n\n在帝国最为脆弱的时刻，远在马格里布的法蒂玛哈里发派出了使节。他们带来的不是慰问，而是冰冷的最后通牒。法蒂玛人援引两个世纪前阿尤布王朝秘密屠杀法蒂玛王族的旧账，宣称萨哈达作为埃及当下的「篡位者」必须为这笔血债付出代价。与此同时，从突尼斯到亚历山大的整条海岸线上，法蒂玛的舰队正在集结。\n\n[From.Monarch.GetName]遥遥凝视开罗的目光，如今正化作千万柄出鞘的弯刀，向尼罗河汹涌而来。我们的国库早已空虚，我们的军队早已疲惫，我们甚至无法确定身边的埃米尔哪一个还值得信任。"
 EDG_FDMEvents.7.a: "愿真主怜悯萨哈达的子民"
 EDG_FDMEvents.8.title: "重返开罗"
 EDG_FDMEvents.8.desc: "两个多世纪前，年少的苏莱曼王子曾伏在开罗一座戒备森严的小院二楼，隔着层层宫墙遥望这座被阿尤布篡权者占据的城池。他坚信这本就是法蒂玛先祖应当统治的土地；他也不曾想到，那一眼遥望，竟在他的子孙心中化作了长达二百余年的执念。\n\n如今，当法蒂玛的旗帜重新飘扬在萨拉丁城堡之上，当艾资哈尔清真寺的宣礼塔再次为伊斯玛仪派的伊玛目诵出祷词，当尼罗河的涛声与哈里发凯旋的号角在开罗城头交织之时——先祖苏莱曼那份压抑了二百年的凝望，终于在他血脉后裔的手中化为了现实。\n\n开罗——这座由先祖穆仪兹亲手奠基、曾见证法蒂玛王朝最辉煌岁月的「胜利之城」，终于重归阿里后裔的怀抱。我们下令将帝国的首都从卡比利亚迁回这座千年古都，同时保留卡比利亚作为帝国的陪都与地中海门户。尼罗河的赠礼将再次滋养这片土地，而开罗的集市、船坞与书院，也将在法蒂玛的统治下迎来第二次黄金时代。\n\n这不仅是一次首都的迁移，更是一场跨越两百年、跨越整个马格里布的伟大归乡。先祖们在黄沙中播下的种子，终于在尼罗河畔结出了最丰美的果实。"
 EDG_FDMEvents.8.a: "愿开罗的荣光永存，愿法蒂玛的旗帜不落！"
 EDG_FDMEvents.9.title: "俘获阿拔斯哈里发"
 EDG_FDMEvents.9.desc: "那位自诩为先知继承者、统御整个逊尼派世界精神权柄的阿拔斯哈里发，如今正以阶下囚的身份跪伏在我们的脚下。\n\n数百年来，这位被各方苏丹与埃米尔轮流挟持的「精神傀儡」，始终是逊尼派世界用以否定我们法蒂玛血脉合法性的最后一面旗帜。从巴格达陷落于蒙古铁蹄之后，这具早已名存实亡的躯壳被辗转庇护于开罗，由历代埃及统治者奉养，借以为自己的统治涂抹一层神圣的金漆。每一次主麻日的祷词中，他都会以「真信士的长官」之名，宣讲着否认伊斯玛仪派正统性的教义；每一封发往伊斯兰世界各地的诏书上，他都会盖下那枚象征着逊尼派正朔的印玺。\n\n而现在，这位「真信士的长官」就跪在我们面前。他苍老的双手颤抖着，浑浊的双眼中混杂着恐惧、屈辱与一丝残存的傲慢。整个伊斯兰世界都在屏息等待——等待先知女儿法蒂玛与阿里的直系后裔，将如何处置这位窃据了哈里发名号数百年的篡位者。"
 EDG_FDMEvents.9.a: "把他做成人彘，尸体挂在开罗城门示众！"
 EDG_FDMEvents.9.a_tt: "所有已知§Y逊尼派§!国家对我们好感改变了§R-100§!。"
 EDG_FDMEvents.9.b: "把他押进开罗的地牢，永生永世不得释放"
 EDG_FDMEvents.9.b_tt: "所有已知§Y逊尼派§!国家对我们好感改变了§R-25§!。"
 EDG_FDMEvents.10.title: "[GetYear]年征税法案"
 EDG_FDMEvents.10.desc: "大战将至，卡比利亚的宫廷彻夜灯火通明。维齐尔将一摞摞税册摊开在哈里发面前，上面密密麻麻地记录着帝国每一座城镇、每一片田庄的产出与人口。\n\n突尼斯的法兰克人仍在我们的先祖土地上作威作福，圣殿骑士团的白袍旗帜高悬于迦太基的废墟之上。要将这些异教徒驱逐殆尽，我们需要数以万计的弯刀、战马与桨帆船——而这一切都需要黄金。\n\n维齐尔提出了两套方案：其一，按照惯例向各省征收适度的战争附加税，百姓虽有怨言但尚可承受；其二，大幅提高税率并预征数年赋税，这将立即使国库充盈，但代价是各省份的税基将遭到不可逆的侵蚀。"
 EDG_FDMEvents.10.a: "适度征收战争税，不可竭泽而渔。"
 EDG_FDMEvents.10.a_tt: "每个拥有的省份都将给予我们§G10§!£icon_cash£§Y杜卡特§!。"
 EDG_FDMEvents.10.b: "预征赋税，为了圣战不惜一切代价！"
 EDG_FDMEvents.10.b_tt: "每个拥有的省份都将失去§G1§!点§Y基础税收§!，然后给予我们§G25§!£icon_cash£§Y杜卡特§!。"
 EDG_FDMEvents.11.title: "[GetYear]年征兵法案"
 EDG_FDMEvents.11.desc: "清真寺的宣礼塔上，宣礼员的声音比往日更加激昂。哈里发以伊玛目的名义颁布征兵诏令，号召帝国境内每一位体魄健全的穆民放下锄头与秤杆，拿起长矛与弯刀，为光复先祖的圣地而战。\n\n卡比利亚的港口日夜不停地建造着战船，柏柏尔部落的骑手从阿特拉斯山的隘口源源不断地涌入集结地，连平日里只知诵经的经学院学生也在操练着刀法。然而兵源并非取之不竭——维齐尔低声提醒我们，若从各省份抽取过多的壮丁，田间的庄稼将无人收割，来年的饥荒恐将不亚于法兰克人的刀剑。\n\n是按照常备军的编制征召精锐，还是发动全面动员倾巢而出？"
 EDG_FDMEvents.11.a: "按编制征召，不可动摇国本。"
 EDG_FDMEvents.11.a_tt: "每个拥有的省份都将给予我们§G1000§!£icon_manpower£§Y人力§!。"
 EDG_FDMEvents.11.b: "全面动员，让每一个穆斯林都成为真主的战士！"
 EDG_FDMEvents.11.b_tt: "每个拥有的省份都将失去§G1§!点§Y基础人力§!，然后给予我们§G2500§!£icon_manpower£§Y人力§!。"
 EDG_FDMEvents.12.title: "大仇得报"
 EDG_FDMEvents.12.desc: "科尔多瓦的红宫终于在我们的铁蹄下陷落。\n\n这座曾让整个伊比利亚为之颤栗的宫殿，曾是倭马亚僭主们炫耀武力与财富的舞台——当我们的先祖在开罗竖起什叶派的大旗时，他们却在安达卢斯以「真正的哈里发」自居，用逊尼派的教义否定法蒂玛血脉的神圣性。数百年来，两个哈里发国隔着地中海遥遥对峙，彼此的仇恨早已融入了每一道诏书、每一场布道、每一次主麻日的祷词。\n\n如今，历史终于给出了它的裁决。我们的旗帜飘扬在瓜达尔基维尔河畔，科尔多瓦大清真寺的宣礼塔将再次为伊斯玛仪派诵出祷词。那些曾自诩为「信仰守护者」的倭马亚遗老们，如今只能在废墟中瑟缩发抖，等待着胜利者的审判。\n\n先祖穆仪兹与奥贝德拉在天之灵可以瞑目了——什叶派与逊尼派延续数百年的哈里发之争，在今天，以法蒂玛的最终胜利画上了句号。"
 EDG_FDMEvents.12.a: "「你生于不义，所以死于耻辱。」"
 EDG_FDMEvents.13.title: "阶下之囚"
 EDG_FDMEvents.13.desc: "萨哈达帝国的最后一座城池在烈焰中陷落。大马利克被卫兵从宫殿的地窖中拖出，他的黄金王冠早已不知去向，华服上沾满了烟尘与血污，曾经不可一世的双眼如今只剩空洞与恐惧。\n\n他被押解至[Root.Monarch.GetName]面前，双膝重重地砸在冰冷的大理石地板上。整座宫殿鸦雀无声，所有人的目光都汇聚在这位昔日征服者的身上。\n\n大马利克伏地叩首，颤抖的声音在空旷的大殿中回荡：「至高的哈里发……至圣阿里的后裔……我也是什叶派的信徒，我从未背弃过对真主的忠诚……我们从未主动觊觎过法蒂玛的故土……求您念在我们同宗同源的份上，饶恕我这卑微的罪人……」\n\n[Root.Monarch.GetName]缓缓起身，俯视着脚下瑟瑟发抖的囚徒，声音如冬日的寒风般冷冽：「你自称什叶派信徒，却窃据了先祖穆仪兹亲手奠基的开罗城；你口口声声忠于阿里，却心安理得地坐在阿尤布篡位者的宫殿里，继承着他们用法蒂玛王族鲜血染红的遗产。你把开罗让给了阿拔斯的傀儡，自己躲到法尤姆苟延残喘，连先祖的城都不敢住——也配谈忠诚？」\n\n大殿中一片死寂。[Root.Monarch.GetName]低头凝视着这位跪伏于地的僭主。"
 EDG_FDMEvents.13.a: "「你不过是又一个自命不凡的野心家罢了，拖下去。」"
 EDG_FDMEvents.14.title: "重生之路"
 EDG_FDMEvents.14.desc: "「与艰难相伴的，确是容易。」——《古兰经》94:5\n\n自当年苏莱曼王子成功逃出开罗并在卡比利亚建基以来，法蒂玛王朝便踏上了一条充满艰险的重生之路。\n\n马格里布从来就不是和平的庇护所，而是一片势力交错的四战之地。我们的西面与南面被根深蒂固的逊尼派政权包围，他们始终视高举伊斯玛仪派大旗的我们为异端；而在东面与北面的沿海地带，野心勃勃的基督徒正试图巩固他们十字军远征的战果，将突尼西亚转化为长久的圣战王国。\n\n在这群狼环伺的乱局中，脆弱的新生政权没有任何退路。为了延续先知的血脉，我们必须凭借军事手腕与外交智慧在夹缝中寻求生存与扩张。征服桀骜的柏柏尔部落、瓦解十字军的统治、将北非的零散势力整合成一个统一的帝国。\n\n但这仅仅是开始。我们在马格里布所进行的一切惨烈战争和统治重建，皆是为了一项更为宏大的历史使命积蓄力量：有朝一日沿着地中海东进，跨越无尽的沙漠，将法蒂玛的旗帜重新插上开罗的城头。"
 EDG_FDMEvents.14.a: "这会是一条布满荆棘和泥泞的道路"
 EDG_FDMEvents.14.a_tt: "进入灾难§T重生之路§!。\n\n以下提示非常重要，请认真阅读！\n\n§T重生之路剩余时间§!是一个政府能力条，它给予你§T大量战争加成§!和§R大量侵略扩张§!，请善用任务树给予的机制控制好包围网。\n\n否则，形成的包围网一旦阻碍了你的扩张，就很可能导致§T重生之路剩余时间§!倒计时归零，从而§T重生之路§!以「§R失败§!」告终，届时你将会进入惩罚性灾难§R绝望之剑§!，因此请尽全力避免此事发生。"
 EDG_FDMEvents.15.title: "重生之路的终点"
 EDG_FDMEvents.15.desc.a: "「与艰难相伴的，确是容易。」——《古兰经》94:5\n\n当法蒂玛的旗帜终于重新飘扬在开罗的城头，当艾资哈尔清真寺的宣礼塔再次为伊斯玛仪派的伊玛目诵出祷词，当尼罗河的涛声与凯旋的号角在萨拉丁城堡上空交织之时——从卡比利亚的荒凉海岸到开罗的千年古都，这条路我们走了太久。\n\n两个多世纪前，年少的苏莱曼王子逃离这座被篡位者占据的城池时，曾在宫墙外最后回望了一眼。那一眼凝望化作了二百余年的执念，化作了马格里布的风沙中一代又一代人的流血与牺牲。如今，先祖的遗愿终于在我们手中化为了现实。\n\n马格里布的柏柏尔部落已被纳入帝国的版图，十字军的残部被驱逐至大海的彼端，从的黎波里到亚历山大的整条海岸线重归法蒂玛的统治。尼罗河的赠礼将再次滋养这片土地，而开罗的集市、船坞与书院，也将在法蒂玛的旗帜下迎来第二次黄金时代。\n\n先祖穆仪兹在天之灵可以瞑目了。重生之路的荆棘已被踏平，泥泞已被洗净，而我们——终于回家了。"
 EDG_FDMEvents.15.desc.b: "时间的沙漏终于流尽了最后一粒沙。\n\n重生之路的倒计时归零时，[Root.Monarch.GetName]正站在开罗城外的一座荒丘之上，遥望着那座始终无法攻克的城池。法蒂玛的旗帜仍只能飘扬在马格里布的荒漠之中，而先祖穆仪兹亲手奠基的「胜利之城」，依然在篡位者的手中对我们紧闭大门。\n\n从卡比利亚出发时，我们曾怀揣着跨越二百年执念的雄心壮志，誓要将先知的血脉重新带回尼罗河畔。然而现实远比梦想残酷——敌人的抵抗比预想中更为顽强，盟友的背叛比预想中更为频繁，而我们自己的国力，也比预想中更为脆弱。\n\n苏莱曼王子的遗愿未能在这一代人手中实现。那些在马格里布的风沙中倒下的将士们，他们的鲜血白流了吗？那些在漫长的行军途中病死、饿死、累死的士兵们，他们的牺牲毫无意义吗？\n\n不。只要法蒂玛的血脉尚存一日，只要伊斯玛仪派的信仰尚有一人传续，重生之路便永远不会真正终结。它只是被暂时搁置了——等待着下一位更有能力的继承人，重新踏上这条未竟的征途。\n\n但此刻，我们不得不面对一个残酷的现实：重生之路，失败了。"
 EDG_FDMEvents.15.a: "一朝戎马收故土，万里忠魂告祖先。"
 EDG_FDMEvents_15_modifier: "§T浴火重生的法蒂玛§!"
 EDG_FDMEvents.15.b: "此身虽化边尘骨，犹向长天啸朔风。"
 EDG_FDMEvents.16.title: "幼狮之牙"
 EDG_FDMEvents.16.desc: "[Root.Heir.GetName]第一次踏上战场时，年仅十三岁。\n\n那是一场针对阿特拉斯山区柏柏尔叛部的清剿行动。[Root.Monarch.GetName]将他安置在中军的辎重队中，由最忠诚的马穆鲁克亲卫看护，本意不过是让他远远地看一看战争的模样。然而当叛军的骑兵突然从侧翼的山谷中冲出、直扑辎重队时，这个少年没有尖叫，没有躲藏，而是抄起身边阵亡卫兵的弯刀，砍倒了第一个冲到面前的敌人。\n\n[Root.Monarch.GetName]在战后巡视营地时，看到[Root.Heir.GetName]正坐在一堆尸骸之间，手中的刀刃已经卷口，衣袍上溅满了血污。他没有哭，只是抬头望着父亲，用一种与年龄极不相称的平静语气说道：「他们的弯刀太短了，父亲。下次给我一柄长枪。」\n\n[Root.Monarch.GetName]沉默了很久，然后转身吩咐侍从：「从明天起，让[Root.Heir.GetName]跟随将军们学习战术。」"
 EDG_FDMEvents.16.a: "这孩子天生就是战士的料"
 EDG_FDMEvents.17.title: "维齐尔的课堂"
 EDG_FDMEvents.17.desc: "从阿特拉斯山归来之后，[Root.Monarch.GetName]将[Root.Heir.GetName]交给了宫廷中最年长的维齐尔教导。\n\n老维齐尔并不急于讲授治国之道，而是先让这个少年做了一件看似枯燥的事——抄写税册。整整三个月，[Root.Heir.GetName]伏在堆积如山的羊皮卷前，一笔一画地誊抄着帝国每一座城镇的人口、田亩与产出。他起初抱怨连连，认为这是对王子的侮辱；直到有一天，他忽然在税册中发现了一个被篡改的数字——某个边远省份的税额被人为压低了三成，而负责审核的官员恰好是维齐尔的外甥。\n\n他将此事报告给了维齐尔。老维齐尔没有惊讶，只是微微一笑：「你终于学会了。治理帝国的第一课，不是学会如何发号施令，而是学会如何在数字中读出谎言。」"
 EDG_FDMEvents.17.a: "而谎言是人生的必修课"
 EDG_FDMEvents.18.title: "沙漠中的棋局"
 EDG_FDMEvents.18.desc: "征服突尼斯之后，[Root.Monarch.GetName]带着[Root.Heir.GetName]穿越撒哈拉的边缘，前往费赞的绿洲巡视新征服的商路。\n\n在穆尔祖克城外的营地中，[Root.Monarch.GetName]命人在沙地上用石子摆出了一幅巨大的地图——从的黎波里到加达梅斯，从费赞到尼罗河上游，每一座绿洲、每一条商路、每一个部落的驻牧地都标注得清清楚楚。他指着地图对[Root.Heir.GetName]说：「你以为打仗就是刀剑相交？不，真正的战争在这里。」他用手指在的黎波里与费赞之间划了一条线：「谁能控制这条商路，谁就握住了整个西地中海的命脉。而要控制它，你需要的不是更多的士兵，而是更聪明的棋局。」\n\n那个夜晚，父子二人在篝火旁对弈至天明。[Root.Heir.GetName]输了七局，但每一局都比上一局多撑了几个回合。"
 EDG_FDMEvents.18.a: "天下为棋，一步三算"
 EDG_FDMEvents.19.title: "粮仓与刀剑"
 EDG_FDMEvents.19.desc: "击败法兰克人之后，[Root.Monarch.GetName]开始让[Root.Heir.GetName]参与宫廷的核心政务。\n\n第一次令他独立面对的，是一场饥荒。今年的泛滥季比往年迟了整整一个月，粮仓几近见底，而粮商们却趁机囤积居奇，将粮价抬高了三倍。城郊的贫民已经开始啃食树皮，集市上每天都有饿殍被人抬走。与此同时，军中的将领不断上书催讨军粮——前线的士兵同样在挨饿，若再不补给，刚征服的省份恐将再度易手。\n\n[Root.Heir.GetName]面前摆着两条路：一是强行征购粮商的库存，以平价售予百姓与军队——这能迅速平息民怨、稳住前线，但粮商背后的商会网络遍布整个地中海，得罪他们意味着帝国的贸易命脉将被切断；二是向热那亚商人借贷购粮，以市场手段化解危机——但这笔债务将像枷锁一样套在帝国的财政上，未来数年都难以挣脱。\n\n[Root.Monarch.GetName]没有替他做决定，只是在书房中静静等待。三天后，[Root.Heir.GetName]交出了他的方案：对粮商强制平价征购一半库存，另一半以帝国的名义向热那亚借贷补齐，同时颁布法令将粮价管制延续至下一个丰收季。\n\n[Root.Monarch.GetName]看完方案，沉默良久，最终说了一句：「你学会了一件许多统治者至死都学不会的事——在两个都不完美的选项中，找到那个让你活到下一个选择的选项。」"
 EDG_FDMEvents.19.a: "帝国需要的是粮食，不是商人的感恩"
 EDG_FDMEvents.20.title: "伊伦"
 EDG_FDMEvents.20.desc: "在法蒂玛宫廷的传统中，每一位王室子弟在成年之前都会经历一场名为「伊伦」的仪式——这个词在柏柏尔古语中意为「试炼之火」。\n\n[Root.Heir.GetName]的伊伦在开罗郊外的沙漠中举行。按照仪式的要求，他必须独自一人在荒漠中度过三天三夜，不携带食物，仅靠一壶水和一柄短刀维生。他需要面对的不仅是酷热与饥饿，还有沙漠中潜伏的毒蛇、蝎子与野狼。\n\n当第三天的黎明降临时，前来迎接的侍从们发现[Root.Heir.GetName]正端坐在一块巨石之上，身旁散落着几具野狼的尸体，短刀的刃口已经崩裂，他的衣袍被撕成了碎片，浑身上下布满了伤痕与沙尘。然而他的眼神却比任何时候都要清亮。\n\n[Root.Monarch.GetName]亲自为他披上了一件崭新的白袍，在他的额头上烙下了一枚小小的银色弯月印记。从这一刻起，[Root.Heir.GetName]不再仅仅是一位王子——他是法蒂玛的「伊伦」，是经历过试炼之火的成年之人。"
 EDG_FDMEvents.20.a: "一个真正准备好登上哈里发之位的人"
 EDG_FDMEvents.21.title: "血色黄昏"
 EDG_FDMEvents.21.desc: "消息传来时，[Root.Heir.GetName]正在开罗的宫殿中审阅一份来自亚历山大的税册。\n\n一名浑身浴血的骑兵跌跌撞撞地闯入大殿，双膝跪地，用嘶哑到几乎听不清的声音说出了那句话：「殿下……哈里发……哈里发殉国了。」\n\n那是一场本不该发生的战斗。[Root.Monarch.GetName]亲率前锋追击一支溃退的叛军残部，却在尼罗河上游的一处狭窄河谷中遭到了伏击。数千名埋伏在芦苇丛中的叛军突然杀出，将前锋部队拦腰截断。[Root.Monarch.GetName]身边的亲卫几乎全部战死，他本人身中数箭，仍在马上挥刀力战，直到坐骑被长矛刺倒，才连人带马坠入了尼罗河中。\n\n当士兵们在下游找到他的遗体时，他的手仍紧紧握着那柄弯刀——那是当年苏莱曼王子逃出开罗时随身携带的佩刀，传了数代，如今又传到了[Root.Heir.GetName]的手中。\n\n[Root.Heir.GetName]没有流泪。他缓缓站起身，接过那柄沾满泥沙与血污的弯刀，转身面向大殿中所有惊愕的臣僚与将领，用一种他自己都不曾听过的、低沉而坚定的声音说道：「法蒂玛的旗帜不会倒下。」\n\n那一天，[Root.Heir.GetName]正式继承了哈里发之位。他年仅15岁。"
 EDG_FDMEvents.21.a: "法蒂玛的旗帜不会倒下"
 EDG_FDMEvents.22.title: "生于马背之上"
 EDG_FDMEvents.22.desc: "[Root.Monarch.GetName]即位后的第一道诏令，不是颁布税法，不是册封维齐尔，而是亲自披甲上马，率领大军出征。\n\n老将们试图劝阻：新哈里发刚刚丧父，国丧未满，贸然出征恐动摇军心。[Root.Monarch.GetName]却只是翻身上马，回头望了一眼开罗的城头，淡淡地说：「父亲的血还没有干。如果我现在躲在宫殿里，那些杀死他的人就会以为法蒂玛已经完了。」\n\n他的骑术是在阿特拉斯山的崎岖小道上练就的，他的刀法是在撒哈拉的风沙中磨砺的，他的战术是在费赞的绿洲棋局中开悟的。当他纵马冲在全军最前方，弯刀出鞘，白袍在风中猎猎作响时，身后的将士们终于明白——这位少年哈里发并非继承了王座才成为战士，而是生来便属于马背。\n\n先父在天之灵若能看到这一幕，想必会露出欣慰的微笑。"
 EDG_FDMEvents.22.a: "[Root.Monarch.GetName]必将带领法蒂玛走向重生！"
 EDG_FDMEvents.23.title: "法蒂玛哈里发要求改信什叶派"
 EDG_FDMEvents.23.desc: "法蒂玛哈里发的使节带着盖有月牙印玺的诏书抵达了我们的宫廷。诏书以先知后裔的至高权威，要求我们放弃逊尼派信仰，改宗什叶派伊斯玛仪派。\n\n使节的语气并非商量，而是命令。他警告说，拒绝哈里发的旨意将被视为对先知血脉的背叛，法蒂玛的军队将毫不犹豫地惩罚那些顽固的异端。然而，改宗意味着背弃我们世代传承的信仰，意味着在清真寺中宣读我们从未认同的教义，意味着在我们的子民面前承认自己的信仰是错误的。\n\n这是一个关乎灵魂与生存的抉择。"
 EDG_FDMEvents.23.a: "我们欣然接受哈里发的统治"
 EDG_FDMEvents.23.b: "拒绝"
 EDG_FDMEvents.24.title: "哈里发机制介绍"
 EDG_FDMEvents.24.desc: "哈里发，为哈里发国与乌玛的统治者，是伊斯兰教的宗教及世俗的最高统治者的称号。最早源自于阿拉伯语中的「继承者」（Khaleefa），指先知穆罕默德的继承者。在穆罕默德死后，其弟子以「安拉使者的继承者」（Khalifat Rasul Allah）为名号，继续领导伊斯兰教，随后称号简化为哈里发，所谓的四大哈里发为巴克尔、欧玛尔、奥斯曼和阿里。"
 EDG_FDMEvents.24.a: "由于我们是或控制了逊尼派或什叶派哈里发，我们可以使用哈里发相关机制"
 EDG_FDMEvents.24.a_tt: "§Y1.301§!版本更新后，哈里发机制迎来更新：\n\n1.全新的通用理念组§Y哈里发理念§!，如果您正在作为@FDM§Y法蒂玛§!游玩，建议您首发此理念。\n\n2.全新的哈里发诏令机制。\n\n3.全新的哈里发外交行动，包括：\n——发动吉哈德\n——哈里发制裁\n——召集朝觐\n——授予合法性\n——允许吉哈德\n——宣誓效忠令"
 EDG_FDMEvents.25.title: "不兼容的宗教"
 EDG_FDMEvents.25.desc: "检测到你游玩的国家不允许使用此宗教，因此本事件发生了。如果你有存档，请回档到改宗此宗教之前。"
 EDG_FDMEvents.25.a: "下一局游戏请不要这么做了"
 EDG_FDMEvents.25.b: "下一局游戏请不要这么做了"
 EDG_FDMEvents.26.title: "绝望之剑"
 EDG_FDMEvents.26.desc: "帝国的根基正在崩塌。\n\n重生之路的失败不仅是一次军事上的挫败，更是对整个法蒂玛政权合法性的致命打击。那些曾被我们压制的敌人闻到了血腥味，从四面八方蜂拥而至。被征服的省份燃起了叛乱的烽火，曾经臣服的附庸纷纷宣布独立，就连宫廷中的埃米尔们也开始密谋各自的退路。\n\n国库空虚，军队疲惫，债务如山。哈里发的权威在这场风暴中摇摇欲坠，整个帝国如同一艘在狂风巨浪中即将倾覆的破船。这是我们最黑暗的时刻——如果我们不能在这场绝望中找到生路，法蒂玛王朝将永远沉入历史的深渊。\n\n但绝望之中，剑仍未折。"
 EDG_FDMEvents.26.a: "置之死地，方能后生！"
 EDG_FDMEvents.26.a_tt: "进入惩罚性灾难§R绝望之剑§!。\n\n要结束此灾难，你需要占领所有以§R独立§!为宣战理由向我们宣战的国家，并对他们均拥有至少80%战争分数。你只能通过此方式解决战争，因为手动和平已被禁用。\n\n由于这是一个惩罚性灾难，因此并不算入游戏流程内，也没有让你更容易结束灾难的设计，作者不保证你一定能结束此灾难，同时，灾难结束后不会有任何奖励。"
 EDG_FDMEvents.27.title: "新生"
 EDG_FDMEvents.27.desc: "硝烟终于散去。\n\n当最后一个叛乱的省份重新升起法蒂玛的旗帜，当最后一位宣布独立的埃米尔跪伏在哈里发的座前，这场漫长而残酷的内战终于画上了句号。\n\n帝国的疆土虽然大幅缩水，但核心仍在。那些在战火中幸存下来的将士们，那些在饥荒中坚守忠诚的百姓们，他们的血与泪铸就了法蒂玛最后的防线。哈里发环顾四周，昔日庞大的帝国如今只剩下一片满目疮痍的废墟——但废墟之上，绿旗仍在飘扬。\n\n绝望之剑已被折断。从今往后，我们将以另一种方式重建这个国家。不再追求虚妄的荣耀，而是脚踏实地地修复每一寸伤痕。只要先知的血脉尚存一日，法蒂玛便永远不会真正消亡。"
 EDG_FDMEvents.27.a: "硝烟已尽"
 EDG_FDMEvents.27.a_tt: "灾难§R绝望之剑§!将会结束。\n\n吞并所有以§R独立§!为宣战理由向我们宣战的国家。"
 EDG_FDMEvents.28.title: "死灰复燃"
 EDG_FDMEvents.28.desc: "当阿拔斯哈里发的血尚未干涸于开罗的石板之上，一个自称继承其名号之人便已从暗处现身。此人声称自己是阿拔斯王室的遗裔，在巴格达的逊尼派社区中获得了出乎意料的支持。曾经默不作声的逊尼派乌里玛们如今在清真寺中公开为他祈祷，市集上的商人以他的名义征收天课，城郊的贝都因部落打着黑旗向底格里斯河畔集结。\n\n这并非单纯的军事叛乱。数十年来，帝国对逊尼派教法学家的礼遇、对逊尼派经学院的资助、对各教派一视同仁的治理方略，使得逊尼派的宗教网络从未真正瓦解——如今，这张网络成为了反对我们最有力的工具。我们以宽容编织的秩序，正在被用来编织我们的绞索。\n\n伊玛目的天平已开始倾斜。一个死去的哈里发的阴影，比他活着时更加沉重。"
 EDG_FDMEvents.28.a: "一个从地狱里归来的死人？"
 EDG_FDMEvents.28.a_tt: "进入灾难§T伊玛目的天平§!。"
 EDG_FDMEvents_28_modifier: "§G一个从地狱里归来的死人§!"
 EDG_FDMEvents.29.title: "当天平打破之后"
 EDG_FDMEvents.29.desc: "伊玛目的天平终于停止了摇摆。\n\n经过漫长的内部博弈与血与火的洗礼，帝国内部各派系的利益终于在废墟之上重新找到了平衡点。那些曾经撕裂国家的宗教纷争——什叶派的狂热与逊尼派的抗拒、正信的偏执与宽容的代价——在这场浩劫之后都变得不再重要。\n\n重要的是，帝国还活着。\n\n哈里发以铁腕与智慧重新整合了这个四分五裂的国度。天平的指针最终指向了一个确定的方向。从今往后，法蒂玛的统治将建立在一个更为坚实——也更为冷酷——的基础之上。"
 EDG_FDMEvents.29.a: "从此我们将不再重蹈覆辙"
 EDG_FDMEvents_29_modifier_1: "铁腕统治"
 EDG_FDMEvents_29_modifier_2: "伊玛目的化身"
 EDG_FDMEvents.29.a_tt: "灾难§T伊玛目的天平§!将会结束。"
 EDG_FDMEvents.30.title: "再堕地狱"
 EDG_FDMEvents.30.desc: "巴格达的叛乱已被平定。那个自称阿拔斯哈里发遗裔之人，最终被我们的军队围困于底格里斯河东岸的一座废弃驿站之中。据说当士兵破门而入时，他正端坐于一张破旧的毯上，身披一件从旧宫中寻来的褪色黑袍，面容平静，仿佛早已预知了这一刻的到来。\n\n他没有求饶，亦没有慷慨陈词。史官将不会记住他的名字——因为他或许本就无名。但他所激起的波澜却不会随他的死亡一同平息：逊尼派乌里玛的讲坛上仍回荡着他被赋予的称号，市井之间仍有人低声传述他是「被藏匿的伊玛目」。一个假死之人可以被杀死第二次，但一个被信仰所塑造的符号，却不会因为承载它的躯体消亡而失去重量。\n\n阿拔斯的黑旗这一次或许真的落下了。"
 EDG_FDMEvents.30.a: "「做个安详的美梦吧...我的宿敌。」"
 EDG_FDMEvents_30_modifier: "平定叛乱"
 EDG_FDMEvents.31.title: "来自圣地的背叛"
 EDG_FDMEvents.31.desc: "阿拉伯的沙漠深处便传来了更为刺耳的消息：伊巴德派的信徒们自阿曼与也门的绿洲中涌出，沿着古老的商路向希贾兹进军。麦加与麦地那——先知之城与禁寺之所在——在几乎未经抵抗的情况下落入了他们的手中。\n\n伊巴德派历来游离于逊尼与什叶的正统谱系之外，既不承认阿拔斯的血统，也不承认法蒂玛的圣裔。他们只服从由信众公推的伊玛目，而这个伊玛目此刻正率军向尼罗河谷进发。对于我们而言，这比阿拔斯伪裔的叛乱更难应对——我们甚至找不到一个可以被收买的世系，一个可以被册封的头衔，一个可以被纳入宫廷礼仪的位置。伊巴德派的权力不来自血统，因此无法被斩断。\n\n多年来，帝国对阿拉伯半岛的治理不过是以贡金换取名义上的臣服，罕吉兹的卡迪由我们任命，但他的权威从未真正越出清真寺的门槛。如今我们终于看清：所谓的羁縻，不过是对方暂时没有理由动手的体面说法。\n\n圣城的沦陷不仅是一场军事失利。当开罗的伊玛目连先知陵墓的看护权都无法保全时，法蒂玛王朝赖以立身的什叶派圣裔叙事，便出现了一道难以弥合的裂痕。"
 EDG_FDMEvents.31.a: "该死的阿曼人！"
 EDG_FDMEvents.32.title: "科普特之剑"
 EDG_FDMEvents.32.desc: "来自阿克苏姆高原的消息令开罗的宫廷陷入了更深的沉默：埃塞俄比亚的科普特教会在亚历山大牧首被软禁之后，终于公开撕裂了与法蒂玛王朝之间那层薄如蝉翼的臣属关系。\n\n阿克苏姆的所罗门后裔以收复圣地为名，重新举起了被遗忘已久的真十字架旗帜，尼罗河上游的科普特修士们将这一消息沿河传至努比亚，传至上埃及的每一个修道院。\n\n最令人心寒的是，这场叛乱的发生几乎毫无征兆。我们曾以为对科普特人的宽容已足够深厚——允许他们保留教堂，允许他们使用自己的语言，允许他们在帝国的庇护下经商。但宽容所建立的，从来不是忠诚，而是一种可以随时被撤回的默许。当帝国的力量出现裂痕，当宽容的承诺不再被实力所支撑，那些曾经感恩的臣民便会发现，感恩原来是一种可以被轻易放下的负担。\n\n来自南方的剑，比来自东方和西方的更为冰冷——因为它刺中的是我们最不愿承认的真相：帝国从来不是被外敌摧毁的，而是被自己所容纳的一切缓缓瓦解的。"
 EDG_FDMEvents.32.a: "我早该知道的！"
 EDG_FDMEvents.33.title: "十字军归来！"
 EDG_FDMEvents.33.desc: "西方的地中海沿岸却悄然亮起了我们最不愿看到的光芒——法兰克人的旗帜，再一次出现在了突尼斯的海岸线上。\n\n这并非一支新的十字军。突尼西亚、圣殿骑士团，这些法兰克人没有返回欧洲，而是蛰伏于西西里的港口、撒丁岛的渔村、马格里布西端的柏柏尔酋长领地之中，像一群被驱散却未被杀死的狼，耐心地等待着猎物露出破绽的时刻。\n\n他们等到了。\n\n那些往来于地中海的热那亚商人与威尼斯水手早已将帝国的羸弱尽收眼底。当一个帝国连自己的边境都无法看守时，被击败的敌人便会从坟墓中爬出来。\n\n地中海的风再一次吹来了铁与血的气息。这一次，我们没有足够的力量在两条战线上同时迎敌。"
 EDG_FDMEvents.33.a: "当初在突尼斯怎么没把这些法兰克人杀光？"
 EDG_FDMEvents.34.title: "安达卢斯之乱"
 EDG_FDMEvents.34.desc: "安达卢斯的穆斯林——那些在基督教王国的蚕食下苟延残喘了数个世代的逊尼派遗民——如今竟在一位自称伍麦叶哈里发后裔之人的号召下重新集结。此人据说是科尔多瓦哈里发国覆灭时逃往北非的王室血脉，在费斯的经学院中蛰伏多年，精通教法与兵法，而今趁着帝国四面楚歌之际，公然在格拉纳达的阿尔罕布拉宫前举起了伍麦叶的白旗。\n\n然而棋局的制定者如今已无力控制棋盘上的棋子。我们送去的白银被伍麦叶宣称者截获，我们点燃的战火被他引向了我们自己。那些曾被我们当作消耗品的安达卢斯战士，如今在他的旗帜下找到了比苟活更值得战斗的理由——一个死去百年的王朝的名字，竟比我们活着的哈里发更有号召力。\n\n阿拔斯的幽灵尚未散去，伍麦叶的亡灵又从伊比利亚的废墟中站了起来。"
 EDG_FDMEvents.34.a: "不过是一群乌合之众！"
 EDG_FDMEvents.35.title: "小亚细亚的叛变"
 EDG_FDMEvents.35.desc: "安纳托利亚的突厥贝伊们几乎未作犹豫便倒向了阿拔斯伪裔的阵营。这些当年在塞尔柱废墟上割据自立的军阀，从未真正臣服于开罗的什叶派哈里发——他们只服从强者。如今帝国的军队被牵制于四方，所谓的臣属关系便如同沙漠中的脚印，风一吹便了无痕迹。"
 EDG_FDMEvents.35.a: "叛徒！"
 EDG_FDMEvents.36.title: "波斯的叛变"
 EDG_FDMEvents.36.desc: "波斯的叛变几乎不令人意外。这片土地曾是阿拔斯王朝的心脏，巴格达的阴影至今仍笼罩在每一座波斯清真寺的穹顶之上。当阿拔斯伪裔的黑旗在底格里斯河畔升起时，波斯的总督们便已开始在密室中计算背叛的收益——什叶派的异端统治从来只是刀剑强加的枷锁，如今刀剑生锈，枷锁便应声而落。"
 EDG_FDMEvents.36.a: "叛徒！"
 EDG_FDMEvents.37.title: "高加索的叛变"
 EDG_FDMEvents.37.desc: "高加索的山民们选择了一个最恰当的时机抛弃了我们。格鲁吉亚的十字架与亚美尼亚的教堂从未真正接纳过什叶派的统治，而那些游牧于山谷间的土库曼部落，更是只认弯刀不认诏书。当帝国的边防军被调往南方镇压叛乱时，高加索的关隘便如同敞开的大门，再也无人看守。"
 EDG_FDMEvents.37.a: "叛徒！"
 EDG_FDMEvents.38.title: "隐藏事件"
 EDG_FDMEvents.38.desc: ""
 EDG_FDMEvents.38.a: "隐藏事件"
 EDG_FDMEvents.39.title: "投诚哈里发？"
 EDG_FDMEvents.39.desc: "帝国的军队已经兵临城下。\n\n阿拔斯伪哈里发的黑旗仍在我们的城头飘扬，但城墙之外，法蒂玛的大军已经将我们团团围住。粮食日渐枯竭，水源即将断绝，守军的士气已经跌至谷底。\n\n法蒂玛的使者带来了最后通牒：献城投降，全体军民宣誓效忠什叶派哈里发，便可保全性命与财产；若执意抵抗，城破之日便是玉石俱焚之时。\n\n我们该向这位异端哈里发低头吗？"
 EDG_FDMEvents.39.a: "我们是正统哈里发的忠诚子民"
 EDG_FDMEvents.39.b: "没有这个可能"
 EDG_FDMEvents.40.title: "为哈里发而战"
 EDG_FDMEvents.40.desc: "帝国危难之际，我们的子民主动向军队捐献物资，甚至自愿加入战斗。无论是来自埃及的农民，还是来自叙利亚的商人，还是来自巴格达的学者，他们都在用自己的方式表达着对哈里发的忠诚与支持。"
 EDG_FDMEvents.40.a: "我们衷心感谢他们的付出"
 EDG_FDMEvents.41.title: "阿克苏姆的幻梦"
 EDG_FDMEvents.41.desc: "那位自称所罗门王后裔的阿克苏姆君主，如今跪在尘土之中，昔日高举的真十字架旗帜已被我们的骑兵踏碎在脚下。\n\n他身披一件粗糙的亚麻长袍，胸前挂着一枚年代久远的铜质十字架，面容黝黑而消瘦，唯有那双眼睛仍燃烧着某种近乎疯狂的虔诚。当我们的将领以胜利者的姿态俯视他时，他没有颤抖，而是缓缓抬起头，用一种我们听不懂的吉兹语低声念诵着什么——身旁的翻译告诉我们，他在祈祷末日审判的到来，祈祷所罗门的宝座在天国为他敞开。\n\n科普特叛乱的脊梁已被折断。然而从这位囚徒的眼中，我们读不出丝毫悔意——只有殉道者特有的平静。这种平静比任何诅咒都更令人不安。"
 EDG_FDMEvents.41.a: "去给所罗门陪葬吧"
 EDG_FDMEvents_41_modifier: "平定叛乱"
 EDG_FDMEvents.42.title: "碎成一地的蓝月亮"
 EDG_FDMEvents.42.desc: "伊巴德派的伊玛目被押解至开罗时，他的白袍已被鲜血浸透，头巾不知所踪，花白的头发散乱地披在肩上。然而最引人注目的并非他的狼狈，而是他胸口那枚弯月徽记——伊巴德派的标志——已被利刃劈成了两半，一半仍挂在胸前，另一半不知遗落在哪片战场上。\n\n他被推倒在哈里发的座前，却拒绝俯身叩首。他用一种平静到近乎冷漠的语气说道：「你们可以杀死我的身体，但伊巴德的道路不会因此断绝。真主不偏袒任何教派，他只裁决真理。」随行的军官报告说，此人被俘时身边仅剩不足百人的残兵，却仍在山谷中组织最后的抵抗，仿佛不知道战争早已结束。\n\n一个不承认任何世俗权威的教派，其领袖被俘后的姿态，竟与被俘前毫无二致——这或许正是伊巴德派最令人忌惮之处：他们没有可以被摧毁的王座，没有可以被挟持的世系，信仰本身就是他们的全部铠甲。"
 EDG_FDMEvents.42.a: "也许你们适合去和真主辩论你们的教义"
 EDG_FDMEvents_42_modifier: "平定叛乱"
 EDG_FDMEvents.43.title: "再次失败的十字军"
 EDG_FDMEvents.43.desc: "突尼斯的港口再一次飘起了法蒂玛的旗帜。那些曾蛰伏于地中海岛屿、妄图趁帝国虚弱之际卷土重来的法兰克十字军，如今被我们的舰队封锁在一座狭窄的海角之上，进退维谷。\n\n我们认出了他们之中的一些面孔——上一次北非远征的幸存者，铠甲上还带着当年战役留下的凹痕。他们的旗帜已被硝烟熏黑，他们的战马已在连月的围困中瘦骨嶙峋，唯有那些绣在盾牌上的十字纹章依旧刺目。一位身披锈蚀锁子甲的骑士被押至阵前，他拒绝跪下，用拉丁语大声喊着什么，身旁的翻译告诉我们：他在呼唤上帝的审判，宣称法兰克人终将重返这片土地。\n\n这已经是法兰克人第二次在北非折戟了。上一次我们放走了幸存者，换来的却是他们卷土重来。这一次，历史不会再重演。"
 EDG_FDMEvents.43.a: "这次我们将不再仁慈"
 EDG_FDMEvents_43_modifier: "平定叛乱"
 EDG_FDMEvents.44.title: "可笑的伪信者"
 EDG_FDMEvents.44.desc: "那位自称伍麦叶哈里发后裔的安达卢斯叛首，被押解至我们的营帐时，身上还穿着一件从格拉纳达宫殿中搜出的仿古白袍——显然试图模仿科尔多瓦哈里发的装束，却因布料粗劣而显得不伦不类。\n\n他跪在地上，双手反绑，眼神中却没有多少恐惧，更多的是一种被揭穿后的羞愤。随行的审讯官报告说，此人的身世经不起任何推敲——他既不会读阿拉伯文，也说不清伍麦叶世系中任何一位哈里发的名字，所谓的「王室血统」不过是他父亲在巴达霍斯的酒馆中编造的故事。然而就是这样一个骗子，竟真的在安达卢斯的残余穆斯林中掀起了风浪——不是因为他有什么真正的号召力，而是因为帝国的衰败让任何谎言都有了被相信的土壤。\n\n一个假先知被揭穿了。但那些追随他的人，那些在绝望中抓住任何一丝希望的安达卢斯穆斯林，他们的绝望并不会因此消散。"
 EDG_FDMEvents.44.a: "就这种程度的组织能力，也想继承伍麦叶的遗产？"
 EDG_FDMEvents_44_modifier: "平定叛乱"
 EDG_FDMEvents.45.title: "[EDG_FDMEvents_45_country_target.GetName]的援助"
 EDG_FDMEvents.45.desc: "在帝国四面受敌的危急时刻，[EDG_FDMEvents_45_country_target.GetName]的统治者向我们伸出了援手，提供了宝贵的军事与经济支持。"
 EDG_FDMEvents.45.a: "我们衷心感谢他们的付出"
 EDG_FDMEvents.45.a_tt: "尽管哈里发极度怀疑@TAB§Y马赞德兰§!对伊玛目的忠诚，但危难之中，接受他们的援助恐怕才是明智之举。"
 EDG_FDMEvents.46.title: "仁慈致盲"
 EDG_FDMEvents.46.desc: "我们对逊尼派臣民的宽容，终于结出了苦涩的果实。\n\n那些被我们善意接纳的逊尼派社区，非但没有感恩戴德，反而在暗中积蓄力量，等待着反击的时机。当帝国的军队被牵制在远方的战场上时，这些曾经温顺的臣民突然举起了叛旗。清真寺的宣礼塔上响起了反对哈里发的呼声，市集上的商人停止缴税，村庄中的壮丁拿起了武器。\n\n仁慈，在这个弱肉强食的世界中，是一种致命的弱点。"
 EDG_FDMEvents.46.a: "该死！"
 EDG_FDMEvents.47.title: "得寸进尺"
 EDG_FDMEvents.47.desc: "伊巴德派的信徒们再次举起了反抗的旗帜。\n\n这些游离于逊尼与什叶正统之外的异端，从来不曾真正臣服于任何一位哈里发。他们只服从由信众公推的伊玛目，而这位伊玛目此刻正率领着从阿曼与也门绿洲中涌出的狂热信徒，沿着古老的商路向帝国的核心地带进军。\n\n我们曾试图以宽容换取他们的安分，但伊巴德派的字典里没有「安分」二字。他们的信仰不允许他们向任何世俗权威低头——哪怕这个权威自称是先知的后裔。"
 EDG_FDMEvents.47.a: "该死！"
 EDG_FDMEvents.48.title: "步步紧逼"
 EDG_FDMEvents.48.desc: "帝国内部的基督徒臣民开始躁动不安。\n\n那些曾经在我们宽容政策下安然生活的天主教徒，如今在罗马教廷的暗中煽动下，开始质疑什叶派哈里发的统治合法性。教堂中的神父在布道时含沙射影地攻击我们的信仰，沿海城市的拉丁裔商人拒绝缴纳天课，甚至有传言说十字军的密使已经潜入了帝国内部。\n\n我们曾以为宽容可以化解一切仇恨，但现实告诉我们：信仰的鸿沟，从来不是善意可以弥合的。"
 EDG_FDMEvents.48.a: "该死！"
 EDG_FDMEvents.49.title: "魔高一丈"
 EDG_FDMEvents.49.desc: "尼罗河上游的科普特教会再次向我们亮出了獠牙。\n\n这些古老的基督徒——埃及大地上最古老的居民——在埃塞俄比亚同宗的暗中支持下，开始秘密组织武装反抗。修道院变成了武器库，修士变成了传令兵，那些曾经在我们庇护下繁荣的科普特社区，如今正在酝酿一场足以撼动帝国根基的叛乱。\n\n我们曾给予他们自由礼拜的权利，给予他们经商的便利，给予他们参与帝国治理的机会。然而，宽容所培养的从来不是忠诚，而是一种可以随时被撤回的容忍。当帝国的力量出现裂痕时，这些曾经感恩的臣民便会发现——感恩原来是一种可以被轻易放下的负担。"
 EDG_FDMEvents.49.a: "该死！"
 EDG_FDMEvents.50.title: "伊玛目的天平"
 EDG_FDMEvents.50.desc: "「他曾将天升起了，并设置了公平。你不要在天平上不公。你们应当秉公地谨守衡度，不要克扣秤量。」——《古兰经》55:7-9\n\n作为先知女儿法蒂玛与阿里的直系后裔，哈里发不仅是世俗的统治者，更是伊斯玛仪派信徒心中至高无上的伊玛目化身。\n\n当年苏莱曼王子在卡比利亚打开城门，接纳了所有愿意归顺的受苦穆斯林，这种宽容曾是我们国家力量的源泉。然而，王朝的治理不得不面对一个根本性的悖论：一个以少数派教义统治多数派臣民的帝国，其存续究竟依赖于信仰的统一，还是依赖于对分歧的默许？\n\n穆斯坦绥尔时代的饥荒与军队哗变，已暴露出这一制度的脆弱：当危机来临时，没有一个统一的信仰核心能够凝聚四分五裂的臣民。\n\n阿克萨清真寺的讲坛上，逊尼派与什叶派的宣礼词交替响起；亚历山大的教堂钟声与开罗的宣礼声共存于同一道城墙之内。法蒂玛王朝的伊玛目们将自己置于这张信仰之网的中央，试图成为所有矛盾的调停者、所有教派的仲裁者。然而，调停者的角色意味着调停者自身不再拥有立场。当布维希人威胁巴格达、当塞尔柱突厥人横扫叙利亚、当十字军叩击海岸之时，法蒂玛宫廷内部的宗教多元已不再是力量的源泉，而是决策瘫痪的根源。\n\n每一个被容纳的教派都成为一个潜在的利益集团，每一份宽容都成为一纸不可撤回的契约。伊玛目的天平越是追求完美平衡，便越是承受不起任何一端的偏移。宽容本身不构成统治，而当宽容取代了统治，帝国便不再属于任何人。"
 EDG_FDMEvents.50.a: "天平的两端，从来不曾真正平衡。"
 EDG_FDMEvents.50.a_tt: "基于历史设定，§M伊玛目的天平§!将设定为倾向§M容忍§!。\n\n历史上，容忍给了法蒂玛王朝惨痛的教训，§R优柔寡断§!和§R妇人之仁§!给法蒂玛王朝带来了深重的苦难和惨痛的教训，§T我们将不会再犯同样的错误§!。"
 EDG_FDMEvents.51.title: "名不副实"
 EDG_FDMEvents.51.desc: "\n「信士们皆为教胞，故你们应当调解你们教胞之间的纷争。你们应当敬畏真主，以便你们蒙主的怜恤。」——《古兰经》49:10\n\n当法蒂玛的旗帜再次飘扬在尼罗河畔，当苏莱曼王子年少时痴痴遥望的开罗城终于回到阿里后裔的手中时，这场复仇与回归似乎达到了历史的顶峰。\n\n但现实却远比史诗残酷。如今统治着埃及的，是一群习惯了马格里布海风与柏柏尔人生活方式的「外乡人」。百年的分离让两地的文化产生了深深的隔阂，埃及本土的阿拉伯人与前朝遗老们在心底里鄙夷这些带着北非口音、行事粗野的新贵族，认为他们不过是窃取了法蒂玛威名、借着十字军与战乱趁火打劫的马格里布强盗。\n\n尽管我们以哈里发自居，但文化上的不认同与离心力让整个统治体系形同虚设。税收受阻，法令难行，那些原本应该臣服于先知血脉的尼罗河子民正酝酿着将我们再次赶回西边沙漠的阴谋。"
 EDG_FDMEvents.51.a: "一个不是埃及人的埃及哈里发？"
 EDG_FDMEvents.51.a_tt: "进入灾难§T名不副实§!。\n\n解锁§Y决议§!：§T名不副实§!：安抚埃及人。\n解锁§Y决议§!：§T名不副实§!：安抚阿尔及尔人。\n解锁§Y决议§!：§T名不副实§!：安抚突尼斯人。\n解锁§Y决议§!：§T名不副实§!：安抚摩洛哥人。\n解锁§Y决议§!：§T名不副实§!：安抚柏柏尔人。\n解锁§Y决议§!：§T名不副实§!：同化马格里布。\n解锁§Y决议§!：§T名不副实§!：重拾埃及认同。\n\n\n本灾难不会带来叛乱，不会影响你的扩张，但本灾难是唯一能够回归§Y埃及§!主流文化的方式，请注意规划。"
 EDG_FDMEvents.51.tt: "该事件属于§T名不副实§!事件组。"
 EDG_FDMEvents.52.title: "名副其实"
 EDG_FDMEvents.52.desc: "经过漫长的文化融合与政治斡旋，马格里布与埃及之间的隔阂终于被弥合。\n\n那些曾经被埃及本土人蔑称为「外乡人」的马格里布贵族，如今已经完全融入了尼罗河畔的社会。他们的子女在艾资哈尔清真寺中诵读古兰经，他们的庄园雇佣着埃及本地的农夫，他们的商队沿着尼罗河谷往来穿梭。文化上的认同不再是问题，税收恢复了正常，法令重新畅通无阻。\n\n法蒂玛王朝不再是一个「名不副实」的外来政权——它已经真正成为了埃及的主人。尼罗河的子民终于接受了阿里后裔的统治，开罗的集市上再次响起了对哈里发的赞美之声。\n\n名副其实，实至名归。"
 EDG_FDMEvents.52.a: "我们是埃及人"
 EDG_FDMEvents.52.a_tt: "灾难§T名不副实§!将会结束。"
 EDG_FDMEvents.53.title: "艾资哈尔的辩论"
 EDG_FDMEvents.53.desc: "艾资哈尔清真寺的讲堂中爆发了一场激烈的辩论。\n\n辩论的一方是来自马格里布的什叶派学者，他们坚持伊斯玛仪派的正统教义，要求帝国的宗教教育完全按照法蒂玛宫廷的规范进行。另一方是埃及本土的逊尼派学者，他们世代传承着自己的学术传统，不愿放弃数百年的知识积淀。\n\n「你们的马立克学派不过是逊尼派的偏见！」马格里布学者厉声斥责。\n\n「你们的伊斯玛仪派不过是少数人的狂想！」埃及学者毫不示弱地回击。\n\n辩论很快从学术争论升级为互相的人身攻击。围观的学生们也分成了两派，有人开始向对方投掷书本和墨水瓶。当哈里发的卫兵赶到时，讲堂已经一片狼藉。\n\n这场辩论表面上是关于教义的分歧，实际上折射出的是整个帝国深层的文化裂痕——马格里布的统治者与埃及的被统治者之间，究竟谁的文化应该占据主导地位？"
 EDG_FDMEvents.53.a: "尊重埃及的学术传统——多元是帝国的力量"
 EDG_FDMEvents.53.b: "推行伊斯玛仪正统——统一信仰才能统一帝国"
 EDG_FDMEvents.54.title: "尼罗河谷的暗流"z
 EDG_FDMEvents.54.desc: "尼罗河谷的深处，一场无声的抵抗正在蔓延。\n\n埃及的农民们没有拿起武器，没有举起叛旗，但他们用一种更为隐蔽的方式表达着对马格里布统治者的不满——他们开始恢复被禁止的古老节日，在田间地头秘密举行传统的丰收仪式，用科普特语而非阿拉伯语教唱古老的歌谣。\n\n更令宫廷担忧的是，一些地方的税收开始出现问题。不是因为歉收，而是因为农民们故意隐瞒产量，将多余的粮食藏在地窖中，或者低价卖给那些同情他们处境的本地商人。马格里布的税吏们对此束手无策——他们可以惩罚个别抗税者，但无法惩罚整个村庄的沉默。\n\n「这不是叛乱，」一位老维齐尔忧心忡忡地说道，「这比叛乱更可怕。叛乱可以用刀剑镇压，但沉默……沉默是无法被镇压的。」"
 EDG_FDMEvents.54.a: "尊重他们的习俗——强行同化只会适得其反"
 EDG_FDMEvents.54.b: "加强管控——帝国的秩序不容挑战"
 EDG_FDMEvents.58.title: "北非的基督徒"
 EDG_FDMEvents.58.desc: "随着帝国的统治中心从马格里布迁至埃及，一个微妙的文化融合正在悄然发生。\n\n开罗的宫廷中，马格里布残余的基督徒与埃及的阿拉伯官僚开始频繁接触。起初，双方充满了戒备与敌意——基督徒精明算计，阿拉伯人朴实直率，两种截然不同的行事风格在朝堂上不断碰撞。然而，随着时间的推移，一些开明的埃及人也开始欣赏这些基督徒的军事才能。\n\n帝国的军事技术正在经历一场静默的变革。穆扎赖卜派教徒和希腊佣兵与埃及的重装步兵体系开始融合，形成了一种全新的作战风格。哈里发敏锐地察觉到了这一变化，并决定将其制度化。"
 EDG_FDMEvents.58.a: "我们会重用这些马格里布的基督徒"
 EDG_FDMEvents.58.b: "没有必要"
 EDG_FDMEvents.60.title: "哈里发调停战争"
 EDG_FDMEvents.60.desc: "哈里发以伊斯兰世界最高精神领袖的身份，要求我们停止与同教兄弟的战争。哈里发的调解代表了整个穆斯林世界的意志，拒绝意味着在伊斯兰世界中声名扫地。"
 EDG_FDMEvents.60.a: "我们接受哈里发的调停。"
 EDG_FDMEvents.61.title: "哈里发授予合法性"
 EDG_FDMEvents.61.desc: "哈里发以先知继承者的至高权威，正式承认了我们的统治合法性。这封盖有哈里发印玺的诏书将在整个伊斯兰世界流传，极大地提升我们的正统性和威望。"
 EDG_FDMEvents.61.a: "感谢哈里发的恩典！"
 EDG_FDMEvents.62.title: "哈里发要求宣誓效忠"
 EDG_FDMEvents.62.desc: "哈里发要求我们以古兰经的名义宣誓效忠。这一古老的仪式将束缚我们的离心倾向，但也将巩固哈里发对我们的宗主权。"
 EDG_FDMEvents.62.a: "我们宣誓效忠于哈里发。"
 EDG_FDMEvents.63.title: "哈里发召集朝觐"
 EDG_FDMEvents.63.desc: "哈里发宣布将通过我们的领土组织一场盛大的朝觐。来自世界各地的穆斯林将途经我们的国土前往圣地，这不仅将提升我们的宗教声望，也将为我们的经济带来可观的收益。"
 EDG_FDMEvents.63.a: "这是莫大的荣耀！"
 EDG_FDMEvents.64.title: "哈里发允许吉哈德"
 EDG_FDMEvents.64.desc: "哈里发以伊斯兰世界最高统帅的名义，允许我们对异教徒发动吉哈德。这一教令将极大地激励我们的士兵，同时也为我们提供了合法的宗教依据来扩张我们的领土。"
 EDG_FDMEvents.64.a: "这是我们扩张的绝佳机会！"
 EDG_FDMEvents.65.title: "我们的请求被拒绝了"
 EDG_FDMEvents.65.desc: "我们满怀期待地向哈里发递交了请求，却收到了一封措辞冷淡的回信。\n\n哈里发以各种冠冕堂皇的理由拒绝了我们的请求——或是声称时机尚未成熟，或是表示需要更多时间审议，又或者干脆以教法为由予以否决。无论如何，结果都是一样的：我们的请求被驳回了。\n\n这不仅仅是一次外交上的挫败，更是对我们在这个伊斯兰世界中地位的一次提醒——在哈里发的眼中，我们或许并不如自己想象的那般重要。"
 EDG_FDMEvents.65.a: "可恶！"
 EDG_FDMEvents.66.title: "选择产物"
 EDG_FDMEvents.66.desc: "选择一个产物进行涨价"
 EDG_FDMEvents.66.a: "取消"
 EDG_FDMEvents.67.title: "选择获得一个理念组"
 EDG_FDMEvents.67.desc: "你可以选择一个理念组"
 EDG_FDMEvents.68.title: "一位神秘的大使"
 EDG_FDMEvents.68.desc: "一位自称来自摩洛哥的神秘使者，在夜色掩护下秘密抵达了我们的宫廷。\n\n他自称是被穆瓦希德王朝覆灭的马林家族后裔，声称在摩洛哥民间仍拥有广泛的支持者网络。他带来了一份大胆的提议：如果我们愿意支持他发动一场针对穆瓦希德统治的叛乱，他将在成功后向法蒂玛宣誓效忠，并为我们提供摩洛哥的战略情报与内部支持。\n\n「穆瓦希德的统治已经摇摇欲坠，」使者低声说道，「他们对什叶派的迫害、对异见者的镇压，已经让整个摩洛哥民怨沸腾。只需要一个火星，就能点燃这场燎原之火。而您，至高的哈里发，就是那个手持火种的人。」"
 EDG_FDMEvents.68.a: "这会成为我们对付穆瓦希德的绝佳工具！"
 EDG_FDMEvents_68_modifier: "马林家族后人的支持"
 EDG_FDMEvents.69.title: "尾声"
 EDG_FDMEvents.69.desc: "当最后一位敌人在法蒂玛的铁蹄下臣服，当旧大陆的每一寸土地都飘扬着绿旗，当伊斯玛仪派的信仰从大西洋延伸到太平洋——一个横跨三大洲的伊斯兰帝国，在阿里后裔的手中完成了统一。\n\n开罗的宫廷中，哈里发站在艾资哈尔清真寺的最高处，俯瞰着脚下这片辽阔的疆域。尼罗河的涛声、红海的波涛、地中海的海风、印度洋的季风——所有的风都朝着同一个方向吹拂，仿佛整个世界都在向这位先知的后裔致敬。\n\n从卡比利亚的荒凉海岸到这片广袤的帝国，这条路我们走了太久太久。先祖苏莱曼的遗愿、穆仪兹的梦想、法蒂玛王朝二百年来的血与泪——在这一刻，都化作了最丰美的果实。\n\n法蒂玛的旗帜，终于覆盖了整个世界。"
 EDG_FDMEvents.69.a_tt: "感谢您游玩@FDM§Y法蒂玛§!的全部内容！\n\n作者§P胆小菇QAQ§!在此祝您生活愉快，游戏开心！"
 EDG_FDMEvents_69_modifier: "世界的哈里发"
 EDG_FDMEvents.70.title: "谨遵先知教诲"
 EDG_FDMEvents.70.desc: "新哈里发即位之际，宫廷中的宗教学者们齐聚一堂，为新任统治者举行一场庄严的仪式。\n\n按照法蒂玛王朝的传统，每一位新哈里发在正式亲政之前，都必须从先知穆罕默德的十二种美德中选择一种作为自己统治时期的指导原则。这些美德记载在古老的圣训之中，每一种都代表着一种治国理念与人生哲学。\n\n「至高的哈里发，」首席乌理玛恭敬地说道，「请从先知的教诲中选择您的道路。慈悯、诚实、坚忍、感恩、谦虚、正义、宽容、慷慨、孝亲、知足、守信、洁净——每一种美德都将成为您统治的基石，影响着帝国未来数十年的走向。」\n\n哈里发缓缓闭上双眼，在心中默念着先知的名字。"
