#地方组织
 EDG_FDM_holy_order_1: "§T维拉亚特§!"
 EDG_FDM_holy_order_1_short: "§T维拉亚特§!"
 EDG_FDM_holy_order_1_full: "§T维拉亚特§!"
 EDG_FDM_holy_order_1_desc: "维拉亚特是伊斯兰世界对行省的称呼，源自阿拉伯语「管辖」一词。自阿拔斯王朝以来，哈里发与苏丹们将广袤的领土划分为若干维拉亚特，由中央派遣的瓦利总督治理。瓦利掌管辖区内税收、司法与军事征调，但其权力受到中央迪万的严格监督。在马穆鲁克的叙利亚与埃及的边远属地，维拉亚特制度维系着庞大帝国对远方领土的控制。"
 EDG_FDM_holy_order_2: "§T苏克§!"
 EDG_FDM_holy_order_2_short: "§T苏克§!"
 EDG_FDM_holy_order_2_full: "§T苏克§!"
 EDG_FDM_holy_order_2_desc: "苏克是伊斯兰城市的心脏——尘土飞扬的露天市场，或是穹顶覆盖的封闭商栈。在这里，香料商、织工、金匠与书商各据一隅，按行会组织经营。穆赫塔西卜巡视其间，检验秤砣、纠察欺诈、维护真主所喜的公平交易。从非斯到撒马尔罕，苏克连接着丝绸之路的驼队与印度洋的帆船，是黄金与丝绸的集散地。控制一座繁荣的苏克，便控制了城市的命脉。"
 EDG_FDM_holy_order_3: "§T加齐§!"
 EDG_FDM_holy_order_3_short: "§T加齐§!"
 EDG_FDM_holy_order_3_full: "§T加齐§!"
 EDG_FDM_holy_order_3_desc: "加齐，意为「征伐者」，是对为信仰出征之战士的尊称。在安纳托利亚的边疆地带，加齐们既是虔诚的圣战士，也是渴望战利品与封地的冒险者。他们突袭拜占庭的堡垒，劫掠基督教商队，将异教徒的土地纳入伊斯兰的版图。加齐精神既是宗教狂热，也是开拓边疆的实用主义，"

