 rigaExpandDisaster.100.name:0 "落点"
 rigaExpandDisaster.100.desc:0 "[riga_rebel_target.GetName]首都的旗帜在烈火中熊熊燃烧，这场席卷东欧与北欧的灾难终于落下帷幕。\n\n然而这场灾难没有赢家。叛军的将军死了，效忠者的骑士也死了；扶植的傀儡被吊在绞刑架上，而[Root.Monarch.GetTitle]也只剩下半条命。波罗的海沿岸的繁华城邑，如今被洗劫一空，只剩飘着呛人的焦味的残垣断壁。街道上躺着无人收殓的尸体，乌鸦啄食着尸骸的眼睛。商人破产，农民弃田，教堂的铜钟被熔成箭头，修道院的忏悔室成了伤兵营。最终还是百姓承受了所有的苦难。\n\n如今，这场灾难的始作俑者与涉事人员都被锁在里加的地牢里。他们的命运如同一把尚未落下的闸刀，悬在[Root.Monarch.GetTitle][Root.Monarch.GetName]手中。如果我们对这件事扩大化处理，那么可以有效的彰显我们的权威，起杀一儆百之效；不过考虑到刚刚经历的浩劫，我们也有充分的理由来从轻发落。\n\n里加的改革还未完成，不论[Root.Monarch.GetTitle]做出何种选择，过去的已经过去了，玛丽亚之地应当继续它的旅程，我们的演出还并未落幕。"
 rigaExpandDisaster.100.aa:0 "没有再流血的必要了"
 rigaExpandDisaster.100.bb:0 "杀一儆百！"

 rigaExpandDisaster.200.name:0 "天堂之战"
 rigaExpandDisaster.200.desc:0 "纵观历史，没有一个帝国能够持续千百年屹立不倒。即使如东罗马帝国一般几经摧残仍苟延残喘，也逃不过葬于土灰之间。\n\n不论[Root.Monarch.GetTitle][Root.Monarch.GetName]曾经采取了如何措施防微杜渐，又是如何做出努力平息各个主教区之间的争端，如今也不得不面对一个铁一般的事实——里加这座庞大的国家行政机器已经出现了严重的故障。\n\n在里加附庸体系规模较小之时，还能够对各个属国进行较为集中的权力管理；但随着里加附庸体系的不断扩大，边远地区属国信息传达的速度也在不断的降低，而这些信息再路途当中还会存在各式各样的问题，里加方面对此类信息进行甄别与核实的成本也越来越高，因此必要的分权政策应运而生。在欧洲各国都在加紧权力集中化之时，里加只能够不断的通过放权来拓展附庸体系。\n\n曾经的改革也许在一定程度上的杜绝了“下克上”的可能，但这并不代表一劳永逸的解决了整个附庸体系的稳定。随着各个主教区的军事与经济实力不断的发展，其下的各个阶级也在紧锣密鼓的行动，试图在各个方面获得最大化的利益，而这其中的参与者不乏各类“暴徒”。\n\n曾经规模较小之时里加还能够对各个属国内部事务加以管制，而随着版图的扩张，各类分离主义者与宗教叛军的行为愈发严重，规模也愈发庞大，在远离里加的边远主教区当中暴力事件层出不穷，并且已成燎原之势扩张，各个主教区管辖范围内的不同叛军相互勾结，不断的干扰着主教区的运作，并且各个主教区下的各个阶级也都在蠢蠢欲动，试图从这座庞大的机器当中汲取更大的利益。\n\n过度而不加以节制扩张所带来的问题还远不止内忧，外部已经有国家察觉到了里加已经陷入内部治理战争的泥潭之中，正在静静的等待着里加这座庞大行政机器轰然倒塌，待彼时从其中的残骸当中获取一杯羹，对我们的敌人来说，战争并不失为一种有效的解决方式。\n\n内忧外患之际，里加必须做出她的选择。"
 rigaExpandDisaster.200.aa:0 "何去何从？"
 rigaExpandDisaster.200.aa.tt:0 "在§R天堂之战§!期间，如若我们的§Y主教区§!属国独立倾向高于§Y50%§!，他们将§R脱离§!我们的掌控谋求独立。\n\n由于我们目前需要专注于自身内部动乱，因此§Y里加利亚§!将陷入四方无援的境地，这将导致§R极其严重§!的后果\n\n请确保§Y[riga_authority_of_the_diocese.GetName]§!保持在较高水平，如若过低则会发生一些§R不可预料§!的后果\n" 
 rigaExpandDisaster.201.name:0 "天堂之战"
 rigaExpandDisaster.201.desc:0 "随着我们宗主国日益衰退的掌控力，我们主教区内的骚动也愈演愈烈，我们必须立刻团结起来应对这场灾难！"
 rigaExpandDisaster.201.aa:0 "战争与和平，永恒的话题"
 rigaExpandDisaster.210.name:0 "黎凡特反击"
 rigaExpandDisaster.210.desc:0 "马什里克地区自征服以来分离主义运动便一直十分严重，不断的骚扰着正常的生产活动，并要求独立。\n\n而在最近，他们在外部势力的帮助之下占据了几座城市与堡垒并宣布独立。"
 rigaExpandDisaster.210.aa:0 "我们不容许如此等行为"
 rigaExpandDisaster.251.name:0 "[rig_subject_unrest_target.GetName]主教区崩溃"
 rigaExpandDisaster.251.desc:0 "由于各式各样的原因，[rig_subject_unrest_target.GetName]主教区内部的冲突规模越来越大，直到政府再也无法承受而崩溃，国家各机构现已基本停罢，各式各样的分离主义者占据了一座座城市与堡垒并宣布独立。\n\n这种行为是对[Root.Monarch.GetTitle][Root.Monarch.GetName]权威的严重挑战，如若无法收回这些领地，那么我们在各个主教区内的威信将严重下降。"
 rigaExpandDisaster.251.aa:0 "击溃叛乱者"
 rigaExpandDisaster.251.aa.tt:0 "我们将向所有分裂出去的国家以§Y吞并§!的理由宣战"
 rigaExpandDisaster.251.bb:0 "我们现在并无余力..."


 rigaExpandDisaster.300.name:0 "地狱之战"
 rigaExpandDisaster.300.desc:0 "我们的宗主国里加陷入了一场浩劫，叛乱席卷了里加整个附庸体系，各个被征服地区不断的宣布独立。叛乱，暴动弥漫在所有主教区，疲于应付国内形式的里加已经无法为我们提供任何形式的支援，我们现在只能够靠我们渡过之后的难关。\n\n里加利亚自建立之初就确立了各地区高度自治的共和体制，各地区均有较高的军事与经济自治度，这一点与里加并无太大区别，但不同的是里加利亚一直以一种“联合”的方式团结起整个国家，而非类似里加一样的臣属关系。这其中有利有弊，利好之处便是能够以十分高效的速度对未加探索之处进行殖民宣教活动，而弊端则在此时展现的可谓“淋漓尽致”。\n\n就在数个月之前来信通知远在天边的里加已无精力再对里加利亚进行任何形式的支援之时，国内的骚动便开始了，里加利亚必须开源节流以维持国家的正常运转，但显然各个地区并不期望在自己头上实施各种缩减开销的政策，同时在此期间它们逐渐发现，自己从国家当中独立出去更加符合自身利益之时，里加利亚的崩溃就此开始。\n\n短短数个星期之内，里加利亚各个地区便纷纷不再服从中央政府的管制，并在近日宣布独立。而更加过分的是，他们已经不满足于现状，将视线转向了里加利亚，试图从里加利亚直辖地区的寻求财富，并打着“解放”的名号来通告[Root.Monarch.GetTitle][Root.Monarch.GetName]立刻解散神圣共和国，一切权利交还于人民，由此来对里加利亚各个教堂的财富进行掠夺。\n\n值此危机时刻，[Root.Monarch.GetTitle][Root.Monarch.GetName]必须做出他的选择"
 rigaExpandDisaster.300.aa:0 "这才是我们的道路！"
 rigaExpandDisaster.300.bb:0 "唯有死亡才是责任的尾声"
 rigaExpandDisaster.300.bb.tt:0 "§R这并不是请求，而是通告§!\n\n所有分离出的国家将一同对§Y里加利亚§!宣战"

 RigaExpandFlavour.0.name:0 "城市日志：柯尼斯堡"
 RigaExpandFlavour.0.desc:0 "最初，柯尼斯堡的所在位置是由古普鲁士人建立的几处定居点，称为特旺斯特。1255年，条顿骑士团征服了普鲁士的桑比安部落，特旺斯特被摧毁，随后一个新的要塞在原地建立，称为柯尼斯堡，意为国王之山，以纪念波希米亚国王普热米斯尔·奥托卡二世。正是奥托卡国王捐资兴建了本地第一座城堡，柯尼斯堡城堡。围绕新城堡，沿普列戈利亚河逐渐发展出阿尔茨塔特、克奈普霍夫和勒贝希特三个镇，距离维斯瓦潟湖约4.5英里，条顿骑士团也将柯尼斯堡作为攻占桑比亚半岛和与立陶宛大公国作战的基地。1262-1263年，因不满条顿武士团强迫其改变宗教信仰，普鲁士人举行起义，柯尼斯堡被围攻，最终在宝剑骑士团的帮助下才得以解围。\n\n1340年，柯尼斯堡成为汉萨同盟的成员，城市快速发展成波罗的海东南部的重要港口，来自普鲁士、波兰王国和立陶宛大公国的货物在此交易。1324－1330年，作家杜伊斯堡的彼得很可能就是在柯尼斯堡写就了其代表作《普鲁士编年史》。\n\n虽然在格伦瓦尔德战役中遭受惨败，但整个波兰-立陶宛-条顿战争期间柯尼斯堡一直都处于条顿骑士团的控制之下，战后宝剑骑士团接替了柯尼斯堡的防务，并参与到被瓦迪斯瓦夫二世军队占领过的城镇的重建中。\n\n随着条顿骑士团本土的战事愈发稀少，柯尼斯堡开始逐渐向外扩建城区以寻求更加迅速的发展，而周围经济也在其带动之下开始增长。"
 RigaExpandFlavour.0.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.1.name:0 "城市日志：玛丽安堡"
 RigaExpandFlavour.1.desc:0 "1274年，条顿骑士团平定“大普鲁士起义”后，开始着手兴建高堡，建设工作一直持续到十四世纪初。完工后的高堡兼具宗教与防御功能，这种综合性建筑在当时欧洲的城堡中独树一帜，因而成为此后骑士团兴建城堡的样本。1309年，骑士团总团长将总部从威尼斯迁到玛丽安堡，开启了城堡建设的新阶段，玛丽安堡外逐步建成中堡，中堡大致呈方形，由三栋相连的大楼围绕方形庭院构成，西北面是总团长宫和骑士大厅，东北面是入口及待客处，东南面是来客住所，第四面向高堡开放，经通道可进入玛丽安堡。与此同时，玛丽安堡本身也经历了大规模改建，面积扩大、整体加高。\n\n这座城堡目前占地面积是温莎城堡的4倍，能够容纳居住大约3000名骑士团成员，按面积衡量，玛丽安堡算得上世界最大的欧式城堡，也是欧洲最大的砖造建筑，而随着条顿骑士团本部的不断扩张，这座城堡的扩建已经提上了日程，尽管玛丽安堡本质上仍然是军事设施，但由于骑士团规模的日益增长与本土愈发稀少的战事，城堡外围不断衍生出各种产业，依托经由但泽港口而来的商人，玛丽安堡地区逐渐繁盛。"
 RigaExpandFlavour.1.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.2.name:0 "城市日志：利夫兰"
 RigaExpandFlavour.2.desc:0 "利夫兰城（现在被称为费林）坐落在维尔扬迪湖畔，一条可通航的水道将波罗的海与楚德湖相连，另一条陆路则连接南、北爱沙尼亚。得天独厚的地理条件，使其早在维京时代便已形成重要的史前定居点，并建有一座山丘堡垒。该城最早见于文字记载是在1154年，阿拉伯地理学家伊德里西在其所编的地图注释中以“法拉穆斯”之名提及此地。然而，利夫兰真正登上历史舞台，是在北方十字军东征时期。\n\n1211年，由德意志人、拉脱维亚人和利夫人组成的联军包围了利夫兰山丘堡垒。1223年8月，宝剑骑士团从一支罗斯人驻军中夺取了该城。次年，宝剑骑士团团长沃尔奎因在山丘堡垒的原址上下令兴建§Y费林城堡。这座城堡是宝剑骑士团在爱沙尼亚南部规模最大、最为坚固的据点，也是整个波罗的海地区最强固的城堡之一。不久，城堡前方逐步建起了中世纪城镇。1238年，骑士团团长威廉·冯·舒博尔希特向该城颁发了城市特许状。1283年，该城正式获得城市权利。\n\n14世纪初，利夫兰加入了§Y汉萨同盟§!，成为爱沙尼亚的四座汉萨城市之一。作为汉萨同盟的成员，利夫兰依托波罗的海的贸易网络，逐渐发展成为南部爱沙尼亚的重要商业中心。到了1444年，利夫兰已是利沃尼亚联邦南部的一座重要城堡城市，受利沃尼亚骑士团的直接管辖，同时也是汉萨同盟的成员。其坚固的城堡和活跃的贸易活动，使其在利沃尼亚的政治版图中占据着不可忽视的地位。"
 RigaExpandFlavour.2.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.3.name:0 "城市日志：维尔纽斯"
 RigaExpandFlavour.3.desc:0 "维尔纽斯地区在公元前就已经有人定居，其位于维尔尼亚河和内里斯河的汇合处，城市的名称据信就源自穿城而过的维尔尼亚河。1323年立陶宛大公国定都在维尔纽斯，同年格季米纳斯大公写信给德意志诸城，邀请德意志人和犹太人来到这里定居。这是该市在文献中的首次记载。\n\n里加在此地建立政府后，该市很快建起了城墙，依托里加在波罗的海的贸易影响力快速发展并建立了维尔纽斯耶稣会大学。该城市的政治、经济和社会活动均十分活跃，并且由于地处东欧与波罗的海的交接之处，放宽移民政策之后维尔纽斯便涌入了大量的移民群体，每个团体都对这座城市的生活做出了独特的贡献，使得维尔纽斯手工业、贸易和科学繁荣起来。\n\n虽然在神权政府的统治下，但维尔纽斯对各宗教的态度却十分宽容。它不仅是一个文化多元的城市，也是一个多种宗教并存的城市，还有一个广为人知的绰号：“立陶宛的耶路撒冷”。部分其它宗教团体在城市当中蓬勃发展，城市也为从别处而来的宗教难民提供庇护。"
 RigaExpandFlavour.3.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.4.name:0 "城市日志：但泽"
 RigaExpandFlavour.4.desc:0 "在公元997年圣阿德尔伯特授让君位后，这一城市名称才被确定，，而在当地卡舒比语中则称为Gduᑄsk，而由于该城市的德国人数量占优势，因此德国名称但泽（Danzig）也被广泛地使用。\n\n但泽北面濒临波罗的海的但泽湾，这是一个略呈半圆形的海湾，位于波罗的海的东南部，部分以海尔半岛与波罗的海的主体相分隔，并有维斯瓦河注入，维斯瓦河的河口分出许多道汊流，但泽市区就位于干流左侧的一道汊流——摩特拉瓦河两岸，河岸地带是这座港口城市的发祥地。\n\n有学者认为但泽要塞是在980年代由波兰国王梅什科一世所建立，但又有人认为997年才是该市的成立日期，因为在那一年，波兰国王波列斯瓦夫一世派圣人布拉格阿达尔贝特为但泽居民施洗。波美拉尼亚但泽公爵的徽章此后，但泽是波美拉尼亚公爵统治下的一个波兰割据公国的主要中心。其中最为著名的公爵是斯威托佩克二世，他于1235年左右批准通过了但泽的自治宪章，当时该市有2,000名居民。到1308年之前，但泽已经发展成为一个繁荣的贸易城市，拥有10,000名居民，当时很少有城市能够达到这样的人口规模。1308年11月13日，条顿骑士团征服并毁坏了这座繁荣的城市，制造了但泽大屠杀，这次屠杀导致了该市的衰落，并引发了条顿骑士和波兰之间一系列的战争，直到1343年签订和约，条顿骑士承认他们占领的波美拉尼亚是他们从波兰国王那里接受的“救济”。尽管仍然存在一些法律方面关于领地财产归属权的争议，但是这个协议最终确立了但泽在1343年成立了市政当局，并发展了波兰经维斯瓦河进口粮食的贸易路线。在条顿骑士控制的年代，这座城市的规模和贸易得到了恢复和发展，日耳曼人的影响也增加了。1361年，但泽成为汉萨同盟成员之一，并成为汉萨同盟中普鲁士和利沃尼亚商圈的首席城市，贸易范围包括普鲁士、波罗的海东岸的条顿骑士团领地、以及波兰和瑞典。\n\n之后但泽经由波兰王国与条顿骑士团之间不断易手，直到波兰王国的彻底分裂才结束了围绕但泽将近百余年的冲突。在汉萨同盟时代以来的数百年间，但泽始终是波罗的海沿岸地区一个重要的航运与贸易中心。虽然在历次的战争中曾经几度衰落，但是在每次衰落之后不久，它都能够利用它的区位优势，恢复过去的繁荣。我们理当继续建设完善这座城市。"
 RigaExpandFlavour.4.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.5.name:0 "城市日志：斯德哥尔摩"
 RigaExpandFlavour.5.desc:0 "斯德哥尔摩，在瑞典语中意为“木头岛”，坐落于梅拉伦湖与波罗的海之间的咽喉要地，群岛环抱，水道交错。关于这座城市的确切创立年份，史料多指向1252年：当时瑞典摄政王比尔格·雅尔为稳固瑞典东部的交通与防务，在此地修筑据点。到了13世纪末，斯德哥尔摩已不再只是湖口处的一道关卡，而是连接瑞典内陆、芬兰海岸与波罗的海贸易网络的重要节点。1397年，在丹麦女王玛格丽特一世的主持下，瑞典、挪威与丹麦在瑞典南部的卡尔马结成共主联盟，三国共戴同一位君主。斯德哥尔摩作为瑞典的最大城市，成为卡尔马联盟在瑞典的政治中心。\n\n同时在经济方面，斯德哥尔摩的繁荣和汉萨同盟密不可分。瑞典与汉萨同盟达成的贸易协议，确保了汉萨商人在瑞典免缴关税的自由以及在此定居的权利。得益于与汉萨同盟的贸易联系，斯德哥尔摩迅速成为连接东西方贸易的枢纽。瑞典中部出产的优质铁矿与铜矿，经由斯德哥尔摩的码头装船，运往吕贝克、但泽等汉萨同盟城市，再转售至整个欧洲大陆。斯德哥尔摩虽从未正式加入汉萨同盟，但德意志商人在城中势力雄厚，影响力随处可见。\n\n到了1444年，斯德哥尔摩已是卡尔马联盟中瑞典王国的核心城市。城中的三王冠宫历经数次扩建，此时已成为瑞典王权的重要象征。斯德哥尔摩的街道上，瑞典语与低地德语交织回响，铜与铁的贸易为这座古老的城市注入了源源不断的财富。"
 RigaExpandFlavour.5.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.6.name:0 "城市日志：隆德"
 RigaExpandFlavour.6.desc:0 "隆德的名字源自古丹麦语中的“树林”一词，因城市最初建于一片茂密的林地之中。隆德位于斯科讷地区最富饶的平原之上，距离厄勒海峡约八英里，是北欧最古老的城市之一。\n\n隆德的建城可追溯至公元990年左右。当时斯科讷地区尚属丹麦王国管辖，八字胡须王斯文一世将乌普奥克拉村的居民迁至一处便于防御的高地，是为隆德建城之始。此后不久，其子克努特大帝于1019年在此设立铸币厂，进一步凸显了这座城市的重要性。1060年，克努特大帝宫廷中的一位英格兰牧师亨利被任命为隆德教区的首任主教，但当时的丹麦教会仍隶属汉堡-不来梅大主教区。1103年，丹麦国王埃里克一世成功说服教皇巴斯卡二世，将隆德设立为北欧大主教驻地，管辖丹麦、挪威、瑞典三国的教会事务，就此摆脱了德意志主教的控制。1104年，首任大主教在隆德就任，其由此成为北欧的基督教中心。\n\n中世纪鼎盛时期，隆德城内拥有包括修道院在内的二十七座教堂，其教堂数量超过任何一座北欧城市。大教堂学校成立于1085年，是北欧最古老的学校之一。隆德大教堂也是斯堪的纳维亚地区第一座大型罗曼式石质教堂，其建筑风格在此后的数百年间深刻影响了整个北欧的教堂建造。\n\n1332年至1360年间，斯科讷地区曾短暂处于瑞典的统治之下，在此期间隆德亦为瑞典所控制，后丹麦收复此地。1397年卡尔马联盟建立，隆德作为丹麦在斯科讷地区最重要的宗教与政治中心，在联盟框架下保持了其原有的地位。到1444年，隆德的钟楼依旧在平原之上稳稳矗立，诉说着往日的荣光，默默注视着波罗的海的风云变幻。"
 RigaExpandFlavour.6.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.7.name:0 "城市日志：波兹南"
 RigaExpandFlavour.7.desc:0 "波兹南之名一说源于古波兰语“poznać”（意为“认识”或“记住”），源自早期皮亚斯特王朝在此建立的政治与宗教中心。该城坐落于瓦尔塔河畔大波兰平原的中心，地处瓦尔塔河与其支流齐比纳河的交汇之处，自古以来便是水陆交通的咽喉要道。10世纪时，波兰首任有记载的统治者梅什科一世在波兹南的大教堂岛上修建了一处坚固的公爵要塞并将此地设为波兰首都，966年，他在此接受基督教洗礼，使波兰正式成为基督教世界的一员，确立了波兰国家的宗教与政治基础。此后不久，波兰第一座主教座堂——圣伯多禄圣保禄圣殿总主教座堂亦在岛上动工兴建，大教堂内至今保存着这两位波兰奠基者——梅什科一世及其继承者，也是波兰历史上第一位国王波列斯瓦夫一世的石棺。\n\n11世纪中叶，波兹南遭波希米亚公爵布热季斯拉夫一世的入侵，公爵城堡被摧毁，波兰国王卡齐米日一世将首都迁往克拉科夫。波兹南虽失去了首都地位，却依然是大波兰地区的首府与主要行政中心。\n\n1253年，大波兰公爵普热梅斯瓦夫一世与其兄弟波莱斯瓦夫共同颁布了城市特许状，依据德意志法律在瓦尔塔河左岸建立了一座全新的“特许城镇”。公爵在新区旁修筑了新的城堡，并授予城市一系列贸易与司法特权。新的波兹南城由此迅速崛起。与此同时，波兹南因地处大波兰平原中心，通过瓦尔塔河—奥得河水系与更广阔的贸易网络相连，逐渐发展成为中欧重要的谷物、毛皮与林业产品贸易中心，来自西里西亚、波希米亚与德意志诸邦的商人络绎不绝。\n\n到了1444年，波兹南已是波兰地区最重要的城市之一。这座城市见证了皮亚斯特王朝的兴衰，目睹了雅盖隆王朝的崛起和波兰的分裂，主教座堂的祷告声在大波兰平原上萦绕了数个世纪，也必将继续回响下去。"
 RigaExpandFlavour.7.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.8.name:0 "城市日志：华沙"
 RigaExpandFlavour.8.desc:0 "华沙坐落于维斯瓦河中游的河岸高地之上，地处马佐夫舍平原，是中欧诸国贸易的通商要道。当地最早的定居点可追溯至9世纪，但华沙作为城市的真正起源始于13世纪马佐夫舍公爵在此修建城堡控制维斯瓦河渡口。1339年，一份文献首次提及华沙的名称，记载了关于马佐夫舍公爵领地的归属争议。1344年，华沙成为马佐夫舍公国的首都，此后历任公爵在此居住，城市功能迅速完善，政治地位日益显赫。14世纪期间，奥古斯丁教堂和修道院、圣母玛利亚教堂、圣约翰教堂等宗教建筑陆续动工，为这座城市留下了第一批哥特式的建筑。到了1444年，华沙虽然尚未迎来日后作为全国首都的辉煌，却已经是一座在河流、城堡与市场之间稳步成长的城镇。它见证了马佐夫舍公爵的统治，见证了这片土地上的人民如何在波兰诸邦分裂的年代里保持自身的活力，也注定要在未来的数个世纪中成为这片土地的心脏与灵魂。"
 RigaExpandFlavour.8.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.9.name:0 "城市日志：斯摩棱斯克"
 RigaExpandFlavour.9.desc:0 "斯摩棱斯克坐落于第聂伯河上游的丘陵之间，控制着连接波罗的海与黑海的古老商路要冲。据说斯摩棱斯克附近森林盛产用于船只建造与修补的松脂与焦油，城市之名也源于古东斯拉夫语中的焦油。\n\n斯摩棱斯克的历史可追溯至公元863年，在那时它已是控制第聂伯河与西德维纳河之间陆路转运的关键堡垒，扼守着连接莫斯科与西欧的贸易通道。882年奥列格南征占领了斯摩棱斯克并将其并入基辅罗斯，而斯摩棱斯克公国在12世纪基辅罗斯分裂后又成为一个独立的政治实体。13世纪蒙古西征席卷罗斯诸邦之际，斯摩棱斯克侥幸避开了彻底毁灭的命运。虽然公国被迫向金帐汗国纳贡，却保留了相当程度的自治权。然而随着基辅罗斯旧秩序的瓦解，新的强邻开始崛起。1386年的维赫拉河战役后，斯摩棱斯克公国最终成为立陶宛大公国的附庸；1407年，当地的商人卫彻议会推翻了无道的留里克王公，并建立了一个卫彻共和国，随即被自耕农和市民推翻并组建了一个否定贵族的政府。\n\n到了1444年，虽然历经无数战火，但是斯摩棱斯克依然是重要的贸易与手工业中心，在执政官尤里和底层群众愈演愈烈的冲突中静静地守望着第聂伯河的河水，等待着命运的下一次转折。"
 RigaExpandFlavour.9.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.10.name:0 "城市日志：莫斯科"
 RigaExpandFlavour.10.desc:0 "莫斯科得名于源于穿城而过的莫斯科河。在古斯拉夫语中，这个词亦有潮湿之意，恰如其分地描绘了这片水网密布的土地。1147年，苏兹达尔王公尤里·多尔戈鲁基在一封写给盟友的信中说道：“到我这里来，兄弟，请到莫斯科来。”这是莫斯科最早见于史册的文字记载。1156年，尤里在莫斯科河与亚乌扎河交汇处的一处高地上，修筑了一座泥木结构的城堡，这便是克里姆林宫的雏形。\n\n13世纪初，莫斯科成为独立的公国，在弗拉基米尔-苏兹达尔公国的诸子嗣中并不显赫。然而蒙古帝国的大军如同草原上的风暴席卷而来，彼时尚为小城镇的莫斯科被洗劫一空，克里姆林宫的木质城墙在烈火中化为灰烬。蒙古人的铁蹄踏碎了罗斯诸公国的旧秩序，莫斯科从此沦为金帐汗国的附庸。\n\n1276年，亚历山大·涅夫斯基的幼子丹尼尔·亚历山德罗维奇获封莫斯科领地，成为莫斯科公国的第一位统治者。他夺取了科洛姆纳，又继承了佩列斯拉夫尔-扎列斯基，为公国的扩张迈出了最初的几步。此后，莫斯科大公们通过贿赂、联姻与征战，逐步兼并周边领地，并在与金帐汗国的周旋中积累了财富与声望。1320年，绰号“钱袋”的伊凡一世开始用橡木和石灰石重建克里姆林宫，1325年他又将东正教都主教府从弗拉基米尔迁至莫斯科，从此莫斯科不仅是大公的驻跸之地，更成为罗斯诸公国的宗教中心。1380年，德米特里·顿斯科伊大公在库利科夫平原上击败了金帐汗国的马麦汗。虽然莫斯科在此后不久再度被蒙古人攻陷，但库利科夫战役的胜利如同一道曙光，照亮了罗斯民族摆脱蒙古枷锁的前路。莫斯科公国在罗斯诸公国中的领导地位，由此得以确立。\n\n到了1444年，莫斯科虽仍处于特维尔-莫斯科战争的阴云之下，但已是全罗斯诸公国中最具实力的城市之一。克里姆林宫的木墙已部分换成了白色的石墙，城内矗立着圣母升天大教堂、天使长大教堂等雄伟建筑，城墙外的商业区和手工艺聚居区正在不断扩展。来自北方的毛皮、南方的香料、西方的金属制品、东方的丝绸，都在莫斯科的市场上一应俱全。"
 RigaExpandFlavour.10.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.11.name:0 "城市日志：沃里尼亚"
 RigaExpandFlavour.11.desc:0 "沃里尼亚（现在叫做弗拉基米尔-沃伦斯基）坐落于西布格河与卢哈河流域之间的沃伦平原之上，是连接罗斯腹地、波兰与喀尔巴阡山贸易通道的重要节点。城市名称源于基辅大公弗拉基米尔一世“圣弗拉基米尔”，这位罗斯的洗礼者于988年前后在征服沃伦地区后下令修建此城，并以自己的名字命名。\n\n依据基辅大公的分封制，988年，弗拉基米尔一世将其子弗谢沃洛德·弗拉基米罗维奇封于此地，使之成为沃里尼亚公国的中心。1124年，一场严重的地震曾重创城市，但凭借其优越的地理位置与富庶的周边土地，沃里尼亚很快恢复了元气，并继续保持其在相邻地区的主导地位。1199年，沃伦王公罗曼·姆斯季斯拉维奇征服邻近的加利奇公国，将两个公国合并为加利西亚-沃里尼亚王国，此后他加冕为罗斯国王，沃里尼亚作为该王国的政治中心之一，一度成为罗斯西南部最为重要的城市。\n\n1240年，拔都率蒙古大军席卷基辅罗斯，沃里尼亚亦被攻陷。城市虽遭浩劫，但并未像基辅那样完全沦为废墟。在蒙古人治下这座城市仍保留了相当程度的自治权，并在此后的百余载中逐步恢复元气，直到1443年爆发的基辅罗斯内战又一次将这座城卷入风暴。不过不管卢加河是多么波涛汹涌，白石建造的巍峨的圣母升天大教堂依旧耸立于城市天际线之上，一如三百余年的往昔和无边无涯的未来。"
 RigaExpandFlavour.11.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.12.name:0 "城市日志：波多里亚"
 RigaExpandFlavour.12.desc:0 "波多里亚（又被称为卡缅涅茨）坐落于斯莫特里奇河的臂弯之中。这条河流在漫长的地质年代里将德涅斯特河左岸的这片高原深深切割，形成一个蜿蜒的峡谷。城市的缔造者们在峡谷环抱的一个天然石岛上安放了最初的奠基石，自此三面环绕的悬崖峭壁便成了这座城永不陷落的天然墙垣。\n\n该城始建于1062年，见于《伊帕捷耶夫编年史》的记载。在基辅罗斯时代，波多里亚已是加利西亚-沃里尼亚公国治下的重要要塞，商贾往来于黑海与波罗的海之间，云集于此。这座屹立于山巅的城堡，不仅守护着罗斯西南的广袤平原，更成为当地东正教信仰的文化堡垒。其坚固的石墙、高耸的塔楼与蜿蜒的防御工事，在罗斯诸城中独树一帜。14世纪中叶，立陶宛大公阿尔吉尔达斯在蓝水河战役中击败蒙古势力后，将波多里亚地区纳入立陶宛大公国的影响范围。随后，科里亚托维奇家族受封统治波多里亚，并将其建设为地区首府。他们修筑石质城墙、扩建防御工事，并鼓励来自罗斯、亚美尼亚、波兰和德意志地区的移民定居，使城市逐渐发展成为多民族聚居的贸易中心。1395年，波兰国王雅盖沃取得了对波多里亚的控制权，并将其纳入王国边疆防御体系之中。由于地处基督教世界与草原游牧势力交界的前线，这座城市的重要性与日俱增。\n\n到了1444年，波多里亚已在波兰与鲁塞尼亚地区野心家的交替治理下走过了百余年之久的岁月，斯莫特里奇河上的城堡由十一座塔楼与绵延的城墙构成，横跨深谷的吊桥连接着古城与外界。它不仅是沃里尼亚东南疆域的军事重镇，更是联结黑海沿岸与中东欧腹地的贸易枢纽。这座以石头为名、以石头为骨、以石头为盾的城市，就这样伫立在东欧平原与黑海之滨的交界处，守卫着鲁塞尼亚的东门。"
 RigaExpandFlavour.12.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.13.name:0 "城市日志：特维尔"
 RigaExpandFlavour.13.desc:0 "特维尔的名字源于穿城而过的特维尔查河。该城坐落于伏尔加河上游，其支流特维尔查河与季马卡河在此汇入伏尔加河，地理位置扼守通往莫斯科、诺夫哥罗德与伏尔加河中游的水陆要冲，自古便是东欧平原北部的交通枢纽。1135年，这座城市始建于季马卡河的河口，最初是诺夫哥罗德共和国与伏尔加河流域贸易航线上的一个商栈与要塞。\n\n1247年，弗拉基米尔大公雅罗斯拉夫·弗谢沃洛多维奇将特维尔地区封予其子亚历山大·涅夫斯基，特维尔公国由此建立。从1247年以后，该地区归亚历山大·涅夫斯基的另一个儿子雅罗斯拉夫·雅罗斯拉维奇及其后裔所有。因地处偏远、受蒙古入侵的破坏相对较轻，大批人口从被毁的罗斯南部迁入，城市的经济与政治在13世纪下半叶迅速发展。1305年，米哈伊尔被金帐汗国册封为弗拉基米尔大公，也即全罗斯名义上的最高统治者，特维尔遂成为罗斯地区的中心之一。\n\n1327年，金帐汗月即别的堂弟策勒汗率军进驻特维尔，蒙古士兵欺压百姓、横行霸道，终于激起了全城起义。愤怒的市民包围了驻地，将蒙古军队尽数歼灭，策勒汗本人亦被活活烧死。金帐汗闻讯大怒，命莫斯科大公伊凡一世率联军征讨。伊凡一世为了获取蒙古人的信任并巩固自身的地位，毫不犹豫地向特维尔挥舞了屠刀。特维尔城被攻陷，起义遭到残酷镇压，大公亚历山大·米哈伊洛维奇被迫流亡。\n\n在此后的百余年间，虽然历经了诸多风雨，特维尔手工业和商业在东北罗斯诸城中仍名列前茅，直到特维尔-莫斯科战争的打响又一次让这座城市的前途波谲云诡。"
 RigaExpandFlavour.13.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.14.name:0 "城市日志：克拉科夫"
 RigaExpandFlavour.14.desc:0 "传说在很久以前，维斯瓦河畔瓦维尔山的山洞里，住着一条喷火的恶龙。维斯瓦公爵担心自己的爱女遭遇不测，遂张榜招贤，悬赏屠龙。最终，一位名叫克拉库斯的鞋匠挺身而出，用塞满硫磺与焦油的羊皮诱使恶龙吞食。巨龙烧焦了喉咙，挣扎着坠入了维斯瓦河中。恶龙死后，人们在瓦维尔山筑起新城，以屠龙的勇士命名，这便是克拉科夫。这座城市坐落于维斯瓦河上游两岸，地处西里西亚与鲁塞尼亚、波罗的海与匈牙利之间的十字路口，自古以来便是欧洲大陆水陆贸易的枢纽。城市的东端，瓦维尔山巍然耸立，为最早的定居者提供了无与伦比的防御基础。\n\n公元700年前后，西斯拉夫部落中的维斯瓦人在此修建了第一批防御性堡垒，这便是克拉科夫最初的雏形。9世纪中叶，克拉科夫已成为维斯瓦部落的核心。尽管该部落曾一度被大摩拉维亚吞并，但在10世纪末重新并入波兰王国的版图后，克拉科夫以其无可比拟的战略位置与富饶土地迅速成为历代君主青睐的居停之所。1038年，卡齐米日一世“恢复者”决定离开当时已饱受兵燹摧残的旧都波兹南，将王国的政治重心迁至克拉科夫。从此瓦维尔城堡成为波兰历代君王的正式住所，而克拉科夫也一跃成为了波兰王国真正的首都。\n\n然而，1241年，拔都率领的蒙古大军在里格尼茨战役中摧垮了波兰贵族联军，随即兵锋直指克拉科夫，全城的木制建筑几乎被付之一炬，只有瓦维尔城堡凭借坚固的石墙勉强守住。1257年，大公波莱斯瓦夫五世颁布了一份影响深远的自治特许状，依照德意志法律重新规划了整个城市。1287年，再次南犯的蒙古军队兵临城下，这一次，拥有坚固城墙和统一自治议会的克拉科夫从容应战，击退了鞑靼人的围攻，彻底终结了蒙古人对小波兰的威胁。1335年，卡齐米日三世在维斯瓦河中央的岛屿上规划兴建了一座新城卡齐米日，作为城市向南方延伸的崭新卫星城；同时1364年，他创办了克拉科夫学院，这也是继布拉格大学之后中东欧第二所高等学府。\n\n到了1444年，克拉科夫已是波兰王国无可争议的政治中枢、经济心脏与学术圣殿。瓦维尔城堡的高塔上，鹰旗在风中猎猎作响。市集广场的纺织会馆前，商人们的低语中满含着对未来的期许，而在克拉科夫学院之中，那些博学的研究者依旧伏案疾书。"
 RigaExpandFlavour.14.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.15.name:0 "城市日志：塞萨洛尼基"
 RigaExpandFlavour.15.desc:0 "塞萨洛尼基源自古希腊语“色萨利人的胜利”之意。马其顿国王卡山德为纪念其妻、亚历山大大帝同父异母的妹妹塞萨洛尼卡，在公元前315年将这座新城赋予了这位公主的名字。塞萨洛尼卡公主恰在父亲菲利普二世取得色萨利战役胜利的当天降生，塞萨洛尼基之名自此在爱琴海畔熠熠生辉。塞萨洛尼基坐落于塞尔迈湾北端，扼守通往巴尔干内陆的通道。城市选址于一处拥有天然温泉的海角，卡山德将古塞尔马的居民与周边二十六个村庄合并，奠定了这座城市最初的版图。\n\n罗马征服马其顿后，塞萨洛尼基于公元前146年升格为罗马马其顿行省的首府。罗马人修建了埃格纳提亚大道，这条连接亚得里亚海与博斯普鲁斯海峡的大动脉从城中穿过，使塞萨洛尼基迅速成为连接东西方的商业、文化与军事中心。公元50年前后，使徒保罗在第二次传教旅程中到访塞萨洛尼基，在当地的犹太会堂传道三日。\n\n拜占庭时期，塞萨洛尼基成长为仅次于君士坦丁堡的第二大城市，被誉为拜占庭的第二首都。四至五世纪间，城市兴建了圣迪米特里奥斯教堂；九世纪，出身塞萨洛尼基的传教士西里尔与美多德兄弟正是从这座城市的码头出发，将基督教与斯拉夫文字带向了广袤的东欧大地。\n\n然而盛世之下暗藏刀兵。904年，萨拉森海盗劫掠了塞萨洛尼基；1185年，诺曼人从西西里跨海而来，攻陷并洗劫了这座繁华的城市。1204年十字军攻陷君士坦丁堡后，塞萨洛尼基落入十字军建立的帖撒罗尼迦王国手中，归拉丁贵族管辖，直至二十余年后尼西亚帝国收复该城。1387年，塞萨洛尼基在长期围困后向苏丹穆拉德一世投降，落入奥斯曼人之手。此后，这座城市在拜占庭、塞尔维亚与奥斯曼之间反复易主。1402年安卡拉战役后，拜占庭凭借与奥斯曼的和约短暂收复了塞萨洛尼基，而又将其在1423年出售给威尼斯共和国。最终在1430年3月29日，在八年围城之后，穆拉德二世亲率大军攻破了塞萨洛尼基的城墙。城中的一千四百名威尼斯守军与无数市民在屠城中丧生。\n\n到了1444年，塞萨洛尼基已处于奥斯曼帝国的铁腕统治之下。这座曾经马其顿的王城、罗马的行省首府、拜占庭的第二首都、使徒保罗传道的见证者如今已成为奥斯曼人在巴尔干北方的军事前哨。圣迪米特里奥斯教堂的墙壁上属于拉丁征服者的壁画尚未完全剥落，伊斯兰宣礼塔的影子已落满了教堂前的石阶。然而塞萨洛尼基从未死去。它在每一次征服中幸存，在每一次洗劫后重建。它的港口依然泊着从爱琴海远道而来的商船，它的集市上仍能听见希腊语与斯拉夫语、威尼斯方言与奥斯曼土耳其语交织的回响。"
 RigaExpandFlavour.15.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.16.name:0 "城市日志：雅典"
 RigaExpandFlavour.16.desc:0 "雅典，西方文明的摇篮，哲学、戏剧、民主的故乡。即便千年战火碾过它的山丘，帕特农神庙的残柱依然如折断的竖琴，在阿提卡的蓝天下吟唱着古老的赞歌。坐落于阿提卡半岛的中心，雅典距萨罗尼克湾仅数里之遥。城市的心脏是卫城，一座高踞于石灰岩山顶的天然堡垒，自迈锡尼时代便有人居住。卫城之下，古市集的碎石间仍能辨认出柱廊与祭坛的基址。\n\n雅典的辉煌属于古典时代。公元前5世纪，在伟大的希波战争之后，雅典一跃成为希腊世界的海上霸主与文化中心。公元前478年，提洛同盟的宝库从提洛岛迁至雅典，民主制度在伯里克利的领导下达到顶峰。公民大会在普尼克斯山的岩坡上举行，从雅典任意一个自由民家庭抽签选出的五百人议事会执掌行政，陶片放逐法用以防范野心家。希罗多德在此讲述《历史》，修昔底德记录着伯罗奔尼撒战争的败绩。阿那克萨戈拉探讨了“奴斯”的宇宙理性，苏格拉底在街头用“诘问法”撕开人的无知。阿里斯托芬在狄俄尼索斯剧场上演《云》与《蛙》，用最粗野的笑声讽刺众神与将军；索福克勒斯与欧里庇得斯分别写下《俄狄浦斯王》与《美狄亚》，将艺术表达用人的悲剧推向高峰。\n\n伯罗奔尼撒战争终结了雅典的黄金时代，然而柏拉图接过了苏格拉底的灵魂开设了雅典学园，亚里士多德又从学园走出在吕克昂的林荫道上漫步讲学。雅典不再是海上的霸主，却依然是天下的学术中心。中世纪，雅典降格为拜占庭帝国的一个省城。城市的规模萎缩，但卫城仍是坚固的堡垒。\n\n1204年，第四次十字军攻陷君士坦丁堡后，勃艮第贵族奥托·德·拉·罗什被册封为雅典公爵。拉丁人在卫城上修建了宫邸。雅典公国在法兰克人的统治下维持了一个世纪。1311年，加泰罗尼亚雇佣兵在切菲斯战役中重创法兰克贵族，夺取了雅典公国。1379年，纳瓦拉佣兵团又赶走了加泰罗尼亚人，雅典公国转入纳瓦拉人之手。1388年，佛罗伦萨银行家内里奥一世·阿恰伊奥里通过巧妙的联姻与购买，从纳瓦拉人手中买下了雅典公爵的头衔。\n\n到了1444年，雅典尚未被奥斯曼正式吞并，但只要苏丹动一动手指，这座曾诞生苏格拉底、柏拉图与亚里士多德的古城就会像一颗熟透的无花果，无声地落入奥斯曼的口袋。它的身后是古典时代的风华绝代，眼前是奥斯曼骑兵卷起的尘土。然而，即便是在最黯淡的岁月里，雅典卫城矗立的石柱，仍足以让任何旅人屏息——因为这里曾是人类思想升起的地方。愿雅典的橄榄树永不枯死，以此提醒后世，智慧不会因为征服者的刀剑而消失，它只是陷入沉睡，静静地等待下一个黎明。"
 RigaExpandFlavour.16.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.17.name:0 "城市日志：安卡拉"
 RigaExpandFlavour.17.desc:0 "安卡拉坐落于安纳托利亚高原的中段，海拔约900米，东、南、北三面环山，萨卡里亚河的支流安卡拉河穿城而过。自古便是连接东西方的交通要冲。早在公元前13世纪，赫梯人便已在这片安纳托利亚高原的腹地筑起了名为“安库瓦”的城堡，使之成为赫梯文明的重要中心。\n\n安卡拉之名据说来源于古希腊语的锚，弗里吉亚国王米达斯在山间漫步时，突然发现了一只铁锚，遂在此建立新城。希腊化时期，安卡拉成为加拉太人的都城，名为安科尔。公元前25年，奥古斯都将加拉太纳入罗马版图，安卡拉升格为罗马行省的首府，罗马人修建了奥古斯都庙、朱里安柱与公共浴场。奥古斯都庙的墙壁上至今镌刻着《奥古斯都功业录》，以拉丁语和希腊语双语记述了第一位罗马皇帝的生平。\n\n拜占庭时期，安卡拉在七世纪之前经历了相对平静的岁月，此后便开始遭受阿拉伯人的反复劫掠。1071年，塞尔柱苏丹阿尔普·阿尔斯兰在曼奇刻尔特战役中击溃了拜占庭大军。两年后，塞尔柱人的马蹄踏上了安卡拉的街道，城市更名为恩古吕。安卡拉自此进入突厥时代。1124年至1127年间，这座城市数次易主，最终落入达尼什曼德之手；1142年，塞尔柱苏丹马苏德重新将安卡拉等城纳入罗姆苏丹国的版图。\n\n1243年，蒙古大军席卷安纳托利亚，安卡拉陷入蒙古人的统治之下。此后，这座城市由称为“阿希贝伊”的地方领袖治理，他们既是蒙古治下的行省总督，亦从事贸易，在安卡拉留下了数座清真寺与商栈。正是在蒙古治下的这个时期，城市的名称逐渐从恩古吕演变为安哥拉。安哥拉山羊、安哥拉猫、安哥拉兔的名称皆源自这座城市。\n\n1356年，初兴的奥斯曼侯国从蒙古人手中夺取了安卡拉，奥尔汗·贝伊将其纳入版图。1402年7月，帖木儿率领的中亚铁骑与奥斯曼苏丹“闪电”巴耶济德一世在安卡拉城外的丘布克平原上展开决战。这场战役以奥斯曼军队的彻底溃败告终，巴耶济德一世本人亦被俘囚禁至死。\n\n到了1444年，安卡拉在经历了帖木儿征服的创伤后正在阿赫尔兄弟会的治理下缓慢恢复，这座从赫梯人的城堡一路走来的内陆重镇，仍是一颗安纳托利亚舞台上闪耀的宝石。"
 RigaExpandFlavour.17.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.18.name:0 "城市日志：阿达纳"
 RigaExpandFlavour.18.desc:0 "相传天神乌拉诺斯之子阿达努斯随同父神巡游大地，行至塞伊汉河畔，见此地水草丰美，遂依河建城，并以己名冠之，是为阿达纳之始。然而早在希腊移民渡过爱琴海之前，赫梯帝国的楔形文字石碑上，这座城市就已经以“阿达尼亚”或“阿塔尼亚”的名称被记录下来，其历史可追溯至公元前3000年。\n\n阿达纳坐落于奇里乞亚平原中央，扼守塞伊汉河，背靠托罗斯山脉，南距地中海仅45公里，自古便是连接安纳托利亚高原与两河流域的咽喉要镇。在赫梯帝国衰亡后，阿达纳先后臣服于亚述人、波斯人与马其顿希腊人。公元前333年，亚历山大大帝的铁骑征服奇里乞亚，阿达纳进入希腊化时代。公元前63年，庞培平定海盗后，将大批被俘的海盗安置于此，使其开垦土地，修筑城防，阿达纳的规模自此开始迅速扩张。公元二世纪，哈德良皇帝巡幸此地，为其修建了一座至今仍在使用的横跨塞伊汉河的巨型石桥。\n\n拜占庭统治时期，阿达纳成为东罗马帝国在奇里乞亚地区的军事与行政中心之一，查士丁尼大帝曾大规模修缮其城墙与桥梁。公元7世纪，阿拉伯伊斯兰大军席卷而来，阿达纳落入阿拔斯王朝之手。阿拔斯名将、日后登基为哈里发的哈伦·拉希德于782年在塞伊汉河右岸修建了一座坚固的堡垒，其遗迹至今犹存。1097年秋，第一次十字军的大军穿过奇里乞亚，阿达纳被十字军攻占，纳入埃德萨伯爵鲍德温的治下。此后的两个多世纪里，这座城市成为了亚美尼亚奇里乞亚王国的重要城邑。\n\n约在1352年，一位名叫拉马赞的乌古斯突厥酋长，率领约雷吉尔部族从呼罗珊西迁进入安纳托利亚，在阿达纳自立为埃米尔。在马穆鲁克苏丹国的庇护下，拉马赞王朝迅速扩张，于1375年彻底终结了亚美尼亚西里西亚王国。到了1444年，阿达纳正在卡拉曼贝伊国治下，在日渐崛起的奥斯曼帝国、雄踞南方的马穆鲁克王朝与西面的白羊王朝之间谨慎周旋。塞伊汉河上的古罗马石桥依旧车水马龙，哈伦·拉希德所建的堡垒城墙下，波斯与印度的商队将香料与丝绸卸入阿达纳的集市，而来自安纳托利亚高原的木材、羊毛与铜矿石，则从此地的码头装车，运往阿勒颇与大马士革。"
 RigaExpandFlavour.18.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.19.name:0 "城市日志：开罗"
 RigaExpandFlavour.19.desc:0 "公元969年，法蒂玛王朝的名将昭海尔·绥基利自突尼斯挥师东进，攻占了阿拉伯帝国统治下的埃及旧都福斯塔特，继而在其东北方向择地兴建新都。新首都破土动工之际，正值火星升至中天。这颗星辰在阿拉伯语中名为“Al-Qāhira”，意为“胜利者”或“征服之星”。于是整座城市便被冠以“Al-Qāhirah”之名，即“胜利之城”。后来欧洲商人将阿拉伯语的名字音译为“Cairo”，这便是开罗之名的由来。哈里发穆伊兹旋即将统治中心从突尼斯的马赫迪亚迁至此地，从而使埃及取代马格里布成为这个什叶派王朝的政治心脏。\n\n法蒂玛的统治延续了两个世纪，哈里发日渐被麾下的将领架空。来自提克里特的库尔德人萨拉丁自1169年受任维齐尔，于1171年废黜法蒂玛末代哈里发，建立了以逊尼派为正统的阿尤布王朝。萨拉丁旋即于1176年着手在马穆凯山山麓营建巨大的城堡，即今日所称的萨拉丁城堡。此堡踞于石灰岩高崖之上，俯视整座开罗城与尼罗河谷，自此成为此后七百余年间埃及统治者的权力中枢。萨拉丁辞世后，他的子孙们为他建立的阿尤布王朝守护了近六十年。至13世纪中叶，苏丹开始从中亚与高加索购买大批突厥奴隶充当近卫军。这些被称为“马穆鲁克”的奴兵，最终于1250年反噬主上，夺去了尼罗河的权杖，建立了马穆鲁克苏丹国。商队从印度与也门运来丝绸与香料，在开罗的集市上加价转售给意大利人，再从尼罗河口驶向整个欧洲。开罗由此成为连接印度洋与地中海、东方与西方的贸易枢纽。\n\n然而1347年，一艘载有三百多名带病奴隶的商船从黑海抵达埃及港口，黑死病如利箭般射入了开罗的心脏。病魔尚未退去，帖木儿又从撒马尔罕带兵西征，开罗虽未直接被帖木儿攻破，但国库因巨额军费与附属地的丧失而枯竭，从叙利亚逃来的难民如潮水般拥入城中。\n\n到了1444年，萨哈达王朝的统治已如风中残烛。开罗城虽仍不失为伊斯兰世界最大、最繁华的都市——萨拉丁城堡的雉堞之上飘扬着大马利克的旗帜，爱资哈尔清真寺的庭院里学者云集，汗哈利利市场的巷弄中异国商旅摩肩接踵——但灯火辉煌的巷陌深处，已经可以嗅到帝国迟暮的气息。开罗，愿宣礼塔上的新月与尼罗河的浪涛，一同见证你无限的来日。"
 RigaExpandFlavour.19.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.20.name:0 "城市日志：大马士革"
 RigaExpandFlavour.20.desc:0 "大马士革的建城史可追溯至公元前2000年，是世界上持续有人居住的最古老城市之一。公元前11世纪，它成为阿拉米王国的首都；公元前732年，亚述帝国征服了这座城市，其在之后千年的时间里，陆续成为新巴比伦、波斯、希腊和罗马帝国的边陲重镇。这座古城东临沙漠西接黎巴嫩山脉，自古以来便是连接东西方的十字路口。\n\n公元636年，伊斯兰教的第二任哈里发欧麦尔征服了大马士革。公元661年，穆阿维叶一世将大马士革设立为横跨三大洲的倭马亚王朝的首都，城市的权力与声望达到顶峰。统治者们在城外兴建了华丽的宫殿与花园，使其赢得了“人间花园”的美誉。公元705年建成的倭马亚大清真寺，直至今日仍是这座城市无可替代的地标。\n\n公元750年，阿拔斯王朝取代了倭马亚王朝，建都巴格达，大马士革的政治地位有所下降，但作为商路枢纽的繁荣未曾消退。在随后数个世纪的动荡中，它先后被塞尔柱帝国、花剌子模帝国以及阿尤布王朝统治。公元1260年，蒙古帝国的大军攻陷大马士革，但蒙古人的统治仅持续数月，同年，新兴的马穆鲁克王朝从埃及反攻，从蒙古人手中夺回了大马士革。公元1401年，来自中亚的征服者帖木儿再次席卷大马士革，帖木儿将城中学者、工匠与财富掳掠一空，并焚毁了倭马亚大清真寺，这座被称为“天国里的城市”的古城遭受了前所未有的重创。\n\n到了1444年，大马士革仍在艰难地复苏。浩劫后的废墟虽在逐步清理，但往日的帝国都城气势已几乎荡然无存。即便如此，它仍未失去作为重要商埠的地位，古老的集市上依然能听到东方的驼铃与西方的喧嚣，它依然是新月沃地上那座承载着太多记忆的古老城市。愿主怜悯这座备受战火摧残的古城，使它有朝一日能重归安定，让“人间花园”不再被纷争与恐惧所遮蔽。"
 RigaExpandFlavour.20.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.21.name:0 "城市日志：德黑兰"
 RigaExpandFlavour.21.desc:0 "“德黑兰”之名，在波斯语中有暖坡、山脚下或洁净之城的意义。这城确如其名，北枕厄尔布尔士山脉的雪峰，南向伊朗高原的旷野，城建于山前冲积扇上，冬无严寒，夏少酷暑，泉水自山麓涌出，明净如洗。早在公元前8000年，德黑兰南郊八公里外的雷伊便有人类聚落的踪迹。这座古城在祆教的《波斯古经》中被列为阿胡拉·马兹达所创造的第12个圣地，是米底人与阿契美尼德人在高原上的最早居所之一。大流士一世的贝希斯敦铭文中，德黑兰的名号赫然在列。帕提亚与萨珊的帝王们在此地驻兵、避暑，将古城的城墙一再加高。\n\n公元7世纪阿拉伯的铁骑席卷高原时，萨珊末代君主伊嗣俟三世曾在德黑兰向他的子民作最后的呼吁，随后逃向东方。阿拉伯人攻陷并摧毁了古城，但不久又在废墟上重建。9世纪，什叶派的圣陵——阿卜杜勒·阿齐姆沙阿圣陵在德黑兰城中落成，使这城成为伊朗北部的宗教圣地。1043年，苏丹图赫里勒·贝格将德黑兰定为帝国的首都，丝绸之路的驼队在此停歇，城中的作坊烧制出闻名遐迩的陶器，其市场规模甚至可与巴格达比肩。图赫里勒·贝格去世后，他的后裔在城郊为他修建了高达二十米的砖砌陵塔，也就是图赫里勒塔，这座圆锥形的建筑至今仍矗立在德黑兰的南郊。\n\n1220年，成吉思汗的铁骑横扫德黑兰，因城中未做激烈抵抗，蒙古大军并未纵兵屠城。14世纪末，中亚的征服者帖木儿席卷了整个伊朗高原。德黑兰因其坐落于战略要冲而被纳入帖木儿帝国的版图。1404年7月，西班牙使节克拉维霍前往撒马尔罕觐见帖木儿，途经德黑兰。在他的游记中，德黑兰被描绘为一座树木葱茏、清泉环流的花园城镇，城中遍布果园与花园，以出产各种鲜美水果而闻名遐迩。\n\n到了1444年，帖木儿帝国的老狮沙哈鲁已老态龙钟，卧病在赫拉特宫中。德黑兰城中，土坯建造的民居与商栈鳞次栉比，围绕着集市展开数条错落的小巷。城北有数座贵族的花园，园中果木成林，桃、李、杏、石榴在各自的时令中竞相芬芳。从厄尔布尔士山流下的溪水穿过巷道，注入每一座庭院的水池。愿厄尔布尔士的雪水，继续浇灌这片山脚下的洁净之土，让德黑兰在岁月的沧桑之后，终焕发出它应有的荣光。"
 RigaExpandFlavour.21.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.22.name:0 "城市日志：伊斯法罕"
 RigaExpandFlavour.22.desc:0 "伊斯法罕之名，源出古波斯语的‘斯帕罕’，意为‘军队’。伊斯法罕深居伊朗腹地，三面环山，扎格罗斯山与库赫鲁山的余脉在此合抱。海拔约1600米的高原之上，扎延德河穿城而过，以雪水与清泉将这座城市浇灌成伊朗高原上最大的绿洲。早在米底与阿契美尼德时代，伊斯法罕便已是连接东西方的交通要冲。祆教的火庙在高丘上燃起圣火，至今仍可见萨珊王朝时期的拜火教遗址。塞琉古王朝将其命名为‘阿斯帕达纳’，帕提亚与萨珊的帝王在此驻兵、避暑，从耶路撒冷被掳至巴比伦的犹太人迁徙至此，建起了名为‘亚胡迪亚’的村庄，与祆教徒毗邻而居。\n\n公元7世纪阿拉伯的铁骑席卷高原时，伊斯法罕和平投降，因未作抵抗而免于屠城。阿拉伯人保留了这里的犹太—波斯文化传统，将其设为伊斯法罕省的首府。1051年，图赫里勒·贝格的铁骑踏开城门，将都城从尼沙布尔迁至伊斯法罕。从此，帝国的心脏在这座高原绿洲中跳动。\n\n然而帝国的荣光在12世纪末叶散去。花剌子模人劫掠了伊斯法罕，将塞尔柱的遗物付之一炬。13世纪，蒙古铁蹄如风暴般席卷西亚。1236年，蒙古大军攻陷伊斯法罕，伊儿汗国建立后，这座劫后余生的城市被纳入蒙古人的版图。帖木儿于1387年从撒马尔罕西征，在伊斯法罕征收重税，激起民变。帖木儿下令屠城，七万颗人头被垒成至少二十八座京观。\n\n伊斯法罕，这座以军队之名命名的城市，先是被塞尔柱人捧为天下之半的帝都，又蒙古人与帖木儿砸进血与灰的废墟。帖木儿的京观早已风化，但伊斯法罕的集市仍在扎延德河畔日夜喧响。"
 RigaExpandFlavour.22.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.23.name:0 "城市日志：大不里士"
 RigaExpandFlavour.23.desc:0 "大不里士之名，源自古波斯语“塔夫列兹”，意为‘热流’，取自城中密布的温泉与地下水流。这座古城东枕萨维兰山，西临雷扎耶湖，扼守着从安纳托利亚高原通往伊朗腹地的咽喉要道，自古便是四方往来通衢，军事与商业交相辐辏。早在公元前3世纪，阿契美尼德王朝的遗民便在此地留下了聚落的火种。公元3世纪，萨珊王朝的阿德希尔一世在废墟上重建城垣，使其成为拜火教在西北边疆的一处堡垒。\n\n第26任哈里发哈伦·拉希德的祖拜达王后于公元791年对地震之后颓败的城垣予以重修，开凿运河，引水入城，使大不里士以花园之城的面貌重获新生。此后数世纪，大不里士因其地处伊朗、安纳托利亚与高加索交汇之衢，而频繁在突厥诸王朝的博弈中易手。拉瓦迪王朝、萨拉丁的赞吉王朝、花剌子模帝国均在此地设重镇、驻强兵，在兵燹与繁盛之间反复摇摆。\n\n旭烈兀于1256年翻越高加索山脉，挥师西进，在攻陷巴格达后选择大不里士作为他的都城与驻节之地。1282年，阿鲁浑汗继位，定大不里士为伊尔汗国的第一首都。1386年，瘸腿的征服者帖木儿从撒马尔罕西征，亲率铁骑攻陷大不里士。这位自称‘世界之君’的蒙古人在城周的平原上驻扎了数周，从阿格城堡的箭塔中拆下铁条铸成马蹄铁，并掳走了城中全部的学者、工匠、画师与丝织匠人。\n\n1444年的大不里士，已非伊尔汗国鼎盛时的顶尖帝国都城，但依旧是丝绸之路上规模最大、体系最完整的交易中心之一。来自印度的靛蓝、来自中国的丝绸、来自威尼斯的玻璃器皿、来自安纳托利亚的地毯、来自北方的毛皮与奴隶，在巴扎的迷宫式拱廊下相逢交易，波斯语、蒙古语、亚美尼亚语、土耳其语与拉丁语在千百条廊柱间交织成一片嘈杂而饱满的市声。"
 RigaExpandFlavour.23.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.24.name:0 "城市日志：君士坦丁堡"
 RigaExpandFlavour.24.desc:0 "公元330年5月11日，罗马皇帝君士坦丁一世在古老的希腊殖民城邦拜占庭的旧址上举行了盛大的落成典礼，将帝国的权力中心从台伯河畔的七丘之城迁至博斯普鲁斯海峡的西岸。官方的新都名曰“新罗马”，但世人只记住了一个名字：君士坦丁堡，君士坦丁之城，万城之城的女王。\n\n这座城市是上帝摆在地球上的一个奇迹。它雄踞于巴尔干半岛的东端，如同一位身着紫袍的帝王，左手按住欧洲，右脚踏住亚洲。博斯普鲁斯海峡在它脚下奔涌，将黑海与地中海握于股掌。金角湾是它天然的港湾，马尔马拉海是它永不干涸的护城河。它不只是一座城市，更是一座以海峡为秤、以地中海和黑海为砣的天平，称量着整个中世纪世界的贸易与权力。圣索菲亚大教堂的巨大穹顶倒映在海面之上，从黄金门出发的帝王大道穿过阿卡狄奥斯广场、狄奥多西广场、君士坦丁广场，大道两侧竖满了历代皇帝的铜像与大理石柱。整座城市就是一座露天的历史博物馆，每一块石头都在吟唱罗马帝国从台伯河迁至博斯普鲁斯的史诗。\n\n然而11世纪以降，帝国在曼齐刻尔特的废墟上丢失了安纳托利亚的粮仓与兵源。1204年4月12日，本应乘风向埃及的法兰克与威尼斯十字军，因利益的驱使与积怨的爆发，将矛头转向了海峡对面的君士坦丁堡。翌日，十字军攻破城墙，在城中纵火三日，劫掠持续一周有余。流亡于尼西亚的希腊贵族米海尔·巴列奥略于1261年7月25日乘守军空虚之机夺回了这座世界之城，但光复后的君士坦丁堡只剩残垣断壁与大约三万五千名饥饿的居民——在百年之前，这座城市的常住人口尚以数十万计。\n\n1347年，黑死病从克里米亚的热那亚商站传入君士坦丁堡。城市被这场天灾抽去了最后一丝生命力，帝国的元气从此再也未能恢复。到1444年时，君士坦丁堡已是一座几乎燃尽的空城。宫殿大多空置，狄奥多西城墙内的菜园多于民居，皇帝约翰八世为了换取军事援助，不得不在1439年佛罗伦萨大公会议上签字同意东西教会合并。城墙之外，苏丹穆拉德二世在瓦尔纳战役中粉碎了基督教联军，并将王冠传与十二岁的穆罕默德二世。后者在登基致辞中说：“这座城市，无论它的城墙有多高，无论它的锁链有多坚固，总有一天要成为我们剑下的新娘。”\n\n君士坦丁堡，世界渴望之城，列国的冠冕。它在一个帝国的死亡与另一个帝国的重生之间苦苦挣扎。圣索菲亚的钟声还在敲响，教堂的银质烛台还在每个圣日点燃，金角湾的船坞里还躺着几艘修补过的桨帆船。但这些都已不是帝国的脉搏，而是一具尚有体温的躯体中最后的颤动。当这具躯体真正冷却的时候，一个新的时代将从它的灰烬中升起，而君士坦丁堡的名字，将永远刻在征服者的勋章上，以及被征服者的哀歌里。愿这城最后的光，照进每一个仰望它的人的眼，因为即将毁灭的不仅是一个辉煌的帝国，还有所有文明所共有的、对永恒的渴望。"
 RigaExpandFlavour.24.aa:0 "这座城市的往事值得铭记。"

 RigaExpandFlavour.25.name:0 "城市日志：耶路撒冷"
 RigaExpandFlavour.25.desc:0 "“耶路撒冷”在希伯来语中意为“和平之城”，然而这座城市的历史，却是一部由征服、毁灭与重建交织的漫长史诗。它雄踞于犹地亚山地之巅，海拔约八百米，东临汲沦谷，西接欣嫩谷，南有锡安山，北有圣殿山。耶路撒冷的建城史可追溯至公元前四千年。青铜时代早期，迦南人便在此处的泉源旁建立了定居点。公元前约1000年，大卫王攻占耶布斯人的锡安堡垒，将此城定为以色列联合王国的首都，约柜被迎入城中，其子所罗门于公元前957年在圣殿山上建成了第一座圣殿，犹太教的祭祀体系在此定型，耶路撒冷由此成为犹太民族圣殿所在的心脏。\n\n公元前586年，新巴比伦的尼布甲尼撒二世攻破城墙，圣殿化为灰烬，犹大国的精英被掳往巴比伦。半个世纪后，波斯居鲁士大帝准许犹太人回归，第二座圣殿在废墟上拔地而起。公元前后，耶路撒冷迎来了罗马人的霸权。大希律王扩建了圣殿，将其修葺为古代世界最壮观的宗教建筑群之一。公元30年前后，拿撒勒人耶稣在城外的各各他被钉十字架。公元70年，罗马统帅提图斯攻破耶路撒冷，圣殿被夷为平地，自此再未重建。公元326年，君士坦丁大帝之母海伦娜太后巡游圣地，于耶稣受难处发掘出“真十字架”，旋即修建了圣墓教堂，耶路撒冷再度成为基督教朝圣的终极目的地。公元638年，正统哈里发欧麦尔和平接收耶路撒冷。公元691年，阿卜杜勒·马利克哈里发建起了岩石圆顶清真寺。公元705年，阿克萨清真寺落成，穆斯林相信先知穆罕默德在此夜行登霄。耶路撒冷由此晋升为伊斯兰教第三圣地。\n\n十一世纪中叶，法蒂玛王朝的哈里发哈基姆下令拆毁圣墓教堂，此举点燃了基督教世界的怒火。1099年7月15日，第一次十字军攻破耶路撒冷，血洗全城，建立耶路撒冷拉丁王国。1187年10月2日，库尔德人萨拉丁在哈丁战役中击溃十字军主力，兵不血刃收复耶路撒冷，十字架被从岩石圆顶清真寺上取下，宣礼声再次在圣殿山上响起。此后，耶路撒冷在阿尤布王朝与十字军残余之间反复易手：1229年，神圣罗马帝国皇帝腓特烈二世通过外交协议短暂收回耶路撒冷；1244年，花剌子模雇佣兵攻陷并洗劫了老城，拉丁基督教对耶路撒冷的有效控制自此宣告终结。十三世纪末，埃及的马穆鲁克王朝将十字军彻底逐出叙利亚，耶路撒冷进入了一个相对稳定却逐渐衰落的时期。\n\n到了1444年，耶路撒冷已是马穆鲁克帝国治下一座略显寂寥的山城。城中的居民不过万余，犹太人聚居在锡安门外的狭窄街区，基督徒散居于圣墓教堂周围，穆斯林则在圣殿山的阴影下经营集市与陶器作坊。朝圣者从欧洲远道而来，需向马穆鲁克官员交纳昂贵的通行税，然后才能在方济各会士的带领下，亲吻各各他的岩石、点燃圣墓的灯盏。\n\n耶路撒冷，基石，圣所，三教共尊的祭坛。它在征服者的刀剑下萎缩，在朝圣者的祷词中膨胀。从大卫的竖琴到十字军的铁锤，从宣礼塔的唤拜到犹太会堂的哀祷，每一段墙壁都铭刻着一种信仰的狂热与痛楚。愿耶路撒冷的圣殿在战火中沉睡，直到那不再有刀剑的日子终于降临。"
