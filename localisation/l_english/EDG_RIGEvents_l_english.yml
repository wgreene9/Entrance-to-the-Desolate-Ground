l_english:
 rigaExpand.0.name:0 "战争前夜"
 rigaExpand.0.desc:0 "里加主教区的现况并不容乐观，尽管我们被宝剑骑士团环绕并长期接受它的保护，但骑士团过去的战斗表现让[Root.Monarch.GetTitle][Root.Monarch.GetName]担忧他们是否能够继续守卫主教区——不论是1236年的苏勒战役还是1242年的冰湖战役，骑士团的表现都不尽人意。\n\n因此[Root.Monarch.GetName]希望能够联合起宝剑骑士团与条顿骑士团。虽然宝剑骑士团在苏勒战役后名义上解散并加入条顿骑士团，但现在他们已经获得了极高的自治权，因此实际上是独立于条顿骑士团的个体。而条顿骑士团则一直试图向波兰与立陶宛方向进行扩张，这使得它在外交上愈发孤立，也更不太可能听从[Root.Monarch.GetName]的建议，不过我们仍然可以试着提出请求。"
 rigaExpand.0.aa:0 "向两位骑士团团长发送我们的邀请"
 rigaExpand.1.name:0 "来自大主教的邀请"
 rigaExpand.1.desc:0 "里加大主教希望我们能够联合在他的名下一同保卫波罗的海地区。这无疑会使得我们丧失主权，但如此联合将极大地增强我们在波罗的海乃至东欧的影响力。"
 rigaExpand.1.aa:0 "我们接受。"
 rigaExpand.1.bb:0 "无稽之谈！"
 rigaExpand.1.cc:0 "也许还有另一种方式？"
 rigaExpand.2.name:0 "回应"
 rigaExpand.2.desc:0 "[From.GetName] 接受了我们的要求！"
 rigaExpand.2.aa:0 "很好。"
 rigaExpand.3.name:0 "回应"
 rigaExpand.3.desc:0 "[From.GetName] 拒绝了我们的要求！"
 rigaExpand.3.aa:0 "他怎么敢！"
 rigaExpand.4.name:0 "处理普鲁士联盟"
 rigaExpand.4.desc:0 "普鲁士联盟一直是条顿骑士团的大麻烦，在冰湖战役失败之后所引起的第一次普鲁士起义动摇着条顿骑士团的根基，如果我们授予这个组织一定的自治权，从条顿骑士团当中拆分出但泽作为他们的自治区，那么这个问题将迎刃而解，不过这显然会引起条顿骑士团的不满并进一步削弱他们的实力。"
 rigaExpand.4.aa:0 "给予普鲁士联盟自治权"
 rigaExpand.4.bb:0 "保持现状"
 rigaExpand.10.name:0 "战略方向"
 rigaExpand.10.desc:0 "在对里加政治，经济，军事系统进行了全方面的确认之后，[Root.Monarch.GetTitle] [Root.Monarch.GetName] 思考良久，并在今天召集了各个阶层的精英进行下一步的战略规划，商讨里加的未来将何去何从。\n\n北方瑞典对波罗的海的控制力度日益提高，如果我们需要垄断波罗的海的贸易，瑞典将会是我们的首要敌人。要击败瑞典显然并不容易，但也许我们可以利用一下挪威的王冠与斯科讷伯国；\n\n虽然波罗的地区已经在我们的掌控当中，但波罗的海的贸易主动权却并不在我们手里。下游由吕贝克所代表的汉萨同盟的逐渐衰弱使得我们需要另谋出路，而1439年丹麦暴动诞生的商业城市联盟则可能是一个绝佳的选择，他们与吕贝克相互竞争，也许我们可以拉拢他们进入我们自己的商业联盟当中；上游则被罗斯异端诺夫哥罗德掌控着，鉴于东方特维尔大公国正在崛起，意有统一东北罗斯的趋势，也许我们应该尽早做出行动。\n\n南方波兰王冠的破碎与基辅罗斯的内战带来了地区性强权的真空，但这一情况并不会长久地保持下去。作为波罗的海的另一个贸易上游节点，我们必须确保对克拉科夫的掌控，并清除掉扬·胡斯的遗产；至于基辅地区，不论是异军突起的波格米勒派还是长期存在的东正教会都将是我们需要面对的敌人。基辅罗斯的内战不会持续很长时间，希望我们能够在另一个强权崛起之前完成我们的目标。\n\n现在，该让我们作出选择了。"
 rigaExpand.10.aa:0 "北进对抗瑞典威胁"
 rigaExpand.10.bb:0 "保护波罗的海的商路"
 rigaExpand.10.cc:0 "南下稳定波兰与鲁塞尼亚局势"
 rigaExpand.10.dd:0 "现在，我们该关注一下我们自身了"
 rigaExpand.11.name:0 "新的战略方向"
 rigaExpand.11.desc:0 "我们已经完成了一个战略方向，现在该选择一个新的目标了。"

 rigaExpand.12.name:0 "与哥得兰接触"
 rigaExpand.12.desc:0 "哥得兰，矗立在波罗的海中部的岛屿，长久以来都是海盗的巢穴、私掠者的乐园。他们不效忠任何国王，不向任何旗帜低头，只认风与浪的法则。正因如此，他们长久以来被视为邻国的眼中钉。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]提出了一个他们无法拒绝的交易：在不损害里加利益的前提下，哥得兰人可以继续他们的海盗生涯——掠夺敌人的船，割断敌人的缆，将波罗的海的财富一车车拉回他们自己的码头。作为交换，我们将为他们提供庇护，成为他们名义上的宗主。当然，我们也可以采用一些更加传统的方式..."
 rigaExpand.12.aa:0 "向哥得兰提出我们的建议"
 rigaExpand.12.bb:0 "我还是更喜欢采用传统的方式"
 rigaExpand.13.name:0 "来自里加大主教的提议"
 rigaExpand.13.desc:0 "一位来自里加主教区的信使前来，称如果我们在保证不损害里加利益的前提下成为他们名义下的附属，他们将会保证我们的安全并提供资金资助，我们也可以继续我们的掠夺生涯。\n\n这显然是一个双赢的提议，但我们有拒绝的权利——前提是我们能够承担这样做的后果。"
 rigaExpand.13.aa:0 "双赢互惠，不是吗？"
 rigaExpand.13.bb:0 "海盗不会屈服于任何人！"
 rigaExpand.14.name:0 "回应"
 rigaExpand.14.desc:0 "哥得兰接受了我们的提议，现在我们可以开展下一步的行动了。"
 rigaExpand.14.aa:0 "甚好！"
 rigaExpand.15.name:0 "回应"
 rigaExpand.15.desc:0 "哥得兰拒绝了我们的提议，看来只得兵戎相见。"
 rigaExpand.15.aa:0 "岂有此理！"

 rigaExpand.16.name:0 "破碎之冠"
 rigaExpand.16.desc:0 "虽说丹麦王国的名字还在编年史中游荡，但它的躯体已经被自由市的商人和瑞典的士兵拆散了。不过，为了长远的贸易利益，我们将尝试重新联合起这个破碎的王国，如今作为瑞典属国的斯科讷伯国正是我们需要寻找的目标。数年前，瑞典人以刀剑从丹麦手中夺走了这片厄勒海峡最窄处的土地，现在他们却成为了重铸丹麦王冠最为合适的人选。但依照目前的状况，一切都不过是天方夜谭。一个被瑞典铁蹄踩住脖颈的小国，该如何举旗反抗？\n\n一次秘密的会谈也许可以揭示出他们的决心——倘若他们敢于公开反抗瑞典，我们将会给予支持。当然，这并不可能是免费的，我们将获得在厄勒海峡的商业优待以确保我们在波罗的海与吕贝克地区的贸易优势，这也可以为我们再次进军斯堪的纳维亚打下基础；当然，倘若他们所谓的决心不过尔尔，那么我们将会亲自“帮助”他们实现目标。"
 rigaExpand.16.aa:0 "静候佳音"
 rigaExpand.17.name:0 "来自里加大主教的提议"
 rigaExpand.17.desc:0 "也许是和瑞典争夺波罗的海贸易的原因，里加主教区的信使找上了我们，在一个秘密场所，他们带来了一个承诺：如若我们公开表示反对瑞典并宣布独立，那么里加主教区将全力支持我们的独立，并且在独立之后将会与我们组成军事同盟。\n\n如此诱人的条件之下同时相应的也有代价，条约规定在此之后里加将会获得在我们国家的商业优待，不过相比于独立来说，里加提出的条件仍然十分诱人。\n\n如果得到了里加主教区的支持，那么我们独立之路将会十分顺畅，最重要的，我们可以自由选择是否兑现承诺，毕竟我们有反悔的权利。"
 rigaExpand.17.aa:0 "让我们先摆脱现在的困境"
 rigaExpand.18.name:0 "回应"
 rigaExpand.18.desc:0 "斯科讷伯国表示同意与我们签署一份条约，[RIG.Monarch.GetTitle][RIG.Monarch.GetName]将会帮助他们独立并组成同盟，之后他们将给予我们在吕贝克贸易节点的商业优待，同时为我们的贸易行动提供一切支持。"
 rigaExpand.18.aa:0 "又一桩生意成交"

 rigaExpand.19.name:0 "一触即发"
 rigaExpand.19.desc:0 "我们已经准备就绪了，里加主教区的部队正在等待着我们发起进攻。依照预定计划，我们将绕过在伯国上的瑞典驻军，突袭位于卡尔马城市的堡垒，为里加部队的登陆做好准备。"
 rigaExpand.19.aa:0 "开始行动"

 rigaExpand.20.name:0 "斯科讷起义"
 rigaExpand.20.desc:0 "瑞典在数年前以武力夺取的斯科讷地区一直没有屈服于瑞典的统治之下，里加主教区与瑞典在波罗的海的利益冲突逐渐白热化也导致了前者对斯科讷伯国独立的支持。\n\n最终，在卡尔马的炮火声中，战争降临了。"
 rigaExpand.20.aa:0 "丹麦王国复兴的第一步！"
 rigaExpand.20.bb:0 "我们不能操之过急！"

 rigaExpand.21.name:0 "挪威王冠"
 rigaExpand.21.desc:0 "1380年，丹麦建立了与挪威的联合统治，至此以后到现在挪威王冠都辗转于瑞典与丹麦手中。随着斯科讷独立战争的爆发，挪威发现自身并不该为了瑞典在波罗的的霸权而战。这一次挪威将以独立来捍卫自己的权利，如果瑞典人想再次戴上挪威王冠，那么就必须付出血的代价。"
 rigaExpand.21.aa:0 "挪威王冠将再次闪耀！"

 rigaExpand.22.name:0 "大北方战争"
 rigaExpand.22.desc:0 "在 [GetYear] 年，里加主教区在在斯堪的纳维亚的战略推进已经远远超出预期，进展十分甚至九分的顺利。这使得[Root.Monarch.GetTitle][Root.Monarch.GetName]有了更加宏大的想法——将帮助斯科讷伯国独立的战争目标转为彻底控制斯堪的纳维亚半岛。\n\n这一行为必定会招致半岛人激烈的抵抗，我们还必须亲手撕毁与斯科讷伯爵定下的条约。若胜，整个斯堪的纳维亚都将向大主教区的十字架低头。若败，则里加多年在半岛上积攒的一切声望、盟友、据点，都将如日头下的薄冰般四散崩解。"
 rigaExpand.22.aa:0 "依照神的旨意，道路已然明了！"
 rigaExpand.22.aa.tt:0 "§Y如果我们在五年之内没有完成任务§R大北方战争§!§!，§R我们在斯堪的纳维亚的战略将彻底失败§!"
 rigaExpand.22.bb:0 "稳扎稳打，无需操之过急"

 rigaExpand.23.name:0 "暴雪通牒"
 rigaExpand.23.desc:0 "里加的野心已经不满足于仅仅控制波罗的海贸易，他们要求我们要么立刻臣服，要么在他们的刀剑下臣服。半岛国家的处境已然十分严峻，不论我们之间有何隔阂，现在的首要任务都是先击败那些入侵我们的敌人"
 rigaExpand.23.aa:0 "摒弃前嫌，统一阵线！"
 rigaExpand.23.bb:0 "我们做不到的..."

 rigaExpand.24.name:0 "暴雪通牒"
 rigaExpand.24.desc:0 "里加主教区撕毁了之前与我们的条约，现在我们必须做出抉择，臣服于他们亦或是为自由而战。"
 rigaExpand.24.aa:0 "我们别无选择..."
 rigaExpand.24.bb:0 "他们必须从我的尸体上踏过！"

 rigaExpand.100.name:0 "急转直下"
 rigaExpand.100.desc:0 "由于我们未能达成目标，因此国内各个阶级以及各个属国已经对此次战争失去了耐心，强制停止了所有战争行为。也许[Root.Monarch.GetTitle]的想法即将化成泡影..."
 rigaExpand.100.aa:0 "一个错误的决定..."

 rigaExpand.30.name:0 "汉萨同盟战略"
 rigaExpand.30.desc:0 "“汉萨同盟”一名首次出现于1344年，最初是共享特权的商业联盟。1356年商人汉萨发展为城市汉萨，加入者包括绝大多数北德沿海城市，吕贝克、汉堡和不来梅是其核心，后来加入者有科隆、但泽和柯尼斯堡。1358年，波罗的海东岸的里加等城亦加入汉萨同盟，这一同盟垄断东欧、北欧同西欧的中介贸易，也通过意大利商人经营东方产品，如香料及贵重纺织品等。1367年，加盟的77个城市的代表在科隆举行首次会议，同盟设有最高议会和最高法院，入盟城市必须遵守同盟权力机关的决定，各城有公共的财政和海军，有权独立对外进行宣战、媾和、缔约等外交活动。\n\n到14世纪中叶，汉萨同盟已经扩展至波罗的海南岸、东岸的所有德国港口城市并扩展到欧洲各地，也许汉萨同盟的影响力十分巨大，但是对于现在的里加来说这并不是长远之计。由于汉萨同盟长期强调“只从最便宜地区采购”的原则，其本土地区的农业和手工业没有得到丝毫开发，这一点十分致命：尽管现在汉萨同盟没有遭遇较为强力的商业竞争，但随着各地区的兼并以及新列强的崛起，单纯的商业重商主义和保护主义手段将会越发苍白无力。\n\n此时，里加亟待以另一种有别于传统商贸的形式来发展商业，我们将在传统商业模式的基础上减弱对贸易的重视程度，通过鼓励手工业以及农业来提高产品数量与质量来实现商业上的“自给自足”，而不是单单依靠赚差价的方式来获取利润，同时这也能确保我们能够在战争时能够一定程度上维持我们商业活动的正常开展。"
 rigaExpand.30.aa:0 "开始吧！"

 rigaExpand.31.name:0 "汉萨同盟的未来"
 rigaExpand.31.desc:0 "由于汉萨同盟是由多个自治城市组成的松散邦联，成员视其本身利益高于同盟的整体利益，因此在面对错综复杂的利益纠葛和军事威胁时开始出现内部分歧，更有一些盟员城市试图通过损害其他城市利益的方式来取得优势地位。随着里加正式宣布开始与我们争夺波罗的海的贸易霸权，这种倾向必定将立刻加剧，同盟的其它成员也开始蠢蠢欲动，已经有成员指出事态可能将会朝我们不利的方向进展，汉萨同盟需要再次团结起来应对里加所带来的影响。"
 rigaExpand.31.aa:0 "汉萨同盟的贸易地位不容挑战！"
 rigaExpand.31.aa.tt:0 "这将激化里加-汉萨贸易争端"
 rigaExpand.31.bb:0 "我们不应该进一步升级事态"

 rigaExpand.32.name:0 "丹麦-里加贸易联盟"
 rigaExpand.32.desc:0 "里加最近与汉萨同盟展开了激烈的贸易战争，几乎使用了除战争以外的一切手段来争夺吕贝克与波罗的地区的贸易。如今里加联系到了我们，希望能够组建一个新的贸易联盟来一同对抗吕贝克，并拓展双方的贸易范围。"
 rigaExpand.32.aa:0 "我们支持这一联盟的成立"
 rigaExpand.32.aa.tt:0 "这将激化里加-汉萨贸易争端"
 rigaExpand.32.bb:0 "我们有自己的打算"

 rigaExpand.33.name:0 "里加-汉萨贸易战争"
 rigaExpand.33.desc:0 "在前些日子，里加主教区新组建的贸易联盟使得其与汉萨同盟的贸易战争继续扩大，这导致北德意志地区的商业状况波诡云谲，如果我们选择支持某一方，将可能从中攫取一份利益，不过这势必会加剧北德意志贸易战争的规模。"
 rigaExpand.33.aa:0 "我们支持里加-丹麦同盟"
 rigaExpand.33.bb:0 "我们支持汉萨联盟"
 rigaExpand.33.cc:0 "我们保持中立"

 rigaExpand.34.name:0 "皇帝敕令"
 rigaExpand.34.desc:0 "旷日持久的北德意志贸易战争迫使皇帝必须做出决定来处理诸侯国的不满，经过一定时间的商讨，皇帝选择要求里加主教区立刻无条件停止这场贸易战争，否则皇帝将会使用军事手段来结束北德意志贸易争端。"
 rigaExpand.34.aa:0 "刀与剑方能揭晓答案！"
 rigaExpand.34.aa.tooltip:0 "皇帝将会带领汉萨同盟一同发起进攻\n\n所有在贸易争端中支持我们的北德意志诸侯国将加入我们一方，反对的则将会加入我们的对立面\n\n双方贸易联盟成员也将加入战争"
 rigaExpand.34.bb:0 "我们不能激怒皇帝..."
 rigaExpand.34.bb.tt:0 "这将即刻停止我们与汉萨同盟的贸易战争，所有相关修正都将被移除"

 rigaExpandIncident.0.name:0 "北德意志贸易战争"
 rigaExpandIncident.0.desc:0 "长期以来，北德意志的商业基本由汉萨同盟的文德商圈与萨克森商圈所包揽。帝国境内的世俗诸侯由于经济多建立在庄园制基础上，产品单一且生产效率低下，因此在与汉萨同盟建立商业关系后随着汉萨商人的活动获得了较大的商业利益。加入汉萨同盟后，诸侯本国生产的原料可以以更高的价格在外国市场上出售，同时能够获得质量更优良的外国进口产品。汉萨商人的进出口税也为诸侯国库提供了稳定而可靠的收入来源。因此，各诸侯国普遍欢迎汉萨同盟在本国开设商站。\n\n随着波罗的海另一个城市里加的崛起，汉萨同盟的在波罗的地区的商业地位开始动摇，双方的竞争态势逐步升级。里加主教区与汉萨同盟的领导者吕贝克在过去一段时间内发生了一系列商业冲突。最近，由里加主教区与丹麦各城邦新组建的贸易联盟将这一争端推向了新的高度。北德意志诸侯国为保护自身利益，开始向某一方倾斜，并施以政策辅助和具体行动以获取更大利润。然而，这种选边站队的行为进一步割裂了本就各有不满的诸侯之间的关系。各地雇佣兵之间的小规模交锋不断发生；生产经济的不稳定导致农民起义愈加频繁。随着贸易战争的持续进行，整个神圣罗马帝国都或多或少受到了北德意志贸易争端的波及——叛乱、饥荒、战争无时无刻不笼罩在帝国之上。"
 rigaExpandIncident.0.aa:0 "只有战争能结束争端"
 rigaExpandIncident.0.bb:0 "皇帝应该调节矛盾"
 rigaExpandIncident.0.cc:0 "这场争端会自己平息"

 rigaExpand.35.name:0 "尘埃落定"
 rigaExpand.35.desc:0 "在和皇帝与汉萨同盟的联军战斗过程中，我们逐渐占据上风，舰队对汉萨同盟的封锁使得他们继续战斗的意愿逐渐低下；与此同时，皇帝此次宣战遭到了诸多支持里加的北德意志诸侯国的抵抗，因此在确定自己胜利无望之际，皇帝也开始了与里加主教区的谈判。\n\n尽管我们占据上风，但由于战争所带来的经济损失十分严重，继续战争有百害而无一利，只会造成北德意志地区经济的进一步恶化——这显然不符合我们的初衷。因此里加方面回复了皇帝一纸和约，该和约确定了里加主教区对汉萨同盟的绝对掌控，所有除吕贝克之外的汉萨同盟成员皆将成为里加的贸易区，成为里加名义上的附庸。"
 rigaExpand.35.aa:0 "很好！"
 rigaExpand.35.aa.tt:0 "旷日持久的贸易战争现在落下帷幕"

 rigaExpand.36.name:0 "西兰协定"
 rigaExpand.36.desc:0 "吕贝克的桅杆折断在波罗的海的浪尖上，汉萨同盟的旧旗从一座又一座城市的塔楼上降下，转而升起里加的旗帜。那些曾在丹麦王国废墟中自立的自由市纷纷遣使来到里加，口中说着恭维的话：“玛利亚之地的战士们，你们的意志强于钢铁。我们愿意将锚抛在你们的港湾里，只要你们用剑为我们挡住北方的风暴。”\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]没有拒绝他们的投靠，协定在几乎没有任何反对的声音中通过。北德意志的贸易，至此完全掌握在里加的手中。"
 rigaExpand.36.aa:0 "很好"

 rigaExpand.37.name:0 "东北罗斯战略"
 rigaExpand.37.desc:0 "东北罗斯曾经的内战并不能阻止他们的崛起，我们必须尽快对此地展开行动以控制波罗的海贸易的重要上游诺夫哥罗德，同时扼制可能崛起的罗斯大公。\n\n首先，我们需要控制位于宝剑骑士团东方的普斯科夫，曾经的北方十字军曾折戟于此，这里也是通往诺夫哥罗德的重要堡垒。我们必须以§Y周密的计划§!拿下这座城市，在彻底进行完我们的战略部署之前最好不要轻举妄动。\n\n一旦普斯科夫的城门在我们的旗帜下敞开，通往诺夫哥罗德的道路便再无险阻。那时，我们将立刻向东挥师，趁其尚未从内战中喘过气来，争取彻底解决这个东方的麻烦，让波罗的海的贸易上游永远握在里加的手中。"
 rigaExpand.37.aa:0 "开始我们的计划"

 rigaExpand.38.name:0 "周密计划"
 rigaExpand.38.desc:0 "我们需要进行一系列的准备来筹备将来的攻势，在此之前对东北罗斯地区的战略目标应当主要以侦查与渗透为主。我们会用一年的时间摸清哪座城池粮足、哪条河流可渡、哪个王公与邻国结怨，绘制出通往普斯科夫的每一条隐秘小径。"
 rigaExpand.38.aa:0 "备齐物资！"
 rigaExpand.38.aa.tt:0 "我们需要一定时间进行战争准备，在此期间发起进攻是十分不明智的"

 rigaExpand.39.name:0 "节外生枝"
 rigaExpand.39.desc:0 "虽然计划还没有完备，但我们仍然拿下了普斯科夫。不过由于此次行动过于仓促，我们需要立刻调整整个战略体系以保证之后的进攻顺利。"
 rigaExpand.39.aa:0 "我们仍需要等待。"

 rigaExpand.40.name:0 "风雨欲来"
 rigaExpand.40.desc:0 "普斯科夫的陷落使得我们必须思考是否需要调整战略方向，先将入侵我们的异教徒赶出我们的领土。而其他罗斯国家也将对此做出反应，如果他们也同意我们的规划，那么我们将暂时联合在一起进行战斗。"
 rigaExpand.40.aa:0 "该让他们记起1242年的教训了"
 rigaExpand.40.bb:0 "我们并不关心这种事情"

 rigaExpand.41.name:0 "战争倾向"
 rigaExpand.41.desc:0 "依照目前我们所做的准备，我们可以决定我们的优势战斗方向是进行持久战还是突袭战。\n\n前者将会拉长我们的战争时间，不过相应地能够减少我们大兵团作战时的补给损耗，后者则着重以小股精锐单位对敌方进行突击作战，如果运用得当将极大地减少战争时间，不过这也将使得我们的陆军损耗加剧。"
 rigaExpand.41.aa:0 "打持久战吧"
 rigaExpand.41.bb:0 "还是突袭战好些"

 rigaExpand.43.name:0 "普斯科夫起义"
 rigaExpand.43.desc:0 "尽管里加主教区在普斯科夫地区进行的一系列战争取得了成功，不过其对普斯科夫的掌控一直十分不稳定，终于在今天，普斯科夫正式脱离了里加主教区的控制，并试图拉拢周围的罗斯国家支持他们的起义。"
 rigaExpand.43.aa:0 "异端滚出我们的城市！"
 rigaExpand.43.bb:0 "我们还没准备好..."

 rigaExpand.44.name:0 "普斯科夫的叛变"
 rigaExpand.44.desc:0 "从普斯科夫传来消息，他们已经彻底脱离我们的控制并向我们发起独立战争，这打乱了我们一直以来的布局，我们必须尽快协调我们属国的军队同我们协作，否则我们的规划将会寸步难行。"
 rigaExpand.44.aa:0 "立刻开始恢复军队秩序"

 rigaExpand.45.name:0 "普斯科夫起义"
 rigaExpand.45.desc:0 "普斯科夫已经发动了起义，我们将可以决定是否支持他们的行动，以此来打击里加主教区在罗斯地区的影响力。"
 rigaExpand.45.aa:0 "我们将支持普斯科夫"
 rigaExpand.45.bb:0 "这样做的风险太大了"

 rigaExpand.46.name:0 "雪耻冰湖"
 rigaExpand.46.desc:0 "1242年4月15日，楚德湖的冰面在刀剑与马蹄下碎裂。那一天，北方十字军的旌旗沉入黑色的湖水，宝剑骑士团的精锐折戟于亚历山大·涅夫斯基的罗斯铁骑之下。而就在今天，经过周密的准备和计划，里加的战旗终于插上了普斯科夫的城头。在两百余年之后，我们终于再次踏上了征服之路。"
 rigaExpand.46.aa:0 "一次重大的胜利！"
 rigaExpand.46.bb:0 "戒骄戒躁，敌人还未被击溃"

 rigaExpand.47.name:0 "涅瓦协定"
 rigaExpand.47.desc:0 "战鼓渐息，剑收入鞘。诺夫哥罗德，这座矗立在沃尔霍夫河畔的古老城邑，向我们低下了它的头颅。从今往后，伏尔加河的毛皮、罗斯腹地的谷物与牲畜，将不再经过异教徒的集市，而是直接运进里加的码头。那些曾经阻挡我们商队的罗斯贵族，现在要么在修道院里忏悔，要么在新立的条约上按下了手印。然而不要只知积攒金币，不知让自己的精神富足。要记得这些都是主赐给我们管理的财富，为的是让祂的国度扩张。"
 rigaExpand.47.aa:0 "该进行下一个计划了"

 rigaExpand.50.name:0 "波兰-鲁塞尼亚战略"
 rigaExpand.50.desc:0 "波兰的王冠在瓦迪斯瓦夫三世倒下之后便碎成了三片。其中，桑多梅日落入了胡斯派——那来自波希米亚的异端——的掌控之中，而大波兰公爵与神圣罗马帝国的关系又十分紧密，可能会受到帝国的保护，所以波兰的统一也许并不会那么迅速与顺利。同时因为条顿骑士团在此之前不断地与波兰诸国产生摩擦，因此想要获取他们的信任并不容易。但所幸我们可以借清除异端的理由来干涉这一地区，以巩固我们在波罗的海地区的贸易，并进一步增强我们的影响力。\n\n虽然基辅罗斯在1443年基辅大公死亡后陷入内战，但这种情况显然并不会持续多久；作为曾经北方十字军的孑遗，我们与异教徒之间也没有任何妥协可言。唯有战争能够夺取我们想要的一切，我们必须保卫我们在南方的安全。"
 rigaExpand.50.aa:0 "开始计划"
 rigaExpand.51.name:0 "缓进急攻"
 rigaExpand.51.desc:0 "我们决定放缓行军，转而加固甲胄、优化冲击阵型。我们行军虽慢，但冲击力与防护力都将大幅提升：草原上的游牧骑兵难以撼动我们的铁墙，而我们的冲锋却足以撕碎他们的队列。"
 rigaExpand.51.aa:0 "以慢制快，以重破轻。"

 rigaExpand.60.name:0 "波罗的之心"
 rigaExpand.60.desc:0 "在那道加瓦河与里加湾的交汇处，伫立着一座辉煌的城市。自1150年哥得兰商人在西德维纳河河口处开始发展、到1201年十字军第一次到达利沃尼亚并建立堡垒、经历北方十字军的终结，再到1366年大主教区在成为独立城市，抵达[GetYear]年的现在......\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]凝望着这座繁华的城市，它灯火通明、商旅不绝、高楼林立，不论是在斯德哥尔摩，还是在但泽，亦或是在更加遥远的涅瓦，都能瞥见那似乎远在天边却又近在咫尺的城市，那座统治整个波罗的海的城市，君士坦丁堡、巴黎、维也纳、吕贝克、米兰......任何你认知当中的城市在它面前都将黯然失色，也许只有那远在东方的神秘国度能够与之比肩。\n\n在那座城市之中，所有人团结于与[Root.Religion.GetName]与[Root.Monarch.GetTitle][Root.Monarch.GetName]之下，各类文化在此交汇融合，各阶级人民在此平等相待，而整个玛利亚之地都为之起舞，为之欢歌，为之疯狂！这便是圣母之地的心脏——里加！\n\n正在[Root.Monarch.GetTitle][Root.Monarch.GetName]对这一景象感到欣慰且入迷之时，冥冥之中脑海中响起了一个空灵的声音，那声音似有似无，悬浮在[Root.Monarch.GetName]的脑海之中，呼唤着他望向整个玛利亚之地..."
 rigaExpand.60.aa:0 "故事还未结束..."
 rigaExpand.61.name:"神启"
 rigaExpand.61.desc:0 "在一次紧急举办的里加主教代表大会上，[Root.Monarch.GetTitle][Root.Monarch.GetName]宣布自身已经领受主的旨意，将向四方播撒福音，为整个波罗的地区带去繁荣与安康。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]的发言并没有受到任何人的质疑，代表们针对如何实现这一计划展开了讨论。终于在几天之后，一个名为“普世城”的计划诞生了，该计划旨在通过各种各样的方式促进波罗的各个城市的发展。这将会是一个十分漫长的计划，因此长远的规划是必要的，而具体能够实施下去多久则没有任何人知道。"
 rigaExpand.61.aa:0 "开始行动吧"
 rigaExpand.70.name:0 "启程"
 rigaExpand.70.desc:0 "筹备已久的普世城计划在现在正式启动了。玛丽亚之地，这片曾被宝剑骑士团的血浇灌、被商人的汗水浸透、被无数无名传教士的祈祷托起的土地，如今要成为整个世界的灯塔。粮仓将不再空虚，病者将有医院收留，孩童将在学校识字，商人将在安全的道路上往来。所有民族、所有语言的人，都将因里加的这一计划而蒙福。\n\n当然，计划的实施需要漫长的过程，而在这个过程当中[Root.Monarch.GetTitle][Root.Monarch.GetName]有足够的时间去思考普世城计划之外的事情..."
 rigaExpand.70.aa:0 "揭开帷幕"
 rig_terra_mariana.tt:0 "§Y我们将正式开始普世城计划§!"
 rigaExpand.70.aa.tt:0 "现在我们能够通过§Y省份页面§!的§T特殊互动§!为§Y属国§!建造建筑\n\n该互动将消耗§Y人力§!£manpower£而非§Y杜卡特§!¤，同时§G无视科技等级§!进行建造\n\n允许通过该§T互动§!建造更为§Y高级§!的建筑，同时解锁一些§Y特殊建筑§!\n\n如果我们§Y没有§!解锁§T基建§!理念，则立刻§Y无条件§!解锁§T基建§!理念组\n\n解锁§Y政府改革§!：§T普世城理想§!\n\n§Y大主教还需要一定时间的思考§!"
 rigaExpand.71.name:0 "间章"
 rigaExpand.71.desc:0 "里加庞大的主教区行政体系在目前来看似乎运转十分良好，但只有[Root.Monarch.GetTitle][Root.Monarch.GetName]知道，里加的内部远远没有看上去那么光鲜亮丽。\n\n里加的行政体系目前运转尚可，各主教区之间的文书与税银还能按时流动。但这只是暂时的。随着时间推移，各主教区的实力与日俱增，发展度一节节攀升——行政区手握重兵与广土，但是需要里加的行政管理支持；经济区银库充盈，却离不开里加舰队的庇护；军区作为边防之盾，拥有最精锐的士兵，但粮草与军饷全仰仗中央的输送。这是一种脆弱的平衡，如同三块巨石互相支撑，任何一块的位移都会引发崩塌。而最先倒下的，必是那块被我们赋予纯粹军事使命的多米诺骨牌——军区。当它不再需要里加的粮草，不再畏惧里加的权杖时，铁锤便会反过来砸向我们自己的手。\n\n里加大主教区是天主教在北方最坚固的柱石，但柱石周围，异端如同除不尽的杂草，在欧洲的每一道墙缝里野蛮生长。祷告派的低语、胡斯派的火把、清洁派在普罗旺斯的扩张，这些敌人已经让圣座为之颤抖。然而，[Root.Monarch.GetTitle]更忧虑的是那些尚未写进羊皮纸的暗流。两次阿尔比十字军的失败和世俗王权的崛起，使皇冠的权威逐渐压过了三重冕。意大利的文艺复兴如同一场瘟疫，从佛罗伦萨蔓延到巴黎、伦敦、柏林，商人们银币的叮当声取代了修士的晚祷；德意志的百姓看着罗马教廷的征税袋嘴里吐出的是咒诅而非赞美。一场针对天主教的宗教改革，已经在地平线上燃起了狼烟。届时，里加必须做出抉择：是坚守旧日的正信，还是加入那场席卷欧罗巴的风暴？\n\n然而，比起未来的宗教冲突，眼前的军事溃烂更加触手可及。长久以来，里加依靠各主教区的独立部队、联合骑士团与军区协同作战。战场上凯歌频传，以至于没有人在意里加直属部队的真实面貌。但是[Root.Monarch.GetTitle]知道，那些部队早已如同风干的朽木。一座城市的动员人口终有上限。若只在里加城内征兵，城市必定会人口锐减，怨声载道。因此，我们长期在各主教区募兵，再将这些口音不同、习俗各异、甚至互不相识的人混编成军。这对部队的战斗力来说毫无疑问是致命的。更可怕的是，过去的胜利惯坏了我们的将领。他们发现，即使自己不上战场，骑士团和军区也能赢得战争。于是我们的盔甲生锈，操练荒废，从将军到士兵都形成了共识：训练没有任何意义。所幸，各主教区尚未对我们的军事实力产生质疑。只要里加还能维持一支足够庞大的军队，他们便仍会低头。——但纸老虎终有被戳破的一天，§R届时我们必将土崩瓦解§!。"
 rigaExpand.71.aa:0 "前路未知..."
 rigaExpand.71.aa.tt:"§Y而圣母之地依旧繁盛，里加将继续前行，迈向未来§!"
 rig_riga_religious_dilemma.tt:0 "由于里加目前的宗教困境，因此我们所有§Y主教区§!与§O骑士团§!属国将无法对省份进行传教并获得一定的宗教统一度加成\n"
 rigaExpand.72.name:0 "第二次里加会议"
 rigaExpand.72.desc:0 "第一次里加会议已结束多年，而这第二次里加会议将对整个里加进行彻底的改革，[Root.Monarch.GetTitle][Root.Monarch.GetName]提出了针对里加行政与军事方面的两个改革，由于里加的行政惯性，我们将一次只能够专注于其中之一。\n\n问题是我们应该先专注于哪一个改革，迫在眉睫的军事改革还是未雨绸缪的行政改革？[Root.Monarch.GetTitle][Root.Monarch.GetName]将会做出抉择。"
 rigaExpand.72.aa:0 "我们将专注于军事改革"
 rigaExpand.72.bb:0 "我们将专注于行政改革"
 rigaExpand.73.name:0 "里加军队现状"
 rigaExpand.73.desc:0 "里加的军队，曾是将异教徒挡在冰湖之外的铁墙。然而如今，这道墙已从内部开始朽坏。腐败如同蛀虫，啃食着每一匹军马、每一袋粮饷。[Root.Monarch.GetTitle][Root.Monarch.GetName]曾多次在议事厅里拍案而起，下令改革。第一次，将军们点头哈腰，回去后刷了一层新漆；第二次，他们口头应承，转身便忘；第三次，有人甚至当面岔开话题，谈论起波兰的小麦和法兰西的葡萄酒。\n\n「你们在干什么？」[Root.Monarch.GetTitle]质问。\n\n「在改。」他们回答，脸上堆着无辜的笑容。\n\n[Root.Monarch.GetTitle]试过温和的手，试过劝勉的话，试过给他们机会悔改。但他们把[Root.Monarch.GetTitle]的宽容当成了懦弱。这一次，[Root.Monarch.GetTitle]决定使用一切可能的手段来推动军事改革。\n\n§R愿主原谅我将要流的血。但我宁可用血洗净这支部队，也不愿看着它在安逸中烂成白骨。§!"
 rigaExpand.73.aa:0 "拭目以待"
 rigaExpand.74.name:0 "万无一失"
 rigaExpand.74.desc:0 "[Root.Monarch.GetTitle]提出了一个计划，由我们的[Root.Mil_Advisor.GetTitle] [Root.Mil_Advisor.GetName]进行一次针对里加各个重要陆军将领的突袭行动，[Root.Monarch.GetTitle]要求此次行动必须要严格保密，并且不允许出现任何重要军事将领的伤亡——当然，是允许出现一些不幸的“意外”的。"
 rigaExpand.74.aa:0 "小心行事"
 rigaExpand.74.aa.tt:0 "我们需要一定时间来准备行动"
 rigaExpand.75.name:0 "夜幕"
 rigaExpand.75.desc:0 "夜色如墨，从道加瓦河面漫上城墙，淹没了里加的每一条街巷。将军们的府邸灯火通明，有人在宴席上推杯换盏醉得不省人事；有人在书房里搂着情妇对窗外的脚步声充耳不闻。如今，我们的行动只差最后一步：将那些沉睡的蛀虫从温暖的被窝里提出来，送进他们该去的铁窗。"
 rigaExpand.75.aa:0 "希望他们晚上不要睡的太死"
 rigaExpand.76.name:0 "拂晓"
 rigaExpand.76.desc:0 "黎明的第一道光，刺破了道加瓦河上的薄雾，我们的行动也已经完成，里加几乎所有的高级将领都被控制住了，少数几个试图反抗的，已在“意外”中倒在了血泊里，尸体被连夜运出城外，埋在无人知晓的土坑中。[Root.Monarch.GetTitle][Root.Monarch.GetName]召集了城中所有主教、骑士团指挥官与市政官，当众宣布这些人犯有叛国罪。贪污军饷、阻挠改革、勾结外敌、图谋不轨——一桩桩一件件确凿的罪行被大声念出。\n\n这种行为无疑会使得民众怀疑我们的军队是否还能保护他们，同时也将极大地冲击我们在属国心目中的地位。但这些都是做出改革所必须的牺牲，现在里加的军事系统已经全面掌握在[Root.Monarch.GetTitle]手中，而里加的军事改革也将终于正式开始。"
 rigaExpand.76.aa:0 "先苦后甜"
 rigaExpand.76.aa.tt:0 "我们所有属国独立倾向§R+10%§!\n\n§Y里加的军事改革将正式开始§!"
 rigaExpand.77.name:0 "紧急征募条例"
 rigaExpand.77.desc:0 "我们已经解散了所有的军队，我们的外交官将在此期间到各个属国稳定形势，[Root.Monarch.GetTitle][Root.Monarch.GetName]也在今日颁布了紧急征募条例以阻止里加国家防御体系的崩溃。\n\n与此同时，我们第一批重组的士兵已经完成了编制，随时可以投身于战场之中。"
 rigaExpand.77.aa:0 "第一步"
 rigaExpand.77.aa.tt:0 "我们将在首都部署一支由§Y35§!队步兵和§Y15§!队骑兵组成的部队"
 rigaExpand.78.name:0 "军事理论指导"
 rigaExpand.78.desc:0 "里加的传统便是在战前召集属国的将军与谋士对战争进行周密的计划。我们熟悉敌人的编组，规划行军的路线，了解天气和地形，拆解对手的战术。这样，我们不仅可以在战场上获得更大的优势，还能够很好地协调与属国军队之间的合作，也能在面对变数时有更多的准备。\n\n当然，这样的弊端也是显而易见的，我们无法应对突发的战争情况，在对手突袭时我们将很难在短时间内组织起有效的抵抗力量。因此回归传统的宣战机制也不失为一种选择"
 rigaExpand.78.aa:0 "坚定不移走我国特色战略体系路线"
 rigaExpand.78.aa.tt:0 "改革结束之后我们将启用§Y里加伟大战役§!机制"
 rigaExpand.78.bb:0 "我们应该回归传统的战争方式！"
 rigaExpand.78.bb.tt:0 "继续使用原汁原味的宣战机制，没有任何特色（可能这也是一种特色？）\n§R注意，该选项可能导致一些奇奇怪怪的问题§!bug:该选项并不能出现"
 rigaExpand.79.name:0 "军事组织指导"
 rigaExpand.79.desc:0 "在军队的组织规模上，军官们有两个主流的意见。一派认为我们应该专注于对大规模部队的补给系统进行改革，另一派认为我们应该强化对小规模精锐部队的训练。"
 rigaExpand.79.aa:0 "我们需要先改进我们的补给系统"
 rigaExpand.79.aa.tt:0 "改革结束之后我们将组建更大更协调的部队"
 rigaExpand.79.bb:0 "我们需要优先训练精锐的部队"
 rigaExpand.79.bb.tt:0 "改革结束之后我们将组建更小更精锐的部队"
 rigaExpand.80.name:0 "联合军事操练"
 rigaExpand.80.desc:0 "[GetYear]年，依照[Root.Monarch.GetTitle][Root.Monarch.GetName]的指示，里加大主教区以及各附属主教区皆派出了自身最为出色的部队，在道加瓦河畔的阅兵场上会师。这次联合操练包括战略、战术、战法、武器装备、攻城设施等各个方面的交流，人们可以看到条顿骑士团的老兵向罗斯的新丁演示如何在城墙上架设云梯，宝剑骑士团的工兵与基辅的炮手争论如何让大炮射得更远，波兰的参谋与斯堪的纳维亚的将军在沙盘上一决高下。\n\n在这个过程当中，我们不仅彻底翻新了我们的军事体系与军队，也和属国部队间有了更加全面的认知，并同时在很多方面影响了他们的军事发展。此次交流也昭示着里加军事改革抵达终点，一支崭新的里加军队即将诞生！"
 rigaExpand.80.aa:0 "临门一脚"
 rigaExpand.81.name:0 "战略论"
 rigaExpand.81.desc:0 "军事行动并不能解决一切问题，但它是解决一切问题的必要条件。现在的战争模式低效得令人叹息，动员迟缓、军队协调混乱、调度速度更是不堪入目，这已经不再能满足里加日益庞大的军事体系和日益恢弘的伟大理想，我们将成立一个专门策划战争的组织部门，以此打破传统宣战模式对我们的束缚。\n\n战争计划部的成立将使我们能够对一个地区所有主权国家宣布§Y伟大战役§!，不过在毫无准备的情况下对某个国家进行宣战也会严重影响我们的政府稳定度。\n\n不论怎样，属于里加的时代即将到来。因为主与谋划者同在，也必与得胜者同在。"
 rigaExpand.81.aa:0 "战争是政治的延续"
 rigaExpand.81.aa.tt.1:0 "我们的§Y主教区§!与§O骑士团§!属国获得上述修正的同时还会获得§G+25%§!全国补给上限\n"
 rigaExpand.81.aa.tt.2:0 "我们的§Y主教区§!与§O骑士团§!属国获得上述修正的同时还会获得§G+10%§!陆军移动速度\n"
 rigaExpand.82.name:0 "里加行政体系现状"
 rigaExpand.82.desc:0 "里加的行政体系尚可称得上无可指摘：它能维持大量主教区的文书往来、税银调拨、法度施行，已是主莫大的恩典。但里加显然并不会满足于现状，扩张的要求催生了对行政体系改革的需求。管理更大的国家需要更为完备的行政体系，尤其是对里加这种建立在对各个主教区控制之上的国家，属国的繁荣与稳定是绝对必要的，甚至其重要性可能高过里加城市本身的发展进程。\n\n随着波罗的海商业不断发展，日益增长的贸易量使得里加外城区不断地向外宝剑骑士团的辖区扩张。然而这种以拓展商业、生产为目标的扩张对我们行政体系的改善没有任何帮助，反而迫使里加以有限的行政容量去承载日益庞大的贸易体系与生产体系。而当前内城区的行政系统扩张速度仅仅只是能够维持我们现有的需求，我们必须找到合适的方法来增强城市的行政能力，不论是精简化内城区官僚建筑还是通过直接地扩建内城区。而现在的当务之急将是提高纸张产量，因为羊皮太贵，记忆太短，而里加的未来，需要用墨写满千千万万页。"
 rigaExpand.82.aa:0 "纸张就是未来！"
 rigaExpand.83.name:0 "波澜不惊"
 rigaExpand.83.desc:0 "里加内城区错综复杂的街道中，随处可见身着长袍的神职行政人员，怀抱纸卷匆匆穿行于大教堂与各属国联络署之间。对于各个主教区的管理从流程上来说并不复杂：若[Root.Monarch.GetTitle]欲向某个属国发出一道命令，则需先将指令送至里加城内专门对接该属国的行政部门，再由那里的书记官誊抄、封印、派遣信使；属国需求的传达，则将此流程倒转即可。\n\n为了及时了解各个属国的状况，每隔一段时间，各主教区都须向里加报告本地的财政、现役兵力、人口等数据。里加据此协调属国之间的贸易经济分配，指导发展方向的轻重缓急。属国虽有很高的政策自主性，却没有里加这般庞大的行政体系与信息来源。它们也许能管好自身，也能应对突发危机，但终归只能靠一己之力缓解压力。而里加主教区的介入则可以调动其他属国，让大家各取所需，互补长短，协同发展，一同渡过危机。\n\n然而，这种行政体系的弊端也显而易见。老生常谈的腐败难以根除，纸面数据常常需要派人复查，信息滞后可能导致错误的命令发出。更关键的是，随着各主教区的发展、新城市的建立，属国行政机构不断增大，里加的行政机构也必须随之调整。属国的增加将进一步加剧里加的行政支出，如同不断在旧屋上加盖楼层，地基终将不堪重负。"
 rigaExpand.83.aa:0 "我们需要一个计划"
 rigaExpand.84.name:0 "黎明"
 rigaExpand.84.desc:0 "改革向来不是什么容易的事，尤其是面对如今这套已生长得盘根错节、庞杂如林的行政体系。[Root.Adm_Advisor.GetTitle] [Root.Adm_Advisor.GetName]提出了一个改革建议，自下而上地对里加行政体系做出改革，在下层可以通过精简属国的行政体系，合并那些职能重叠、冗杂多余的属国，减少文书往来的节点，压缩层层转报的环节。在上层则需扩张里加的行政机构，使里加的行政能力足以承载日益庞大的属国网络。\n\n然而，合并我们的属国的行政机构也需要我们付出时间与精力，这将会导致我们在一定时间内承受更大的行政压力，但显而易见的是在完成之后我们将会获得十分长远的收益。"
 rigaExpand.84.aa:0 "改革现在开始"
 rigaExpand.85.name:0 "行政重组"
 rigaExpand.85.desc:0 "不同于其他国家的改革，里加的行政改革要复杂且困难许多，由于不仅仅涉及到自身阶级的利益，还涉及到各属国阶级利益的问题，大规模行政结构的改变必然导致各个阶级的利益冲突。这将造成一些显而易见的问题，诸如各部门之间协调不当导致的行政效率低下，对政策实施方式的不满而滋生的暴动等，不过这并不是不可避免的——变革之下的反对声音是不会停歇的，倘若我们拥有足够的实力，软硬兼施之下，相信他们一定能够认识到自身的地位。\n\n相较于激进快速地一步到位，也许缓步进行更加适合里加的现状。我们并不一定需要所有属国立刻进行改革，而是可以先挑选一个我们认为适合的属国进行试点，待完成之后再对另一个属国推行。如此实施虽然会导致改革时间的延长，但是能够维持改革期间大主教区的稳定性。"
 rigaExpand.85.aa:0 "我们没有多少时间了，必须快速推行改革"
 rigaExpand.85.bb:0 "不可操之过急，应徐徐图之"
 rigaExpand.87.name:0 "骚动"
 rigaExpand.87.desc:0 "最近里加政府的改革措施引起了里加城市内各个区域中对里加统治不满的阶级的骚动与暴乱，而在改革期间所导致的中央行政管理机构的暂时的混乱使得这群激进的反对分子获得了可乘之机。\n\n有叛乱分子宣称里加在统治期间积攒了无数的财富却不拿出来改善外城区人民的生活条件，还大肆宣扬内外城区生活条件的差异，并以要求获得更加公平的对待为宗旨向[Root.Monarch.GetTitle]施压。无独有偶，在听闻外城区骚乱的传言之后，中城区也产生了一定的骚动——当然，这在一开始并不足以成为威胁，直到运抵里加城区的一艘满载金银的货船被一伙暴乱分子所劫持，里加因多年以来的繁荣所积攒起来的财富在此刻成为了诱发骚乱的又一根导火索。\n\n政府上下正因最近的改革而陷入暂时的混乱，文书积压，号令不通。等到[Root.Monarch.GetTitle]终于发出平乱的指令，火势已经蔓延到了大半个城市。平等的分配并不能平息贪婪，而当面对几乎可以说唾手可得的巨量财富之时，渴望便成了支配一切行动的源泉。\n\n由于里加极度庞大的城市规模，派遣军队镇压将会对导致严重的破坏，因此只能寄希望于里加的城市卫队能够迅速处理此次骚动。"
 rigaExpand.87.aa:0 "风雨欲来"
 rigaExpand.88.name:0 "兵变"
 rigaExpand.88.desc:0 "由于先前的暴动仍然在持续，[Root.Monarch.GetTitle]考虑到如若让属国参与镇压将会严重损害里加的威信，并且在当前情况下可能导致一些不可预料的事情发生，因此选择了不向属国求援，不让外界知晓里加城内到底正在发生什么。虽然各个属国并没有接到里加的任何通告，但显然如此重大的事故是不可能永远掩盖下去的。\n\n就在今天早晨，[riga_rebel_target.GetName][riga_rebel_target.Monarch.GetTitle][riga_rebel_target.Monarch.GetName]所带领的一支部队突然出现在里加城外，打着“肃清叛乱”的旗号准备入城。[Root.Monarch.GetTitle]严令禁止他们如此僭越的行为，但并未受到理会。该部队仍然径直进军，马蹄踏过城门的石板，溅起昨夜的雨水与灰烬。"
 rigaExpand.88.aa:0 "叛徒！"
 rigaExpand.89.name:0 "偃旗息鼓"
 rigaExpand.89.desc:0 "显然[riga_rebel_target.GetName]哗变的军队没有预料到城内如此复杂的情况，在与城市卫队一同处理完城内暴乱之后已无力再做出任何动作，便撤出了城内。\n\n[Root.Monarch.GetTitle]训斥了这一行为，但是由于其行为在外宣传仍然是正面的，因此[Root.Monarch.GetTitle]并不打算对此次僭越的行为做出回应。"
 rigaExpand.89.aa:0 "放倒他们！"
 rigaExpand.90.name:0 "主教区改革"
 rigaExpand.90.desc:0 "传统的各主教区职能并不能够满足我们现在的行政需求，不论是经济区、军区亦或是行政区都需要做出变革，因此我们需要对其进行大刀阔斧的改革来建立一个更加高效的行政体系。\n\n经过一段时间的行政适应与政府重组，我们建立起了一个更加高效的行政网络，这将能够大幅提升我们各个主教区的行政效率并分配他们更多的行政职能以完成更加繁重的任务。"
 rigaExpand.90.aa:0 "继续吧"
 rigaExpand.91.name:0 "骑士团改组"
 rigaExpand.91.desc:0 "一直以来骑士团都作为里加最重要的军事组织而存在，但长久以来我们却没有对其领地权与职责进行过明晰的确定。改革的另一个内容便是确定各个骑士团所应当承担的责任与义务，以及他们所享有的权利。\n\n一般来说骑士团会效仿世俗封建主，在所获的土地上建立庄园，役使农民，以作物的产出供养骑士的甲胄与马匹。不过这所导致的压榨农民的现象以及低下的工作效率问题十分棘手，因此我们有必要改变这一传统的体制。\n\n在经过深思熟虑后，[Root.Monarch.GetTitle]宣布骑士的封地将仅限于房产而不再包含土地，里加将会接管各个农场并新建一套称之为“军功”的体系，通过给予所有骑士额外的收入来弥补他们的损失。"
 rigaExpand.91.aa:0 "下一步是..."
 rigaExpand.110.name:0 "第三次里加会议"
 rigaExpand.110.desc:0 "不同于里加的第一次与第二次会议之间的风平浪静，第二次里加会议之后的改革造成的后果仍历历在目，时刻提醒着[Root.Monarch.GetTitle][Root.Monarch.GetName]对待任何事情都不能掉以轻心。现在，里加庞大的附庸体系已经逐渐稳固成型，经过军事与政治改革之后的里加将再次启程，迎接新的挑战。由于各个主教区属国的增加，代表数量也愈来愈多，为了筹备此次会议，[Root.Monarch.GetTitle]不得不将里加代表大会会议厅的扩建提上议程。\n\n第一次与第二次里加会议一直在处理里加自身的问题，第一次会议解决了里加的生存空间，第二次会议则解决了长久以来困扰里加的行政、宗教及军事体系问题，而这第三次会议将让里加的目光转向更加远大的目标。\n\n北方十字军的失败使得里加长期以来自身难保，但经过百年的发展，里加已不同以往的孱弱，它拥有了继续完成曾经使命的实力与机会，因此[Root.Monarch.GetTitle][Root.Monarch.GetName]在会上宣布里加将在未来几年为新的十字军做好准备。\n\n不同于以往的十字军行动，此次计划将进行十分周密的筹划，一切皆由[Root.Monarch.GetTitle]及里加各主教区属国负责，杜绝了其他可能干预十字军的因素。此次十字军分为两个大方向：第一支十字军将会从波多里亚南下，跨过摩尔达维亚及瓦拉几亚的泥泞进军君士坦丁堡，之后越过博斯普鲁斯海峡围攻安卡拉、卡拉曼，继而沿着塞浦路斯湾向南抵达安条克，并在最后夺取圣城耶路撒冷；第二支十字军将从基辅与特维尔出发，清除东欧大草原及乌拉尔地区的异端，继而向中亚及西伯利亚进军。不同于第一支十字军拥有确定的进攻路线，第二支十字军仅有一个大方针作为指导，他们所要做的就是扩大里加在中亚及西伯利亚地区的影响力，并将基督的福音洒向东方。\n\n如此庞大的战争计划放在曾经可以说得上是天方夜谭，但如今里加拥有实现这一计划的实力，而[Root.Monarch.GetTitle][Root.Monarch.GetName]也必将其付诸实施。接下来，我们需要对这两项计划进行更加细致的策划以及军事准备。"
 rigaExpand.110.aa:0 "那么，散会"
 rigaExpand.111.name:0 "众志成城"
 rigaExpand.111.desc:0 "里加最为传统的行政问题仍然困扰着我们，两支十字军行动所造成的行政负担将超出里加所能够承受的范围，因此[Root.Monarch.GetTitle][Root.Monarch.GetName]必须做出选择，优先执行哪一支十字军的行动。\n\n如若要执行第一支十字军，那么我们必须组建一支黑海舰队来确保我们在爱琴及东地中海的制海权，如若按照原定计划单纯从路上进军，将会使得战争时间被严重拉长，如若能够登陆安条克、雅法等地，将能够极大的加快我们实现目标的速度。\n\n如若要执行第二支十字军，那么对应就必须做好应对游牧的战术，在充分了解我们的对手之前，我们需要更加稳健的行动方案，按部就班的向着中亚推进。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]将作出他的选择。"
 rigaExpand.111.aa:0 "东方优先"
 rigaExpand.111.bb:0 "南方优先"
 rigaExpand.112.name:0 "以剑之名"
 rigaExpand.112.desc:0 "在经历了一系列的准备之后，所有军队都已整装待发，等待着行军的号角。\n\n广袤的大草原之上即将响起战争的号角..."
 rigaExpand.112.aa:0 "而鲜血将再次泼洒其上"
 rigaExpand.112.aa.tt:0 "我们还将对拥有§Y秋明§!、§Y撒尔马罕§!、§Y阿拉斯特罕§!、§Y喀山§!、§Y埃里温§!的国家宣战"
 rigaExpand.113.name:0 "武装朝圣"
 rigaExpand.113.desc:"在经历了一系列的准备之后，所有军队都已整装待发，等待着行军的号角。\n\n在耶路撒冷沦陷的数个世纪之后，基督的旗帜将再一次在圣地飘扬."
 rigaExpand.113.aa:0 "朝圣之路将由刀与剑所铺就"
 rigaExpand.113.aa.tt:0 "我们还将对拥有§Y君士坦丁堡§!、§Y安条克§!、§Y耶路撒冷§!、§Y亚历山大§!、§Y巴格达§!的国家宣战"
 rigaExpandGlobal.0.name:0 "贸易战争影响"
 rigaExpandGlobal.0.desc:0 "里加-汉萨的贸易战争导致北德意志地区的生产力受到刺激，尤其是造船业的蓬勃发展，因此木材价格持续上涨，船具需求也日益提高。"
 rigaExpandGlobal.0.aa:0 "这将产生长远的影响"
 rigaExpandGlobal.0.bb:0 "我们将从中获益"
 rigaExpandGlobal.1.name:0 "万城之城"
 rigaExpandGlobal.1.desc:0 "不论列国曾如何夸耀他们的城邑，它们在现在的里加城面前，都如同萤火之于皓月，不过尔尔。任何第一次见到这座城市的人，都将穷尽其一切的言语来惊叹于这座宏伟的奇迹。道加瓦河两岸，教堂的穹顶与骑士团的塔楼交相辉映；码头上泊满商船，吊车如林；城墙之外，新辟的城区向四面八方伸展。这是波罗的海的心脏，这是屹立于所有城市之上的城市——万城之城！\n\n曾经遥不可及的理想——让公义如大水滚滚，使商贸如江河滔滔，令福音传到地极——如今已近在眼前。\n\n那么就让帷幕悄然落下，当它再次被揭开之时，整个世界都将为之起舞。"
 rigaExpandGlobal.1.aa:0 "大幕渐起"
 rigaExpandGlobal.1.tt:0 "\n静待佳音\n"
 rigaExpandGlobal.2.name:0 "命运的抉择"
 rigaExpandGlobal.2.desc:0 "该国家拥有两个可游玩的TAG，因此请在开局进行选择游玩哪个国家。"
 rigaExpandGlobal.2.aa:0 "游玩里加"
 rigaExpandGlobal.2.aa.tt:0 "这将使得我们正式开始@RIG§Y[RIG.GetName]§!的游玩\n\n@RIG§Y[RIG.GetName]§!旨在以极其特殊的§Y附庸体系§！，通过§Y普世城计划§!，将§Y整个世界§!纳入自己的统治之下\n\n在§Y将来§!我们也可以某种方式游玩@RGL§Y[RGL.GetName]§!\n"
 rigaExpandGlobal.2.bb:0 "游玩里加利亚"
 rigaExpandGlobal.2.bb.tt:0 "这将使得我们正式开始@RGL§Y[RGL.GetName]§!的游玩\n\n@RGL§Y[RGL.GetName]§!旨在前往新世界传播信仰，解放并开化新世界的人民\n"

 RigaExpandSupplement.0.name:0 "里加会议"
 RigaExpandSupplement.0.desc:0 "在[GetYear]年，道加瓦河的风终于不再带来刀兵之声。从但泽到纳尔瓦，里加的旌旗已经插遍了波罗的海东岸的每一个港口。然而我们虽有广袤的疆土，却没有明晰的行政体系征收赋税；虽有英勇的军队，却没有稳固的军事体制守卫四方；虽有繁荣的商港，却没有统一的财经律法权衡轻重。\n\n因此，[Root.Monarch.GetTitle][Root.Monarch.GetName]召集了一次会议，试图确定里加接下来的道路。\n\n§O「愿主赐下无上的智慧，使所立的律法如金灯台，照亮玛利亚之地的千百年。」§!"
 RigaExpandSupplement.0.aa:0 "行政为首要议题"
 RigaExpandSupplement.0.aa.tt:0 "会议将在一段时间后取得进展"


 RigaExpandSupplement.1.name:0 "里加行政体系"
 RigaExpandSupplement.1.desc:0 "经过多方面讨论，里加确立了一种全新的政治体系：大主教将只专注于直接统治里加一座城市，这在极大地提高里加城市的发展能力的同时也限制了里加将来直接扩张的可能。\n\n骑士团在经过改组之后将彻底听命于大主教，其拥有十分精锐的军事实力以作为卫戍领来保卫主教区，但由于骑士团的规模并不大，因此无法高效管理大片土地，因此请保持骑士团的领地范围在合理的水平。\n\n里加其他附属各主教区皆为里加大主教区行政延伸的体现，拥有较为独立的政治与军事系统，但同时各个主教区皆有其不同的职能倾向：行政区着重于行政规划以及对所处地区稳定的维持，因此可以高效地管理大部分土地，在军事与经济方面则有一定的限制；经济区着重于经济建设，地区内将减少对农民的税收并鼓励农业与手工业发展，以促进生产为中心促使地区经济繁荣。不过由于专注于经济事务，因此军事与行政方面有较大不足，无法有效管理较大的地区与维持地方稳定；军区具有极高的军事发展潜力，是作为骑士团之外里加军事实力的直接体现，越大体量的军区将提供越强悍的军事实力，但同时他们脱离主教区的风险也将随之扩大。\n\n§O注意，我们将解锁一项省份互动，允许我们帮助属国核心化省份§!"
 RigaExpandSupplement.1.aa:0 "接下来是经济"
 rig_can_assisted_core_for_subject.tt:0 "\n解锁一项省份互动，允许我们帮助属国核心化省份\n"
 RigaExpandSupplement.2.name:0 "里加经济体系"
 RigaExpandSupplement.2.desc:0 "不同于君主制封建体系下的大庄园制度与其他封建神权制度，里加虽然也从各个行政延伸区（即附庸国）收取税收并要求服兵役，但除专精经济发展的区域之外，这种税收大部分情况下是象征性的，对里加而言是九牛一毛。\n\n由于里加优越的天然地理位置，商业成为了里加收入的主要来源，加入汉萨同盟又使得里加获得了十分可观的利润。但这种严重依靠贸易的经济模式在没有确立对生产资料的控制之前并不能长久，因此里加决定塑造一种独特的经济体制：附属国将把自身的贸易权交于里加主教区，自身仅保留部分、甚至不再保留独立的贸易体系，而里加将会将属国生产的物资进行集中贸易以获利。\n\n协调如此庞大的贸易显然由里加一座城市无法做到，为了帮助里加减轻负担，贸易区应运而生。这类特殊的贸易城市主要从事贸易工作，虽然依附于里加，但为了保证在战争时期也能够维持运转，因此不会参与里加的进攻性战争。"
 RigaExpandSupplement.2.aa:0 "接下来是军事"

 RigaExpandSupplement.3.name:0 "里加军事体系"
 RigaExpandSupplement.3.desc:0 "由于目前的行政制度，里加的战争相当依赖于附属国的参与。在北方十字军期间骑士团所积累的军事经验虽然从现在看来已经稍有过时，两个骑士团在联合之前也在不断衰弱，但联合之后的骑士团再次向所有人展示了他们极高的军事水平。\n\n得益于骑士团的指导，里加军队虽然比不上他们的精锐，但仍然有一战之力。但鉴于征募部队几乎必须在属国城市进行，因此使用雇佣兵作战也是一个不错的选择。总的来看，里加的军事力量以各附属国，如骑士团与军区的部队为主力，同时自身也还保有大力发展军事的潜力与经济实力。"
 RigaExpandSupplement.3.aa:0 "最后是战略方面"

 RigaExpandSupplement.4.name:0 "以剑之名"
 RigaExpandSupplement.4.desc:0 "1236年，苏勒战役粉碎了宝剑骑士团，使得宝剑骑士团作为独立的军事修会宣告终结。而在 [GetYear] 年，大主教宣布再次进军立陶宛以稳定波罗的地区的局势。\n\n这一次，我们军械齐备，粮草充足，骑士们的眼中燃着愤怒的火——苏勒的阴翳，必在这场战争中被烈风卷去，不再存留！"
 RigaExpandSupplement.4.aa:0 "玛利亚之地的呼唤！"

 RigaExpandSupplement.5.name:0 "罗马尼亚战略"
 RigaExpandSupplement.5.desc:0 "我们完全控制了鲁塞尼亚地区，通往巴尔干的道路已经彻底稳固。如若想要在将来更加方便地干涉巴尔干地区，一个稳定的桥头堡是必不可少的，而已经分裂许久的罗马尼亚便是一个出色的对象。假使我们有足够的时间与耐心，就可以继续将南方战略拓展至罗马尼亚地区，在此建立并稳固我们在巴尔干的立足之地。"
 RigaExpandSupplement.5.aa:0 "我们将进军罗马尼亚"
 RigaExpandSupplement.5.bb:0 "我对这个地方不感兴趣"

 RigaExpandSupplement.6.name:0 "野火"
 RigaExpandSupplement.6.desc:0 "无人知晓第一束火光是从哪一条陋巷、哪一只颤抖的手中燃起的。也许当里加，这座被主亲手抬举的城市第一次在城墙内生出对财富的贪欲和对弟兄的嫉妒时，结局便已经写下。\n\n混乱的政府、无序的组织、惊恐的平民以及愤怒的暴徒，一切都在火焰中搅成一锅地狱的浓汤，任何想要缓解的措施在如此规模的火焰之中不过杯水车薪。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]独自站在大教堂前，看着熊熊燃烧的城市。他的影子被火光拉得很长，落在满是碎石的庭院里。大火燃尽的不止是仓库里的布帛、码头上的船木、街巷里的尸骸，也许还有[Root.Monarch.GetTitle]用一生编织的理想，那个关于普世城、关于圣母之地、关于将波罗的海变成公义与繁荣之海的伟大理想......"
 RigaExpandSupplement.6.aa:0 "一切都在崩塌......"
 RigaExpandSupplement.6.aa.tt.1:0 "§Y里加§!发展度§Y减半§!"
 RigaExpandSupplement.6.aa.tt.2:0 "§R如若无望重生，不如焚烧殆尽§!"
 RigaExpandSupplement.7.name:0 "背离"
 RigaExpandSupplement.7.desc:0 "最糟糕的事情还是发生了，[riga_rebel_target.GetName][riga_rebel_target.Monarch.GetTitle][riga_rebel_target.Monarch.GetName]已经宣布里加由于大规模叛乱，无力维持对各个属国的统治，将出兵“协助”里加重建政府机构，并在此期间完全接管里加。\n\n起初几日，[riga_rebel_target.GetName]的士兵确实挥舞刀剑，以铁腕镇压了仍在街头流窜的暴徒。但没过几天这些士兵便露出了本性，开始对里加各个城区进行洗劫，这使得刚刚经历过暴动以及大火的里加城经济状况雪上加霜。\n\n[riga_rebel_target.GetName][riga_rebel_target.Monarch.GetTitle][riga_rebel_target.Monarch.GetName]为了确保能够控制里加主教区并确立自身行为的合法性，立刻扶持了一位新的大主教，对外则宣称上一任大主教死于暴乱——显然现在里加已经陷入了十分重大的危机当中。"
 RigaExpandSupplement.7.aa:0 "这是赤裸裸的叛国行为！"

 RigaExpandSupplement.8.name:0 "里加兵变"
 RigaExpandSupplement.8.desc:0 "傀儡的大主教坐在里加的宝座上，他的每一道敕令都出自外邦人的口。教堂被洗劫，银币被运走，而真正的大主教生死不明。现在，是时候做出我们的选择了。"
 RigaExpandSupplement.8.aa:0 "我们只承认里加大主教区的权威！"
 RigaExpandSupplement.8.bb:0 "现在的局势对我们刚刚好"

 RigaExpandSupplement.9.name:0 "宣称芬诺斯堪底亚"
 RigaExpandSupplement.9.desc:0 ""
 RigaExpandSupplement.9.aa:0 "我们将拥抱新的未来！"
 RigaExpandSupplement.9.bb:0 "现在还不是时候..."
 RigaExpandSupplement.10.name:0 "医院骑士团"
 RigaExpandSupplement.10.desc:0 "医院骑士团全称为“耶路撒冷圣约翰医院骑士团”，又被称为圣若翰骑士团，成立于1099年。在1113年，教廷承认其独立修会的地位，并赐予他们一系列的经济、政治特权，如无需缴纳十一税，无需接受任何政权的领导，只受教皇节制。\n\n其成立初期，只是一个行善的组织，直到1120年，医院骑士团才开始作为一个军事修会进行活动，以武力保护朝圣者免受异教徒攻击，并发展成为耶路撒冷王国的一支重要军事力量，对耶路撒冷的政局也有很大的影响力。\n\n在1187年哈丁之战中，医院骑士团也派出主力参战，由于指挥上的失误，包括医院骑士团、圣殿骑士团在内的基督教军队几乎全军覆没，并且随着1222年“法兰西十字军”的结束，医院骑士团并没有等到援军，终于在1291年，骑士团放弃了巴勒斯坦，前往塞浦路斯，又在1309年又撤到罗得岛，最终他们还是丢掉了最后的领地。\n\n依照[Root.Monarch.GetTitle][Root.Monarch.GetName]给出的条件，医院骑士团将会获得哥得兰岛的领地权，并效忠于[Root.Monarch.GetTitle]。领地的转移并不意味着职责的消失，医院骑士团将继续他们曾经的事业，以武力保护朝圣者免受异教徒攻击以及医疗救助活动，并保卫在波罗的海的贸易船只免受私掠者的攻击。"
 RigaExpandSupplement.10.aa:0 "很好"
 RigaExpandSupplement.10.aa.tt:0 "我们将解锁一项决议以安置§Y医院骑士团§!"
 RigaExpandSupplement.11.name:0 "圣殿骑士团"
 RigaExpandSupplement.11.desc:0 "圣殿骑士团，又译神庙骑士团，正式全名为“基督和所罗门圣殿的贫苦骑士团”，1119年，法国贵族雨果·德·帕英和格弗雷·德·圣欧莫以圣殿山的阿克萨清真寺作为根据地成立一个修士会，以保卫朝圣者的安全，并攻击异教徒。该寺建于昔日所罗门圣殿的废墟之上，修士会因此得名，成员起初九人。\n\n1129年，罗马教廷在法国的特鲁瓦召开宗教会议，教皇正式地承认了他们的地位。这次会议是一个里程碑，它为圣殿骑士团制订了章程，确认了圣殿骑士团在整个基督教世界的合法地位和罗马教廷对它的最高威权，教廷的确认进一步扩大了圣殿骑士团在欧洲的影响，并使其接受基督教徒的捐赠行为合法化。\n\n1187年的哈丁战役使得圣殿骑士团被萨拉丁大军围困，大部分成员非死即伤。同年，萨拉丁攻陷耶路撒冷，圣殿骑士团一直后退，直到塞浦路斯，最后返回了法兰西。\n\n而后在1221年，圣殿骑士团支持了由当时王太子阿图瓦伯爵路易发起的一次新的“法兰西十字军”，这次十字军虽然没有取得一开始的目标，但基督徒在北非仍然取得了立足之地。随着一系列军事与外交上的失败，突尼西亚王国最终覆灭，而圣殿骑士团也失去了在北非的领地，又回到了法兰西。\n\n尽管圣殿骑士团在过去积攒了十分可观的财富，但一个十分现实的事情是，他们现在并没有实际拥有的领地，在各方面的行动都将任人摆布。[Root.Monarch.GetTitle][Root.Monarch.GetName]给予了圣殿骑士团大团长一个条件，将东欧大草原地区授予圣殿骑士团以换取其对[Root.Monarch.GetTitle]的效忠，圣殿骑士团将能够在此继续他们的职责。"
 RigaExpandSupplement.11.aa:0 "很好"
 RigaExpandSupplement.11.aa.tt:0 "我们将解锁一项决议以安置§Y圣殿骑士团§!"
 RigaExpandSupplement.12.name:0 "另一项改革"
 RigaExpandSupplement.12.desc:0 "我们已经完成了一项改革，接下来我们应该马不停蹄地投入到另一项改革中去了。"
 RigaExpandSupplement.13.name:0 "伟大战役"
 RigaExpandSupplement.13.desc:0 "伟大战役旨在只通过一次拥有十分充足的军事行动，或征服，或瓦解，或支配一个地区所有国家的战争模式，其对一个国家的整体军事实力水平提出了极高的要求，而里加的军事体系则十分适合此类需要充足战前准备的战争模式。\n我们将依次选择征服的地区和征服目标，当最后准备完成之后，我们将§R以我们选择的战役目标对所有首都位于战役地区的国家宣战§!，不过§Y满足以下条件之一§!的国家将不会被宣战：\n\n§R与你处于军事同盟§!；\n§R被你保证独立§!；\n§R与你处于同一贸易联盟§!；\n§R是一个属国§!；\n\n请仔细选择你的目标，§R战争一旦开始就无法轻易停下§!"
 RigaExpandSupplement.13.aa:0 "开始计划"
 RigaExpandSupplement.14.name:0 "计划确认"
 RigaExpandSupplement.14.desc:0 "目前§Y伟大战役§!计划如下：\n\n目标区域：§R[Root.GetGreateWarArea]§!\n战役需求：§R[Root.GetGreateWarTarget]§!\n\n确认无误之后我们便可以为即将到来的战争做好准备。"
 RigaExpandSupplement.14.aa:0 "开始吧！"
 RigaExpandSupplement.16.name:0 "新教同盟"
 RigaExpandSupplement.16.desc:0 "§Y「我必使这全地的人，都因刀剑、饥荒、瘟疫而惊慌。」§!主的先知说的话在欧罗巴的土地上应验了。公教与新教之间的裂痕，已从神学家的书桌和教堂的围墙内蔓延到国王的议事厅和战场的壕沟里。各国的君主们不再只以刀剑争疆土，更以信仰划阵营——北方的诸侯倾向新教，南方的皇帝坚守公教，东启鲁塞尼亚，西达不列颠，南至马格里布，北抵斯堪的纳维亚，每一个城市、每一座堡垒、每一个诸侯国都可能在一夜之间成为信仰的战场。一场席卷欧洲的宗教战争已经拉开帷幕。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]突然发现，曾经在北德意志贸易冲突和领土问题上和我们敌对的神圣罗马帝国皇帝，此刻也许正与里加站在同一条战壕里，因为我们共同的敌人正在拆毁教会千年的根基。现在是时候放下过去的过节，一同捍卫公教会的权威了。"
 RigaExpandSupplement.16.aa:0 "拿起刀剑！"
 RigaExpandSupplement.17.name:0 "海外宣讲"
 RigaExpandSupplement.17.desc:0 "新大陆发现的消息如同风裹挟的火焰，从伊比利亚的海港烧遍了整个欧罗巴。列国的君主们纷纷打开钱袋，招募水手，建造船只，只为在那片未知的土地上插上自己的旗帜，分得一份产业。\n\n现有的技艺尚无法让水手们在茫茫大海上准确测度经度，薄薄的木壳挡不住船蛆的利齿，腌肉与硬饼在数周的航行后便长出霉斑，船舱里拥挤、潮湿、疾病横行——这一切都足以让胆小者望而却步。然而在经济利益与政治利益的双重驱使下，探险活动仍然络绎不绝。\n\n1474年，一群满腔热血的探险者向[Root.Monarch.GetTitle][Root.Monarch.GetName]请求支持他们向新大陆进发的探险行动，期望能够在新大陆传播基督福音。这群探险者构成十分复杂，水手，渔民，教士...不同职业不同阶级的他们在同一个目标之下汇聚在一起，试图向着那充满机遇的新世界前进。\n\n[Root.Monarch.GetTitle]知道，虽然长久的商业繁荣已为里加积攒了可观的财富，但支持这样一场远征仍然是惊人的开销。准备船只、招募水手、配给食物、规划航线，每一样都需要大量的杜卡特，而这一切可能只换来一场船难或一句「未见陆地」的报告。拒绝他们，有一千个充分的理由。\n\n但倘若他们能够成功，倘若里加的旗帜插上新大陆的某个海角，倘若玛利亚之地的商人能够在大洋彼岸开设商站，倘若福音能通过里加支持的主教在异教徒中扎根——那将是一场何等荣耀的回报！里加的影响力将不再局限于波罗的海，而是辐射到更遥远的地方；现有的成功航线可以源源不断地输送补给与人员，将基督的名传遍那整个辽阔的大地。\n\n一切都取决于[Root.Monarch.GetTitle]给予探险者们多少支持，他可以选择低调地资助一小队船只，也可以向全城宣告这项神圣的事业，尽全力募集更多的船只与人员。\n\n[Root.Monarch.GetTitle][Root.Monarch.GetName]将做出他的选择。"
 RigaExpandSupplement.17.aa:0 "这是上帝的旨意，我们将尽力支持他们！"
 RigaExpandSupplement.17.bb:0 "我们将提供充足的支持"
 RigaExpandSupplement.17.cc:0 "我们只能提供有限的支持"
 RigaExpandSupplement.18.name:0 "里加利亚"
 RigaExpandSupplement.18.desc:0 "那一天，海天相接的尽头终于不再是无穷无尽的水与云。一支悬挂着里加主教区旗帜的舰队，驶入了新大陆的某个海湾。\n\n船帆已被盐渍漂白，船壳上还嵌着船蛆咬过的齿痕，水手们的脸因坏血病而枯瘦。数年的准备和航行，风暴、迷失、疾病、死亡...一切的苦难，在这一刻都化作了岸边篝火的噼啪声。探险者们在祷告中登上了沙滩，将十字架插进湿润的泥土。很快，一个坚固的据点在岸边建立了，而这个据点将在接下来的时间内不断发展壮大，成为一座繁华的城市。传教士们带着善意与福音走进原住民的村落，学说当地的语言，为婴儿施洗，为病人祈祷。骑士们则在据点外围巡逻，警惕着野兽与怀有敌意的部落。\n\n在经过一系列的商讨之后，这片远离里加的土地之上，一个被称作“里加利亚”的国家诞生了，其国家职能交由神职人员及每隔十年所选出的代表所组成的议会来行使，这一结构被称之为“神圣共和国”，它的使命只有一个：致力于将基督的福音传播向整个新大陆，让那些从未听过主的名的灵魂，也能沐浴在救恩的光中。\n\n时间将会决定这个新生国家的未来将何去何从，但现在这片土地的机遇属于他们。"
 RigaExpandSupplement.18.aa:0 "静候佳音"
 RigaExpandSupplement.18.bb:0 "这是我们的使命！"
 RigaExpandSupplement.19.name:0 "战术选择"
 RigaExpandSupplement.19.desc:0 "依照惯例，战争计划部门制定了两套战术作为十字军的指导思想。尽管战争当中的各项突发因素将会对战场产生很大的影响，但一个具有整体指导意义的方针仍然是不可或缺的。"
 RigaExpandSupplement.19.aa:0 "我们将专注于进攻"
 RigaExpandSupplement.19.aa.tt:0 "在两次十字军发动之时，我们与我们的属国将获得一定的§Y攻城效率§!及其他修正"
 RigaExpandSupplement.19.bb:0 "我们将专注于防守"
 RigaExpandSupplement.19.bb.tt:0 "在两次十字军发动之时，我们与我们的属国将获得一定的§Y防御效率§!及其他修正"
 RigaExpandSupplement.20.name:0 "后勤规划"
 RigaExpandSupplement.20.desc:0 "任何战争当中，后勤都是至关重要的一环。战争计划部制定了两套后勤方案，分别从不同方向来优化我们现有的后勤系统。"
 RigaExpandSupplement.20.aa:0 "我们将专注于大兵团作战"
 RigaExpandSupplement.20.aa.tt:0 "在两次十字军发动之时，我们与我们的属国将获得一定的§Y全国补给上限§!及其他修正"
 RigaExpandSupplement.20.bb:0 "我们将专注于兵员的补充"
 RigaExpandSupplement.20.bb.tt:0 "在两次十字军发动之时，我们与我们的属国将获得一定的§Y补员速率§!及其他修正"
 RigaExpandSupplement.21.name:0 "远渡重洋"
 RigaExpandSupplement.21.desc:0 "落叶捎来讯息：\n\n在海的彼端，那远渡重洋的帆船已经抵达新世界。\n\n我们的投资显然超出了我们的预期，那群满腔热血的探险者已经在新大陆定居，并向着更加遥远的地方扩张着。\n\n然而，现在我们并没有足够的远洋能力给予他们进一步的支持，只能在外交事务方面保证他们的独立性，让列国知晓那片据点受到玛丽亚之地的庇护。\n\n也许在未来的某一天，当我们的船坞能造出更大的船，当我们的海图能标记更安全的航道，我们便能改变这一现状。"
 RigaExpandSupplement.21.aa:0 "愿他们将继续茁壮成长，遥祝里加利亚的兄弟姐妹们平安。"
 RigaExpandSupplement.22.name:0 "海外事务"
 RigaExpandSupplement.22.desc:0 "随着航海科技的发展以及航线的勘探开拓，我们终于有了跨越整片大洋将影响投射到新大陆的实力。而先前由我们支持成立的里加利亚也已经在新大陆站稳脚跟，现在也许我们应该商讨一下如何对待他们了。\n\n依照过去的协议，我们向里加利亚发送了我们的信函，其可以保持现有的政府结构并享有绝大部分事务的自主决定权，而里加利亚仅需在名义上作为我们的附庸即可得到里加大主教区对其宣教事业的经济支持。\n\n里加利亚很快便同意了这一请求，[Root.Monarch.GetTitle]现在需要决定是否给予他们进一步的经济支持以扩大里加利亚在新大陆的发展和宣教速度。"
 RigaExpandSupplement.22.aa:0 "我们将腾出一些精力来帮助他们"
 RigaExpandSupplement.22.bb:0 "我们还有更要紧的事情"
 RigaExpandSupplement.23.name:0 "罗马帝冠"
 RigaExpandSupplement.23.desc:0 "公元330年5月11日，罗马皇帝君士坦丁一世在拜占廷建立新都，命名为新罗马，但该城普遍被以建立者之名称作君士坦丁堡；从公元4世纪中期到13世纪初期，它一直是全欧洲规模最大、最为繁华的城市，圣索菲亚的穹顶悬于天际，狄奥多西的城墙如神的藩篱，将一切异教的洪流挡在门外。后来罗马逐渐衰落，它的领土范围也缩减到君士坦丁堡及其周边地区，直到14世纪中叶，那曾经伟大的帝国终于咽下了最后一口气。\n\n如今，君士坦丁堡已在里加的控制之下。圣索菲亚的穹顶重新响起了拉丁弥撒，金门再次为公教的传教士敞开。但若没有一顶合法的冠冕，巴尔干的山民和安纳托利亚的农民将不会顺从大主教的统治。我们需要一个名号，一个能在希腊人、保加利亚人、塞尔维亚人、亚美尼亚人心中唤起顺服与敬畏的权威——那便是拉丁帝国，由第四次十字军在腥风血雨中建立的王朝。"
 RigaExpandSupplement.23.aa:0 "拉丁帝国应在此重生"
 RigaExpandSupplement.24.name:0 "光复耶路撒冷"
 RigaExpandSupplement.24.desc:0 "自1187年哈丁战役十字军败于萨拉丁的弯刀之下，圣地的基督教旌旗便如将残的灯火，在异教的风中摇曳。1291年，阿卡港的最后一支十字军乘船西去，耶路撒冷的城门对公教世界彻底关闭。\n\n然而，[GetYear]年，这一切被里加的铁蹄踏碎。[Root.Monarch.GetTitle][Root.Monarch.GetName]骑马穿过大卫门，在圣墓前的广场上勒住缰绳。他没有说话，只是从鞍囊中取出一面绣着宝剑与十字的旧旗——据说那是宝剑骑士团在冰湖之战中使用过的旗帜，旗角还带着异端的火把烧出的焦痕。大主教将旧旗铺在圣墓的石板上，然后亲手将一面崭新的里加旗帜覆盖其上。耶路撒冷王国陷落已经有数百年，但今天，基督的旗帜终于再次飘扬于圣城之上。"
 RigaExpandSupplement.24.aa:0 "耶路撒冷理应得到重建"
 RigaExpandSupplement.25.name:0 "政府论"
 RigaExpandSupplement.25.desc:0 "随着最后一次行政会议的落幕，里加的行政改革也基本结束了，不论过程如何曲折，我们都算是达到了我们预期的目的：行政效率提升，属国与中央的纽带更加紧密，腐败的根系被连根拔起，骑士团的剑重新淬火，人民的呼声有了回应。\n\n然而，改革不是一劳永逸的工程，只有随着时代的进步而不断地审视、调整、完善体制，才能够让里加维持最为高效稳定的统治。也许在将来的某一天，当新的问题积累成山，当旧的法令不再适应新的疆界，我们的后代将不得不再次召集会议，进行一场比今天更加彻底的变革。那是他们的事。而我们从此刻起，应当将目光转向其他事务了。"
 RigaExpandSupplement.25.aa:0 "开始下一步吧"
 RigaExpandSupplement.26.name:0 "全里加及各主教区联合舰队"
 RigaExpandSupplement.26.desc:0 "一直以来里加的舰队都以商船进行贸易为主，较少的关注重型战舰与桨帆船的发展，随着大航海时代的来临，造船水平的提高与日益增长的海外探索需求使得里加开始大力发展远洋船队，而随着远洋贸易的兴起，里加的海军发展也应当做出调整。\n\n同里加曾经的陆军情况类似，各个主教区属国都拥有较为独立的海军，各个地方所建造与拥有的舰船规格与种类都不尽相同，但各主教区舰队的规模显然并没有里加如此庞大，因此我们只需要花费一定时间将所有属国的船只进行统一建造与管理，后接由里加直接指挥，这将能够极大的提升里加舰队整体的实力。"
 RigaExpandSupplement.26.aa:0 "我们将统治海洋！"
 RigaExpandSupplement.27.name:0 "分裂伊始之地"
 RigaExpandSupplement.27.desc:0 "858年，东罗马皇帝将佛提乌推上君士坦丁堡宗主教的宝座，罗马教皇拒绝承认，并开除其教籍。佛提乌不甘示弱，于867年反手将尼古拉一世逐出教会，双方的裂痕由此发端。\n\n6世纪，西班牙教会归顺天主教后，擅自将《尼西亚信经》中圣灵「从父出来」一句，增添为「从父和子出来」。正教会指责这违背了七次大公会议共同确立的信条。双方为此争论数百年，曾一度和解，但1014年，罗马教皇正式将「和子」句引入信经，争端再起，如同一根刺扎进东西方之间。\n\n1054年，君士坦丁堡牧首色路拉里乌指责西方教会以无酵饼祝圣圣体，罗马教皇利奥九世遣枢机主教洪贝尔携措辞严厉的信件东来。4月，教皇驾崩，洪贝尔等人却在君士坦丁堡遭冷遇。恼羞成怒之下，7月16日，洪贝尔径直闯入圣索菲亚大教堂，当众将一份诅咒东方教会、革除牧首教职的「训谕」置于圣餐桌上，拂袖而去。色路拉里乌在皇帝的支持下，以牙还牙，于7月20日召开宗教会议，焚毁教皇书信，宣布革除罗马教皇及其使节的教籍，自称东部教会之首。\n\n如今，里加的十字架插上了君士坦丁堡的城墙，正教会的牧首在里加大主教的权杖下低头。但裂痕可以覆盖，伤口却需要时间愈合。我们攻下了分裂开始的城市，却还未等到合一的季节。我们还需要等待更加合适的时机，来完成这项伟大的使命。"
 RigaExpandSupplement.27.aa:0 "我们还有其他事情需要关注"
 RigaExpandSupplement.28.name:0 "耶路撒冷之旅"
 RigaExpandSupplement.28.desc:0 "我是一名里加的铁匠，在道加瓦河畔打了一辈子的马蹄铁与犁铧。那一日，我听闻圣城被勇武的铁卫收复。作为一个虔诚的基督徒，我当即把锤子交给学徒，背上十字架与干粮袋，跟随一队商人、修士与朝圣者，从里加的南门出发前往耶路撒冷。\n\n我们穿过波兰-鲁塞尼亚的麦田，那里的村庄已经不再向鞑靼人纳贡。田野间矗立着新建的天主教堂，木制钟楼的影子落在黑土上，神父在教堂里对农夫传播福音。我在圣坛前祷告，祈求一路平安。我们沿着多瑙河进入巴尔干，保加利亚的隘口里插着里加卫队的火把，塞尔维亚的修道院里住着从里加派来的拉丁文法教师。\n\n在君士坦丁堡，我站在狄奥多西城墙下，手指划过石头上的裂纹，据说那是突厥人在最后一次攻城时留下的。圣索菲亚的穹顶比传说中更高，我在地板上仰头望，那光透过窗子洒下来，如同金屑落在忏悔者的头顶。\n\n渡过博斯普鲁斯，我们进入安纳托利亚。从尼西亚到安卡拉，从安卡拉到阿达纳，道路平整，路边的每一座驿站都备有从里加运来的草药和墨水。在奥普提马通，一位从撒马尔罕返程的东征军战士向我们分享他的见闻。在卡拉曼，一位书记官告诉我，这条路还会继续修下去，直到沙漠和海的尽头。\n\n三周后，我们望见了安条克。安条克的城墙一半是泥砖，一半是里加工兵新修的石墙。圣彼得洞穴教堂的石阶已被朝圣者的双脚磨得光滑，我在洞口脱下鞋子，赤足走进去，向全能的主跪地祈祷。那天晚上，我在城墙上看了日落，奥龙特斯河变成一条金线，从马什里克的群山流下来，流向大海。\n\n最后一程是漫长的。我们穿过黎巴嫩的山谷，在加利利海北岸歇脚，然后沿着旧路攀上犹地亚的山丘。当圣城出现在视野中时，队伍中没有人说话，我听到的只有靴子踩在碎石上的声音。圣城的门洞里有凉风涌出来，带着千年的尘土气味。我没有马，没有侍从，没有贵重的奉献。我只是一名抡了几十年大锤的铁匠。但是现在我做到了几百年来多少王公贵胄，多少富商巨贾梦寐以求但没能做到的事——我在圣墓教堂的门口跪下来，用额头触碰石板。石板是冷的，但我的眼眶是热的。我把从里加带来的铁十字钉在圣墓的栏杆上，旁边挤满了别人的十字架、布条、丝带。\n\n如今我已在返回里加的途中，行囊中塞着一捧从各各他山脚下取来的红土。我将把它放在床头，但是即使没有这捧土，耶路撒冷的钟声也将永远在我心头回响。"
 RigaExpandSupplement.28.aa:0 "主历[GetYear]年，写于大马士革城中"

 RigaExpandSupplement.29.name:0 "城市日志：安条克"
 RigaExpandSupplement.29.desc:0 "安条克的历史始于公元前300年。塞琉古一世·尼卡托尔在伊普苏斯战役后夺取了叙利亚，于奥龙特斯河畔选了一处富庶的平原建城。他以自己的父亲安条克命名新城，并将安条克设为帝国的西部首都，其宫廷的奢华与亚历山大里亚比肩，其城墙的规模仅次于罗马与君士坦丁堡。\n\n罗马帝国时期，安条克升至东方第一大城的地位。凯撒、提比略、图拉真、哈德良等皇帝纷纷在此修建广场、水道与公共浴场，城中居民一度超过五十万。然而，这座大都会也常遭天灾的诅咒。公元115年，一场大地震几乎将安条克夷为平地，正在城中过冬的图拉真皇帝本人险些被压死；公元526年，又一场大地震夺去了二十五万人的生命。\n\n安条克对基督徒的意义十分重大，使徒保罗与巴拿巴在此传道一年之久，正是在这座城的犹太会堂里，外邦人被首次接纳进入教会。然而公元637年，阿拉伯铁骑征服安条克，城市归入倭马亚王朝的版图。拜占庭帝国于969年光复安条克，在第一次十字军期间，博希蒙德一世又一次攻陷安条克，建立安条克公国。拉丁统治持续了近两个世纪，直到1268年，马穆鲁克苏丹拜巴尔斯攻陷安条克，屠城一日，将城墙与教堂悉数拆毁。此后，安条克一蹶不振，沦为一座仅有数千居民的小镇。\n\n到了1444年，安条克这昔日的“东方之眼”已经只剩碎石遍地。圣彼得洞穴教堂的门口堆满了瓦砾，奥龙特斯河上的石桥断裂了半截，赛马场的拱门被附近的农户拆下改作羊圈。然而安条克仍然在朝圣者的地图上被标为一个必须经过的站口，因为从欧洲去耶路撒冷必须在此渡过奥龙特斯河。愿这潺潺的河水有一日能再度映照出圣彼得大教堂的尖顶，让曾被异教徒截断的诗篇，重新为这罪人的世界传颂。"
 RigaExpandSupplement.29.aa:0 "这座城市的往事值得铭记"
 RigaExpandSupplement.30.name:0 "城市日志：亚历山大"
 RigaExpandSupplement.30.desc:0 "亚历山大港始建于公元前332年，是按其奠基人亚历山大大帝命名的。作为当时马其顿帝国埃及行省的总督所在地。亚历山大大帝死后，埃及总督托勒密在这里建立了托勒密王朝，加冕为托勒密一世，随后亚历山大成为埃及王国的首都。托勒密王朝的统治者们建造了举世闻名的法罗斯灯塔，它高达一百多米，共分三层，塔顶的青铜巨镜能将火光反射到数十公里外的海面上；他们还创立了当时世界上最大的图书馆——亚历山大图书馆，收藏了据说多达七十万卷的纸莎草和羊皮纸手稿，几乎囊括了所有古希腊文献和大量东方典籍。\n\n然而，伟大的城市也难逃历史的兴衰。公元前48年，罗马的凯撒大帝在追击庞培时抵达亚历山大港，卷入了托勒密王室的内斗，并在此纵火，大火蔓延至港口，据说烧毁了图书馆的一部分藏书。公元641年，阿拉伯帝国的大军兵临城下。在经历了长期的围困后，亚历山大港向阿拉伯将领阿慕尔·本·阿斯投降。此后，它先后在倭马亚、阿拔斯、法蒂玛等王朝的统治下延续其商业中心的地位。然而，随着埃及的伊斯兰统治者在969年建成开罗并将首都移动到该地，亚历山大港的地位便不断下降，失去了往昔独一无二的荣光。千年灯塔在多次地震中逐渐受损，最终在14世纪的一次大地震后轰然坍塌。\n\n我们并没有理由让这座曾经会辉煌的城市继续衰败下去，这座港口将会被我们建设的更加辉煌。"
 RigaExpandSupplement.30.aa:0 "很好"
 RigaExpandSupplement.31.name:0 ""
 RigaExpandSupplement.31.desc:0 ""
 RigaExpandSupplement.31.aa:0 ""
 RigaExpandSupplement.31.bb:0 ""
 RigaExpandSupplement.32.name:0 "集中资源"
 RigaExpandSupplement.32.desc:0 "我们从挪威的峡湾运来最坚韧的橡木，制作大厅的桁架；我们从埃塞俄比亚的高原运来成吨的黄金，镶嵌圣坛的壁面；我们从印度河谷运来巨幅的织锦，点缀教堂的墙面；我们从西伯利亚的冻原运来白熊的毛皮，铺设在议会厅的长椅之上。每一支商队、每一艘帆船、每一辆牛车，都沿着四通八达的道路奔向同一座城门——仿佛整个世界都在为这座即将落成的万城之城献上最后的贡品。\n\n且看这座从波罗的海沿岸拔地而起的新耶路撒冷，将如何改变世界的地平线。"
 RigaExpandSupplement.32.aa:0 "让我们拭目以待"
 RigaExpandSupplement.33.name:0 "断章"
 RigaExpandSupplement.33.desc:0 "经历了数百年一砖一瓦的堆砌，里加终于在今天完成了它最后的扩建计划。它的城墙已延伸至视野之外，它的大道如同摊开的地图将世界的形状铺展在步行者的脚下，它的码头足以同时停泊一百艘克拉克帆船，它的仓库足以存放整个东欧平原一整年的收成，它的圣殿之中并列着拉丁十字、拜占庭圆顶与伊斯兰式拱廊，仿佛整个欧洲与亚洲的屋顶都在这座城中找到了最后的落点...\n\n前无古人。尼禄可以修建罗马的金宫，但他的大理石只能从卡拉拉运来，他的工匠走不出地中海；帖木儿可以建造撒马尔罕的蓝色穹顶，但他所模仿的只是波斯与花剌子模的建筑，无法同时融汇东西方历史名城的形制。\n\n后无来者。因为任何后来者若想超越这座城，便需先征服它所征服过的世界，拆解它所拆解过的历史，再以同样的耐心与匠心重新组装。而这一切的前提是世界重新分裂为孤岛，而后再度被同一只手征服、拼接——然而那样的时刻，我们可以自豪地说，已不在历史的预期之内。\n\n幕布并未就此落下，而当舞台扩展到整个地球时，每个人都是观众，每个人都是演员。里加在大地中央推开了一扇门，而所有从门中穿过的人，都将以自己携带的方言与记忆，为这部不会完结的史诗增添下一页。万国都将来到里加——或者说得更准确一些，里加已经成了万国汇聚时的那个名字。而这座被世界共同筑成的城市，将以世界的名义，继续向地平线之外延伸。"
 RigaExpandSupplement.33.aa:0 "而里加已经准备好了"
 RigaExpandSupplement.33.aa.tt:0 "§R演出自此迈入高潮§!"
 RigaExpandSupplement.34.name:0 "天堂攻势"
 RigaExpandSupplement.34.desc:0 "世界是有尽头的，而尽头已被我们所知晓。那是海图边缘的留白，是商队未曾踏足的沙漠，是传教士尚未翻译成拉丁文的陌生音节。然而，知晓尽头并不等于抵达尽头。在我们所绘制的地图之外，仍有无数人民在偶像的阴影下蒙受黑暗，他们在从未听闻过基督之名的山谷中，用仅知的方言向沉默的木头与石头祈祷。他们的苦难，是尚未被解放者的苦难；他们的无知，是尚未被光照者的无知。而里加，这座横跨大陆、融汇万邦、以刀剑与砖石征服了大半个世界的帝国，它的使命并不止于将地图上的空白填满。它的使命，是将福音的种子撒向每一块仍未翻耕的土壤，使那些在黑暗中被遗忘的民族也有机会在清晨的日光中抬头。\n\n这便是我们最后也是最重要的使命，我们将把已被我们得到的自由，传递到那些仍在等待中的灵魂面前。无论是越过海洋，攀上高原，还是沿着陌生的河流溯流而上，里加的传教士、商人与骑士都将同行，将圣经中的话语翻译成新的音节，将圣餐的饼掰给那些从未领过圣体的人，将十字架立在那些从未被任何教会的钟声唤醒过的山谷中央。当世界被完全照亮时，它的边缘将成为新的中央，而它的尽头将变成新的起点。我们不是要将这个世界变成单一颜色的画布，而是要使每一种颜色都在同一束光中找到它的位置，并因此，使那束光变得更加宽广。"
 RigaExpandSupplement.34.aa:0 "已有的事，后必再有；已行的事，后必再行。"
 RigaExpandSupplement.34.aa.tt:0 "我们的所有非§G里加特许贸易区§!属国将获得持续§G5§!年的§Y天堂洪流§!修正\n"
 RigaExpandSupplement.35.name:0 "归墟之门"
 RigaExpandSupplement.35.desc:0 "历史洪流滚滚向前，百川万流皆入归墟。\n\n自1444年的开篇至今，里加已经走过了数百年的征程，而在此之前的历史仍历历在目：费尔南多三世去世后，基督诸国终究无法统一，收复失地运动停滞不前，伊比利亚四分五裂；金帐汗国分崩离析，黑海草原被狼群所瓜分，东正教徒重新占领了大草原的土地；基辅罗斯从蒙古人的手中获得自由，但国内矛盾尖锐，内战一触即发，这片土地上必将狼烟四起；斯特凡大帝造成的余震仍未在小亚细亚消退，庞大的十字军又一次被突厥人瓦解，埃迪尔内的统治者如脱弦之箭，誓要重铸奥斯曼帝国的荣光；塞尔维亚帝国如百足之虫死而不僵,在背叛了十字军后也没能换取长久的和平，如今巴尔干再次燃起战火；阿尔比十字军功败垂成,清洁派建立起阿尔勒王国，与北方的洛塔林吉亚王国以及蒸蒸日上的英格兰王国共同置法兰西的卡佩王朝于四面楚歌之中；马穆鲁克集团终究难逃分裂，布尔吉王朝虎踞开罗，或能重新统一埃及并北上叙利亚...\n\n在时间的滚滚长河之中，我们无法改变过去，那么就应当继续向前以书写属于自己的篇章。也许在将来的某一天我们所有人能够团结在一起，望向更加遥远的天边——如同现在一样，追求更加美好的明天，响应更加伟大的召唤。也许届时，后来者将会称这一起源为：共同命运。\n\n历史的巨轮滚滚向前,吾等终踏入归墟之门。"
 RigaExpandSupplement.35.aa:0 "而时间之河将继续奔流"
 RigaExpandSupplement.35.aa.tt:0 "@RIG §Y[RIG.GetName]§!的内容至此完结，§Y感谢游玩§!\n\n感谢群友§O冬天的雨§!提供的任务描述与部分事件文本"

