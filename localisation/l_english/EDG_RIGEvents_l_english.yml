 rigExpandAction.10.name:0 "战争前夜"
 rigExpandAction.10.desc:0 "经过了数年的准备，我们已经完成了战争所需要的一切，现在该向我们的敌人正式发出宣战申请了！"
 rigExpandAction.10.aa:0 "开始我们的伟大征服！"
 rigExpandAction.50.name:0 "里加宗教改革"
 rigExpandAction.50.desc:0 "文艺复兴的曙光如同晨星刺破中世纪的浓雾，人文主义的浪潮向那古老而摇摇欲坠的权威发出了挑战。\n\n人文主义者如伊拉斯谟，致力于办学、印行《圣经》与古教父著作，希望通过开拓新的学问，改革社会、恢复教会的合一。他们虽不质疑传统的基本教义，甚至反对脱离正统教会的分裂行为，然而当他们拨开历史的尘土，细读原始基督教的文献时，却惊异地发现：当代教会的教阶制、神职人员的世俗化、经院哲学的无休争论都背离了基督原始的教训，是基督教面临崩溃的征兆。\n\n也有少数人更加大胆。圣经学者威索尔首次宣告《圣经》的权威在罗马教皇之上，唯有上帝能赦罪，人只能靠信心、通过与主的直接交往而得救。在这一神学观点中，神权和教会有形组织的地位被大大降低。马丁·路德赞赏威索尔的学说，并于1522年将其发表，成为宗教改革基本教义的蓝本。\n\n14-15世纪，《圣经》已被译成数种语言，印刷术的发明又使这本书不再是少数人的专利，这使得各地人民对于宗教的认识也逐渐提升。\n\n[GetYear]年，里加城内众多的教堂与神学家，针对当下的宗教现状展开了激烈的辩论。最终，在[Root.Monarch.GetTitle][Root.Monarch.GetName]主持的最后会议上，确认了天主教在里加独一无二的地位，同时承诺在核心教义不动摇的前提下，对部分实践与教条进行审慎的妥协。虽然这一举动会导致教皇的不满，但是时代的进步不断地提醒着我们需要变革，故步自封有百害而一利。"
 rigExpandAction.50.aa:0 "我们需要着手开始处理"

