 rigExpandAction.202.aa:0 "稳扎稳打"

 rigaExpandDisaster.0.name:0 "破晓之战"
 rigaExpandDisaster.0.desc:0 "在[riga_rebel_target.GetName]宣布控制里加之后，城市内外的里加大主教区效忠者对此等叛国行径进行了多次抗议，但无一例外都被清洗与镇压。\n\n不过[riga_rebel_target.GetName]诸如此类的行动非但没有彻底消除反对的声音，反而使得其在逐渐明晰的事实面前不断滋生蔓延开来。各个主教区属国对此也持有各自的态度，或反对现状，或静观其变，一切都只是为了自身利益的最大化而行动着。\n\n然而表面的骚动只是涌动暗流上泛起的涟漪。里加大主教区在经历了两场灾难之后，管理效率已经大幅度下降。属国们不仅要面对里加主权归属这柄悬在头顶的剑，还要在自己境内扑灭因经济失调、政治混乱而燃起的遍地野火。\n\n由于里加的现状，各个属国所面临的问题在这几个月愈演愈烈，各类暴力事件层出不穷，任何想要实现自身目标的阶级、团体亦或是个人都纷纷开始了自己的行动，试图从这场灾难当中为自己谋求最大的利益，而正当化这些利益最便捷有效的方式便是参与到里加大主教区主权归属的斗争当中。\n\n于是一场大混战开始了。效忠者与傀儡军、贵族与商贾、虔诚的修士与贪婪的雇佣兵......所有庞杂的势力在同一面大旗下互相撕咬。里加的附庸体系，如同一个被点燃的装满火药的木桶，终于炸裂开来。"
 rigaExpandDisaster.0.aa:0 "这是一场考验"
 rigaExpandDisaster.0.aa.tt:0 "我们所有的属国也将开始灾难§Y破晓之战§!"

 rigaExpandDisaster.1.name:0 "暴动"
 rigaExpandDisaster.1.desc:0 "一伙[riga_rebel_target.GetName]效忠分子在[riga_dawn_of_war_unrstprovince_target.GetName]发起了叛乱，旨在让政府倒向[riga_rebel_target.GetName]，我们必须采取必要的措施。"
 rigaExpandDisaster.1.aa:0 "击溃他们"
 rigaExpandDisaster.2.name:0 "冲突"
 rigaExpandDisaster.2.desc:0 "动荡的时局导致了各类不同的阶级势力都妄图从中获利，而这类冲突最终大部分都会以暴力的方式进行最后的表达，而胜利者将会延续他们所曾经使用的手段。"
