#阶层
 EDG_Syracusae_estate_burghers_name:0 "公民"
 EDG_Syracusae_estate_burghers_desc:0 "「公民」这一概念源于「叙拉古独立战争」，随着希腊民族主义的形成被护国议会确立为共和国法律主体身份，通过共享的民族认同与该国家紧密相连，并因此享有平等权、政治权利、人身自由及社会经济文化权利等特定权利、承担遵守法规、服兵役和纳税等特定义务，同时对联邦保持最高的政治忠诚。"
 estate_EDG_GRE_Hellenic_Nationalism:0 "§T希腊民族主义§!"
 estate_EDG_GRE_Hellenic_Nationalism_desc:0 "民族主义是一种意识形态和社会运动，强调民族作为政治生活的核心单元，主张民族认同、忠诚和团结，并通常追求民族的自治、统一或独立。希腊民族主义滥觞于叙拉古独立战争，以古希腊文明（民主、哲学、艺术）和东正教传统为双重遗产，重新构建出一种「连续性」民族叙事。"
 estate_EDG_GRE_Hellenic_Nationalism_tt:0 "我们治下所有§T文化组§!为§T希腊§!的省份都将获得："
 EDG_GRE_Hellenic_Nationalism_modifier:0 "希腊民族主义"
 EDG_GRE_Hellenic_Nationalism_modifier_desc:"§T让我攀登苏尼阿的悬崖，\n\n可以听见彼此飘送着悄悄话，\n\n让我像天鹅一样歌尽而亡；\n\n 我不要奴隶的国度属于我，\n\n干脆把那萨摩斯酒杯打破！§!"
 estate_EDG_GRE_Elysium_Dream:0 "§T埃律西昂之梦§!"
 estate_EDG_GRE_Elysium_Dream_desc:0 "你注定不会死在牧马的阿尔戈斯，\n不会在那儿接受命运的终局。\n众神将把你送往埃律西昂平原，\n送往大地的尽头，送往金发的拉达曼提斯身边——\n那里生活最安逸，凡人不需辛劳，\n没有风雪，没有冬雨，没有漫长的寒冬，\n只有大洋之神俄刻阿诺斯不断吹拂的\n温煦的西风，抚慰着所有终老的英雄。"

 EDG_SIC_estate_interracial_name:0 "希腊人"
 EDG_SIC_estate_interracial_desc:0 "希腊人是西西里土地上最古老的文明记忆之一，他们早在三千年前便跨海而来，栉风沐雨建立城邦，将橄榄枝与哲学思辨植根于岛屿的沃土。而后任凭罗马、萨拉森与诺曼接踵而来，希腊人依然在特里纳克里亚举足轻重。从「西西里晚祷」到「巴勒莫事变」，希腊人在西西里统治近200年，与本地人逐渐融合，形成了独特的希腊-西西里文化。希腊移民带来了语言、建筑和法制，他们作为医生、星象家、税务官与外交翻译，为宫廷注入拜占庭式的治理智慧，其海事经验更成为王国掌控地中海商路的关键。即便在霍亨施陶芬王室回归的当下，他们也是国家不可或缺的一部分。"
 estate_EDG_SIC_interracial_Girko_Community:0 "§O格里科社区§!"
 estate_EDG_SIC_interracial_Girko_Community_desc:0 "「格里科社区」最初是指生活在南意大利的希腊裔语言文化群体。早在公元前8世纪起，希腊人就在当时被称为「大希腊」的今南意大利建立了许多殖民城市，如叙拉古、塔兰托、克罗托内等。而在拜占庭时期，由于君士坦丁堡的统治，希腊文化逐渐在南方复兴。尽管而后诺曼人一度统治了两西西里，但也没有改变当地枝繁叶茂的希腊社区。时至今日，我们恢复了天主教在西西里的统治，而并未与希腊人针锋相对，而是选择了合作包容。在我们王朝的治下，空气与阳光平等地属于所有人。"
 estate_EDG_SIC_interracial_Girko_Community_tt:0 "我们治下所有位于§O南意大利§!或§O文化组§!为§O拜占庭§!的省份都将获得："
 EDG_SIC_interracial_Girko_Community_modifier:0 "格里科社区"
 EDG_SIC_interracial_Girko_Community_modifier_desc:"§O我给予希腊人应得的荣誉，\n\n也不剥夺拉丁人的财富，\n\n手持盾牌，\n\n保护双方，\n\n不让任何一方不公正地取胜。§!" 

 EDG_Syracusae_estate_interracial_name:0 "帕罗科伊"
 EDG_Syracusae_estate_interracial_desc:0 "帕罗科伊（Perioikoi），即「边区公民」，是叙拉古共和国在扩张过程中纳入的非希腊裔自由民阶层的统称——他们来自新征服地区或联邦边缘（如一开始的意大利亚和安纳托利亚，后来的波斯和伊比利亚），保留一定程度的本地自治，从事工商业与辅助性军事服务，但经常被排除在核心政治权力之外。边民的人身自由受帝国法律保护，财产权与希腊裔公民等同，他们在本地事务中实行高度自治。但这一切以两项义务为代价：缴纳高于公民的土地税与贸易税，并在战时按比例提供辅助部队。然而，这条边界并非一成不变。随着国家的不断扩张，可以预见的是，越来越多的帕罗科伊终将接纳「希腊公民」的身份。"
 estate_EDG_SIC_interracial_Mercenary:0 "§T建立整编军团§!"
 estate_EDG_SIC_interracial_Mercenary_desc:0 "希腊世界刚刚从崩溃的边缘恢复，我们的民众亟待休养生息，无法支持共和国大规模的战事。于是，护国公狄奥多勒认为，我们可以借鉴历史上同样缺少人口的众希腊化国家的军队建设，以希腊军士为核心，广泛学习当地的军事传统，以异族士兵建立一系列整编军团。"
 estate_EDG_SIC_interracial_Mercenary_tt:0 "我们将能在完成特定征服任务后解锁一系列§T整编军团§!。"
 estate_EDG_SIC_interracial_Generals:0 "§T拔擢外籍将领§!"
 estate_EDG_SIC_interracial_Generals_desc:0 "从国父狄奥多勒时代以来，尚武的传统就在希腊民族逐渐复兴。希腊先人尊重强者，重视才干程度远超籍贯与血统。我们应当延续这种光荣传统，采取才能优先，广纳有能之辈。"
 estate_EDG_SIC_interracial_Generals_tt:0 "§Y招募将领§!现在将提高§Y5点§!§T异族人阶级忠诚度§!。"
 estate_EDG_SIC_interracial_Marshal:0 "§T委任大元帅§!"
 estate_EDG_SIC_interracial_Marshal_desc:0 "执政官兼任联邦政府、护国议会和国防军的领袖，事务繁忙，或许我们可以从军队中拔擢一位有能之人，为执政官分担压力。"
 estate_EDG_GRE_Illyrian_Hussars:0 "§T伊利里亚龙骑兵团§!"
 estate_EDG_GRE_Illyrian_Hussars_desc:0 "尽管轻骑兵编队的概念最早源自于古罗马，但人们普遍认为巴尔干骠骑兵第一次出现，是作为东帝国的辅助部队现身于历史舞台，其成员主要从帝国于10和11世纪控制的塞尔维亚地区募集而来。即使在罗马没落之后，这个传统也仍然在持续着，并在此后的几个世纪中进一步细化完善，并最终形成了今天的伊利里亚龙骑兵团。"

 EDG_Syracusae_estate_cossacks_name:0 "罗斯人"
 EDG_Syracusae_estate_cossacks_desc:0 "东斯拉夫人起源于第聂伯河沿岸，在东欧平原繁衍生息，而后与瓦良格人融合形成了今天的罗斯民族。自罗斯受洗为始，他们渐渐融入了希腊领导下的正教世界，与我们结下了不解之缘：罗斯视希腊为兄长，西里尔字母由希腊传教士创作，斯拉夫礼仪直接译自希腊文，圣事有效性完全同一；希腊人视罗斯人为密友，双方共享异族统治下「受难者」身份记忆，通过瓦希之路密切往来。这种在共同信仰纽带下形成「兄弟民族」关系，超越单纯的文化交流，正是正教文明内在张力和生命力的核心体现。"
 estate_EDG_GRE_restore_Varangian_Route:0 "§T恢复瓦希之路§!"
 estate_EDG_GRE_restore_Varangian_Route_desc:0 "瓦希之路，即「从瓦良格到希腊之路」，是连接北欧、东欧与希腊世界的跨国水路贸易网络，它奠定了基辅罗斯国家的经济基础，促成了罗斯文明的正教化，深刻塑造了东欧的历史轨迹。13世纪后，拉丁共和国的崛起、基辅罗斯的分裂、罗马帝国的崩溃、蒙古人的入侵等多重因素导致了瓦希之路的衰败，希腊人与罗斯人的连接一度断绝。如今，我们两个民族都已缓慢复苏过来，是时候重开瓦希之路了。"
 estate_EDG_GRE_establish_embassy_in_Russia:0 "§T建立驻罗斯大使馆§!"
 estate_EDG_GRE_establish_embassy_in_Russia_desc:0 "瓦希之路的重要性与日俱增，希腊-罗斯民族之间的交流越来越频繁和密切。一些外交官欲前往罗斯，以我们的名义建立大使馆，以此巩固两国之间的关系。我们的朋友也欣然接受这个提议，并同样派来了他们的外交官。"
 estate_EDG_GRE_study_Siberian_Frontiers:0 "§T吸纳罗斯拓荒团§!"
 estate_EDG_GRE_study_Siberian_Frontiers_desc:0 "西伯利亚拓荒团是一批在罗斯统一后形成的、以哥萨克探险家为先锋、由罗斯国家支持驱动的武装殖民群体，通过武力征服、要塞建设和毛皮贸易，将西伯利亚纳入罗斯版图，并塑造了该地区的斯拉夫化进程与经济结构。希腊人和罗斯人一样爱好探索，早在公元前就开始了自己的伟大旅程，只是随着时光流逝，那段记忆越来越模糊。但是没关系，我们的朋友会帮我们重温那段开拓岁月。"
 estate_EDG_GRE_joint_military_drill:0 "§T希腊-罗斯军事联合§!"
 estate_EDG_GRE_joint_military_drill_desc:0 "射击军是15世纪中期由内战中的罗斯君主创建并发展的常备步兵部队，以使用火枪射击战术和兼具军事与工商业职能的封闭性社区生活为特征，依靠拥护统一和中央集权的中小贵族建立。分为首都军和市民军两大部分：首都军负责克里姆林宫防务、警戒及消防；市民军则驻防各地城镇，执行边境守卫与地方任务。其战术以防御阵型为主，采用齐射与轮换装填技术，被称为「可移动的堡垒」。叙拉古是尚武之国，乐于向所有国家学习其军事传统并加以改造，用于自身军制。就让我们和罗斯兄弟也进行一次军事交流，学习一下他们的技艺。"
 estate_EDG_GRE_Vodka:0 "§T引入罗斯酒饮§!"
 estate_EDG_GRE_Vodka_desc:0 "伏特加是一种近年来起源于罗斯的透明蒸馏烈酒，最初作为药物或「生命之水」在修道院和贵族间小范围流通，逐渐普及后，民间出现大量私酿，成为农民冬季御寒和节日饮品。随着罗斯统一事业的推进和王权势力的加强，伊凡雷帝建立第一批「皇家酒馆」；之后的沙皇将伏特加生产销售作为国家财政支柱，实行严格垄断。我们的国民也对这一罗斯人喜爱的酒饮展现出浓厚的兴趣，不管是为了财政考量还是为了取悦民众，护国公都可以考虑引入这一特殊工艺。"
 estate_EDG_GRE_Vodka_tt:0 "\n§T我们治下生产谷物的省份将引入伏特加工艺。§!\n"
 estate_EDG_GRE_Vodka_INCOME_DESC:0 "从§Y酒类§!和§Y谷物§!的生产中获得"
 estate_EDG_GRE_Russian_absolutism:0 "§T学习罗斯专制主义§!"
 estate_EDG_GRE_Russian_absolutism_desc:0 "罗斯专制主义起源于蒙古人的统治理念，在基辅罗斯崩溃后的漫漫长夜中萌芽，经罗斯统一战争锤炼，为米哈伊尔三世与伊凡雷帝所强化，以沙皇拥有绝对且神圣不可侵犯的权力为核心，国家全面掌控社会、经济与意识形态，并带有强烈扩张倾向与救世使命感的独特集权政治传统。在这个当中央政府从其他势力手中夺取国家绝对权力的时代，为了护国公可以心无旁骛地建设国家，我们不妨学习下罗斯人的思想。"
 
 EDG_Syracusae_estate_nobles_name:0 "豪族"
 EDG_Syracusae_estate_nobles_desc:0 "在旧东罗马帝国地方（尤其是行省）中，豪族是指凭借土地财富、军事资源、家族网络或官僚身份而形成实际支配力的地方显贵阶层。他们介于中央皇权与普通平民之间，既是帝国统治的支柱，也可能成为离心力量的来源。作为一个诞生在东罗马继业者遗体上的军事化国家，我们必须吸取经验教训，不能忽视这些掌握军事资源的希腊豪族。"
 estate_EDG_GRE_balance_between_the_Porphyra:0 "§T平衡诸§!§P紫室§!"
 estate_EDG_GRE_balance_between_the_Porphyra_desc:0 "所谓「紫室」家族是各希腊豪族中最为特殊的一批，他们通过与罗马皇室（尤其是「生于紫室」的成员）长期、多次联姻，深度融入皇族血脉网络，并借此垄断高级官职、掌控大量土地与私人武装，从而对帝国政治产生支配性影响力。他们并非单纯的军事或地主贵族，而是以「紫室血统」为合法性源泉和政治资本的特权集团，是罗马帝国血缘政治与官僚军事体制结合的终极产物。各大豪族在共和国内拥有着盘根错节的利益关系，为了确保军政府的团结，我们应当让渡部分利益，团结各大紫室豪族。"
 estate_EDG_GRE_control_Doukas:0 "§T控制§!§P紫室§!§T：杜卡斯§!"
 estate_EDG_GRE_control_Doukas_desc:0 "杜卡斯王朝（1059-1078年），中期东罗马短命王朝，官僚贵族出身，统治期间遭遇曼齐克特惨败，但在后续通过支持科穆宁王朝并与其长期联姻合作，杜卡斯家族仍拥有着相当大的影响力。1443年，罗马皇帝安德罗尼卡五世继位，此时杜卡斯家族的尼基弗鲁斯掌握了帝国内部相当大的一部分权力，他自知有可能被皇帝攻击，且自己可能无法在军事上战胜皇帝，因而将帝国内忠于自己的军队私自调走，入侵热那亚共和国的黑海领地，建立了亚速专制公国。如今杜卡斯家族已经向联邦投诚，他们的权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个朝不保夕的政权。"
 estate_EDG_GRE_control_Komnenos:0 "§T控制§!§P紫室§!§T：科穆宁§!"
 estate_EDG_GRE_control_Komnenos_desc:0 "科穆宁王朝（1081-1185年），罗马最后的中兴王朝，通过军事贵族联盟重建中央权力，其创新性的军区制改革和家族网络统治一度重振帝国，但过度依赖贵族和与西方的恩怨也埋下了长期隐患。1204年悲剧后，科穆宁家族建立了特拉布宗帝国，在黑海沿岸苟且偷生。14世纪时，不思进取的大科穆宁们日日把酒言欢，直到阿夫沙尔突厥人包围了他们的金城汤池。他们如梦方醒，卷走金银细软乘上战舰抛弃城市和他们的属民而去，但不少船只，包括那位而那位望风而逃科穆宁皇帝和他满载历届皇帝所搜刮的金银财宝的战舰都被卷入了黑海的滚滚浪涛之中。如今科穆宁最后的落胤已经被联邦寻得，他们昔日的权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个荒唐可笑的回忆。"
 estate_EDG_GRE_control_Palaiologos:0 "§T控制§!§P紫室§!§T：巴列奥略§!"
 estate_EDG_GRE_control_Palaiologos_desc:0 "巴列奥略王朝，罗马的末代王朝，其统治时期是帝国的一场漫长葬礼。虽在1261年成功复国，但罗马已沦为小国，王朝又多次陷入毁灭性内战和宗教纷争，无力压制斯拉夫人和突厥人的兵锋，最终只能屈服于异族铁蹄。如今巴列奥略家族已经向联邦俯首，他们的权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个脆弱不堪的理想。"
 estate_EDG_GRE_control_Angelos:0 "§T控制§!§P紫室§!§T：安杰洛斯§!"
 estate_EDG_GRE_control_Angelos_desc:0 "安杰洛斯王朝（1185-1204年），科穆宁王朝衰落后凭借血统关系上位的短命王朝，在其统治期间罗马帝国国都失陷，帝国分裂为多个希腊人国家和拉丁政权。1411年，以米海尔·安杰洛斯家族为首的军事贵族发动了一场反叛，尽管叛军被曼努埃尔二世击败，但米海尔带领自己的部队向西渡海，得到了威尼斯共和国的支持，将还桎梏于内战中的西西里岛攻下，建立起了一个东正教希腊裔王国。1443年，伟大的护国公狄奥多勒宣布废黜安杰洛斯王朝，建立起了护国议会领导的国家，这就是我们叙拉古的前身。安杰洛斯家族已经被联邦牢牢掌控，他们的权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个遥不可及的梦想。"
 estate_EDG_GRE_control_Laskaris:0 "§T控制§!§P紫室§!§T：拉斯卡里斯§!"
 estate_EDG_GRE_control_Laskaris_desc:0 "拉斯卡里斯王朝（1204-1261年），在1204惨剧后建立尼西亚帝国这一东罗马继业者的王朝，通过在绝境中守护正统希腊文化，组织抵抗拉丁统治，为收复首都奠定基础。尽管最终被巴列奥略家族的米海尔篡权，但拉斯卡里斯家族仍然在帝国内为巴西琉斯效力。1444年初，安德罗尼卡五世任命拉斯卡里斯家族的狄奥多尔为摩里亚专制公，但后者最终在威尼斯和西西里的支持，拥兵自立，并自称巴西琉斯，与安德罗尼卡分庭抗礼。如今拉斯卡里斯家族已经同意和共和国进行最深层的合作，他们的权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个虚无缥缈的野望。"
 estate_EDG_GRE_control_Vatatzes:0 "§T控制§!§P紫室§!§T：瓦塔泽斯§!"
 estate_EDG_GRE_control_Vatatzes_desc:0 "瓦塔泽斯王朝（1222-1261年），实际统治尼西亚帝国的家族，通过联姻继承拉斯卡里斯政权，推行稳健经济政策，发展农业和贸易，积累复国实力，在约翰三世治下使帝国国力达到顶峰，实际奠基东罗马复国事业。1443年，出身瓦塔泽斯家族的护国公狄奥多勒开启了希腊民族历史的新纪元，实际掌控了瓦塔泽斯家族，其权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个腐朽不堪的帝国。"
 estate_EDG_GRE_control_Sassanid:0 "§T控制§!§P紫室§!§T：萨珊§!"
 estate_EDG_GRE_control_Sassanid_desc:0 "萨珊王朝（224-651年），与罗马长期并存、争霸400年的伊朗帝国，其行政体系高度中央集权，艺术、建筑和学术成就显著，复兴波斯传统文化，更是希腊文明古典宿敌的延续。但最终被萨拉森人征服。千年时光足以消弭很多东西，往日的恩怨已是过眼云烟，如今的萨珊末裔已经紧紧依附于联邦，其权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个愚不可言的目标。"
 estate_EDG_GRE_control_Ryurik:0 "§T控制§!§P紫室§!§T：留里克维奇§!"
 estate_EDG_GRE_control_Ryurik_desc:0 "留里克王朝，罗斯的起源王朝，600年的统治历史使其已经成为了一个民族符号。从奥列格到圣弗拉基米尔，从雅罗斯拉夫到米哈伊尔三世，留里克维奇越来越融入希腊与东正教世界。伴随着文明与信仰在浩劫之后的复苏，希腊和罗斯越来越密不可分。如今一部分有权势的留里克维奇也进入联邦定居，建立起一个颇具政治力量的新豪族，其权力网络和政治资源今后也将为希腊民族的事业服务，而非为了一个蹒跚学步的文明。"

