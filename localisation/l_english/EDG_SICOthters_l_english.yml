 EDG_Firepower_Act_6:0 "世界帝国"
 EDG_Firepower_Act_7:0 "人民炮兵"
 EDG_Firepower_Act_8:0 "「新秩序」改革"
 EDG_Firepower_Act_9:0 "王家工事、炮兵与设计学院"
 EDG_Firepower_Act_10:0 "纳里亚德团"
 EDG_Firepower_Act_11:0 "李希滕施泰因体系"
 EDG_Firepower_Act_12:0 "胜利之路"
 EDG_Firepower_Act_13:0 "净化条例"

 EDG_Firepower_Act_0_desc:0 "火药是国家军队的血脉，也是社会暴乱的引信。将硝石矿、硫磺矿、火药工坊收归国营，统一配方，统一存量，统一配发。每一桶火药都有编号，每一发炮弹都登记在册。监管署的印章盖在弹壳上，也盖在叛乱的咽喉上。国库因垄断而充盈，社会因管控而安定。"
 EDG_Firepower_Act_1_desc:0 "铸炮需要铜锡，火药需要硝石，运输需要车马。从矿山到工坊，从工坊到港口，从港口到前线——通过一系列的努力，我国已经拥有了完整的军工产业链，能自主将原材料转化为火力。每一门火炮的炮管上都烙印着矿工的汗水、工匠的技艺、商人的资本。军工兴则百业兴，百业兴则国库盈。"
 EDG_Firepower_Act_2_desc:0 "外交辞令的背后，是舰队舷窗中伸出的炮管。装备巨炮的战舰巡弋公海之上，每逢商路争端或领地纠纷，舰炮的轰鸣便是最简洁的谈判语言。和平来自震慑，让步源于恐惧。敌人畏惧炮口，盟友敬重实力。炮舰抵达之日，谈判便开始之时。"
 EDG_Firepower_Act_3_desc:0 "神职人员为火炮祝圣，士兵将信仰的意志刻在炮弹上。神圣使命赋予战争以合法性，烈焰成为惩罚敌寇的利刃。每一声轰鸣都是对渎神者的审判，每一道爆炸都是天罚的显现。圣旗所向，炮火所至；信仰不灭，烈焰不息。"
 EDG_Firepower_Act_4_desc:0 "集中所有火炮于决定性方向，不计成本地倾泻弹药，瞬间改变一场战役的格局，以雷霆万钧之势撕开敌阵。将军团野战炮队编入进攻梯队，在进攻作战中不计成本地倾泻弹药。弹幕密度超过敌军承受极限时，城墙开裂，队列溃散，防线崩塌溃败从天而降。先轰后冲，不留活口；以火洗地，寸草不生。猛烈的火力本身就是进攻的号角。"
 EDG_Firepower_Act_5_desc:0 "火狱是《古兰经》反复描述的为不信道、作恶与不义者预备的后世惩罚之所，那里燃烧着吞噬一切的烈火，充满沸水、毒风与永无间断的酷刑，是被逐出真主慈悯的终极深渊。而先知穆罕默德（愿主福安之）曾赐予阿里名剑佐勒菲卡尔，这把剑在正义之战中代表了捍卫正道、将悖逆之敌击入火狱的神圣裁决力量。而当信徒因私欲或派系纷争，将本该指向外敌的利刃挥向自己的教胞时，这把剑便从吉哈德的工具，扭转为将持剑者本身拖入火狱的「刑罚之引」。如今，教法学家认为，真主已经将火狱之剑赐予了我们的哈里发，促使我国为新一轮的吉哈德和统一达尔·伊斯兰而努力。"
 EDG_Firepower_Act_6_desc:0 "远征舰队的船艏炮口指向未知的海岸线。火炮不仅用于轰击土著堡垒，更用于宣告主权、驱逐竞争者。殖民地在炮台的庇护下生根，贸易站在舰炮的射程内繁荣。每一声炮响，都是文明疆界向外延伸的信号。"
 EDG_Firepower_Act_7_desc:0 "我们的炮兵部队不仅拥有最先进的武器，更拥有最先进的思想和理念，并采用了最先进的战术。所以炮兵都出身于自由民，不为大大小小的封建主而战，而一心一意为自己的农民同胞而战，是真正的人民炮兵。"
 EDG_Firepower_Act_8_desc:0 "为了扼制敌国的上升势头，帕迪沙塞利姆三世决定先从军队入手，训练一支新式军队取代帝国的近卫兵团。他专门购入了一批来复枪和西式火炮，又请来外国军事顾问负责训练新军。塞利姆三世组建了忠于君主的新的常备军。他创办了陆军和海军等各种新的军事学校，聘请外国教官任教。为了配合外国教官们的工作，他还专门设立了几所军事院校，用外文授课，每所学校都新建一个图书馆，收藏的也大都是外文书籍。"
 EDG_Firepower_Act_9_desc:0 "火炮撕开旧时代的城墙，工事抵御新时代的浪潮。为了维持王国在海外的利益，统一伊比利亚以降的列位伊比利亚君主都大力延揽欧洲顶尖军事工程师，于里斯本创立这所结合数学、制图、筑城与炮兵学的皇家学院。在这里，贵族子弟与平民天才一同钻研沃邦式防线、弹道计算与海岸炮台设计。正是这些毕业生，让一座座棱堡在无数围攻中屹立不倒，也令伊比利亚的炮兵在每一次排射中打出属于半岛的怒吼。"
 EDG_Firepower_Act_10_desc:0 "为了推进罗斯帝国的霸业，伊凡「雷帝」大力增强中央集权、推行军事改革，他建立了「纳里亚德」（本意为「派遣」或「分遣队」），即一种任务导向的临时性炮兵分遣队，本身并非固定编制，而是根据具体任务需要集结的临时单位。人员主要从炮手和早期火绳枪步兵中抽调。纳里亚德团在当时是重型火力的代名词，为攻坚破城立下了汗马功劳，其运作模式也为后来的罗斯炮兵正规化奠定了基础。"
 EDG_Firepower_Act_11_desc:0 "针对在奥地利王位继承战争中暴露的炮兵严重短板，李希滕施泰因亲王受命对皇家炮兵进行全面改革。他亲自研发并普及了炮管仰角螺旋调整装置，极大提高了射速和精度；并废除在露天场所装载松散火药的危险操作，改用安全高效的药包供弹。通过「李希滕施泰因体系」 ，他为奥地利建立了从武器制造、弹药供应到人员训练的全新标准，让帝国炮兵一跃成为欧洲军事强国中「最强大的工具」。"
 EDG_Firepower_Act_12_desc:0 "兰开斯特家族的家徽是一朵鲜红的玫瑰，而浇筑出那样的玫瑰需要足够的鲜血，而鲜血源于战争。\n\n用敌人的血铸就我们的传奇，用敌人的血宣告我们的胜利，在绝对的火力面前，胜利之路已然敞亮！"
 EDG_Firepower_Act_13_desc:0 "圣母玛利亚的骑士们在圣战旗帜下集结，十字军以无垢的原胎之名，将渎神者的罪孽尽数洗刷。在圣伯多禄和里加大主教的指引下，我们会用圣母的神圣胸襟教导不信者，向他们传授基督的教义。"

