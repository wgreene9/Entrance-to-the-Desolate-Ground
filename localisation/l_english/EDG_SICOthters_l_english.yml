 desc_EDG_GRE_TAB_Ducate:0 "马赞德兰人，你崛起吧！"
 EDG_GRE_Supprot_Noms:0 "支持诺姆人"
 desc_EDG_GRE_Supprot_Noms:0 "「马利克的卫队中有许多来自希腊的人。他们被称为‘朱鲁吉’（Juruji），是射手，是剑士，也是懂得制造希腊火的工匠。他们不说阿拉伯语，不与当地人通婚，住在开罗城外一个叫‘小拜占蒂翁’的街区里。街区的教堂虽小，却保持着希腊的礼仪。」"
 EDG_GRE_Alexandar_Diadoch:0 "继业者"
 desc_EDG_GRE_Alexandar_Diadoch:0 "「凭我离开时两手空空，回来时仍然两手空空——除了这片土地上的人民愿意给我的东西。」"
 EDG_GRE_Philhellenism:0 "爱希腊者"
 desc_EDG_GRE_Philhellenism:0 "「希腊人」这个名字不再属于一个种族，而属于一种智识。那些接受我们教育的人，比那些仅仅与我们分享血缘的人，更配得上被称为「希腊人」。\n\n如果有人问：谁是真正的希腊人？我的答案是：那些爱希腊的人。\n\n无论他们出生在哪里，无论他们的父辈说什么语言，只要他们愿意学习我们的文化、效仿我们的制度、追随我们的神祇，他们就是我们的同胞。\n\n而如果他们中的某些人还能拿起武器，与我们共同对抗蛮族——那些人，应当被刻在最光荣的石碑上。"