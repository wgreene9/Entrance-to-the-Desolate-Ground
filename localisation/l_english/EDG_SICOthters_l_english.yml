#特质
 EDG_personality_Grand_LordProtector:0 "大护国公"
 EDG_personality_Grand_LordProtector_desc:0 "狄奥多勒·瓦塔泽斯出身于拉斯卡里斯家族旁支，发迹于行伍，三十多岁便在军队崭露头角，并在西西里皇帝伊萨克四世死后执掌大权，废黜无能幼帝，在诸豪族的拥护下建立了共和国。在拉丁人发起的侵略、废帝和公教余孽勾结的叛乱中，狄奥多勒击败了每一个敌人，为叙拉古人赢得了民族独立、国家复兴。此刻，他即将带领叙拉古这个崭新而古老的国家，奔向更伟大的命运。"
 EDG_personality_Grand_LordProtector_die_desc:0 "狄奥多勒·瓦塔泽斯是希腊最骄傲的儿子，他重建了叙拉古国家，拯救了正教文明，复兴了希腊世界的共和传统，并继承亚历山大大帝的衣钵发起了新的征服，为第二次希腊化时代拉开了序幕。他的执政生涯堪称完美，对得起护国议会和全体希腊人民授予的大护国公职务，领导叙拉古这艘希腊人的诺亚方舟航向远方，无疑是我国历史上最神功圣武的一位领袖。此刻，所有希腊人的呼吸都因失去他的哀恸而暂停。"

 EDG_personality_LordProtector:0 "护国公"
 EDG_personality_LordProtector_desc:0 "该统治者品行优渥、性格刚毅、能力过人，是受护国议会和全体希腊人民共同推举的联邦执政官，被授予了与国父狄奥多勒·瓦塔泽斯相同的「护国公」头衔，誓要带领共和国沿着先贤的道路行稳致远。"
 EDG_personality_LordProtector_die_desc:0 "他的成就和品德让每个知道他的人为之深情怀念，他的功业将被载入世界史册，他的棺椁将被希腊人民抬入雅典的先贤祠。"

 EDG_personality_Therios:0 "塞里奥斯「以弗所人」"
 EDG_personality_Therios_desc:0 "塞里奥斯·帕帕斯出生于以弗所的政治世家，其家族世代把握士麦那共和国的大权。他受到良好的教育，曾向遍访爱琴海沿岸乃至本都、西西里学习音乐、政治理论和哲学思想、他生于名门而不养尊处优，守正不阿、廉洁奉公、有眼光、善演说、坚毅冷静、气宇不凡、亲近平民，年纪轻轻就登上了士麦那的政治舞台，并在突厥人兵临城下前临危受命，接任士麦那执政官。他发自心底认同护国公狄奥多勒擘画的希腊民族主义，并愿意为之奋斗终生。在护国公告别尘世后，他被推选为新一代执政官，相较狄奥多勒，塞里奥斯更加内敛深沉，专注于行政改革和内政建设，常常被拿与古希腊先贤伯利克里相提并论。"
 EDG_personality_Therios_die_desc:0 ""
 
 EDG_personality_Andreas:0 "安德烈亚斯「安提柯」"
 EDG_personality_Andreas_desc:0 "安德烈亚斯·纪伯伦生于安条克城外的一个小村庄，其同村村民的祖先几乎都是迫于压力假意改信的正教徒，因此，在联邦军队行至安条克附近时，他们箪食壶浆，喜迎王师，安德烈亚斯也正是在这个时候加入了叙拉古军队。初出茅庐的他就展现出了惊人的军事才能，从大头兵做起，屡立大功，累升至塞琉西亚军区指挥官，并在联邦的有意引导下，成为了前异教徒和异邦人的榜样，因此团结了一批游离于叙拉古主流政治舞台之外的庞大力量。他的一些政敌称他为「安提柯」——那位差点统一了希腊化世界的继业者军阀，尽管他本人更喜欢以亚历山大大帝自比，但心胸宽广的他还是接受了这个称号，甚至在一次演说中立下了要超越安提柯、重建希腊化世界的豪言壮语。"
 EDG_personality_Andreas_die_desc:0 ""

 EDG_personality_Ignatios:0 "伊格纳修斯「圣徒」"
 EDG_personality_Ignatios_desc:0 "伊格纳修斯是一位品行优渥、谦卑侍神的教士，生于西科尔基斯省，从一个基层神职人员做起，累升至格拉特修道院院长，此后加入政坛，凭借自己的天赋聚拢了一批志同道合之人，为联邦与圣教会签订联合协定立下重大功劳。在联邦的政治风暴中，军政府迫于压力，推出了从未有过军旅生涯的伊格纳修斯作为执政官。伊格纳修斯的品行固然无处指摘，但他那出离的虔诚和稚嫩的掌权经验、尤其是对军队的幼稚认知，不知道会将我们的国家带向何方......"
 EDG_personality_Ignatios_die_desc:0 ""
 
 EDG_personality_Sotirios:0 "索蒂里奥斯「米特拉达梯」"
 EDG_personality_Sotirios_desc:0 "索蒂里奥斯·科穆宁据说是科穆宁王朝末裔，出生在本都省的一个军官家族，他的祖先因为在特拉比松之战中立下起义夺城之功而为他的家族赢得了「米特拉达梯」的称号。索蒂里奥斯在成年后就加入了联邦国防军，先后在亚细亚行省、阿伊普多斯特别区、巴克特里亚边疆区、印度前线任职，甚至在埃律西昂领地都待过一段时间，履历堪称完美。联邦震荡之时，索蒂里奥斯正好被调回叙拉古城，担任护国公卫队司令官，他迅速控制了混乱局势，取得了军队和官僚的信任，在之后被推举为护国公，领兵出征，迅速平定乱局。他的名字直接来源于基督的称号「救世主」，是一个寓意非常强烈的虔诚名字，而他也确实如他的名字一般，拯救了风雨飘摇的叙拉古巨舟。"
 EDG_personality_Sotirios_die_desc:0 ""

 EDG_personality_Constantinus:0 "康斯坦丁「立法者」"
 EDG_personality_Constantinus_desc:0 "康斯坦丁·雅典尼奥斯出生于阿提卡的一个平民家庭，曾在联邦国防军长期任职，在复员之后成为了一名行政人员，在索蒂里奥斯政府时期，他已升迁至内阁首席。在康斯坦丁执政之前，希腊联邦的行政机构就已迫切需要变革，新时代的格局已与狄奥多勒和塞里奥斯时期迥异，因此他主动响应时代的要求，对联邦的行政机构和官僚体制进行了完整、全面的改革。如果说索蒂里奥斯的武功堪比「世界光复者」奥勒良，那么康斯坦丁的文治则超越了查士丁尼大帝。他重塑了希腊的民族精神，赋予了希腊国家活的灵魂。"
 EDG_personality_Constantinus_die_desc:0 ""

#将领特质
 edg_sic_grand_lordprotector_personality:0 "§T大护国公§!"
 desc_edg_sic_grand_lordprotector_personality:0 "这位将领是护国议会和全体叙拉古人民共同推举的领袖，在他的领导下，我们从一场胜利走向另一场胜利。"
 edg_sic_grand_lordprotector_personality_die_desc:1 "他参军前，希腊世界还沉沦于异族的枷锁之下；他去世时，全希腊世界已经繁荣统一在叙拉古的鹰旗之下。"

 edg_gre_sword_of_alexandar_personality:0 "§T亚历山大之剑§!"
 desc_edg_gre_sword_of_alexandar_personality:0 "这位将领被认为是亚历山大大帝的继业者，以迅捷如风的征伐和无情似火的进攻而闻名于世。"
 edg_gre_sword_of_alexandar_personality_die_desc:1 "他为希腊民族开拓的万里疆域不会被任何一位公民忘记。"

