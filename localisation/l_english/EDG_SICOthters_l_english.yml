 EDG_SIC_end_disasters_modifier:0 "复兴曙光"
 desc_EDG_SIC_end_disasters_modifier:0 "TODO"
 EDG_GRE_back_home:0 "归乡心切"
 desc_EDG_GRE_back_home:0 "§T「即便我只是听说我的故乡伊塔卡，那山峦起伏、树木葱茏的地方，我也愿立刻死去。」§!"
 EDG_GRE_Byzantium_province_modifier:0 "希腊世界的第二心脏"
 desc_EDG_GRE_Byzantium_province_modifier:0 "§T「拜占蒂翁啊，你坐在波塞冬的牧场中央，\n\n金色的鱼群是你永恒的冠冕。\n\n你守护着黑海的咽喉，\n\n让每一艘平安归航的船只为你的名字奠酒。§!」"
 EDG_GRE_Athen_province_modifier:0 "§T古典之城§!"
 desc_EDG_GRE_Athen_province_modifier:0 "§T愿此城邦永远昌盛，\n\n愿它在战争中共享宙斯的公正，\n\n愿神明眷顾这片土地，\n\n让它成为希腊人的荣耀。§!"
 EDG_GRE_Kill_Arta_modifier:0 "§R复仇怒火§!"
 desc_EDG_GRE_Kill_Arta_modifier:0 "「§R不是因为贪图他们的土地，也不是因为渴求他们的财富，而是因为拉丁人的脚玷污了上帝之城，我们必须用烈火洗净每一块染血的石板。§!」"
 EDG_GRE_reconquer_North_Epirus_modifier:0 "§T希腊不会忘记§!"
 desc_EDG_GRE_reconquer_North_Epirus_modifier:0 "§T我们不会忘记它，§!\n\n§T希腊的北伊庇鲁斯，§!\n\n§T我们帮她重获自由。§!"
 EDG_GRE_Thessaly_Stud_Farm_modifier:0 "色萨利马场"
 desc_EDG_GRE_Thessaly_Stud_Farm_modifier:0 "§G在法尔萨洛斯的平原上，§!\n\n§G骏马如风驰过，§!\n\n§G它们的鬃毛在阳光下闪耀，§!\n\n§G如同匹尼奥斯河的波光。§!"
 EDG_GRE_raise_Thessaly_warhorse:0 "帖撒利亚战马"
 desc_EDG_GRE_raise_Thessaly_warhorse:0 "「这些马最美丽、最雄骏，比雪还白，跑起来快如旋风，是晨曦和阳光下最好的骏足。」"
 EDG_GRE_Elysium_fund:0 "埃律西昂探险基金"
 desc_EDG_GRE_Elysium_fund:0 "我去，这个都有人看描述吗？"
 EDG_GRE_Rejuvenate_Magna_Graecia:0 "大希腊重生"
 desc_EDG_GRE_Rejuvenate_Magna_Graecia:0 "§T何处有鱼群如银币闪烁，\n\n何处有港湾如新月弯弯，\n\n那里便是库迈人的餐桌，\n\n那里便是阿波罗赐予的牧场。§!"
 EDG_GRE_Banish_Latin_Republics:0 "取缔拉丁共和国"
 EDG_GRE_expel_crusaders:0 "毁灭十字军"
 desc_EDG_GRE_expel_crusaders:0 "§R他们的纪念，愿它在东方的教会中永远消亡，\n\n直至他们归还所盗取的、忏悔所玷污的——\n\n但谁能归还一座被焚毁的城？§!"
 EDG_GRE_Hellenic_Revenge_on_Latin_modifier:0 "§R@GRE希腊人的复仇§!"
 desc_EDG_GRE_Hellenic_Revenge_on_Latin_modifier:0 "我们希腊人的骨头是燧石，每一次击打，都擦出新的§R火焰§!。等到§R火焰燎原§!之日，那些曾用脚踩我们的人，将用自己的脚奔跑，因为我们的§R火焰§!会追上他们。"
 EDG_GRE_Destroy_Nova_Rome:0 "帝国陨落"
 desc_EDG_GRE_Destroy_Nova_Rome:0 "他们以罗马之名统治了千年，我们以希腊之名终结了这千年。"
 EDG_GRE_Save_Hellas:0 "§T拯救希腊§!"
 desc_EDG_GRE_Save_Hellas:0 "时光流转，岁月轮回，希腊终于重归我们。"
 EDG_GRE_Bulgarian_Butcher:0 "奥德律西亚屠夫"
 desc_EDG_GRE_Bulgarian_Butcher:0 "§R你问那山间为何如此寂静？\n\n只因一万四千根舌根已无法回应。\n\n你问那河水为何如此鲜红？\n\n只因保加尔人的眼窝里流出的血染红了埃玛河的源头。§!"
 EDG_GRE_Stick_to_True_Faith: "纯正信仰"
 desc_EDG_GRE_Stick_to_True_Faith: "......但这也许并非最优解。"
 EDG_GRE_gift_of_Mithras:0 "密特拉的赠礼"
 desc_EDG_GRE_gift_of_Mithras:0 "献给不可言说的密特拉，\n太阳的主宰，契约的守护者。\n\n诸神的名字可以翻译，\n但你的名字，\n我们只在洞穴中轻声念出。"
 EDG_GRE_Ducate_of_pontus_modifier: "本都军区"
 desc_EDG_GRE_Ducate_of_pontus_modifier:0 "本都是世界的中途——\n\n不是东方，不是西方，\n\n是所有方向的风都能吹到的地方，\n\n也是所有方向的风都懒得停留的地方。"
