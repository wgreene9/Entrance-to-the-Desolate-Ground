 EDG_SIC_decision_ambush_calabria_title:0 "奇袭@CBI卡拉布里亚"
 EDG_SIC_decision_ambush_calabria_desc:0 "@CBI卡拉布里亚公爵英锐刚毅，是我们的强敌，必须打断他的补给线，直捣他的老巢。"
 unlcok_EDG_SIC_decision_ambush_calabria_tt:0 "解锁决议：§T奇袭@CBI卡拉布里亚§!"

 EDG_SIC_decision_ambush_genoa_title:0 "奇袭@GEN热那亚"
 EDG_SIC_decision_ambush_genoa_desc:0 "@GEN热那亚公爵的被俘和军队的哗变已经让这个国家失去了所有的抵抗能力，我们应该趁此良机直取利古里亚。"
 EDG_SIC_decision_ambush_aegean_title:0 "@CRT爱琴海之怒"
 EDG_SIC_decision_ambush_aegean_desc:0 "在第四次十字军东征之后，拉丁人的不义统治已经在爱琴海诸屿延续了200多年，但是希腊人一直未被他们驯服，只要我们能抽空施加援手，当地的希腊人就会自主发动起义，驱逐威尼斯领主。"
 EDG_SIC_decision_ambush_corfu_title:0 "@CEP科孚岛事变"
 EDG_SIC_decision_ambush_corfu_desc:0 "@CEP科孚岛是威尼斯共和国进入希腊世界的桥头堡，也是我们进入亚得里亚海的拦路虎。幸运的是，这里的百姓都是不满于拉丁统治的希腊同胞，我们只需简单地挑动，他们就会为我们打开通往威尼斯腹心的大门。"
 EDG_GRE_decision_Player_Form_Syracusae_title:0 "@GRE建立叙拉古共和国。"
 EDG_GRE_decision_Player_Form_Syracusae_desc:0 "「今天不来，明天就一定到！」\n\n展翅高飞吧，多利亚的雄鹰！" 

 EDG_GRE_decision_see_province_group_title:0 "@GRE查看§T希腊§!省份组"
 EDG_GRE_decision_see_province_group_desc:0 "这是一个辅助性决议，仅供查看。"
 EDG_GRE_for_viewing_only_tt:0 "§T该决议仅供查看。§!"

 EDG_GRE_decision_rename_to_Hellas_title:0 "@GRE变更国号为§T希腊§!"
 EDG_GRE_decision_rename_to_Hellas_desc:0 "两千年前科林斯的游子，回到了他们的故乡。"

 EDG_GRE_decision_restore_Varangian_Route_title:0 "@GRE重建瓦希之路"
 EDG_GRE_decision_restore_Varangian_Route_desc:0 "瓦希之路，即「从瓦良格到希腊之路」，是希腊人和罗斯人商贸往来的重要路线，但因近几百年双方的衰败和纷飞的战火而一度断绝，如今是时候恢复这一古老的贸易路线了。"
 EDG_GRE_Varangian_Route_Nodes_Controlled_tt:0 "我国拥有§T瓦希之路各重要节点§!的通行权§g（决议所展示高亮省份）§!"
 unlock_estate_EDG_GRE_restore_Varangian_Route_tt:0 "解锁§T罗斯人§!特权：§T恢复瓦希之路§!"
 EDG_GRE_Varangian_Routes_Trade:0 "@GRE§T瓦希之路重建者§!"

 EDG_GRE_decision_Russian_Embassy_title:0 "@GRE出使罗斯"
 EDG_GRE_decision_Russian_Embassy_desc:0 "随着叙拉古与罗斯的合作愈发亲密，一些官员提议，我们两国可在首都互相为对方建立永久性使馆，作为双方友谊的见证。"
 unlock_estate_EDG_GRE_establish_embassy_in_Russia_tt:0 "解锁§T罗斯人§!特权：§T建立驻罗斯大使馆§!"
 EDG_GRE_Russian_Alliance_add_trust_tt:0 "我们的§T罗斯盟友§!将会与我们§T互相§!增加§T10§!点§Y人情§!和§Y信任§!。"

 EDG_GRE_decision_study_Siberian_Frontiers_title:0 "@GRE交流拓荒经验"
 EDG_GRE_decision_study_Siberian_Frontiers_desc:0 "当我们的远征队紧锣密鼓地开启埃律西昂探险运动时，我们的罗斯友邦也在冰天雪地的西伯利亚开展拓荒运动，或许我们可以相互交流一些探险经验，以便更快的开展殖民活动。"
 unlock_estate_EDG_GRE_study_Siberian_Frontiers_tt:0 "解锁§T罗斯人§!特权：§T吸纳罗斯拓荒团§!"

 EDG_GRE_decision_study_Vodka_title:0 "@GRE引进新式酒艺"
 EDG_GRE_decision_study_Vodka_desc:0 "罗斯的统治者将一种名为伏特加的烈酒进行了垄断控制，通过售卖推广这一饮品获得了大量的利益。酒是老英雄，越喝越奋勇，我们也是不会客气的。" 
 unlock_estate_EDG_GRE_Vodka_tt:0 "解锁§T罗斯人§!特权：§T引入罗斯酒饮§!"

 EDG_GRE_decision_study_streltsy_title:0 "@GRE打造射击军制度"
 EDG_GRE_decision_study_streltsy_desc:0 "射击军是罗斯特有的兵种，其军制和战术对我们也有一定借鉴意义，一些军事顾问和将军建议护国公和罗斯盟国进行一次军事经验交流，学习射击军军制。"
 unlock_estate_EDG_GRE_joint_military_drill_tt:0 "解锁§T罗斯人§!特权：§T希腊-罗斯军事联合§!"
 EDG_GRE_decision_streltsy_commanders_capital_tt:0 "15队§T射击军步兵§!将于我们首都招募。"

 EDG_GRE_decision_study_Russian_absolutism_title:0 "@GRE效仿罗斯专制主义"
 EDG_GRE_decision_study_Russian_absolutism_desc:0 "罗斯人已经发展出了绝对主义的思想，而这个时代正是属于统治者的绝对权威的时代，为了护国公的指令能够更好地贯彻，我们应该不耻下问，向他们学习。"
 unlock_estate_EDG_GRE_Russian_absolutism_tt:0 "解锁§T罗斯人§!特权：§T学习罗斯专制主义§!"

 EDG_GRE_decision_befriend_Morea_title:0 "@MOE交好§T摩里亚§!"
 EDG_GRE_decision_befriend_Morea_desc:0 "1443年，安德罗尼卡五世将驻守摩里亚的任务交给拉斯卡里斯家族的狄奥多尔，并任命其为摩里亚专制公，然而狄奥多尔却暗中争取了威尼斯和西西里的支持，背叛了安德罗尼卡五世，并拥兵自立，并自称巴西琉斯，是为狄奥多尔三世，与君士坦丁堡公开对立。西西里与摩里亚专制国拥有相同的立场——对抗君士坦丁堡政权和拉丁人，更重要的时，狄奥多尔出身的拉斯卡里斯家族与护国公背后的瓦塔泽斯家族同出于尼西亚皇室，血脉相连，若论起关系，护国公本人还是他的堂叔。我们两国是天然的盟友，理应进行联合。"
 
 EDG_GRE_decision_Contact_Smyrna_title:0 "@SUG交好§T士麦那§!"
 EDG_GRE_decision_Contact_Smyrna_desc:0 "在被突厥狼群噬咬劫掠的安纳托利亚故地，尚有一个希腊人国家——士麦那共和国残存于世。他们在被君士坦丁堡抛弃后，和我们一样不服从色雷斯伪帝的号令，独力与异族抗争。在过去，将目光聚焦于罗马帝位的西西里忽视了这一骨肉相连的同胞，如今，更关注希腊荣耀的我们，理应与她联合。"
 
 EDG_GRE_decision_Form_Syracusae_title:0 "@GRE成立叙拉古"
 EDG_GRE_decision_Form_Syracusae_desc:0 "「今天不来，明天就一定到！」\n\n展翅高飞吧，多利亚的雄鹰！"

 EDG_GRE_decision_support_NOM_title:0 "@NOM支持§T诺姆人§!"
 EDG_GRE_decision_support_NOM_desc:0 "萨哈达王朝轰然倒塌后，马穆鲁克军阀再次主导了近东的秩序，埃及的马利克决定吸取前朝教训，要求削弱马穆鲁克势力，并因此全国内建立多个名为「诺姆」的军区，军区军事长官是由君主直接任命的希腊裔军官。在阿拉伯大入侵后，希腊裔在埃及的影响力从没有如此之高，我们需要把握良机，支持埃及的希腊兄弟谋取更多的利益。"

 EDG_GRE_decision_vassalize_Morea_title:0 "@MOE多利亚之血"
 EDG_GRE_decision_vassalize_Morea_desc:0 "古希腊人并非单一民族，而是分为四个主要部落（或称方言集团）。这种划分主要基于他们所使用的古希腊语方言以及神话中的希伦四子族谱。其中，多洛斯的后裔多利亚人以勇武、严苛纪律和军事化社会著称，而叙拉古的母邦科林斯和斯巴达都属于多利亚部族。历史长河一度葬送了古希腊世界，但时间来到了现在，特里纳克里亚和拉栖代梦都已脱离了罗马帝国的统治，甚至都在同在拉斯卡里斯宗族的治下。因此，我们两国的人民一致认为，叙拉古和摩里亚需要团结一致，应对任何可能的威胁。"

 EDG_GRE_decision_vassalize_Smyrna_title:0 "@SUG以弗所的守望"
 EDG_GRE_decision_vassalize_Smyrna_desc:0 "以弗所位于小亚细亚西海岸，是伊奥尼亚十二城邦之一，相传为雅典王子安德罗克洛斯所建。吕底亚国王克罗伊索斯曾捐资修建阿尔忒弥斯神庙，使其成为古代世界七大奇迹之一。亚历山大大帝东征后，以弗所相继被继业者统治。公元前133年该城并入罗马，成为亚细亚行省首府，人口逾二十万，建有塞尔苏斯图书馆等宏伟建筑。使徒保罗在此传教三年，使徒约翰晚年居此，圣母玛利亚亦相传安老于此。公元431年第三次普世大公会议在此召开。然而，古以弗所在漫长的岁月中早已衰落废弃，而在古以弗所遗址旁，一群被罗马帝国抛弃的希腊人建立起了一个「新以弗所」，即士麦那共和国。如今，突厥人的进攻正让她岌岌可危，我们必须庇护士麦那人，确保希腊同胞的安危。"

 EDG_GRE_descion_Suez_Cannal_title:0 "@GRE修建§T托勒密运河§!"
 EDG_GRE_descion_Suez_Cannal_desc:0 "连接地中海与红海的运河最早可追溯到古埃及第十二王朝，辛努塞尔特二世与三世（值得一提的是，他们的名字正是「苏伊士」一词的来源）首开挖苏伊士湾至尼罗河的运河，试图沟通红海与地中海，但未成功。前600年法老尼科二世重启工程，因战争消耗暂停。在被希腊人统治后，前270年，法老托勒密二世重新开通了运河，并增设船闸，但历经千年，托勒密运河还是因泥沙淤积而废弃了。近几十年，威尼斯人试图与控制埃及和叙利亚的萨哈达王朝谈判修建运河，但最后不欢而散。随着叙拉古扶持诺姆军政府掌控埃及，重新开辟托勒密运河终于被提上了护国议会的历程。经过仔细的讨论和勘察，最终护国公敲定，将在克利斯马与布巴斯提斯之间，复兴托勒密运河，一举连接地中海和红海。"

 EDG_GRE_descion_Cimmerian_agriculture_title:0 "@AZO黑海农业复兴"
 EDG_GRE_descion_Cimmerian_agriculture_desc:0 "在古典时期，雅典等希腊城邦的本地粮食已无法养活全部人口。辛梅里安人曾粗放耕作的黑海北岸（如第聂伯河流域和陶里斯半岛），在希腊人带来精耕细作技术后，变成了古希腊世界的「北大仓」。这里出口的谷物（主要是小麦），养活了雅典等城邦的公民，支撑了希腊世界的繁荣。农业的繁荣与否对于一个国家来说至关重要，如今，黑海沿岸在经过千年的游牧民族袭扰掠夺后农田废弃，人烟稀少，我们需要及时重振黑海农业，以确保共和国的粮食安全。"

 EDG_GRE_decision_vassalize_Azov_title:0 "@AZO陶里斯遗梦"
 EDG_GRE_decision_vassalize_Azov_desc:0 "1443年，在罗马皇帝安德罗尼卡五世继位时，杜卡斯家族的尼基弗鲁斯掌握了帝国内部相当大的一部分权力，但他自知有可能被巴西琉斯攻击，且深知自己可能无法在军事上战胜年少有成的安德罗尼卡，因而将忠于自己的军队私自调走，并带领了一支雇佣军，与狄奥多罗的哥特统治者结盟，夺取了热那亚共和国位于黑海沿岸的领地，于是希腊人在陶里斯地区复兴了博斯普鲁斯王国。随着东帝国的灭亡和希腊民族意识的抬头，杜卡斯家族最终放下了对帝位的追求，我们应该趁机将他们发出邀约，请求联合。"

 EDG_GRE_descion_Landsia_Silk_title:0 "@GRE发展里海产业"
 EDG_GRE_descion_Landsia_Silk_desc:0 "作为是古丝绸之路的关键节点，里海沿岸地区贸易往来频繁，更是各种艺术风格和织造技艺的交融之地，其中，塔巴里斯坦被誉为伊朗地毯产业的中心。由于常年的分裂与战乱，地毯产业萎缩，大不如前。为了我们波斯领地的繁荣，护国公决定帮助伊朗人复兴这一传统产业。"

 EDG_GRE_descion_Pannonian_Methorian_title:0 "建立@RMN潘诺尼亚边疆区"
 EDG_GRE_descion_Pannonian_Methorian_desc:0 "多瑙河是希腊文明的极壁，当地的马扎尔人和达契亚人都厌恶德意志统治者，让我们利用这一点，扶植他们建立一个@RMN潘诺尼亚边疆区，拱卫国土。"

 EDG_GRE_descion_Rhipaion_Methorian_title:0 "建立@GK6瑞裴昂边疆区"
 EDG_GRE_descion_Rhipaion_Methorian_desc:0 "阿尔卑斯山脉是希腊文明的极壁，当地的瑞士人厌恶德意志统治者，让我们利用这一点，扶植他们建立一个@GK6边疆区，拱卫国土。"

 EDG_GRE_descion_recontrol_Nicaea_title:0 "@GK2重返尼西亚"
 EDG_GRE_descion_recontrol_Nicaea_desc:0 "荣耀的尼西亚，伟大的尼西亚，美丽的尼西亚，希腊人觉醒的起点，拉斯卡里斯先帝的基业，在被奥斯曼突厥蛮侵吞近200年后，终于重归约安尼斯三世的后人之手。"

 EDG_GRE_descion_vassalize_Egypt_title:0 "@NOM联合诺姆军政府"
 EDG_GRE_descion_vassalize_Egypt_desc:0 "在我国的鼎力相助下，希腊人已经再次在埃古普托斯站稳了脚跟，成立了一个体制与我们相近的军政府。护国议会一致认为，我们的付出是时候得到兑现了，护国公将向南方的兄弟们寄出一份联合请求。"

