#修会
 EDG_SIC_Girko_guild:0 "§T科林斯商会§!"
 EDG_SIC_Girko_guild_desc:0 "科林斯商会是一个由意大利-希腊裔（即所谓的「格里科」人）开创，于15世纪下半叶成立于维涅狄亚的商人公会，商人们以当年叙拉古的母邦——热衷贸易和航海的科林斯为商会起名。得益于联邦统治者的爱幸，以及从拉丁共和国学得的经验，商会成长十分迅速。到16世纪初时，其贸易网络已经遍布全地中海，甚至可以辐射新大陆。"
 EDG_SIC_Girko_guild_localization:0 "设立§T科林斯商会§!"
 EDG_SIC_Girko_guild_localization_short:0 "科林斯商会"
 EDG_SIC_Girko_guild_localization_full:0 "科林斯商会"
 EDG_SIC_Girko_guild_enable_flag_tt:0 "解锁地方组织「§T科林斯商会§!」。\n"

 EDG_SIC_Macedonia_Academy:0 "§T马其顿学院§!"
 EDG_SIC_Macedonia_Academy_desc:0 "马其顿学院于1453年建立于塞萨洛尼基，它的第一任院长和创始人是叙拉古国父狄奥多勒·瓦塔泽斯，是专门用于教育平民青年男子的机构，专注于教授军事技能、文化培养和宗教教育，旨在培养一批不受豪族影响、忠于护国公的联邦柱石。"
 EDG_SIC_Macedonia_Academy_localization:0 "设立§T马其顿学院§!"
 EDG_SIC_Macedonia_Academy_localization_short:0 "马其顿学院"
 EDG_SIC_Macedonia_Academy_localization_full:0 "马其顿学院"
 EDG_SIC_Macedonia_Academy_enable_flag_tt:0 "解锁地方组织「§T马其顿学院§!」。\n"

 EDG_SIC_Academeia:0 "§T叙拉古学园§!"
 EDG_SIC_Academeia_desc:0 "叙拉古学园由著名学者格弥斯托士·卜列东创建，是希腊文化、正教传统和柏拉图哲学的坚定拥护者。雅典哲人柏拉图曾经三度扬帆叙拉古，以期建立理想国。如今希腊世界的中心已经从雅典转移到了叙拉库塞，他的夙愿将由叙拉古的学者实现。"
