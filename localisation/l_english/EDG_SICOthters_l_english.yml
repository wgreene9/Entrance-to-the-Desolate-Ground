 EDG_SIC_loyal_Sicily_modifier:0 "卡尔比自治区"
 desc_EDG_SIC_loyal_Sicily_modifier:0 "§T能做法蒂玛哈里发陛下的狗，就是微臣最大的荣幸啊！§!"
 EDG_SIC_Reforms_of_Issac:0 "伊萨克四世的改革"
 desc_EDG_SIC_Reforms_of_Issac:0 "伊萨克四世皇帝，神武雄略，乃一代之英主......而降年不永，美志不就，悲夫！"
 EDG_SIC_Inner_Troubles:0 "§R统治危机§!"
 desc_EDG_SIC_Inner_Troubles:0 "「当统治者之间发生争吵、产生派系时，他们就不再是城邦的护卫者，而是城邦最大的祸害。因为他们手中握有权柄，他们的不和会比平民的不和带来更大的灾难。」"
 EDG_SIC_intervene_sicily_civil_war_modifier:0 "干涉两西西里内战"
 desc_EDG_SIC_intervene_sicily_civil_war_modifier:0 "我们要确保自己在两西西里内战中攫取最大的利益。"
 EDG_SIC_Fatimid_Support_modifier:0 "法蒂玛的战争援助"
 desc_EDG_SIC_Fatimid_Support_modifier:0 "胆小菇的恩情还不完。"
 EDG_SIC_PUA_lose_capital_modifier:0 "国都失陷"
 desc_EDG_SIC_PUA_lose_capital_modifier:0 "大势已去......"
