#理念
 Syracusae_ideas:0 "叙拉古理念"
 Syracusae_ideas_bonus:0 "叙拉古野心"
 Syracusae_ideas_start:0 "叙拉古传统"
 Syracusae_plus_ideas:0 "叙拉古理念"
 Syracusae_plus_ideas_bonus:0 "叙拉古野心"
 Syracusae_plus_ideas_start:0 "叙拉古传统"
 Syracusae_Military_Government:0 "叙拉古军政府"
 Syracusae_Military_Government_desc:0 "在「叙拉古独立战争」后，狄奥多勒·瓦塔泽斯挫败了安杰洛斯王室和公教徒的复辟阴谋，但他并未给自己加冕，走上罗马帝国的老路，而是选择与各豪族约定，建立了一个精诚团结的军政府，积极恢复希腊传统，摆脱罗马影响，在特里纳克里亚之滨重建了叙拉古共和国。"
 Syracusae_rejuvenation_of_civilization:0 "文明的复苏"
 Syracusae_rejuvenation_of_civilization_desc:0 "1204年的浩劫险些将正教世界和希腊文明拖入万劫不复之地，不过感谢上主，我们终究挺过来了。希腊文明古老智慧的灰烬在叙拉古海岸重燃。我们拾起柏拉图的书卷，再诵荷马的遗篇，恢复叙拉古的剧场，重建科林斯的立柱，修葺雅典的学院，重组马其顿的战阵，一个古老而富有生命力的文明正在复苏，并且比她历史上任何一个时刻都更加强健。" 
 Syracusae_control_the_Ecumenical_Patriarch:0 "庇护普世牧首"
 Syracusae_control_the_Ecumenical_Patriarch_desc:0 "君士坦丁波利斯主教，即普世牧首，希腊世界信仰的领袖，这位神圣的职位却长期被罗马皇帝控制，没有取得应有的地位，仅仅是巴西琉斯的工具。但叙拉古已经解放了拜占蒂翁城，希腊人的普世牧首已无需受限于罗马人和异教徒的阴影，护国公即是他的新庇护人。"
 Syracusae_Come_form_Syracusae:0 "从雅典到叙拉古"
 Syracusae_Come_form_Syracusae_desc:0 "柏拉图曾经三赴叙拉古，但都以苦涩的失败告终。新生的叙拉古曾经也只是世族勋阀的利益联合体，处于陷入军事僭主统治的边缘，但经过多位护国公的努力，我们终于向世人证明，所谓僭主的暴政不过昨日故梦，千年前哲人囿于对话录中的理想已在地中海的晨光中显形，在法典与议会中第一次真实呼吸。从雅典来，到叙拉古去——柏拉图未竟的彼岸，如今已经屹立于此地。"
 Syracusae_Meagali_Idea:0 "伟大理想"
 Syracusae_Meagali_Idea_desc:0 "在罗马人窃取我们的遗产、贬抑我们的文化之前，希腊民族在文明世界拥有比罗马更大的影响力，甚至远远超出我们的版图。从海格力斯柱到印度，从西徐亚草原到尼罗河尽头，叙拉古必须实现国父狄奥多勒的伟大理想，再次恢复希腊化世界，共同飞向伟大的明天。" 
 Syracusae_Greek_Fire_Revolution:0 "希腊火革命"
 Syracusae_Greek_Fire_Revolution_desc:0 "希腊文明是建立在海洋与舟船上的文明，强大的舰队从古希腊到东罗马，都为我们带来了无数美名。为了恢复从大西洋到印度洋的辽阔希腊化世界，海军的强大不可或缺，而为了弥补从1204大劫至今的数百年衰退，一场技术革命势在必行。「希腊火」这一威名赫赫的海军武器，即将以另一种姿态再次登上战争舞台。"
 Syracusae_Second_Hellenistic_Age:0 "第二次希腊化时代"
 Syracusae_Second_Hellenistic_Age_desc:0 "第一次希腊化时代是自亚历山大大帝东征（公元前334年）至罗马吞并最后一个希腊化王国——托勒密埃及（公元前30年）之间的历史时期。期间，希腊古典文明与西亚、北非等地本土文明深度交融的基础上，形成了一个以希腊语为通用语、希腊式城市为节点、但文化多元混合的跨地域文明圈，并在政治、科学、艺术和宗教领域产生了开创性成就。如今，希腊民族又一次在强大的军事领袖带领下，击败了一切敌人，正迎来第二次希腊化时代的曙光！"
 Syracusae_Hellenic_Military_Government:0 "希腊军政府"
 Syracusae_Hellenic_Military_Government_desc:0 "在「叙拉古独立战争」后，狄奥多勒·瓦塔泽斯与各豪族约定，建立了一个精诚团结的军政府，积极恢复希腊传统，摆脱罗马影响，在特里纳克里亚之滨重建了叙拉古共和国，这一举动深刻影响了我们民族乃至世界的历史。如今，军政府已经光复了整个希腊世界，我们不再只是「叙拉古的军政府」，而是「全体希腊人的军政府」，多利亚人的纪律、爱奥尼亚人的智慧、马其顿人的勇武都为共和国所用。"
 Syracusae_Restore_World:0 "重建世界"
 Syracusae_Restore_World_desc:0 "在很多人看来，叙拉古独立战争已是多年前的往事，1204年的浩劫是两百年前的旧伤，科林斯被撒盐和阿基米德倒在剑下的记忆更是恍如隔世。如今，共和国的舰队正驶入拜占蒂翁，科林斯商会的商船在塞萨洛尼基的港口进出忙碌，叙拉古的学者在雅典图书馆日夜整理古籍。我们曾经几近万劫不复之地，但蒙主宏恩，我们最终重建了希腊世界，修复了千百年来积累的创伤，比历史上任何一个时刻都要繁荣、昌盛、伟大。" 
 Syracusae_control_the_Ecumenical_Patriarch_plus:0 "圣教会授权共和国"
 Syracusae_control_the_Ecumenical_Patriarch_plus_desc:0 "旧日的罗马皇帝无力在异教徒和渎神者的阴影前保护正教会，但叙拉古护国公可以，希腊的勇士可以。随着拜占蒂翁被共和国所解放，普世牧首不再臣服于巴西琉斯的权杖，而是为这个由希腊人建立、为希腊人存在的共和国祈福。圣教会承认叙拉古共和国是正教信仰的合法保卫者，是全体希腊人的世俗领袖。作为回报，共和国保证教会的独立与尊严，牧首有权召集大公会议，有权委任主教，有权在一切信仰事务上参与裁决。这不是罗马帝国的皇帝凌驾于教会之上，也不是公教异端的教会凌驾于国家之上，而是十字架与蓝白旗帜的彼此见证，是圣教会与叙拉古共和国的神圣盟约。"
 Syracusae_Come_form_Syracusae_plus:0 "从雅典到叙拉古"
 Syracusae_Come_form_Syracusae_plus_desc:0 "柏拉图曾经三赴叙拉古，但都以苦涩的失败告终。新生的叙拉古曾经也只是世族勋阀的利益联合体，处于陷入军事僭主统治的边缘，但经过多位护国公的努力，我们终于向世人证明，所谓僭主的暴政不过昨日故梦，千年前哲人囿于对话录中的理想已在地中海的晨光中显形，在法典与议会中第一次真实呼吸。从雅典来，到叙拉古去——柏拉图未竟的彼岸，如今已经屹立于此地。"
 Syracusae_Meagali_Idea_plus:0 "伟大理想"
 Syracusae_Meagali_Idea_plus_desc:0 "在罗马人窃取我们的遗产、贬抑我们的文化之前，希腊民族在文明世界拥有比罗马更大的影响力，甚至远远超出我们的版图。从海格力斯柱到印度，从西徐亚草原到尼罗河尽头，叙拉古必须实现国父狄奥多勒的伟大理想，再次恢复希腊化世界，共同飞向伟大的明天。" 
 Syracusae_Greek_Fire_Revolution_plus:0 "希腊火革命"
 Syracusae_Greek_Fire_Revolution_plus_desc:0 "希腊文明是建立在海洋与舟船上的文明，强大的舰队从古希腊到东罗马，都为我们带来了无数美名。为了恢复从大西洋到印度洋的辽阔希腊化世界，海军的强大不可或缺，而为了弥补从1204大劫至今的数百年衰退，一场技术革命势在必行。「希腊火」这一威名赫赫的海军武器，即将以另一种姿态再次登上战争舞台。"
 Syracusae_Second_Hellenistic_Age_plus:0 "第二次希腊化时代"
 Syracusae_Second_Hellenistic_Age_plus_desc:0 "第一次希腊化时代是自亚历山大大帝东征（公元前334年）至罗马吞并最后一个希腊化王国——托勒密埃及（公元前30年）之间的历史时期。期间，希腊古典文明与西亚、北非等地本土文明深度交融的基础上，形成了一个以希腊语为通用语、希腊式城市为节点、但文化多元混合的跨地域文明圈，并在政治、科学、艺术和宗教领域产生了开创性成就。如今，希腊民族又一次在强大的军事领袖带领下，击败了一切敌人，正迎来第二次希腊化时代的曙光！"

 Hohenstaufen_ideas:0 "霍亨施陶芬西西里理念"
 Hohenstaufen_ideas_bonus:0 "霍亨施陶芬的永世传奇"
 Hohenstaufen_ideas_start:0 "霍亨施陶芬西西里传统"
 Hohenstaufen_eagle_of_Malta:0 "马耳他之鹰"
 Hohenstaufen_eagle_of_Malta_desc:0 "希腊、日耳曼、拉丁，三个文明的精华铸就了我们的君王——腓特烈「斯泰莱特」的伟大。\n他的佩剑锐长、他的枪矛锋利，他的战盔醒目闪亮、他的银盾映照，穹宇无垠群星煌煌。\n他是斯陶芬的孤星、是马耳他的黑鹰、是新时代的至尊。"
 Hohenstaufen_Barbarossa_ambition:0 "巴巴罗萨雄心"
 Hohenstaufen_Barbarossa_ambition_desc:0 "伟大的霍亨施陶芬皇帝腓特烈「巴巴罗萨」从施瓦本起家，加冕为罗马人的皇帝，夺取了德意志、意大利和勃艮第的王冠，一生为基督和帝国南征北战，他留下的记忆至今激励着我们的士兵和将军，士兵们期待着更伟大的战斗，将军们艳羡他的神功圣武，并都愿意为实现他未竟的雄心而奋斗终生。"
 Hohenstaufen_Kaiserreich:0 "意大利和日耳曼的凯撒"
 Hohenstaufen_Kaiserreich_desc:0 "统治整个意大利和德意志——前2位腓特烈的未竟之业，如今正紧紧攥在第三位腓特烈的手中，一个崭新的、真正意义上的罗马帝国已经重临人间，凯撒的荣光笼罩了全意大利与日耳曼，乃至整个西方，欧洲已经迈入了新时代——霍亨施陶芬的「铁之世纪」。"
 Hohenstaufen_University_of_Fredrich:0 "腓特烈大学"
 Hohenstaufen_University_of_Fredrich_desc:0 "腓特烈二世在位期间，创办了西西里第一所大学，兴办了诗歌学校，汲取了阿拉伯和希腊世界的智慧，将西西里变成了「黎明前文艺复兴」的第一抹曙光。一个国家最需要的永远是人才，就让第三位腓特烈从腓特烈二世手中接过接力棒，将他的遗产扩建为西西里的大学群。"
 Hohenstaufen_Norman_ammiratus:0 "诺曼海军大元帅"
 Hohenstaufen_Norman_ammiratus_desc:0 "\n西西里国王罗杰二世设立了历史上第一个海军大元帅，\n改革海军体制，由此奠定了诺曼人的霸业。\n\n特里纳克里亚地处地中海之心，如果要成为欧洲的大国，学习诺曼人的经验、像罗杰一样改革海军将是必经之路。"
 Hohenstaufen_Papal_controller:0 "三重冕的庇护人"
 Hohenstaufen_Papal_controller_desc:0 "伟大的霍亨施陶芬家族与腐朽的罗马教廷之间的斗争终于落下了帷幕，我们如愿以偿控制了普世教会的核心，能为拯救公教文明大展宏图，而宗座也再无需被尘世俗务打扰，可以到马耳他的修道院潜心研读典籍，为改革公教做出贡献，真可谓两全其美。"
 Hohenstaufen_the_Constitutions_of_Melfi:0 "新梅尔菲宪法"
 Hohenstaufen_the_Constitutions_of_Melfi_desc:0 "1231年，腓特烈二世颁布了《梅尔菲宪法》，体现了他建立中央集权国家、实行重商主义的思想。时至今日，面向新时代的曙光，我们应该站在巨人的肩上改进梅尔菲宪法，进一步推动专制王权和中央集权。"

 Angelos_ideas:0 "安杰洛斯新罗马理念"
 Angelos_ideas_bonus:0 "安杰洛斯新罗马野心"
 Angelos_ideas_start:0 "安杰洛斯新罗马传统"
 Angelos_Porphyrogennetos:0 "生于紫室"
 Angelos_Porphyrogennetos_desc:0 "我们是罗马人，我们的君主是生于紫室的正统东帝国继承人，我们的王朝是君士坦丁波利斯名正言顺的统治家族，所有欧洲国家都要钦慕我们的皇室气度。"
 Angelos_Issac_reforms:0 "伊萨克财政改革"
 Angelos_Issac_reforms_desc:0 "西西里内战留下了一个满目疮痍的国家，内有刚刚臣服、蠢蠢欲动的拉丁人，外有教宗和威尼斯的压迫，伊萨克五世进行了一系列财政改革，来保障西西里的国家机器能正常运行，以确保他的雄心能得到实现。"
 Angelos_Roman_league:0 "罗马同盟宪章"
 Angelos_Roman_league_desc:0 "一个内外交困的西西里不足以支撑安杰洛斯王朝的罗马之梦，那我们何不整合力量，将所有歆慕罗马之人都拉拢到我们的阵营，许诺他们好处，只要他们献上忠诚？"
 Angelos_Learn_from_the_west:0 "学习西方体制"
 Angelos_Learn_from_the_west_desc:0 "作为东帝国的正统王朝，没有人比我们更了解拜占庭的陈旧官僚机制是多么糟糕透顶。我们新罗马的宫廷兴盛于西方，可以邀请西方的顾问、商人和官僚，以进一步提高我们的行政能力，维持一个稳定的官僚体系。"
 Angelos_Romance_Hellen_friendship:0 "罗曼-希腊兄弟情谊"
 Angelos_Romance_Hellen_friendship_desc:0 "与日耳曼人的合作终究只是虚与委蛇，与罗曼兄弟的友谊才能为帝国带来最大的利益。罗曼人拥有比日耳曼人更先进的文明、更强大的军队、更荣耀的王室，也跟我们一样——更忠于罗马和至高无上的教宗。"
 Angelos_decentralization:0 "地方分权"
 Angelos_decentralization_desc:0 "从第四次十字军以来的数百年，帝国领土支离破碎，其程度是前所未有的。虽然我们已经基本恢复了帝国疆界，但地方自治已经成了传统，而我们赖以完成统一伟业的功臣也不愿被夺权。既然如此，我们不妨放权地方。——当然，前提是他们为新罗马献出心脏。"
 Angelos_Imperator:0 "东方与西方的凯撒"
 Angelos_Imperator_desc:0 "日耳曼人称他们是罗马的继承人，但事实显然不是如此。新罗马像凤凰涅槃般从废墟中崛起，走向光荣的命运，宣告了东方与西方的凯撒的无上权威。安杰洛斯的魂灵从断壁残垣中破土而出，静静享受普世之国的荣耀。"

 EDG_Ducate_ideas:0 "希腊军区理念"
 EDG_Ducate_ideas_bonus:0 "希腊军区野心"
 EDG_Ducate_ideas_start:0 "希腊军区传统"
 EDG_Ducate_1:0 "边境军团"
 EDG_Ducate_2:0 "希腊官僚"
 EDG_Ducate_3:0 "叙拉库塞的仆从"
 EDG_Ducate_4:0 "身骑世界的骏马"
 EDG_Ducate_5:0 "希腊化"
 EDG_Ducate_6:0 "正教热忱"
 EDG_Ducate_7:0 "叙拉古治下的和平"
 EDG_Ducate_1_desc:0 "阿克里特原是东帝国所设，坚守亚洲边境的边防军。他们在山间筑起堡垒，在要道设卡，用烽火传递敌情，用长矛和弓弩守护身后的希腊村落。九至十世纪，阿克里特被纳入正规军体系，享有土地免税权、战利品分成和边境自治权。在先后经过塞尔柱入侵和巴列奥略的昏聩治理后，阿克里特制度逐渐废弛。如今，希腊人的军政府为了恢复文明的边疆，再次重建了阿克里特制度。"
 EDG_Ducate_2_desc:0 "军区的官僚直接由叙拉库塞委派，是文明世界最富有经验的行政人员队伍，这套传承自东帝国、经过共和国改革的希腊官僚系统无疑是高效而廉洁的。"
 EDG_Ducate_3_desc:0 "军区的存在，不是为了从护国议会手中分润权力，而是为了让叙拉库塞的护国公能够更好地控制地方。军区的将军承接祖国之父的恩泽而统治，代替执政官加强对各地的统治。"
 EDG_Ducate_4_desc:0 "我们追随着战无不胜的护国公，坚信他将骑乘骏马征服全世界，实现亚历山大大帝未竟的预言，并紧跟其征服世界的脚步，愿为他的事业肝脑涂地、赴汤蹈火。"
 EDG_Ducate_5_desc:0 "希腊文明的影响范围曾经西迄伊比利亚，东到印度河流域，但如今却退守爱琴海一隅。为了实现希腊人之父的「伟大理想」，军区不仅是中央政府下的一个分支，更是希腊文明的播种者，积极在地方推广同化，汲取当地文化的有益价值，融入希腊世界。"
 EDG_Ducate_6_desc:0 "当今希腊人的精神世界建立于正教文明的基石之上，叙拉古人对正教的狂热也深深影响了我们。信仰将来自不同地区的士兵凝聚为兄弟，让他们在异教四面围攻的边疆甘愿坚守；修道院兼作医院、粮仓与烽火台，修士同时手执圣经与利剑，是军区最坚韧的脊梁。"
 EDG_Ducate_7_desc:0 "我们处于希腊联邦的庇护之下，享受着长久稳定的太平盛世，叙拉库塞的护国公整治财政、恢复税收秩序、整肃军队纪律、修建基础设施、推广希腊语、制定希腊法，使希腊化世界和平有序，时人称之为「叙拉古治下的和平」。"

#理念组
 EDG_Firepower_basic_ideas:0 "火力理念"
 EDG_Firepower_basic_ideas_start:0 "火力理念野心"
 EDG_Firepower_basic_ideas_bonus:0 "完成火力理念"
 EDG_Firepower_basic_ideas_1:0 "常备军改革"
 EDG_Firepower_basic_ideas_2:0 "御前炮兵学院"
 EDG_Firepower_basic_ideas_3:0 "青铜时代"
 EDG_Firepower_basic_ideas_4:0 "海洋之火"
 EDG_Firepower_basic_ideas_5:0 "野战炮兵独立化"
 EDG_Firepower_basic_ideas_6:0 "线式机动协同战术"
 EDG_Firepower_basic_ideas_7:0 "大炮群战术"
 EDG_Firepower_basic_ideas_1_desc:0 "常备军是社会生产力发展到一定阶段的产物，是国家或政治集团平时保持的现役正规军队常备军通常采取统一的组织编制。常备军一般编配制式的装备，实行特定的军衔等级制度，穿着统一的服装，使用专用的标志和符号，实施专门的教育训练，执行严格的规章制度，保持较高的作战能力和战备水平。迈向常备军是军事改革的必由之路，也标志着国家将更多资源投入到陆军当中，为新式武器的开发奠定基础。"
 EDG_Firepower_basic_ideas_2_desc:0 "御前炮兵学院是我国最重要的军校之一，该校始创于15世纪，是我国最早的培养炮兵军官的职业军事教育院校，在后来成为整个火炮军的任命前教育机构。每年，学院会选拔有才干的青年新兵，进入院校的学子将研习与军事后勤、部队调遣以及围城器械建造相关的一切知识。"
 EDG_Firepower_basic_ideas_3_desc:0 "1450年至1540年是所谓的欧洲「第二个青铜时代」，各国竞相铸造铜炮管，其产量之大、涉及地域之广，空前绝后。火炮分类体系逐渐成型：长炮管长射远，加农炮管短力猛，迫击炮曲射高抛。希腊数学家尼古拉·克里尼斯发现炮弹在真空中以45度射角发射时射程最大，为炮兵学奠定了理论基础。再这一时代，国家统一火炮口径，建立炮兵定级制度，使火炮真正成为军队的常备兵种。"
 EDG_Firepower_basic_ideas_4_desc:0 "希腊火是流传自东罗马帝国的古老武器，其配方以石油为基，混合硫磺、松香、树脂，经青铜虹吸管喷射，可在水面上持续燃烧。如今，由于战事的需要，希腊的工匠将古老的希腊火与东方的火药、硝石相结合，催生出更可怕的爆破武器，成为摧毁敌军辎重、焚毁粮草、攻陷坚城的利器。"
 EDG_Firepower_basic_ideas_5_desc:0 "古斯塔夫·阿道夫是著名的军事改革家，他赋予了火炮前所未有的机动性，其核心思路是让火炮跟上大军的步伐，通过减轻炮管、缩短长度并减少装药量，创造出仅需两人或一匹马就可牵引的「皮革炮」和3磅「团属火炮」，成为伴随步兵冲锋的「移动火力点」：将炮兵从「辅助」地位提升为与步、骑兵并列的独立兵种，并建立专门的指挥体系和训练标准，赋予其独立战术地位。"
 EDG_Firepower_basic_ideas_6_desc:0 "古斯塔夫·阿道夫率先将火炮轻型化，以皮制炮管和更轻的炮架使火炮得以伴随步兵机动。他废除笨重的攻城巨炮，采用3磅、6磅、12磅的标准化团属火炮，将火炮与步兵、骑兵协同使用。线式战术时代，火炮被部署在战线中央，以交叉火力撕裂敌军队列。将火炮分散配属，以两门炮为一组，随进攻线列移动提供火力支援，使步、骑、炮三兵种协同作战，正是其战术核心。"
 EDG_Firepower_basic_ideas_7_desc:0 "出身炮兵的拿破仑·波拿巴在驰骋疆场时将炮兵战术运用到极致。他首创「大炮群战术」——将数百门火炮集中使用，在决定性方向上对敌军单一翼侧实施毁灭性轰击，待敌阵松动后以骑兵和步兵纵队突入。在军团编制中专设「炮兵预备队」，由最高统治者直接指挥，可以确保我们在决战时刻拥有压倒性的火力。"

 EDG_Firepower_Act_0:0 "火药监管法案"
 EDG_Firepower_Act_1:0 "军工体系法案"
 EDG_Firepower_Act_2:0 "炮舰外交法案"
 EDG_Firepower_Act_3:0 "神罚烈焰"
