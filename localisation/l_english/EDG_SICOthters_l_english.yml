#派系
 EDG_SIC_MIL_faction:0 "日耳曼派"
 EDG_SIC_MIL_faction_influence:0 "日耳曼派影响力"
 EDG_SIC_MIL_faction_FACTION_DESC:0 "日耳曼派起源于马耳他的腓特烈组建的「山岳人」卫队，他们坚守天主教信仰，忠诚而坚忍，是国家的核心力量，他们掌握着军队，主导征伐大事，能征善战。\n§Y若我们拥有高陆军传统或处于战争之中，该派系的影响力将会增长。§!"
 EDG_SIC_ADM_faction:0 "罗马派"
 EDG_SIC_ADM_faction_influence:0 "罗马派影响力"
 EDG_SIC_ADM_faction_FACTION_DESC:0 "罗马派，又称希腊派，起源于伊萨克·安杰洛斯引入到西西里的希腊官僚，他们在东帝国有着悠久的历史，以优秀的行政能力闻名。\n§Y若我们处于高稳定度和和平之中，该派系的影响力将会增长。§!"
 EDG_SIC_DIP_faction:0 "拉丁派"
 EDG_SIC_DIP_faction_influence:0 "拉丁派影响力"
 EDG_SIC_DIP_faction_FACTION_DESC:0 "拉丁派是意大利亚的本土势力，长期处于多个强权之间，锻炼出长袖善舞的本领，在我们的外交战略和贸易策略中具有举足轻重的地位。\n§Y若我们拥有高外交声誉，该派系的影响力将会增长。§!"

 EDG_Syracusae_MIL_faction:0 "马其顿派"
 EDG_Syracusae_MIL_faction_influence:0 "马其顿派影响力"
 EDG_Syracusae_MIL_faction_FACTION_DESC:0 "马其顿派主要由毕业于由国父狄奥多勒·瓦塔泽斯创建的马其顿军事学院的联邦军事精英组成，他们直接效忠于执政官，是战争内阁的主导力量，叙拉古的主战派。\n§Y若我们拥有高陆军传统或处于战争之中，该派系的影响力将会增长。§!"
 EDG_Syracusae_ADM_faction:0 "安条克派"
 EDG_Syracusae_ADM_faction_influence:0 "安条克派影响力"
 EDG_Syracusae_ADM_faction_FACTION_DESC:0 "安条克派的开创者被认为是纪伯伦元帅，一名从伊斯兰教皈依正教的安条克人。该派继承了他的政治遗产，深耕于国内局势管理和行政整合，团结异族人和异教徒，推广正教信仰和新希腊认同。\n§Y若我们处于高稳定度和和平之中，该派系的影响力将会增长。§!"
 EDG_Syracusae_DIP_faction:0 "孟斐斯派"
 EDG_Syracusae_DIP_faction_influence:0 "孟斐斯派影响力"
 EDG_Syracusae_DIP_faction_FACTION_DESC:0 "孟斐斯派起源于前埃及诺姆军政府的希腊裔军官勋阀，他们在解甲归田与原叙拉古政治豪族合流，利用此前积累的经验从事地方政务和外交事务，在国际舞台上游刃有余。\n§Y若我们拥有高外交声誉，该派系的影响力将会增长。§!"

